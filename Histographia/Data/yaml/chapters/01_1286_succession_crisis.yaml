chapters:

  - id: death_of_alexander_iii
    ja: アレグザンダー3世の死 (1286年3月19日)
    date: 1286-03-19
    narrative_ja: 1286年の3月19日、スコット人の王アレグザンダー3世がフォース湾沿いの町キングホーンに滞在中、突如この世を去った。享年44歳。王の遺体は王家の霊廟であるダンファームリン修道院に丁重に埋葬された。不幸にも、彼の子どもたちであるアレグザンダー、デイヴィッド、マーガレットの3名は皆、王がこの世を去る数年前に若くして相次いで亡くなっていた。すなわち、王の死はそれまで約200年間に渡って続いてきたスコットランドの王家の男系の血筋が途絶えたことを意味したのである。この王家を襲った相次ぐ不幸により、スコットランドは短期的には未曾有の王位継承の問題に直面することとなり、さらには約70年間に渡る戦乱と危機の時代へと突入していくことになる。
    desc_ja: 
    sources:
      - gesta_annalia_ch_67
      - gesta_annalia_ch_63
      - gesta_annalia_ch_64
    links:
      - election_of_guardians_1286


  - id: election_of_guardians_1286
    ja: 6名の摂政団の選任 (1286年4月)
    date: 1286-04
    narrative_ja: 1286年4月の復活祭の2週間後、スクーンで政治集会が開催され、その場でスコットランドの「王国共同体」によって6名の摂政団が選任された。その6名とは2名の司教、2名の伯、そして2名の大領主、すなわちセント・アンドルーズ司教ウィリアム・フレイザー、グラスゴー司教ロバート・ウィシャート、ファイフ伯ダンカン、バカン伯アレグザンダー・カミン、バーデノックの領主ジョン・カミン、スコットランド王国家令のジェームズ・ステュワートであった。
    desc_ja: 中世ヨーロッパの政治思想において、王国という政体はよく人体のアナロジーで語られた。そして、その頭の役割を担うとされたのが王自身である。アレグザンダー3世の死後、後継者が最終確定するまでスコットランドは文字通り「頭が不在」の状態となったことになる。このような状況において、不在の王に代わって聖俗の有力者たちからなる「王国共同体」が王国の政治を司るという考え方が生まれていった。\n\n摂政団の人選について、スコットランド側の年代記『ゲスタ・アナリア』によれば、セント・アンドルーズ司教、ファイフ伯、バカン伯がフォース湾以北の代表として、グラスゴー司教、ジョン・カミン、ジェームズ・ステュワートがフォース湾以南の代表として任命されたとされ、南北の地理的な公平性にも配慮された人選であったことがうかがえる。
    sources:
      - gesta_annalia_ch_68
      - gesta_annalia_ch_81
    links:
      - seal_of_guardians_1286
      - turnberry_band
      - yoland_not_pregnant


  - id: seal_of_guardians_1286
    ja: 摂政団の印章
    date: 1286-04
    narrative_ja: 王不在の中でスコットランドの統治を司った摂政団は、スコットランドの守護聖人である聖アンデレを裏面に描いた新しい国璽を使用した。その銘には「アンデレよ、スコットランドの同胞の指導者たれ」と刻まれており、聖人への真摯な保護の願いが込められていた。
    desc_ja:


  - id: turnberry_band
    ja: ターンベリ―盟約 (1286年9月20日)
    date: 1286-09-20
    narrative_ja: 1286年9月20日、スコットランド南西部、キャリック伯領内のターンベリー城で一つの盟約が結ばれた。これは、結ばれた場所の名からターンベリー盟約と呼ばれている。アナンデールの領主ロバート・ブルースを始め、この盟約の参加者たちはアルスター伯リチャード・ド・バーグとトマス・ド・クレア (グロスター伯ギルバート・ド・クレアの弟) を支援することを誓約した。\n\n盟約の参加者はダンバー伯パトリックとその息子たち (パトリック、ジョン、アレグザンダー)、メンテイス伯ウォルター・ステュワートとその息子たち (アレグザンダー、ジョン)、アナンデールの領主ロバート・ブルース (5世) とその息子であるキャリック伯ロバート・ブルース (6世) とリチャード・ブルース、スコットランド王国家令のジェームズ・ステュワートとその兄弟のジョン、そして島嶼部の有力者であったオイングス・マク・ドヴナルとその息子アラスデアだった。この誓約は、アイルランドやスコットランド西部の島嶼部における政情不安を事前に防ぐための相互不可侵を目的としたものであったが、同時にスコットランドの政治情勢にも影響を与えるものだったと言える。なぜなら、この場に集まった者たちは後にロバート・ブルースが王位を請求した際、その主要な支持者となった人物たちだったからである。その中には摂政団のひとりであるジェームズ・ステュワートも含まれていた。自らがスコットランド王家の遠縁であることを自覚していたロバート・ブルースは、将来を見越してこの時点から自身の味方を増やそうと画策していたとしていたのである。
    desc_ja: 
    sources:
      - stevenson_documents_i_no_12
    links:
      - revolt_of_robert_bruce_1286


  - id: yoland_not_pregnant
    ja: 王妃ヨランド、懐妊せず (1286年末)
    date: 1286-11
    narrative_ja: アレグザンダー3世の死後、スコットランドにはまだ王妃ヨランドが子を身籠っている可能性があるという期待が残されていた。しかしながら、1286年の末頃には王妃ヨランドが妊娠していないことが決定的となり、アレグザンダー3世の残された唯一の子孫であるノルウェーの乙女マルグレーテが1284年の誓約に基づき、王位継承者となることが確実となった。
    desc_ja: 
    links:
