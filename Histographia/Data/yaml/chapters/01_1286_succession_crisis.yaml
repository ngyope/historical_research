  - id: revolt_of_robert_bruce_1286
    ja: ロバート・ブルースの反乱
    date: 1286-11
    narrative_ja: 1286年の11月、アナンデールの領主であったロバート・ブルースは息子のキャリック伯とともに突如として軍を動員し、公然と軍旗を掲げてウィグタウンやダンフリースといった王城、ならびにギャロウェイの領主 (ベイリオル家) が有するビトル城を占拠した。この反乱の範囲はスコットランド南西部に限定されていたものの、エディンバラ城でも「戦争の危機」を理由に守備隊が増員されるなど、一時、王国全体に緊張が走った。しかしながら、ブルースは王国貴顕層の広範な支持を得ることができずに孤立し、翌年初頭に反乱は鎮圧された。反乱の首謀者であったブルースは処罰を免れたものの、この反乱は当時のスコットランドが王不在の中、「王国共同体」の理念のもとでまとまりを見せている一方で、その内部には自家の権益を優先する貴顕の政治が渦巻いていたことを示唆している。
    desc_ja: ブルースはデイヴィッド1世 (在位: 1124-1153年) の孫、ハンティンドン伯デイヴィッドの次女の息子にあたる。A. A. M. Duncan や G. W. S. Barrow といった研究者は、ブルースがその親等の近さゆえに王位を狙っており、同じくハンティンドン伯デイヴィッドの長女の孫であるジョン・ベイリオルとライバル関係にあったことから、この反乱はブルースによる王位継承の正当性の主張であり、かつライバルのベイリオルに対するけん制の意も兼ねたものであったと推察している。A. A. M. Duncan (2002), ch. 9; G. W. S. Barrow (2013), ch. 2.
    sources:
      - palgrave_docs_no_13_ex1
      - er_34-51_ex1
      - er_34-51_ex2
