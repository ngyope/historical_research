chapters:

  - id: death_of_alexander_iii
    ja: アレグザンダー3世の死 (1286年3月19日)
    date: 1286-03-19
    narrative_ja: 『ゲスタ・アナリア』は1286年の3月19日、スコット人の王アレグザンダー3世がフォース湾沿いの町キングホーンに滞在中に命を落としたと伝える。享年44歳。その在位は36年に及び、王の遺体は王家の霊廟であるダンファームリン修道院に埋葬された。ボウワーの『スコティクロニコン』は事件をより具体的、かつ劇的に伝えてる。すなわち、王がクイーンズフェリーで暗闇が訪れるまで渡海を阻まれたこと、今夜はインヴァーキーシングを通り過ぎるなという側近の忠告を退けたこと、騎士の護衛に囲まれて早足でキングホーンへ急いだこと、その西側の海岸沿いで馬が砂につまずき、供回りの注意もむなしく首の骨を折って落命したことである。\n\n王の死がもたらした問題は王位の継承であった。最初の王妃、イングランド王ヘンリ3世の娘マーガレットとの間に生まれたアレグザンダー、デイヴィッド、マーガレットの3名は皆、王がこの世を去る数年前に相次いで亡くなっていた。唯一の血統上の後継者は王の娘でノルウェー王エイリーク2世の妃となっていたマーガレットの遺児、すなわち王にとって孫にあたる幼少の「ノルウェーの乙女」ことマルグレーテであった。
    desc_ja: 1286年の死は、しばしばいわゆる「スコットランド独立戦争」へと至る道の起点、すなわち歴史の「転換点」として叙述される。このような歴史解釈は14世紀に成立したとみられる年代記『ゲスタ・アナリア』が、王の死の記述に「その後の時代の損失」を読み込んだ時点ですでに歴史叙述の中に胚胎している。しかし、この「転換点」という叙述には留意が必要である。第一に、それは結果を知る後世の知見からの回顧的構成であり、1286年3月の時点で時の人々が予見できたものではなかった。また、イングランドとスコットランドの関係の悪化は、アレグザンダー3世の死の必然的帰結ではなく、その後のマルグレーテの死という偶発的事故と、エドワード1世の選択とが介在して初めて現実化したものである。したがって、1286年の死を直線的に戦争の起点へと結ぶ叙述は、慎重に相対化される必要がある。
    sources:
      - gesta_annalia_ch_67
      - gesta_annalia_ch_63
      - gesta_annalia_ch_64
      - scotichronicon_bk_10_40
    links:
      - election_of_guardians_1286


  - id: election_of_guardians_1286
    ja: 6名の守護団の選任 (1286年4月)
    date: 1286-04
    narrative_ja: 1286年4月の復活祭の2週間後、スクーンで政治集会が開催され、その場でスコットランドの「王国共同体」によって6名の守護団 (Guardians) が選任された。これは王の不在化で王国を統治するための暫定政府の樹立であり、以後同様の事態にzおいて「守護」や「国王代理」が選出される先駆けとなった。\n\n選出された6名は2名の司教、2名の伯、そして2名の大領主、すなわちセント・アンドルーズ司教ウィリアム・フレイザー、グラスゴー司教ロバート・ウィシャート、ファイフ伯ダンカン、バカン伯アレグザンダー・カミン、バーデノックの領主ジョン・カミン、スコットランド王国家令のジェームズ・ステュワートであった。\n\n守護団の地位の独自性はその印章に象徴的に表れている。この印章は王の肖像を用いず、一面に王家の紋章 (ライオン・ランパント)、他面に十字上の聖アンドルーを刻み、「王国の統治のために委任されたスコットランドの印章」「聖アンデレよ、同胞スコット人の導き手たれ」の銘を備えた。即位した王が存在しない状況で、守護団は特定の君主の名によらず、共同体から委託された「王の尊厳 (royal dignity)」そのものを担って統治した、という解釈が現代の歴史家によって提示されている。
    desc_ja: 守護団の人選について、年代記『ゲスタ・アナリア』は、セント・アンドルーズ司教、ファイフ伯、バカン伯がフォース湾以北の代表として、グラスゴー司教、ジョン・カミン、ジェームズ・ステュワートがフォース湾以南の代表として任命されたとされ、南北の地理的な公平性にも配慮された人選であったと述べている。\n\nなお、『ゲスタ・アナリア』やそれを継承するバウワーの『スコティクロニコン』は北部担当の伯をバカン伯ジョン・カミンと記すが、1286年当時のバカン伯はアレグザンダー・カミンであり、ジョン・カミンは別人、すなわち南部担当のバーデノックのジョン・カミンである。この誤りは文書史料および二次文献によって訂正されている。誤りが生じた理由として、おそらく1289年にアレグザンダー・カミンが没した後、息子のジョンが伯位を継いだことから、後代に編纂された年代記がなじみのある後継者ジョンの名を1286年の伯に遡及させた可能性が考えられる。\n\nまた、年代記はこの政治集会を「議会 (Parliament)」と述べるが、文書史料においてスコットランド側が王国の政治集会で「議会」という用語を使い始めるのは1290年以降であり、年代記の用語は時代錯誤的なものと解釈される。
    sources:
      - gesta_annalia_ch_68
      - gesta_annalia_ch_81
    links:
      - turnberry_band
      - scottish_mission_to_gascony_1286
      - yoland_not_pregnant


  - id: turnberry_band
    ja: ターンベリ―盟約 (1286年9月20日)
    date: 1286-09-20
    narrative_ja: 1286年9月20日、スコットランド南西部、キャリック伯領内のターンベリー城で一つの盟約が結ばれた。これは、結ばれた場所の名からターンベリー盟約と呼ばれている。アナンデールの領主ロバート・ブルースを始め、この盟約の参加者たちはアルスター伯リチャード・ド・バーグとトマス・ド・クレア (グロスター伯ギルバート・ド・クレアの弟) を支援することを誓約した。その際、イングランド王への忠誠と「故アレグザンダー王の血統により」スコットランド王国を得る者への忠誠が留保された。\n\n盟約の参加者はダンバー伯パトリックとその息子たち (パトリック、ジョン、アレグザンダー)、メンテイス伯ウォルター・ステュワートとその息子たち (アレグザンダー、ジョン)、アナンデールの領主ロバート・ブルース (5世) とその息子であるキャリック伯ロバート・ブルース (6世) とリチャード・ブルース、スコットランド王国家令のジェームズ・ステュワートとその兄弟のジョン、そして島嶼部の有力者であったオイングス・マク・ドヴナルとその息子アラスデアだった。
    desc_ja: この盟約は、アイルランドやスコットランド西部の島嶼部における政情不安を事前に防ぐための相互不可侵を第一の目的としたものであったが、一部の歴史家はこの盟約が同時に王の空位下においてブルースを中心とする反カミン的なネットワークの結集を示すものでもあったと解釈する。\n\nまた、「故アレグザンダー王の血統により」スコットランド王国を得る者という継承の留保条項に対して、これを「定型的で慎重な留保」と読むか、「乙女の継承を妨げる含みを残したブルースの王位志向の兆候」と読むか、それとも「武力による王位請求主張の一環」と読むかで歴史家たちの解釈は分かれる。\n\nまた、守護団の一員であったステュワートが関与していることを「王国共同体への反抗」と評価するか否かについても、歴史家の見解が分かれている。
    sources:
      - stevenson_documents_i_no_12
    links:
      - revolt_of_robert_bruce_1286


  - id: yoland_not_pregnant
    ja: 王妃ヨランド、懐妊せず (1286年末)
    date: 1286-11
    narrative_ja: 王妃ヨランドに対する懐妊の期待や、その期待が失われたという記述は年代記や同時代の文書史料から直接的に読み解くことはできないものの、現代の歴史解釈においてはアレグザンダー3世の死後、スコットランドにはまだ王妃ヨランドが子を身籠っている可能性があるという期待が残されていたが、王の死から半年以上経過した同年末頃にはその期待は失われただろうという共通見解がもたれている。これにより、アレグザンダー3世の残された唯一の子孫であるノルウェーの乙女マルグレーテが1284年の誓約に基づき、王位継承者となることが確実となった。
    desc_ja: 
    sources:
      - scotichronicon_bk_11_3
    links:
