chapters:

  - id: strathord_surrender_1304
    ja: ストラソードの降伏 (1304年2月16日)
    date: 1304-02-16
    narrative_ja: 1303年のエドワード1世によるスコットランド遠征においてイングランド軍はフォース川を渡河し、北東部の城塞群を制圧してダンファームリンに越冬した。この軍事的圧力のもと、当時のスコットランド摂政ジョン・カミンは、スコットランドの王国共同体を代表してイングランドとの交渉に臨んだ。交渉の主要な舞台はパース近郊のストラソードであった。\n\n現存する一次史料は、単一の調印済み条約ではなく、交渉の進行を反映した一群の作業文書であり、以下の段階で交渉が展開したと考えられる。\n\n**スコットランド側の最大要求**\n\nカミンは文書冒頭で「海のこちら側と向こう側にある者たち」すなわちフォース湾両岸の王国共同体全体を代表する立場を明示し、(1) 生命・身体・財産の無条件保全と過去の武装行為の全面免除、(2) アレグザンダー3世の時代と同様の法・慣習・特権の維持、(3) カミンとジョン・モーブレーの別個の処遇、(4) 臣従礼以外の人質・保証の拒否を求めた。\n\n**エドワードの一般条件（聖灰水曜日以前）**\n\nエドワードは「国王の和平に加わることを望む者たちに一般的に与えられる条件」として、生命・身体の保全と領地没収の回避を認めた。一方、身代金・没収物の賠償・スコットランドの地の統治体制については将来の王令に留保した。カミンとモーブレーは「他の者たちよりも、本来であれば、もっと謙虚にあるべき」と批判的に言及されながらも、随行者とともに帰服することを許された。これに対し、サイモン・フレイザー、デイヴィッド・グレイム、トマス・デル・ボイスは「身分が異なる」として除外された。\n\n**ストラソード提案**\n\n「国王の使者からカミンに…提示された提案」と題されるこの文書は最も詳細な交渉文書である。除外された人名 (スコットランド家令ジェームズ・ステュワート、ジョン・ソールズ、サイモン・フレイザー、トマス・デル・ボイス) の追放年数、未成年相続人の扱い、次回議会までの捕虜の扱いが規定された。異本間で第七項にあるグラスゴー司教の扱いの記述が異なり、文書自体が交渉の流動性を示している。\n\n**王への報告と王の指示**\n\nアルスター伯ら交渉使節団からの王への報告書は、その週の水曜日の午前から日没まで、ストラソードにてカミンおよびその評議会と会談した旨を伝え、ロバート・フィッツペインが口頭報告を補完する使者として派遣された。続く王の印璽を伴う指示文書は、グラスゴー司教ウィシャートの2～3年間の追放、デイヴィッド・グレイムの半年間の追放、アレグザンダー・リンジーへの制裁、王太子への従軍と保証手続き・捕虜の解放を定めた。第3項として**「ウィリアム・ウォレスについては、王は彼を王自身の意志と裁量に委ねられること」**と記され、ウォレスのみが無条件帰服を求められた。\n\n**カミン一派の個別誓約証書 (2月16日以前）**\n\n「ジョン・カミンの随行者たちが国王の和平に加わるための条件を含む誓約証書」として、2月16日までに帰服することが定められた。条件は生命・身体・土地・自由の保護であった。\n\n2つの著名な例外があった。第一に、スターリング城代ウィリアム・オリファントは降伏交渉から事実上排除され、最後まで抵抗を続けた。第二に、ウィリアム・ウォレスは交渉の全段階から事実上除外されており、無条件帰服のみが提示された。\n\n本件の帰服は最終的な統治の確定ではなく、暫定的な性格を帯びていた。身代金・賠償・統治体制は将来の議会での王令に留保され、捕虜は「次回議会まで」王の手に置かれることとされた。
