chapters:

  - id: mission_to_edward_i_early_1291
    ja: エドワード1世への仲裁を求める使節団の派遣 (1291年5月初頭)
    date: 1291-05-04
    narrative_ja: ブルース派、ベイリオル派の双方が王位の獲得に向けて策を講じる中、スコットランドの王国共同体は摂政団を中心に誰が王位を継承するかの議論を重ねたものの、結論に至ることはできなかった。先に見たように、いかに摂政団政府が王国の行政を滞りなく運用できていたとしても、王の権威が不在の状況においては当事者に判決の遵守を強制できるような上位権力に欠けていたのである。そこで、事態の平和的解決を図るために、王国共同体はセント・アンドルーズ司教を筆頭とする使節団をイングランド王エドワードのもとに派遣することを決定した。その目的は、エドワードにこの王位継承をめぐる紛争の上級裁判官ならびに仲裁役となってもらうためであった。\n\nスコットランドの使節からの要請を受けたエドワードは、直ちにスコットランド王国のあらゆる聖俗貴顕に対し、その地位や身分がいかなるものであれ、ベリックの町に一堂に会する日を定めた。そして、論争の当事者たち、および当該王国の権利を主張するその他のすべての者たちを召喚するよう命じた。表向きは、彼はあくまで隣国の強力かつ友好的な仲裁者として振舞っていたのである。
    sources:
      - gesta_annalia_ch_70
      - stevenson_documents_i_no_137
    links: 
      - meeting_of_norham_1291
      - english_sovereignty_from_chronicles
      - english_military_summoning_to_norham_1291


  - id: english_sovereignty_from_chronicles
    ja: イングランド王の「宗主権」の論拠を年代記に求める
    date: 1291-03-21
    narrative_ja: スコットランド王国内で王位継承をめぐる問題が深刻化する中、イングランド王エドワード1世はイングランド中の修道院に命じてスコットランドに対するイングランド王の「宗主権」を歴史的に正当化する証拠を年代記から探し出させた。ここから、彼が表向きには友好的な助言者・仲裁者として振舞う一方、歴史解釈と法理論を駆使ししてスコットランドを属国化するというリアリスティックな戦略を着々と進めていたことがうかがえる。
    sources:
      - stevenson_documents_i_no_133
    links: []


  - id: english_military_summoning_to_norham_1291
    ja: イングランド王、ノラムに軍隊を招集する (1291年4月16日)
    date: 1291-04-16
    narrative_ja: 1291年4月16日、イングランド王エドワード1世はイングランド北部諸州の家臣たちに対して、イングランド北部の町ノラムに軍隊を率いて集結するよう命じた。表向きには、これはスコットランドの王位継承問題をめぐる会合に参加するためのものであったが、軍隊を率いてという命令の文言からは、エドワード1世がこの会合をスコットランドに対する軍事的な威圧の場として利用しようと考えていたことがうかがえる。
    sources:
      - cds_ii_no_473
    links: []


  - id: meeting_of_norham_1291
    ja: ノラム会議 I (1291年5月10日)
    date: 1291-05-10
    narrative_ja: 1291年5月、イングランドとスコットランドの境域、ツイード川のほとりにあるノラム城にて両王国の会合が設定された。5月10日、エドワード1世の招集に応じ、スコットランドの聖職者、伯、バロンたちは彼の仲裁に一縷の望みを託してノラム城に集結する。\n\nしかし会議の冒頭、エドワード1世の代理人であったロジャー・ブラバゾンの口から発せられた言葉は彼らの期待を打ち砕き、衝撃と困惑をもたらすものだった。彼はフランス語で、エドワードがスコットランドの宗主として王位継承問題を裁定するために来たことを宣言し、スコットランド側にこの宗主権を認めるよう要求したのである。\n\nこれは友好的な仲裁ではなく、紛れもない最後通牒だった。
    desc_ja: エドワードは最初から友好的な仲裁者としてこの場に臨む気はなく、スコットランドを自身の領主権下に置き、その主君としてこの問題を裁定しようとしていたのである。
    links:
      - meeting_of_norham_1291_ii


  - id: meeting_of_norham_1291_ii
    ja: ノラム会議 II (1291年6月1日)
    date: 1291-06-01
    narrative_ja: ノラムでの会合でイングランド王エドワード1世が宗主としてスコットランドの王位継承問題を裁定するという主張に対し、スコットランド側の代表者たちはこの要求に関して王国共同体と協議をするための猶予を要請した。\n\n3週間の猶予が与えられた後、1291年6月1日、スコットランド側の代表者たちはツイード川を挟んでスコットランド側にあった町、アップセットリントンにてイングランドへの越境を拒否した。これは、イングランド王の管轄権を認めないという意思表示に他ならなかったと言える。\n\nスコットランドの代表団はアップセリントンの町から、法的な正当性をもって反論を試みた。「あなた［＝エドワード1世］の権利について知識がなく、それに応えるべき主君が不在であるため、権限がない」、すなわち、王位が空位である以上、臣下が勝手に王国の地位を決定することはできないという主張によって、彼らはエドワード1世の要求を巧みに回避したのである。
    desc_ja: 
    links:
      - meeting_of_norham_1291_iii


  - id: meeting_of_norham_1291_iii
    ja: ノラム会議 III (1291年6月1日頃)
    date: 1291-06-01
    narrative_ja: 王位が空位である以上、臣下が勝手に王国の地位を決定することはできないというスコットランド側の回答を退け、イングランド王エドワード1世は3つの選択肢を突きつけたとされる。すなわち、彼の宗主権を認めるか。それとも、彼が宗主ではないという証拠を示すのか。もしくは、武力をもって抵抗するか。\n\nこの主張に対し、当時スコットランドの摂政団の一員であったグラスゴー司教ロバート・ウィシャートが激しく抵抗した。司教は「頭を失った民」は王座が空位である間王国を従属させることはできないとして、エドワードの宗主権を否定した。また、スコットランド側が「ないことを証明」するのではなく、イングランド側は積極的に宗主であるという証明をすべきであるとして2つ目の選択肢も否定した。さらに、分裂した王国を攻撃することは王の名誉を害し、かつエドワードが引き受けた十字軍遠征の達成も遠のくとして、3つ目の武力行使も否定したのである。
    desc_ja: 
    links:
      - meeting_of_norham_1291_iv


  - id: meeting_of_norham_1291_iv
    ja: ノラム会議 IV (1291年6月5日)
    date: 1291-06-05
    narrative_ja: スコットランドの共同体代表との議論が膠着状態に陥ると、エドワード1世は議論の対象を巧みに切り替える方針に転換した。彼はもはや共同体全体にではなく、王位継承権を主張する「競合者」たち一人ひとりに対して、自らの宗主権を認めるよう要求したのである。王位という報酬を目の前にぶら下げられた競合者たちは共同体の利益か、それとも個人の野心かという選択を迫られた。エドワード1世の要求を拒めば、実質的に裁定の候補者から外されることは明らかだったと言えよう。これは、スコットランドの団結を内部から、しかも当事者たちの野心そのものを利用して切り崩す一手だったのである。\n\n王位を主張する者たちの選択は早く、そして一方的なものだった。まず、ロバート・ブルースが真っ先にエドワード1世をスコットランドの正統な最高君主として認め、彼の裁定に全面的に従うことに同意した。それに続いてホラント伯フロリス、ジョン・ヘイスティングスといった他の競合者たちも次々とエドワードの宗主権を認めていった。\n\n他の競合者よりも優位な立場にあったジョン・ベイリオルは当初、欠席あるいは遅刻という体裁で承認をためらった。このためらいからは、彼を支持するカミン派、ないしは王国共同体がイングランドに対する隷属を巧みに回避しようとしたことが示唆される。しかし、他の候補者が次々と承認する中でベイリオル陣営も孤立を恐れ、最終的にエドワードの宗主権を承認し、彼の裁定に全面的に従うことに同意してしまうのである。
    desc_ja: 
    links:
      - meeting_of_norham_1291_v


  - id: meeting_of_norham_1291_v
    ja: ノラム会議 V (1291年6月6日)
    date: 1291-06-06
    narrative_ja: 1291年6月5日および6日付で、スコットランドの王位請求者たちはエドワード1世を宗主として裁定を受け入れること、ならびに判決が出るまで王国の一時的な占有権を彼に与えることを認める文書に署名した。\n\nその同意を踏まえ、裁判を進めていくにあたってベイリオルとブルースはそれぞれ40名の訴訟支援者を選出し、エドワードそれらとは別に24名の訴訟支援者を割り当てることが決定された。\n\nしかし、王位請求者たちが屈服した後も、スコットランドの城を守る守備隊長たちはエドワードへの城の明け渡しを拒否し続けていた。これに対し、エドワードは城の守備隊長と個別に合意書を取り結ぶ手に出る。その合意書では、城はエドワードに対し「上級領主」としてではなく「彼自身および他の請求者たちのための、1人の請求者」として引き渡されることになった。つまり、エドワードが一時的に自らも「王位請求者の一人」という立場を演じることによって、スコットランド側はエドワードを宗主としてではなく、あくまで将来の王を含む王位請求者たちの代表として受け入れるという合意を結んだのである。これによって守備隊長たちは「正当な王位継承者のために王国を守る」という誓いを破ることなく、エドワードも実質的な城の占有権を手に入れることができた。\n\nまた、エドワードはスコットランドの法と慣習を維持し、訴訟をスコットランド内で処理すること、ならびに王国の文書は安全な場所に保管することを約束した。これは1290年8月のノーサンプトンでの合意に基づいてスコットランド側が強く求めた条件だった。エドワードはこれらの譲歩を行うことによって、スコットランドの共同体の説得を試みていった。
    desc_ja: ブルースとベイリオルが訴訟支援者を選出するという決定からも、10名を超える王位請求者の中で、最初からジョン・ベイリオルとロバート・ブルースが有力視されていたことがうかがえる。
    links:
      - meeting_of_norham_1291_vi


  - id: meeting_of_norham_1291_vi
    ja: ノラム会議 VI (1291年6月13日)
    date: 1291-06-13
    narrative_ja: 1291年6月13日、アプセットリントンにおいて摂政団を含むスコットランドの主要な貴顕たちが一人ずつ個別にエドワード1世に忠誠を誓った。\n\nスコットランドの摂政団は維持されたが、エドワードは摂政団、ならびにスコットランドの文書局の長官である尚書にイングランド人の補佐官を任命し、実質的な影響力を確保した。スコットランドの共同体はあくまでエドワードを「友好的な仲裁者」かつ「王位請求者の代表」として受け入れることで同意したが、エドワードはその譲歩を足掛かりに、スコットランドの支配を着実に固めていこうとしていたのである。
    desc_ja: ノラム会議は法的権利を巡るスコットランド側の頑強な抵抗と、それに対するエドワード1世の圧力と王位請求者の政治的分断、そして最終的にエドワードを1王位請求者として扱うという「法的な建前」による瀬戸際の譲歩といった高度な政治的・法的議論の場だった。\n\nそれと同時に、この一連の交渉がイングランド側の代表とスコットランド側の代表の間で執り行われ、その決定にスコットランド王国共同体が従ったという形を取らなかったことは注目に値する。確かに、会の冒頭でイングランド側から宗主権を認める要求が出た際、スコットランドの代表団は議論の猶予を要請し、ツイード川を渡らないという形で集団としての意志表示を行った。この点から、当時のスコットランド王国共同体が政治集団として機能していたことは明白である。一方、エドワードはその抵抗を踏まえ、あくまで個々の王位請求者、城の守備隊長、そして最終的には個々の貴顕たちと個別に合意や忠誠の誓いを結ぶことで着々と交渉を進めていった。この事実は、当時のスコットランド王国共同体の実態は個々の有力者たちの集合体でもあったことを示唆している。
    links:
      - great_cause_i
