chapters:

  - id: great_cause_i
    ja: 大訴訟 I (1291年6月13日頃)
    date: 1291-06-13
    narrative_ja: 1291年6月13日にアップセットリントンでスコットランド王国共同体とエドワード1世の間で王位継承の訴訟手続きに関する合意が結ばれると、交渉の舞台は同じくツイード川流域の町ベリックへと移り、そこで王位継承者を決めるための「大訴訟」が展開された。\n\n王位請求者は10余名を数える規模になったが、当初から有力な候補者はハンティンドン伯デイヴィッド伯の子孫である3名、すなわち長女マーガレットの孫にあたるジョン・ベイリオル、次女イザベルの息子ロバート・ブルース、そして三女エイダのの孫ジョン・ヘイスティングスだった。\n\nベイリオルの主張は、当時のイングランドやスコットランドでの慣習法に則り、長子相続権に基づいて長女の子孫である自分が王位に相応しいといったものであった。それに対しロバート・ブルースはローマ法の原理に基づき、最も親等が近い自分こそが王位につくべきであるという主張を展開した。この2人に対していずれも法的裏付けが弱いヘイスティングスは、おなじくイングランドやスコットランドの慣習法にのっとり、土地が女性相続人に相続される際には分割相続が原則であるとして、王国を3人で分割する案を提示した。\n\nこの審理はエドワード1世を議長とし、先のノラム会議で定められた104名 (ベイリオルが選定した40+ブルースが選定した40名+エドワード1世が選定した24名=104名) の訴訟支援人が実行した。この「104名+王」という構成は、ローマ法において105人の裁判官が相続問題を扱った「百人官裁判」をモデルにした可能性が高いとされる。これはエドワードがこの問題を「封建上の」君主としてだけでなく、より普遍的な権威を持つ「準皇帝」的な立場で裁こうとしたことを示唆している。一方で、スコットランド側に多数の訴訟支援人を認めるという点は、彼がスコットランド側に譲歩をした結果でもあった。\n\nこの訴訟支援人の構成には、当時の状況を反映した対照性が認められる。ベイリオル側の支援人には司教6名、修道院長8名、伯4名といったスコットランドの「王国の共同体」を代表する権威ある有力者が名を連ねていた。これは、ベイリオル側が王国全体の総意に近い支持を得ていたことを示唆する。一方、ブルース側の支援人は、南部・南西部の出身者が多く、法的な議論に長けた大学卒業者を多く含んでいた点が特徴的である。この構成からはブルース側が自身の勢力圏内のネットワークを基盤としつつ、専門家を登用して法的な理論武装を図ろうとした様子がうかがえる。
    desc_ja:
    links:
      - great_cause_ii


  - id: great_cause_ii
    ja: 大訴訟 II (1291年8月)
    date: 1291-08
    narrative_ja: 1291年8月、大訴訟の審理は翌1292年6月までという異例の長期延期が決定された。この延期の表向きの理由は、王位請求者の1人であるホラント伯フロリス5世が証拠書類を探すためとされた。伯が自身の祖先であるエイダ (スコットランド王ウィリアム1世の姉妹) の権利に基づき、ハンティンドン伯デイヴィッドが王位継承権を放棄していたとする主張を行ったからである。関連文書の捜索のため、法廷は10ヶ月間にわたって休廷することとなった。\n\n現代の研究者たちは、この長期休廷の理由とされたホラント伯の証拠書類の調査はあくまで表向きの理由にすぎず、真の狙いは別にあったと解釈している。ホラント伯が主張の根拠とした「ハンティンドン伯デイヴィッドの権利放棄書」の原本には日付も証人もなく、信憑性に欠ける偽文書とみて間違いない。むしろ、この延期はエドワードが約1年間に渡ってスコットランドに対する直接的な支配権を保持し、それを既成事実化するための政治的な戦略であったと解釈されている。
    desc_ja:
    links:
      - great_cause_iii


  - id: great_cause_iii
    ja: 大訴訟 III (1292年6月)
    date: 1292-06
    narrative_ja: 1292年6月に審理が再開されると、主要な争点はジョン・ベイリオルとロバート・ブルースの主張に絞られた。ブルースの主張は「近親度」に基づき、アレグザンダー3世の血筋に世代的に最も近い自分が正統であるといったものである。彼は、王位継承は通常の土地相続とは異なる「王が統治するための法」に従うべきだと訴えた。\n\n一方、ベイリオルの主張は「長子相続」の原則に基づき、長女の系統を継ぐ自分が優先されるべきだというものであった。彼はスコットランド王国をイングランド王から保持する「封土」と見なし、イングランドおよびスコットランドの慣習法の適用を求めた。\n\n訴訟の核心はどの法を適用すべきかという問いにあった。選択肢はスコットランドの王位継承に関する慣習法、イングランドの封土 (特に伯領やバロンの所領) に関する慣習法、またはブルースが主張するローマ法であった。
    desc_ja:
    links:
      - great_cause_iv


  - id: great_cause_iv
    ja: 大訴訟 IV (1292年7月)
    date: 1292-07
    narrative_ja: 1292年7月、大訴訟が行われるさ中、エドワード1世は「評議会からの厳粛な使者を通じて、様々な地域の賢人たち」に諮問することを決定した。時間的な制約から、実際にはパリ大学とフランス王の高等法院の法学者のみが諮問対象となった。\n\nこの諮問に対する回答は1292年10月の審理が難航した主要な原因となった。公式記録ではその役割は無視されているが、審理の議論に深く影響を与えたことは明らかである。\n\nパリの専門家たちに提示された設問は、エドワード1世とスコットランドの訴訟支援人の影響を受けており、スコットランド王が上位君主であるイングランド王に臣従の誓いを立てて封土として王国を保持していた点を強調していた。その上で、長女に由来する遠縁のベイリオルと、次女に由来する近縁のブルースのどちらが不可分の王国を継承するべきかを問うた。\n\nそれに対し、10の団体・個人から寄せられた回答は以下の点で共通の傾向を示した。8つの回答はスコットランド王国に王位継承に関する明確な慣習法が存在する場合、それが最優先されるべきであるとした。スコットランドの慣習法が存在しない場合、6つないし7つの回答が、近親度 (ブルースの主張) を支持した。5つの回答が最後の手段としてローマ法を適用すべきであると考えた。諮問官がイングランドやスコットランドの伯領やバロンの所領の相続法を適用するよう誘導尋問を行ったものの、専門家たちはこれを明確に否定した。彼らは王国の継承と下位の封土の継承は区別されるべきであると主張したのである。唯一の例外は元イングランド民訴裁判所の首席裁判官で、亡命中のトマス・ウェイランドであった。彼は王国が封土として保持されている以上、イングランドの伯領やバロンの所領と同様に扱われるべきであり、論理的にはベイリオル、ブルース、ヘイスティングスの間で3分割されるべきだと結論づけた。
    desc_ja:
    links:
      - great_cause_v


  - id: great_cause_v
    ja: 大訴訟 V (1292年10月14日)
    date: 1292-10-14
    narrative_ja: 1292年10月14日にベリックで大訴訟の審理が再開されると、エドワード1世は「パリの意見」に対抗し、自らの望む方向へ結論を導くために、評議会とスコットランド代表 (80人の粗相支援人) に対し、巧妙な一連の諮問を行った。まず、王は彼らに「帝政ローマ法とイングランドまたはスコットランド両王国の法・慣習のどちらによってこの王位継承問題を裁くべきか」を問うた。評議会は「イングランドとスコットランドの法と慣習」を選択し、これによってブルースが依拠していたローマ法という強力な法的武器が審理から排除された。\n\n次に、王は「スコットランド王国はその尊厳性や特権から、イングランドやスコットランドの他の封 (伯領やバロンの所領) と異なる方法で裁かれるべきか、それとも同じ方法で裁かれるべきか」と問うた。ここでダラム司教アンソニー・ベックが重要な役割を果たし、王国も他の「同輩」の封土と変わらないという理屈を補強した。\n\nさらに、王は「王国を伯領やバロン領のように裁くべきでないとする、何らかの具体的な論拠や「特権」を王位請求者たちは持っているか」と問うた。ベイリオルは王国の不可分性を「特権」として主張したものの、それを証明する決定的な証書は提示できなかった。ブルースもかつてのアレグザンダー2世による指名の証書があると主張したが現物を提示できなかったため、王国の特殊性を法的に立証する責任を果たすことができなかった。\n\n4つ目の問いは「イングランドとスコットランドで類似の事例に対して法が異なり、互いに一致しない場合、どちらの法で裁くべきか」というものであった。80人の訴訟支援人はスコットランドに明確な成文法が存在すればそれに従うべきであると回答した。しかし、当時この事例に適合する明確なスコットランド法は存在しないことが共通認識であったため、この回答は結果としてイングランドの先例や王の裁量を優先させる余地を残すことになった。\n\n最後の問いは「もし両王国の慣習法のいずれもがこの事例を解決するのに不十分であった場合、どうすべきか」というものであった。これに対し、80人の訴訟支援人は「上級領主である王がその件について十分な新しい法を制定できるし、制定すべきである」と回答した。この回答により、エドワード1世は既存の慣習法に縛られず、自らの裁量で判決を下すための絶対的な法的正当性を獲得した。\n\nA. A. M. Duncan 氏が論じているように、これら5つの質問を通じて、エドワード1世は「スコットランド王国をイングランドの伯領と同等の地位に貶め、長子相続の原則を適用したい」という自らの意図をスコットランド側の代表者に自ら承認させる形で既成事実化したと言える。
    desc_ja:
    links:
      - inauguration_of_king_john


  - id: inauguration_of_king_john
    ja: ジョン王の即位 (1292年11月30日)
    date: 1292-11-30
    narrative_ja: 大訴訟の審議が一通り完了すると、ジョン・ベイリオルがスコットランドの正当な王位継承者であることが決定された。1292年11月30日、ベイリオルはスクーンにて古来の慣習に則り、スコットランドの王に即位した。
    desc_ja:
    links:
      - homage_of_king_john
      - land_transfer_of_bruces_1292
      - propaganda_inauguration_of_king_john


  - id: land_transfer_of_bruces_1292
    ja: ブルース親子の生前譲渡 (1292年11月7日)
    date: 1292-11-07
    narrative_ja: 大訴訟を戦ったロバート・ブルース (5世) はジョン王の即位前の1292年11月7日、アナンデールの所領を息子のロバート・ブルース (6世) に生前譲渡した。さらに、その翌々日にはキャリック伯であったロバート・ブルース (6世) 世も同様に、伯領を当時18歳だった息子のロバート・ブルース (7世) に譲渡した。この一連の生前譲渡について、研究者たちはロバート5世がジョン・ベイリオルに対して臣従礼を行うことを避けるための措置だったと解釈している。ロバート6世もまた、キャリック伯領を息子に譲ることでスコットランドにおける主要な封土を手放し、ベイリオルの直接の臣下として儀礼を行う義務を免れた。つまり、この一連の生前譲渡はブルース親子が一族の所領が新王ジョンへの不服従によって没収されるリスクを回避しつつ、王位請求権を「ベイリオルに臣従していない状態」で保持し続けるための策略だったのである。
    desc_ja:
    sources: []
    links:
      - homage_of_king_john


  - id: propaganda_inauguration_of_king_john
    ja: 大訴訟の決定に関する後世の年代記の挿話
    date: 1292-11-30
    narrative_ja: 大訴訟の経過とジョン王の即位について、14世紀に書かれた『ゲスタ・アナリア』以降のスコットランドの歴史記述の伝統は、ロバート・ブルースが答弁を通じて王国の自由と独立を確固たる決意で守ろうとしたのに対し、ジョン・ベイリオルとその顧問団が易々とエドワードに対する臣従を受け入れ、王国を隷属化に置いたと厳しく批判する。\n\nしかしながら、実際にはエドワードへの臣従を易々と受け入れたのはブルースの方であり、むしろベイリオルは欠席ないしは遅刻という手段を使って当初は臣従を回避しようとしていた。『ゲスタ・アナリア』はブルース一族を救国の英雄として描くために、意図的にこの答弁の逸話を挿入したと考えられる。
    desc_ja:
    sources:
      - gesta_annalia_ch_72
    links:
      - homage_of_king_john
