chapters:

  - id: death_of_david_son_of_alexander_iii
    ja: 王子デイヴィッドの死（1281年6月）
    date: 1281-06
    narrative_ja: 『ゲスタ・アナリア』とバウワーの『スコティクロニコン』は、1281年の6月末、アレグザンダー3世の王子デイヴィッドがスターリング城でこの世を去ったこと、ならびにその遺体がダンファームリン修道院に埋葬されたことを伝えている。
    desc_ja: 『ゲスタ・アナリア』と『スコティクロニコン』はいずれも、デイヴィッドの死を「スコットランドの未来の悲しみの始まり」と位置付けることで、1286年のアレグザンダー3世の死とそれに続く王位継承の危機へと至る一連の展開の起点として、遡及的に位置付けている。
    sources:
      - gesta_annalia_ch_63
      - scotichronicon_bk_10_37
    links:
      - marriage_of_eric_ii_and_margaret

  - id: marriage_of_eric_ii_and_margaret
    ja: ロクスバラ協定（1281年7月25日）
    date: 1281-07-25
    narrative_ja: 1281年7月25日、ノルウェー王エイリーク2世とスコットランド王アレグザンダー3世の娘マーガレットの婚姻がロクスバラで合意された。『ゲスタ・アナリア』はその後彼女が8月にノルウェーに出発し、両者の結婚式がノルウェーにて執り行われたことを伝える。『スコティクロニコン』は出発日を8月12日と具体化し、さらにノルウェーの入国日である聖母被昇天祭の前夜（8月14日）に母后の反対を押し切った戴冠というエピソードを付加している。
    desc_ja: 年代記『ゲスタ・アナリア』はマルグレーテの夫をノルウェー王ホーコンとするものの、これは後代の年代記作家による誤認である。バウワーの『スコティクロニコン』はホーコンまたはエイリークとし、『ゲスタ・アナリア』の記述を引き継ぎつつも、修正案を別説として提示している。
    sources:
      - gesta_annalia_ch_64
      - scotichronicon_bk_10_37
    links:
      - death_of_margaret_queen_of_norway

  - id: death_of_margaret_queen_of_norway
    ja: ノルウェー王妃マーガレットの死（1283年4月9日）
    date: 1283-04-09
    narrative_ja: 『ゲスタ・アナリア』やバウワーの『スコティクロニコン』によれば、1283年4月9日、ノルウェー王妃マーガレットがこの世を去った。彼女は夫であるエイリーク2世とともに1年半暮らした後、マルグレーテと呼ばれる娘をもうけていた。
    sources:
      - gesta_annalia_ch_64
      - scotichronicon_bk_10_37
    links:
      - death_of_prince_alexander_son_of_alexander_iii
      - margaret_or_norway_and_king_of_norway

  - id: death_of_prince_alexander_son_of_alexander_iii
    ja: 王太子アレグザンダーの死（1284年1月）
    date: 1284-01
    narrative_ja: 『ゲスタ・アナリア』は旧暦1283年、スコットランドの王太子アレグザンダーが20歳でこの世を去り、ダンファームリン修道院に埋葬されたことを伝える。バウワーの『スコティクロニコン』は『ゲスタ・アナリア』の記事を踏襲しつつも、埋葬日を聖アグネスの第二の祝日、すなわち1月28日と特定する。中世スコットランドでは3月25日が新年の始まりのため、旧暦1283年1月28日は現代の暦で1284年1月28日となる。
    sources:
      - gesta_annalia_ch_63
      - scotichronicon_bk_10_37
    links:
      - tailzie_1284

  - id: tailzie_1284
    ja: 1284年の限定相続（1284年2月5日）
    date: 1284-02-05
    narrative_ja: 1284年2月5日、スクーンにてスコットランド王国のバロンを名乗る総勢30名以上の伯とバロンたちが、王国の王位継承に関する文書を共同で発給した。この文書では、国王アレグザンダー3世の男系直系が断絶した際、彼の亡き娘マーガレットと夫であるノルウェー王エイリークとの間に生まれたマルグレーテを王国の相続人として受け入れることを誓約した。
    desc_ja: 西部・島嶼の領主たちが「スコットランド王国のバロン」として文書の発給者に含まれる。これを島嶼勢力の王国的枠組みへの同化の表れと読む余地がある一方、儀礼的・便宜的な包摂にとどまる可能性もある。
    sources:
      - aps_i_424
    links:
      - marriage_of_alexander_iii_and_yolande

  - id: marriage_of_alexander_iii_and_yolande
    ja: アレグザンダー3世とヨランド・ド・ドルーの結婚（1285年10月14日）
    date: 1285-10-14
    narrative_ja: 前王妃マーガレットの死から10年、すなわち旧暦1284年、アレグザンダー3世は家臣たちの助言により、新たな妻を娶るための使者を手配し、使節4名をフランスに派遣したと『ゲスタ・アナリア』は伝える。同年代記はまた、1285年の聖カリストゥスの日（1285年10月14日）に、王がドルー伯の娘ヨランドと結婚したこと、ならびに王家の結婚式にフランスとスコットランド双方から多くの貴族たちが集ったことを記している。バウワーの『スコティクロニコン』は挙式地をジェドバラと明記する。
    desc_ja: バウワーの『スコティクロニコン』は、婚礼での仮面劇と亡霊の挿話を加えており、この挿話を王の死の前兆として提示している。婚姻という出来事を男子を残さぬ王の死という帰結側から遡及的に意味づける典型的な叙述であり、事実叙述というよりも、修辞的・構築的なエピソードとして扱うのが穏当である。
    sources:
      - gesta_annalia_ch_66
      - gesta_annalia_ch_67
      - scotichronicon_bk_10_40
    links:
      - death_of_alexander_iii


