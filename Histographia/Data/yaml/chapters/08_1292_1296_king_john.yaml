  - id: council_of_twelve_1295
    ja: 十二人評議会の設立 (1295年7月6日)
    date: 1295-07-06
    narrative_ja: 『ラナーコスト年代記』は1295年の章の叙述の中で、1295年7月6日に「スコットランド王国の貴顕、高位聖職者、その他の貴族たちが集まり、スターリングで荘厳な議会が開かれた。そこで、彼らの王が自ら何かを行うことができないように、フランス人の慣習に倣って12人の貴族を置くことが共通の評議によって定められ、その場で彼らを選出し、任命した」と述べる。ピエール・ラングトフト年代記もまた、スコットランド側の指導者集団が「12人の同輩」を立てた旨を叙述しており、これらイングランド側の年代記叙述からは1295年頃に12人を単位とする合議的統治形態が結成されたことがうかがえる。\n\n『ラナーコスト年代記』はこの「スターリング議会」において、12人の合議体の設立のほかに、ロバート・ブルース (6世) とその子ロバート・ブルース (7世) の権利剥奪、ウォレン伯［サリー伯］らイングランド側使節の冷遇と入城拒否、エドワード1世への臣従礼の破棄を協議し、フランス王と同盟して海陸からイングランドを疲弊させる構想の策定がなされたと記録している。
    desc_ja: 『ラナーコスト年代記』の1295年の章は、1296年春のカーライル攻撃、続くベリック攻略) を含む叙述の後に7月6日のスターリング議会記事を置いており、内部年代が前後している。したがって、同記事を「1295年7月6日」の事実記録として直接的に読むのではなく、制度・政治方針の説明記事が後から挿入・再配置された可能性を前提に扱うのが良いと考えられる。\n\nこの12人評議会の歴史的性質をめぐっては、主に「王権の機能不全を補完する憲法上の革命」とする見解と「特定の外交課題に対応するための実務的委員会」とする見解の間で議論が展開されている。G. W. S. Barrow はこの評議会の成立を「慎重な憲法革命」と位置づけた。Barrow によれば、エドワード1世の圧力に対して脆弱さを露呈していたジョン王から統治の実権を剥奪し、4人の司教、4人の伯、4人のバロンからなる評議会が国政を担うこととなった。そしてこの構成は1286年の摂政評議会の構成を倍にしたものであり、13世紀スコットランドに固有の「王国の共同体」という観念を体現する、極めて対称的かつ代表的な組織であった。Barrow はこれをイングランドの1258年の15人評議会と比較しつつも、スコットランド独自の保守性とエドワード1世への強い反感の産物として評価した。\m\m一方で、この評議会をより限定的な「実務委員会」とみなす見解も存在する。M. Penman が紹介するように、一部の研究者はこれが1281年の婚姻協定交渉時と同様に、フランスとの外交交渉と軍事同盟の策定に特化した身分制議会による作業部会であったと示唆している。この文脈では評議会は必ずしも王権との対立や王の排除を意味するものではなく、むしろジョン王の血縁関係や人脈を利用してフランスとの同盟を確実にするための機能的な組織であったとされる。M. Brown も、この評議会 (または非公式な助言者集団) がジョン王の名において政府を動かしていた可能性を認めつつ、1290-91年の事例と同様に高位聖職者や大貴族たちが王国を代表する集団としての権利を主張した結果であると述べている。
    sources:
      - chron_lanercost_1295_ex1
      - chron_langtoft_212-32
    links: []


  - id: french_scottish_negotiation_beginning_1295
    ja: フランス＝スコットランド外交交渉の開始 (1295年3月～5月)
    date: 1295-05-10
    narrative_ja: 1295年3月から5月にかけて、フランスとスコットランド間の同盟の交渉が始まったと考えられる。1295年3月3日、フランス王フィリップ4世はフランドル伯に対して敵国への物資供給を禁じる命令を発しているが、その対象にイングランドとアイルランドと並んでスコットランドが含まれている。このことから、この時点ではまだ、フランス側はスコットランドをイングランド側に与する国と見なしていたことがわかる。しかし、同年5月10日付の文書では、フィリップ4世はスコットランド商人たちを「友邦」と呼称し、11月の万聖節までの間、フランスおよびフランドルでの羊毛、皮革、家畜などの取引を許可している。したがって、スコットランドとフランスの交渉はこの3月から5月の間にかけて開始されたものとみられ、同年7月にスコットランドで設立された12人評議会に先立って開始されていたことがうかがえる。
