chapters:

  - id: homage_of_king_john
    ja: ジョン王の臣従礼 (1292年12月26日)
    date: 1292-12-26
    narrative_ja: 1292年12月26日、新たにスコットランドの王となったジョン・ベイリオルはニューカッスル・アポン・タインにて、エドワード1世に臣従礼を行った。その臣従礼はエドワードをスコットランド王国の「宗主」と呼び、ジョンは「スコットランドの全王国とその属領およびそれらに付随するすべてに関し」エドワードの臣下となることを誓った。スコットランドは独立した王国ではなく「イングランド王から世襲的に保持されるもの」、つまりイングランド王から与えられた所領と定義されたのである。
    desc_ja:
    sources:
      - foedera_i_ii_782_1
    links:
      - cancel_of_treaty_of_birgham


  - id: appeal_of_roger_bartholomew
    ja: ロジャー・バーソロミューの上訴 (1292年12月7日)
    date: 1292-12-07
    narrative_ja: 1292年12月7日のロジャー・バーソロミューの上訴は、スコットランドの最高裁判機関が下した判決に対し、イングランド王エドワード1世が再審と裁定を加えた記録上最初の上訴事例である。ベリックの市民であったバーソロミュー師はジョン・ベイリオルの即位からわずか1週間後の1292年12月7日、ベリックに滞在していたエドワード1世に対しスコットランドの摂政団裁判所で自身に不利に下された判決群を不服として上訴した。上訴の対象となった原判決は、1291年10月18日にエディンバラの摂政団の御前で下されたものである。一次史料上は4件の訴答からなるが、通例3件として総括される。\n\nエドワード1世は原裁判の手続き記録と当事者をニューカッスル・アポン・タインに召喚し、1292年12月22日に裁定を下した。その結末は事件ごとに分かれた。バーソロミューによる告発が悪意あるものとされた不法侵害事件 (ギルバート・ダンバー件) では摂政団判決が無効と宣言されてバーソロミューに有利に覆った。市民保有地の排除をめぐる事件 (香辛料商マイケル件) では原判決が確認されたが、バーソロミューに別途の訴権が留保された。亡夫の遺産をめぐる寡婦の訴え (マージョリー・モイン件) は当事者間の和解によって決着した。\n\nこの上訴はスコットランドにおける裁判所の判決にイングランド王が再審の手を及ぼした最初の事例として、その後の一連の経過の起点に位置づけられてきた。
    desc_ja:
    sources:
      - stevenson_documents_i_no_305
    links:
      - homage_of_king_john


  - id: cancel_of_treaty_of_birgham
    ja: バーガム条約の無効化 (1293年1月2日)
    date: 1293-01-02
    narrative_ja: 1293年1月2日のバーガム条約破棄は、スコットランド王ジョン・ベイリオルがイングランド王エドワード1世を空位期にスコットランド側と取り交わした一切の約束・誓約から正式に解放し、その過程でバーガム条約ならびにノーサンプトン合意を明示的に無効化した出来事である。バーガム条約は1290年7月、ノルウェーの乙女マルグレーテとイングランド王子エドワードの婚姻を定めるとともに、両王家が結合した場合にもスコットランド王国が「分離し独立した自由な王国」として、その教会・法・慣習・司法を保持することを保障した文書であった。スコットランド側はこれを王国の独立を支える拠り所と見なしてきた。\n\nこの破棄は突発的な事件ではなく、ジョン・ベイリオルの即位以後の一連の経過の帰結に位置づけられる。直接の契機となったのは、ベリック市民ロジャー・バーソロミューの上訴に対しエドワード1世がニューカッスルで裁定を下した事件である。スコットランド側の有力者たちはスコットランドの裁判を国外で扱わないとしたバーガム条約に反するとして、エドワードに条約の遵守を請願した。しかしエドワードは、空位期に自らが与えた約束は「当面のもの」にすぎず、ジョン王の即位後は拘束力を持たないと宣言してこれを退けた。ジョン王の臣従礼からわずか1週間後の1293年1月2日、ジョン王はラテン語とフランス語による文書をもってエドワードを一切の拘束から解放した。
    desc_ja:
    sources:
      - foedera_i_ii_783_1
      - foedera_i_ii_783-4
      - foedera_i_ii_784_1
    links:
      - treaty_of_birgham_1290
