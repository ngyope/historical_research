  - id: marriage_of_isabella_bruce_and_erik_ii_of_norway
    ja: イザベラ・ブルースとノルウェー王エイリーク2世の結婚 (1293年11月15日)
    date: 1293-11-15
    narrative_ja: 『ラナーコスト年代記』は1293年11月15日、キャリック伯ロバート・ブルース［＝ロバート・ブルース (6世)］の娘イザベルがノルウェー王マグヌス［エイリーク2世誤り］の妃となったことを記録している。実際、1293年9月の持参金目録においてイザベルはノルウェー王妃と称されていることから、この事実を確かめることができる。ブルースは1292年10月にノルウェーに赴くための安全通行証を取得しており、その時から娘のイザベルをノルウェー王エイリーク2世に嫁がせるための準備を進めていた。ブルース家はジョン王の治世においてスコットランドの国政における影響力は失っていたものの、イザベルの結婚を通じてノルウェー王との関係を強化し、国際的な地位の向上を図っていたとみられる。
