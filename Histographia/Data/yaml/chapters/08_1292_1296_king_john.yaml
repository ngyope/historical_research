  - id: french_norwegian_alliance_and_norwegian_scottish_non_aggression_pact
    ja: フランス・ノルウェー同盟の締結とノルウェー・スコットランド間の不戦合意 (1295年10月22日)
    date: 1295-10-22
    narrative_ja: 1295年10月22日、ノルウェー王とフランス王の間で結ばれた友好同盟はスコットランドを巻き込んだより広範な対イングランド同盟ネットワークの一環であった。\n\nこの同盟の締結は同日に発行された2通の文書によって確認される。1つ目は、ノルウェー王エイリーク2世の代理人アウドゥン・フグレイクソンとフランス王フィリップ4世との間で結ばれた同盟条約を記録するものである。この同盟では両王とその後継者を拘束する「永続的な真実かつ忠実な友人関係」ならびに「統合、調和、永続的な友好の条約」を樹立する旨が合意された。また、この条約にはスコットランドに関する特別条項として、ノルウェーが対スコットランド戦争を行う場合フランスはノルウェーを支援しないこと、逆もまた然りであること、フランス王の仲裁を条件とする例外規定、フランス＝イングランド戦争中はノルウェーが過去の係争を口実にスコットランドへ戦争・敵対行為を起こさないこと、が明記されている。もう1つは、スコットランド側の使節4名 (セント・アンドルーズ司教ウィリアム・フレイザー、ダンケルド司教マシュー、騎士ジョン・ソールズおよびイングラム・アンフラヴィル) から発出された文書で、スコットランドがノルウェーに対して不戦を保証する内容となっている。この文書はジョン王がフランス＝イングランド戦争中にノルウェーへ戦争を行わないこと、過去の係争を口実とした敵対行為や陰謀を行わないこと、ノルウェー王がスコットランド王国内に保持する土地・財産をジョン王がこれを掌握した場合に返還すること、これに関するジョン王自身の開封書状を可能な限り速やかに送付することを明記している。スコットランド使節は、対ノルウェー不戦と西部諸島関連の所領返還を約束することで、対イングランド共同戦線における後方の安全を確保し、翌日10月23日のパリ条約調印に向けた条件を整えたと解される。\n\n両文書とも同日付・同地 (1295年10月22日、パリ) で発出されている点は、これらの文書がフランス王フィリップ4世が対イングランド包囲網政策の一環として、ノルウェーとスコットランドを同時に対イングランド同盟ネットワークへ組み込もうとした外交戦略の所産であった可能性を強く示唆している。
    desc_ja: R. Nicholson は、この同盟の締結はフィリップ4世による対イングランド包囲網政策の一部であったと整理し、ノルウェー海軍による対イングランド海上侵攻と、スコットランドによる陸上侵攻を組み合わせる構想であったとしている [R. Nicholson (1974), ch. 3]。\n\nまた、ノルウェー側使節の書簡が婉曲に表現する「過去の時代に彼らの間に生じた問題や不和」とは、1266年パース条約に基づく西部諸島の年金100マークの支払いの未払い、ならびにエイリーク2世の亡き妃マーガレットの遺産・寡婦産支払いの未払いを指すと解される [Brown (2004), ch. 8]; [Beam (2008), ch. 5]。 これらの未解決問題はエドワード1世が貢納義務を尊重させなかった点でノルウェーの不満を醸成し、結果としてエイリーク2世をフランス側へ接近させた可能性が示唆される。
    sources:
      - stevenson_documents_ii_no_343
      - stevenson_documents_ii_no_344
    links:
      - paris_treaty_1295


  - id: paris_treaty_1295
    ja: パリ条約の調印 (1295年10月23日)
    date: 1295-10-23
    narrative_ja: 1295年10月23日、パリにて、前日に締結されたノルウェー＝フランス同盟とスコットランド＝ノルウェーの不戦合意に基づき、スコットランドとフランスの間で友好同盟を伴う条約が結ばれた。同盟締結の当事者はスコットランド側の使節4名 (セント・アンドルーズ司教ウィリアム・フレイザー、ダンケルド司教マシュー、騎士ジョン・ソールズおよびイングラム・アンフラヴィル)、フランス側は王フィリップ4世が弟シャルル・ド・ヴァロワの意志と同意のもとに代表した。この条約はスコットランド＝フランス間の対イングランド相互防衛・攻勢同盟と、ベイリオル王朝・ヴァロワ家間の婚姻同盟を骨格とする詳細かつ拘束的な合意だった。\n\n条約の内容は、ジョン王の長男エドワード・ベイリオルとシャルル・ド・ヴァロワの長女ジャンヌの婚姻契約、両国間の軍事同盟、そして「王国の共同体」による条約承認の予告という3つの主要な柱から構成されている。婚姻条約については、エドワード・ベイリオルがフランス王の姪であるジャンヌと結婚することが定められ、持参金25000リーヴル・トゥルノワや年額1500ポンドの寡婦産の規定が詳細に定められている。軍事同盟の条項では、スコットランド側はイングランドへの侵攻を約束し、フランス側はスコットランドへの支援を約束する内容となっている。また、単独不講和条項も設けられており、いずれの当事者も他方を含めない形で和平や休戦を結ぶことができないとされている。さらに、「王国の共同体」による承認の予告では、高位聖職者や貴族、都市の自治共同体が条約を承認し、フランス王へ印章付き開封書状を送付することが約束されている。王太子と仏王室の婚姻、ジョン王個人の補償的利益、王国共同体の動員といった複数の動機が重なって条約が成立した点を考慮すると、これを単純に当時スコットランドにおいて有力な政治派閥であったカミン派による「王権簒奪」と解する立場は退けられるべきであり、カミン派指導層が主導する形で、王権と統治エリートの複合的合意がなされた結果の所産と捉えるのが妥当と考えられる。\n\nこの条約はジョン王がフランス王フィリップ4世に対して臣従することを前提としたものであったが、実際にはジョン王はこの条約をイングランドに対する反撃のための戦略的な同盟関係として位置づけており、フランス側もまた、イングランドを牽制するための同盟関係としてこの条約を利用しようとしたと考えられる。したがって、この条約は単なる友好同盟以上の意味を持ち、当時の国際政治における複雑な力学を反映したものであったと評価できる。
    desc_ja: [A. Beam (2008), ch. 5] はこの軍事条項が「軍事的にフランス側に有利な一方的な内容」であると評価する。すなわち、スコットランド側は「全力」での対イングランド侵攻が義務化されるのに対し、フランス側の義務は「援軍派遣または他地域での牽制」にとどまっている。実際、Beam が指摘するように、1298年や1302年のイングランド＝フランス和平交渉ではこの単独不講和条項は遵守されず、スコットランドはフランスから事実上排除される結果となった。この非対称性は、条約調印時点でのスコットランド側の交渉力の限界を反映しているとも解しうる。\n\n伝統的に、この1295年のパリ条約はフランスとスコットランドの同盟「オールド・アライアンス」の始まりとされてきた。しかし、[R. Nicholson (1974), ch. 3] や [G. W. S. Barrow (2013), ch. 5] が論じるように、この条約は1173年以来のフランス＝スコットランド協調の延長線上にあるとみるべきである。ただし、1295年の条約は過去の協定よりも条項が詳細かつ拘束的である点で、伝統の制度化と質的深化を含んでいるとも解しうる。
    sources:
      - aps_i_451-3
      - chron_guisborough_269
    links:
      - ratification_of_paris_treaty_1296


  - id: ratification_of_paris_treaty_1296
    ja: パリ条約の批准 (1296年2月23日)
    date: 1296-02-23
    narrative_ja: 1295年10月23日にパリで調印された条約は、1296年2月23日にダンファームリンで正式に批准された。批准の主体はスコットランド王ジョンと、聖職者、修道院、伯、バロン、諸都市からなる「王国の共同体」であった。この批准文書には4人の司教 (セント・アンドルーズ司教ウィリアム・フレイザー、グラスゴー司教ロバート・ウィシャート、ダンケルド司教マシュー・クランベス、アバディーン司教ヘンリ・チェイン)、5院の修道院 (アーブロース、ダンファームリン、エディンバラのホリルード、ケルソー、セント・アンドルーズ)、4人の伯 (バカン伯ジョン・カミン、マー伯ドナルド、ストラサーン伯マリーズ、アソル伯ジョン)、11人のバロン (バーデノックの領主ジョン・カミン、ジェームズ・ステュアート、アレグザンダー・ベイリオル、ジェフリ・モウブレー、リチャード・シワード、ハーバート・マクスウェル、パトリック・グレイム、ニコラス・ヘイ、ニコラス・グレイム、アレグザンダー・カミン・オブ・バカン、アレグザンダー・ボンクル)、6つの諸都市 (アバディーン、パース、スターリング、エディンバラ、ロクスバラ、ベリック) が封印者として名を連ねている。この封印者には当時スコットランドの政権を指導したカミン派の有力者たちが含まれているほか、6大都市の自治共同体が王国の重要な政治アクターとして公式の場に登場する点は都市共同体が王国の政治において重要なアクターとして認識されるようになっていたことを示唆している。\n\n一方、この封印者リストにはブルース家の関係者がひとりも含まれていないのは示唆的である。[R. Nicholson (1974)] や [A. Beam (2008), ch. 5] や [G. W. S. Barrow (2013), ch. 5] はこの事実をブルース派とカミン派の派閥対立の表面化や、1295年末から1296年初頭にかけてのブルース家のベイリオル政権からの離反の指標として読み、ブルース家がこの批准の段階ではまだカミン派政権内で重要な役割を果たしていなかったことを示唆している。また、ブルース家の庇護下にあったギャロウェイ司教トマス・ダルトンや、ケイスネス、アーガイル、マリといった他の司教の名が見えないことも特徴的であり、対イングランド強硬路線を支持する教会内勢力の核を可視化しているとも解される。
    desc_ja: 6大都市が封印者として名を連ねている点について、[G. W. S. Barrow (2913), ch. 5] は「王国の共同体」の概念が聖俗の貴族のみならず、都市部の自治体までを含む広がりを持っていたことを強調している。 
    sources:
      - aps_i_451-3
    links:
      - english_invasion_1296


