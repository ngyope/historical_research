  - id: scone_parliament_1293
    ja: スクーン議会 (1293年2月9日)
    date: 1293-02-09
    narrative_ja: 1293年2月9日にスクーンで開催されたジョン・ベイリオル王の最初の議会では、スコットランド王国の統治体制を確立するための重要な司法・行政上の決定が行われた。ジョン王の統治を安定させるための最も顕著な行為は、王国内に3つの新たな州長官管区を設置することであった。これらの創設は「王国の平和と安定」を目的として正当化されたが、実質的には新しい地方行政単位の設定であり、同時にベイリオル派と思われる有力貴族への権力の分配でもあった。\n\nスカイの州長官にはロス伯ウィリアムが任命された。彼にはスカイ島、ルイス島、バーラ島、ウイスト島、および小島嶼を含む北ヘブリディーズ全体を統治する権限が与えられた。この任命はロス伯が「島民たちをジョン王の平和へ導く」ことで得たとされる報酬であり、彼は同時にセイニッジの新たな貸与を受けたことから、ジョン王がカミン派に属する有力者に対して政治的恩恵を与えていたことを示している。一方、この任命がアンガス・オブ・アイラとスコットランドの島嶼領主たちの反感を招くことにもなった。\n\nローン地方の州長官にはアーガイルの領主アレグザンダー・マクドゥーガルが任命された。マクドゥーガルにはモーヴァーン、アードナマーカン、ロッホオーの地域とアーガイルおよびムルの支配権が与えられた。マクドゥーガルは既にアレグザンダー3世の時代に同地方で有力な地位を占めていたが、ジョン王はこれを正式な官職として追認した形である。また、マクドゥーガル家はカミン家と姻戚関係にあったため、この任命はジョン王がカミン派の有力者に対して政治的恩恵を与えていたことも意味している。これもまた、アンガス・オブ・アイラとスコットランドの島嶼領主たちの反感を招くことになった。\n\nキンタイアの州長官にはジェームズ・スチュアートが任命された。彼はもともとブルース派と関係が強く、またその権限は主に彼の一族領地であるキンタイア、ビュート島、アランに限定されていたものの、ステュワートは元摂政団のメンバーであり、ブルース派との関係を保持しながらもベイリオル王権に協力して政治的に有用な立場を占めていたと言える。\n\n1293年2月の議会における本業務の大部分は土地保有や相続に関する紛争の解決に充てられた。これらの事件の幾つかは、アレグザンダー3世治世中および摂政団期に生じた土地権の不確実性を反映していた。\n\nマクダフ事件は、ジョン王の権威に対する最初の深刻な挑戦となった。マクダフは1289年に殺害されたファイフ伯ダンカンの兄弟であり、ファイフ地方にあったリーアスおよびクレイの土地に対する権利を主張していた。これらの土地は伯ダンカンの未成年時代に王の管理下に置かれていたが、王の死後、セント・アンドルーズ司教ウィリアム・フレイザーの管理下に置かれていた。マクダフは暴力的に自らが占有を得ようとしたとして告発されたが、議会における裁定により、伯ダンカンの息子が成年に達するまで、司教フレイザーが土地を保有することが認められた。この判決は、実質的には王権が有力な盟友 (カミン派との結びつきが強いフレイザー) の利益を優先したことを示唆している。マクダフはこの不利な判決に従わず、後にイングランド王エドワード1世に上訴することになり、これが1293年から1295年にかけてのマクダフ事件の長期化につながることになる。\n\n他の土地紛争も類似の構図を示していた。騎士のジョン・ソールズはかつての保有地を確認するために出頭し、セント・アンドルーズ司教との間で土地保有権に関する複雑な法的問題を扱わねばならなかった。\n\nレディング修道院事件はさらに複雑であり、スコットランド、イングランド、ノルウェーの3つの君主権が絡む国際的性質を持っていた。レディング修道院はスコットランドのメイ小修道院の収入と収益を要求しており、前修道院長ロバートとセント・アンドルーズ司教ウィリアムとの間で行われた売却契約が有効であるかどうかが問題とされた。\n\nまた、この議会において出頭を命じられた者たちの中には、王権に対して明らかに敵対的な態度を示す者たちがいた。キャリック伯ロバート・ブルース、ケイスネス伯ジョン、島嶼のアンガス、ウィリアム・ダグラスといったスコットランドの有力貴族は、当議会に出頭してジョン王に臣従礼を行うことを拒否した。彼らは2度目の召喚により、復活祭後の第1日曜日の翌日に出頭するよう命じられた。
    desc_ja:
    sources:
      - rps_1293_2
    links:
      - appeal_of_macduff
      - sterling_parliament_1293


  - id: appeal_of_macduff
    ja: マクダフの上訴 (1293年2月～1294年4月)
    date: 1293-03-01
    narrative_ja: 1293年2月9日、スクーンで開催されたスコットランド王ジョンの最初の議会において、マクダフは「暴力的な不法侵入」の罪で召喚された。争点となったのはファイフ地方のリーアスおよびクレイクの両保有地である。これらの土地は先代ファイフ伯ダンカンの死後、次代のダンカンが未成年であったため、所領の後見権に基づいて王の管理下にあった。マクダフはこれらの土地が父マルコム伯から与えられ、アレグザンダー3世によって承認されたものであると主張して占拠したが、王側はこれを王の平和を乱し、王の権利を侵害する行為として訴えたのである。\n\nマクダフは議会において、先王アレグザンダー3世の証書を提示して自身の正当性を主張した。しかし、議会に列席した有力者たちはアレグザンダー3世自身がかつての継承者たち (ファイフ伯コルバンおよびその子ダンカン) の未成年期にこれらの土地を後見人として管理していた事実を証言した。これに基づき、議会は不法侵入の罪によりマクダフの身柄を拘束するという判決を下した。ただし、土地に対するマクダフの権利そのものが否定されたわけではなく、現在の継承者である年少のダンカンが成年に達した際、王国の法と慣習に従って改めて訴えを起こす権利は留保された。\n\nジョン王の裁定を不当な「偏向」であると見なしたマクダフは釈放後、スコットランド王の上級君主であったイングランド王エドワード1世に対し、聴聞を求めて上訴を行った。マクダフの上訴を受理したエドワード1世はジョン王に対し、1293年5月の聖三位一体祝日の翌日にロンドンへ出頭するよう命じた。しかし、ジョン王はこの初回の召喚に応じなかったため、エドワード1世は同年9月のミカエル祭の期日への再召喚を命じるとともに、スコットランドからの上訴手続きに関する厳格な規定を策定した。この規定は、エドワード1世がスコットランドの上級君主としての審判権を具体化させたものだったと言える。まず、スコットランド王が召喚に2度応じず、不服従を申し開きできない場合、その事案に関する審理権を喪失し上級君主の罰金刑に服することが定めれた。また、スコットランド王による不当な土地奪取が認定された場合、原告は占有を回復するだけでなく、その土地に関してイングランド王の直接の封臣となり、スコットランド王の裁判管轄権から恒久的に離脱することが定められた。さらに、上訴期間中、原告はイングランド王による「保護」を申請でき、これに対する侵害があった場合はスコットランド王はその土地に対する支配権を永久に失うと定められた。\n\n1293年9月のミカエル祭後の議会において、ジョン王は自らイングランド議会に出頭した。この審理では、上級君主権の管轄権をめぐる法的応酬が記録されている。まず、マクダフの訴えに対し、ジョン王は自らが「スコットランド王国の王」であることを強調し、王国の賢人らに相談することなく王国に関わる事柄について回答することはできないと主張した。これに対し、エドワード1世はジョンが臣従礼を捧げた「臣下」であり、法廷に召喚された以上は回答の義務があると迫った。ジョン王が相談のための延期すら拒否したため、議会はジョンを弁護を放棄した状態と宣告した。そして、マクダフに対する投獄の損害賠償が申し渡され、リーアスおよびクレイクの土地からの排除に関する事実調査の実施が命じられた。さらに、ジョン王の不服従と侮辱に対する制裁として、スコットランド王国の主要な3つの城をイングランド王が没収し、謝罪がなされるまで保持することが決定された。これらの判決が言い渡される直前、ジョン王は自ら口頭および書面で嘆願を行った。彼は、自分だけでなく王国に関わる問題であるため民と相談するまでの猶予を求め、次の1294年の復活祭後の議会で回答することを約束した。エドワード1世は特赦としてこれを認め、制裁の執行を猶予した。\n\nジョン王は1294年の復活祭後の議会に参加したものの、議会はイングランドの対フランス戦争に関するアジェンダが優先されたため、マクダフの訴訟は延期となったようである。結局、この訴訟は決着することなく、1296年のイングランドによるスコットランド侵攻とジョン王の臣従撤回へと至ることとなった。
    desc_ja:
    sources:
      - rps_1293_2
      - rot_parl_110-11
      - gesta_annalia_ch_86
    links:
      - london_parliament_1294


  - id: sterling_parliament_1293
    ja: スターリング議会 (1293年8月2日)
    date: 1293-08-02
    narrative_ja: 1293年8月2日にスターリングで開催されたジョン王の議会は、同年2月のスクーン議会に続く統治体制構築の段階に位置し、王権の権威確立、敵対者の屈服、王領の回復、対外的請願の処理を主要な議題とした。現存する議会記録は8つの条目から成り、各案件はいずれも「国王陛下と評議会の面前にて」処理されたことが明示されている。\n\nスターリング議会への召喚は式文集という形で伝存する個別召喚状によって行われたと考えられる。召喚状の内容は「重要事項」の協議への招請、州長官区内のすべての訴願人に対し、不法行為者から受けた侵害を王と評議会の面前で訴え、正義の裁定を受ける機会の提供、1286年のアレグザンダー3世死去以降に許可なく譲渡された王の直臣地の権原調査、ならびに羊疫病に感染した羊の保有許可からなる。\n\nこの議会において、フランドル伯の代理人ジョン・ヴィダム・オブ・ピンケニーとラソ・オブ・ゴールがアレグザンダー3世の長男アレグザンダー (1284年死去) とフランドル伯娘マルグリットの婚約時に与えられた1500マルクの寡婦産を請求した。手続上注目される点は次のとおりである。①代理人は本件を「訴訟の形式ではなく、友好的な請願として」提示した。②王は評議会を通じて根拠書類の提出を求め、ゲルデルン伯夫妻からフランドル伯への授権状および代理人任命状の提出を受けた。③王はスコットランドの法と慣習による裁定を受ける意思の有無を確認したが、代理人は再度「友好的な回答」のみを求める旨を主張した。④王はイングランドおよび他国に滞在する友人・近親者・近臣・顧問と相談したいとして「国王陛下がイングランドから帰還した後の次回議会」に答弁を延期した。\n\nこの議会では、ジョン王の即位前と即位後の2件の不法行為について、ウィリアム・ダグラスが訴追された。王の即位前、ダグラスは自城で3名を不法投獄し、保証と担保および王国法に反して拘禁した結果、1名は獄中で死亡、1名はダグラスの命令で斬首、1名は逃亡したとされる。王に1000ポンドの損害を与えたとされる本件についてダグラスは事実を否認できず、国王の裁量に身を委ねた。王の即位後には、ラナーク州長官の代官が地方統監の命令によってダグラスから勝訴した母への保有地の引渡しおよび140マルクの損害賠償の徴収のためにダグラス城を訪れたところ、ダグラスは代官を1日1夜にわたり城内に拘束した。自認により王の官吏妨害が認定され、制定法に従って投獄および国王の意向に従う罰金が命じられた。\n\nまた、本議会では家令ジェームズ・スチュアートとジョン・ソールズがスターリング議会に出頭し、王の叔父バーナード・ベイリオルがネンソーンにおいて保有していたすべての土地と保有地を、王が正統な相続人であるとの理由で王に返還している。\n\n議会記録の最後には、1293年2月議会への召喚に応じなかった「キャリック伯ロバート・ブルース」が、父であるロバート・ブルース (6世) から1292年11月9日にベリック・アポン・ツイードで発行された権利放棄書を持参し、キャリック伯領の臣従礼を国王に願い出た事件が記されている。手続上はスコットランド王国の慣習法により、王が当該土地の占有をいったん取った後でなければ臣従礼を受けられない、という規定が明示的に運用された点が注目される。若ロバート・ブルースは保証人として、相続上納金についてマー伯ドナルドとスコットランド家令ジェームズを、父の権利放棄書の適法な作成・引き渡しについてはレノックス伯マルコム、ジョン・ソールズ、ギルバート・キャリックを立てた。この運用に則り、エア州長官には占有の接収と保有地の評価が命じられた。
    desc_ja: この議会の召喚状は内的証拠 (先王アレグザンダーへの言及、1286年以降の譲渡地の調査、羊疫病への暫定的猶予、聖ペテロの祝日後の月曜日という日付)から、A. A. M. Duncan によって1293年8月のスターリング議会への召喚状と同定されている [A. A. M. Duncan (1966)]。\n\n議会の「実質的構成部分」が王と評議会であった点については、A. A. M. Duncan と A. A. B. McQueen がともに主張している点である。McQueen は議会記録本文においてフランドル案件とダグラス案件を除くすべての条目が評議会の関与に言及していることを指摘し、2月議会の記録と比較して評議会の役割がより明示的に強調されていると論じる [A. A. B. McQueen (2002)]。記録様式についても、placita coram rege、tenementa、transgressio、ingressus、in octabis purificacionis beate Marie といった用語・慣用表現はスコットランドでは1291年以前にも以後にも一般的でなく、イングランドの書記の影響もしくはイングランド人書記による作成を示唆すると Duncan は論じる [A. A. M. Duncan (1966)]。A. Beam もこの点を踏まえ、エドワード1世の宗主権下で訴訟手続を意識せざるを得なかったジョン政権がイングランド式の記録様式を取り入れた可能性を指摘している [A. Beam (2008)]。
    sources:
      - rps_1293_8
    links:
      - lanark_parliament_1294


  - id: lanark_parliament_1294
    ja: ラナーク議会 (1294年2月26日)
    date: 1294-02-26
    narrative_ja: 1294年2月初旬から中旬にかけてラナークで開催されたジョン王の議会は同王の議会のうちでも史料的に乏しい議会であり、議会記録に相当する一次資料は現存していない。議会の存在と日付は1295年に作成されたエドワード1世の役人ウォルター・オブ・カンボーの会計書の付随的言及によってのみ間接的に確認されるにとどまる。A. A. M. Duncan は同会計書に記された滞在日数「15日間」と1294年2月16日付の裁定書発給日とを照合し、議会が2月2日の聖燭祭に開会し、約2週間続いたと結論づけている [A. A. M. Duncan (1966)]。\n\n本議会は1293年9月のミカエル祭会期のウェストミンスター議会において、ジョン王がマクダフ事件の上訴審理で「無答責」と宣告され、主要3城の没収という制裁を受けた直後の議会である。ジョン王はミカエル祭議会での嘆願により1294年6月14日への期日変更を獲得したが、この議会はその間の時期に開催されたものである。\n\n本議会において一次史料が直接確認する唯一の案件は、ファイフ伯領の後見権をめぐるエドワード1世の請求である。先代ファイフ伯ダンカンの死後、未成年の相続人ダンカン4世はエドワード1世の後見下にあった。エドワード1世は1293年11月20日にウォルター・オブ・カンボーを代理人に任命し、王国直臣として保有されていた同伯領の管理権を主張させた。ウォルターはまずギャロウェイのビトル城にいたジョン王のもとを訪れ、12日間滞在したが回答を得られず、案件はラナーク議会に回付された。議会にはさらに15日滞在し、2月16日に「賛意ある回答」と必要な王の書状を受領した。
    desc_ja: この議会については議会記録が現存していないものの、A. A. M. Duncan が論じるように、ジョン王のもとで議会が請願処理を含む実質的審理機関として機能していた好例である [A. A. M. Duncan (1966)]。また、1293年2月のスクーン議会から、1293年8月のスターリング議会、1294年2月のラナーク議会といった一連の議会の開催は、ジョン王治世において議会が定期的に開催された証左であるとする A. A. B. McQueen の主張も注目される [A. A. B. McQueen (2002)]。
    sources:
      - stevenson_documents_i_no_317
    links:
      - edinburgh_parliament_1294
      - conflict_for_the_bishopric_of_whithorn


  - id: conflict_for_the_bishopric_of_whithorn
    ja: ホイットホーン司教位をめぐる対立 (1294年5月19日～10月10日)
    date: 1294-10-10
    narrative_ja: 1293年11月1日のホイットホーン (ギャロウェイ) 司教ヘンリ死去に伴い、ホイットホーン修道院長、聖堂参事会、聖職者団が後任としてトマス・ダルトン・オブ・カークーブリー師を選出したのに対し、ギャロウェイの領主でもあったスコットランド王ジョンが異議を申し立て、ヨーク大司教ジョン・ロメインを舞台に約半年にわたってホイットホーン司教位をめぐる対立が繰り広げられた。最終的にジョン王は1294年5月19日に異議を撤回し、トマスは同年10月10日に聖別された。\n\nホイットホーン司教座は他のスコットランド司教座がローマ教皇庁に直接帰属していたのに対し、ヨーク大司教座に服属する唯一の司教座であった。1255年の前回選挙以来、約40年にわたり選挙が行われていなかったため、選挙権限がホイットホーン修道院 (聖堂参事会)、ギャロウェイ大助祭、ヨーク大司教の3者の間で曖昧化していた。一方、ベイリオル家にとってギャロウェイは1290年に母ダーヴォルギラの死去によって相続したばかりの所領であり、ジョン王がギャロウェイの領主として「司教座のパトロネージ」を主張しうる立場にあった点が本件の紛争の契機となった。\n\n『ラナーコスト年代記』は諸聖人の祝日［1293年11月1日］に「神に愛された司教、ギャロウェイのヘンリが現世を去った」と記し、後任を「トマス・ダルトン師」と明記する。もっとも、『ラナーコスト年代記』が同人の聖別を「リポンにて、聖母被昇天の祝日 [8月15日]」とする点は、実際の聖別日 (1294年10月10日) と一致せず、年代記の記述には日付上の混乱がある可能性が示唆される。\n\n選出に際し、トマス・ダルトンはアナンデール領主であった競争者ロバート・ブルース (5世) の書記であり、G. W. S. Barrow が論ずるところでは「競争者の最後の公的行為」のひとつが、本案件における自らの被保護者の司教叙任の獲得であった。Barrow はこれをイザベル・ブルースのノルウェー王エイリーク2世との結婚と並ぶ「ベイリオルに対する二重の挑戦」として位置づける。\n\nジョン王は自家の本拠地ビトル城に滞在中の1294年1月13日、ヨーク大司教ロメイン宛の書簡を発し、トマスが「神霊や慈愛によらず、約束と聖職売買により」選出されたとして異議を申し立て、聖別の延期を求めた。同書簡は王の書記ウォルター・フォザリンゲイおよびトマス・オブ・アソルを案件説明者としてヨークに派遣する旨を伝えており、ジョン王の主たる主張は「ホイットホーン修道院長と聖堂参事会員が買収された」という点にあった。Barrow も、ジョン王が聖堂参事会の選挙権そのものは争わず、買収を告発の中心に据えた点を指摘し、その告発が実際にはブルース派閥に向けられていたとする。\n\nほぼ同時期に、ブルース側もロメインに書簡を送付してトマス選出を擁護した。アナンデール領主ロバート・ブルース (競争者の子) がロメインに宛て、トマス・カークーブリーが「神の許しと、貴殿に服属するウィソーンの全選挙人団の共通の同意」によって司教に選出されたとし、「悪意ある霊に膨れ上がったある『不法の息子たち』」が妨害を企てていると訴える。\n\n教区内部の対立について、先行研究はほぼ一致した像を提示する。すなわち、ギャロウェイ大助祭ヘンリ (年配で盲目の人物) とその甥ジョン師はベイリオル派であり、選挙権限の所在を巡って聖堂参事会と争っていた。Barrow は特に、ジョン師が王位継承訴訟においてベイリオルの訴訟支援人を務めた人物であり、前任司教ヘンリ・オブ・ホリールード自身もベイリオル側の訴訟支援人であった事実を挙げ、これらの偶然ではない結びつきがベイリオル派の教区内基盤を形成していたと指摘する。さらに、ホイットホーンの教区代理ロバート・ヴァヴァサーからも、ヘンリ死後の教区内不和を伝える書簡がロメインに届けられた。\n\nロメインの対応は段階的に発展した。A. Beam の整理に従えば、以下のとおりである。1294年1月22日、ロメインはジョン王に返信し、本件への注意深い対応を約束した。1月23日、ロメインはホイットホーンの教区代理であったヴァヴァサーに返信し、彼が正規の手続を経ずに教区代理を任命させたとして大破門の対象となっている事実を指摘し、ベイリオル派の代理人として活動していたジョン師を黙らせるよう命じた。この時点ではロメインはトマス・ダルトン選出の覆審に傾いていた可能性が示唆される。2月19日、ロメインはジョン王に対し、ホイットホーン司教座の司教領に割り当てられた2つの教会をヴァヴァサーに引き渡すよう要請。5月1日、ロメインはヨーク大司教座の教区代理ロバート・レイシーを委員長とする委員会を招集し、スコットランド王側の異議を正式に審理に付した。\n\n1294年5月、エディンバラにおいてジョン王とその評議会が一連の懸案を処理した。A. A. M. Duncan の再構成によれば、5月16日にフランドル伯娘マルグリットの寡婦料支払いが「我らの評議会および他の信頼すべき者たちの助言を用いて」決定され、その3日後の5月19日に、ジョン王はホイットホーン司教選出への異議を「高貴で賢明な大貴族らの請願により」撤回した。さらに5月30日にはロメインがジョン王に対し、王が選挙認可を申請し獲得した事実を踏まえ司教領の返還を要請した。トマス・ダルトンは同年10月10日に聖別された。
    desc_ja: 
    sources:
      - chron_lanercost_1293_ex1
      - raine_northern_registers_no_64
    links:
      - edinburgh_parliament_1294


  - id: first_treasurer_of_scotland
    ja: スコットランドにおける財務官職の創設
    date: 1293-12-19
    narrative_ja: ジョン王の治世は、スコットランドにおいて財務官職 (treasurer) の存在が初めて確認される時期に位置づけられる。1319年に行われたアプランドの土地をめぐる訴訟の記録において、紛争当事者のホリルード修道院が提出した1293年の文書の中に、スコットランドの財務官 (treasurer of Scotland) の肩書を帯びたアルピン師という人物が登場する。彼がスコットランドの財務局の印章を使用していることを踏まえると、ジョン王の治世において王の財務官という役職が創設され、アルピン師がその最初の担い手であったと考えられる。
    desc_ja:
    sources:
