  - id: edinburgh_parliament_1294
    ja: エディンバラ会合 (1294年5月16日)
    date: 1294-05-16
    narrative_ja: 1294年5月16日の前後、ジョン王はエディンバラで会合を開き、1293年8月のスターリング議会以降、複数の議会を経て繰り越されてきた諸案件 (フランドル伯娘マルグリットの寡婦料、1286年以降に許可なく譲渡された王の直臣地の権原調査、ホイットホーン司教選挙問題) を一括して処理したと考えられる。この会合では1294年5月16日付でフランドル伯娘マルグリットの寡婦料の支払いを命じる証書が、5月19日付でホイットホーン司教選挙への異議を撤回するヨーク大司教ジョン・ロメイン宛書簡が発給された。ただし、これらの文書はいずれも自らを「議会 (parliamentum または colloquium)」と称してはおらず、唯一1500年頃に作られた式文集において「次の我らがエディンバラの会合 (colloquium) まで」とみえることから議会／会合とみなされている [A. A. M. Duncan (1966)]。\n\nこの会合では、1293年8月のスターリング議会で問題となったフランドル伯娘マルグリット (アレグザンダー3世の長男アレグザンダーの寡婦) の寡婦産1500マークの請求について最終決定がなされ、ジョン王はその支払いを承認した。5月16日付で発給された王文書の文言は、決定が王単独ではなく評議会との合議の所産であることを明示している。\n\nまた、1293年11月1日のホイットホーン司教 (ギャロウェイ司教) ヘンリ死去に伴い、修道院長、聖堂参事会、聖職者団が後継司教としてトマス・ダルトン・オブ・カークーブリー師を選出したのに対し、ギャロウェイ卿でもあったジョン王は1294年1月13日付ビトル発書簡で異議を申し立て、聖別の延期を求めていたが、1294年5月19日、ジョン王はヨーク大司教ロメインに対し「高貴で賢明な大貴族らの請願により」異議を撤回する書簡を発した。この書簡もおそらく、この会合において評議会の助言を得て作成されたものであると考えられる。
    desc_ja:     
    sources: 
      - stevenson_documents_i_no_323
    links: 
      - london_parliament_1294


  - id: london_parliament_1294
    ja: ロンドン議会 (1294年6月)
    date: 1294-06-29
    narrative_ja: マクダフの上訴をめぐる議論は1293年9月の議会において、その審理が1294年の復活祭後の議会まで延期されることが決定されたのを踏まえ、ジョン王は1294年の6月にロンドンで開催された議会に参加した。しかし、議会はイングランドの対フランス戦争に関するアジェンダが優先されたため、マクダフの訴訟は延期となったようである。エドワード1世は議会において貴顕に対して対仏戦争への援助を求めた。『ギスバラ年代記』の記述によれば、この場にはスコットランド王ジョンも列席しており、イングランドの大貴族らとともに援助を約束したとされる。\n\nこの議会における議論を踏まえて、1294年6月29日、エドワード1世がポーツマスにてスコットランド王ジョンおよびスコットランド貴顕に対して軍事奉仕要求を発した記録が現存している。エドワード1世はフランス王フィリップ4世が「協定をどの条項においても遵守せず」、ガスコーニュを「悪意を持って占拠」していることを「イングランド王冠に対する明白な権利剥奪」であると非難し、その上で、ジョン王および貴顕に対し彼らが負っている「忠誠と臣従」に基づき、1294年9月1日にロンドンへ「馬と武具」を備えて参集し、海を渡るよう命じた。召喚の対象にはジョン王個人のみでなく、アナンデール領主ロバート・ブルースやバカン伯ジョン・カミン、マーチ伯パトリック・ダンバー、マー、アソル、ロス、ストラサーン、メンテイス、レノックスといった主要な伯、さらにはスコットランド家令ジェームズ・ステュアートら18名が含まれていた。
    desc_ja:     
    sources:
