chapters:

  - id: edward_military_summons_for_scottish_nobles_1297
    ja: エドワード1世のスコットランド貴顕への軍事召集 (1297年5月24日～8月17日)
    date: 1296-05-24
    narrative_ja: 1297年5月24日から8月17日にかけて、イングランド王エドワード1世はスコットランドの貴顕に対し、フランス王フィリップ4世に対するフランドル遠征への従軍を求める一連の召集令を発した。\n\n## 1297年5月24日の召集令\n\n召集令はエドワードからマーチ伯の子パトリック以下に宛てられ、出陣時期を「洗礼者聖ヨハネ祭の8日後の次の日曜以降、できるだけ速やかに」と定めた。具体的指示は財務官ヒュー・クレッシンガムとオズバート・スポルディントンが口頭で伝えるものとされた。\n\n受給者リストはフォース湾以南とフォース湾以北に二分される。前者にはキャリック伯ロバート・ブルース、スコットランド家令のジェームズ・スチュワートの弟ジョン、レノックス伯マルコムら、後者にはストラサーン伯マリーズ、サザランド伯ウィリアムらが含まれる。\n\n## 誘因と履行措置 (7〜8月)\n\n召集と並行して、参陣・従軍を確保するための個別措置が取られた。1297年7月29日、老ロバート・ブルースが海外従軍するにあたり、国庫債務の返済猶予と差押の免除が与えられた。7月31日、リチャード・シワードに没収地が返還され、また、フランドルおよびフランス王に対する従軍を誓約して身柄保証を得たアソル伯ジョンの釈放がロンドン塔の城代に命じられた。7月31日付でサイモン・フレイザーの参陣に関する書簡、および8月9日付でエドマンド・カミン・オヴ・キルブライドのフランドル等での対仏従軍宣誓が現存している。さらに、8月17日付の書簡を通じて、アソル伯ジョンが「身柄をもって身柄を保証する」ことを条件に、アレグザンダー・マイナーズ、マルコム・オブ・キルロス、デイヴィッド・マイア、ジョン・ペイジら4名の捕虜の馬と武具を備えてフランドルへ従軍させる旨の王令と、その履行記録が現存している。
    desc_ja: ## 実効性に関する議論\n\n大規模な徴募手配はなされたものの、その実効は限定的であったと考えられている。M. Prestwich は、1297年5月24日に大規模な徴募が整えられたが「ほとんど成果はなかった」とし、それでもエドワードは捕囚状態からの解放と引き換えに一定数のスコットランド人の従軍を得たと評価する [M. Prestwich (1997), ch. 18]。F. Watson はこれをより明確に述べ、実際に海外へ赴いたスコットランド人はごく少数で、しかもその全員がイングランドの牢獄から直接赴いたとする [F. Watson (1998), ch. 2]。\n\n## 結果・影響\n\nこの兵力徴発要求は、1297年の蜂起 (南部のウォレス、北部のアンドルー・マリ) を導いた主要な不満の一つとして、研究者に位置づけられている。M. Prestwich と A. Young はともに、1297年7月にグラスゴー司教ロバート・ウィシャート、キャリック伯ロバート・ブルース、ジェームズ・スチュワートが示した立場を引く。すなわち、彼らは「王がスコットランドの中間層の人々をことごとく徴発し、海外の戦争に送ろうとしている」と聞かされ、それが「大きな損害と破壊」をもたらすと抗議した [M. Prestwich (1997), ch. 18]; [A. Young (1997), ch. 7]。ただし両者ともこの徴発要求を蜂起の唯一の原因とは扱わず、金銭徴発、行政接収、バーガム原則の侵害といった複数の不満の一環として論じている。M. Prestwich は、エドワードが金銭・物資・とりわけ人員に対して行った要求がスコットランドで深く憤激を招いたとし、クレッシンガムが実行したエドワードの諸政策を蜂起を引き起こした「主要な要素」と評価する [M. Prestwich (1997), ch. 18]。
