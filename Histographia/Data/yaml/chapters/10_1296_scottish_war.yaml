  - id: john_balliol_surrender_deposition_1296
    ja: ジョン王の降伏と廃位 (1296年7月10日)
    date: 1296-07-10
    narrative_ja: 1296年7月、スコットランド王ジョンはイングランド王エドワード1世に降伏し、スコットランド王国に対する一切の権利を放棄した。これは3月末のベリック占領、4月のダンバーの戦いに続く、エドワード1世による1296年のスコットランド征服作戦の最終段階をなす事件であった。伝統的にはこの降伏は7月8日、モントローズ城の単一の出来事として語られてきたが、史料を仔細に検討すると、降伏はむしろ7月初旬の数日間に複数の地点で展開した一連の過程であったことが示唆される。イングランドの大法官府記録に由来する文書史料は、王国返還を表明する開封書状がまず7月2日にキンカーディンで発給されたとし、近年の研究も、この服従の手続きが7月2日から10日にかけてキンカーディン、ストラカスロ、ブレヒン、モントローズで段階的に進められたものであり、その経過を記録する諸文書にはなお解きがたい問題が残ると認めている [Prestwich (1997), ch. 18]。\n\n降伏に至る交渉について、イングランド側の『ギスバラ年代記』は比較的詳細に伝える。同年代記によれば、エドワードは「聖ヨハネの町」パースに滞在中にスコットランド側の和平使節を迎え、15日以内にブレヒン城へ出頭するよう指示したのち、ダラム司教アンソニー・ベックに全権を委ねて交渉に当たらせた。幾度かの会談ののち、和平の唯一の形は、ジョンが王国を放棄し国璽を破壊した上で、無条件にエドワードの意志に身を委ね、子エドワードを人質に差し出すことであった。この交渉には、バーデノックとバカンの両ジョン・カミンをはじめとする有力貴族がブレヒンに参集したとされる。\n\n降伏の儀礼そのものについては、スコットランド側の『ゲスタ・アナリア』、ボウワーの『スコティクロニコン』、ウィントンの『原初年代記』が、中世の主従関係の慣習に則った象徴的な様式を共通して描写する。すなわち、王冠、錫杖、剣、指輪といった王権の徴章が取り上げられ、ジョンは白い杖を手に、スコットランド王国における一切の権利をエドワードに返還した。ウィントンはさらに、ジョンの陣羽織 (タバード) から紋章が剥ぎ取られたことを記し、これがのちの「トゥーム・タバード（空っぽの陣羽織）」という渾名の由来となった。これらスコットランド側史料は降伏の舞台をモントローズ城とするが、『ギスバラ年代記』はモントローズに言及せず、交渉と文書発給をブレヒンに置く。\n\nこの王国返還書状は、ジョンの「過ち」、すなわち、フランスとの同盟やシャルルの娘との婚姻、臣従礼の返上を認め、スコットランド王国の全土とその住民を「自由意志に基づき」エドワードに返還するとしている。同書状は、大法官府記録に由来する文書史料 (フランス語本文とそのラテン語版) と、年代記写本系 (『ギスバラ年代記』や『スコティクロニコン』という由来を異にする2系統で伝来している。\n\n降伏の数日後、ジョンとその子エドワードは船でロンドンへ送られ、いずれの史料も「厳重な監視」のもとに置かれたと伝える。父ジョンはのちに解放されてフランスのベイリューの所領に戻ることを許されたが、息子エドワードはより長く拘束された。本事件の後、スコットランド王国は王不在の状態に陥った。
    desc_ja: ## 降伏の場所と日付をめぐる史料の相違\n\n降伏の場所について、史料は単一の地点を指していない。スコットランド側史料 (『ゲスタ・アナリア』、『スコティクロニコン』、『原初年代記』) は王権剥奪の儀礼の舞台をモントローズ城とし、『ラナーコスト年代記』もエドワードがキンカーディンでジョンを水陸両面から包囲し、王の意志に従わせてモントローズへ向かわせたと記す。一方、『ギスバラ年代記』はモントローズに一切言及せず、和平交渉とそれに続く降伏文書の発給をブレヒンに位置づける。さらに大法官府記録に由来する文書史料は、王国返還書状そのものをキンカーディンで7月2日に発給されたものとする。日付についても、同じ書状を収録する年代記写本系 (『スコティクロニコン』および『ギスバラ年代記』) はともに7月10日（『ギスバラ年代記』は発給地をブレヒンとする）とし、伝統的には7月8日が降伏の日とされて、『ラナーコスト年代記』は降伏の完了 (ジョンのロンドン送致) を7月8日に置く。『ゲスタ・アナリア』およびウィントンの『原初年代記』は具体的な日付を明示しない。\n\nこれらの相違は、必ずしも矛盾を意味しない。2つの独立した年代記伝統 (『ギスバラ年代記』と『スコティクロニコン』) がともに7月10日を伝えることは、単なる写本の誤記として退けがたい。書状が7月2日にキンカーディンで発給され、年代記がその文面を7月10日の公的な降伏儀礼に結びつけたと解すれば、7月2日 (書状発給)、7月8日前後 (『ラナーコスト年代記』の伝える完了)、7月10日 (公的儀礼) という複数の日付は、いずれも降伏という一連の過程の異なる段階を指すものとして無理なく整合する [Beam (2008), ch. 5]; [Prestwich (1997), ch. 18]。確実に押さえうるのは、書状の発給日、発給地 (7月2日、キンカーディン) と公的降伏儀礼の時期 (7月10日ごろ) という二つの事項であり、降伏を単一の日・場所に還元することには慎重であるべきである。\n\n## 降伏文書の2系統の伝来と真正性\n\n王国返還書状は、性格を異にする2系統で伝来する。すなわち、大法官府記録に由来する文書テキスト (フランス語本文と、そのラテン語訳) と、2つの年代記写本 (『ギスバラ年代記』のアングロ・ノルマン仏語版および『スコティクロニコン』のラテン語版) である。文書テキストのラテン語版は仏語本文の訳出であって独立した別証言ではないが、文書系と年代記写本系という由来を異にする伝来が、罪状の列挙や「自由意志による返還」の文言において一致することは、文面の真正性を補強する。他方、自発的譲渡を装う法的擬制が各伝来形態に共通して見られることは、この粉飾が文書そのものに組み込まれた特徴であったことを示す。実際には軍事的敗北の帰結である王国の喪失を「自由意志による返還」として描くこの擬制は、エドワード側の法的正当化のためのものと解される。\n\n## ジョン・カミンの役割\n\nジョン・カミンがジョン王をモントローズへ連れ戻したという記述は、スコットランド側の史料 (『ゲスタ・アナリア』、『スコティクロニコン』、『原初年代記』) に共通するが、イングランド側の史料には見られない。『ゲスタ・アナリア』が「ある者たちの話によれば」と留保をつけていることから、この挿話は伝聞に基づく可能性がある。これに対し『ギスバラ年代記』は、バデノックとバカンの両カミンを、ブレヒンでの和平交渉に参集した貴族の一員として淡々と列挙するにとどまり、「拉致」の挿話を含まない。カミンは確かにエドワードに降伏したが、その後の戦争では重要な指導者となっており、その立場は単純な「裏切り者」ではなかったとみえる。降伏の責任をカミン個人の裏切りに帰す叙述がスコットランド側史料に固有であることは、当該挿話が後世の解釈、あるいはスコットランド貴族内部の不和に降伏の原因を求める傾向を反映している可能性を示唆する。\n\n## 降伏の強制性\n\n『スコティクロニコン』の「暴力と生命の恐怖に導かれて」という表現は、降伏が強制されたものであることを強調するが、これはスコットランド側の正当化のためのレトリックとみられる。実際には、ダンバーの戦いでスコットランド軍が潰走し主要な城が次々と陥落した状況下では、ジョン王に他の選択肢はほとんどなかったと考えられる。ただし、物理的な暴力や生命の直接的な脅威があったという証拠はなく、むしろ当時の主従関係に基づく儀礼に則った降伏が行われたとみるべきである。\n\n## 「トゥーム・タバード」の民衆記憶\n\n「トゥーム・タバード（空っぽの陣羽織）」という渾名は、史料的には2つの韻文年代記に登場する。『ピエール・ラングトフトの年代記』はイングランド側の視点から、フランス語本文の末尾に挿入された英語の風刺的韻文において「His tipet is tipped, His tabard is tom (彼の肩衣は取り上げられ、彼のタバードは空っぽである)」と記す。「tom」は「toom (空っぽ)」と「torn (引き裂かれた)」の両義を持つ言葉遊びの可能性が高い。一方、『原初年代記』はスコットランド側の視点から「Twme Tabart」という形でこの渾名を記録する。これに対し、『ゲスタ・アナリア』や『スコティクロニコン』といったラテン語の編年史、また『ラナーコスト年代記』には、この民衆的な呼称は見られない。このことから、当該渾名は学識ある聖職者の著すラテン語年代記の伝承には属さない、より民衆的な表現であったことが窺える。研究者は、この渾名を同時代のラングトフトの造語とし、約1世紀後にウィントンが反復したものと整理し [Beam (2008), ch. 5]、また最終的な降伏儀礼でジョンの陣羽織から紋章が公然と剥ぎ取られたことをその直接の由来とする [Prestwich (1997), ch. 18]。
