chapters:

  - id: english_invasion_march_1296
    ja: スコットランド軍のカーライル侵攻 (1296年3月26日～28日)
    date: 1296-03-26
    narrative_ja: イングランドの『ギスバラ年代記』や『ラナーコスト年代記』は、1296年3月26日にバカン伯ジョン・カミン率いるスコットランド軍がイングランドに侵攻し、カーライル市を攻撃対象とした遠征を行ったことを記録している。特に『ギズバラ年代記』は事件の最も詳細な日付と地理情報を提供している。同年代記によれば、1296年3月26日、バカンのジョン・カミンを筆頭とする7名のスコットランド貴族が500騎の武装騎士と4万人の歩兵を率いてアナンデールの谷を出発したとされる。この兵員数は年代記的誇張の可能性が高いものの、大規模な軍勢が動員されたとみてよいだろう。スコットランド軍はソルウェイ湾を3箇所で渡河し、アーサレットおよびニコラスの御料林と呼ばれたイングルウッド・フォレストを通過してカーライルに至る地域を組織的に焼き払ったとされる。そして3月27日、スコットランド軍はカーライル市への攻撃を開始した。イーデン川の橋で最初の戦闘が発生したものの、イングランド側の射手が橋板を外して防戦した。スコットランド軍は迂回してリカーディナ村下流の浅瀬で渡河し、カーライル市を包囲した。『ギスバラ年代記』にはこの包囲の際に市内にいた密偵パトリックが脱獄して建物に放火し、スコットランド軍を鼓舞したという劇的なエピソードを記録している。火災は風に煽られて拡大したが、市民と女性たちの抵抗により、スコットランド側の攻撃は失敗に終わった。翌28日、スコットランドの軍勢は包囲を解いてアナンデールの谷へ撤退した。    
    desc_ja:     
    sources:
      - chron_guisborough_272-4
      - chron_lanercost_1295_ex1
      - scalacronica_38
    links:
      - berwick_siege_1296


  - id: berwick_siege_1296
    ja: ベリック攻囲戦 (1296年3月30日)
    date: 1296-03-30
    narrative_ja: 1296年3月下旬、イングランド王エドワード1世は大軍を率いて北上し、3月28日頃にベリック・アポン・ツイードの対岸に到着した。この時点でベリックは城壁を持たず、堀によって守られているのみであったとされる。エドワード王は降伏勧告を行ったが、守備隊はこれを拒否した。『ラナーコスト年代記』や『ギスバラ年代記』が伝えるところによれば、その過程で、おそらくベリック側の住民または守備隊が港に接近したイングランド補給船を攻撃し、少なくとも1隻を焼き払って乗員を殺害する事件が発生した。この事件は、エドワード側に即座の攻撃を決断させる契機となった。\n\n3月30日、聖金曜日の朝、イングランド軍は総攻撃を開始した。『ギスバラ年代記』によれば、攻撃開始前にエドワードはヘンリー・パーシーら多数の従騎士を叙任して騎士とし、士気を高めたとされる。攻撃は迅速であり、『ギスバラ年代記』は「あたかも無きがごときもの」として堀を越え、守備隊は「放心して呆然と立ち尽くしていた」と記す。この記述から、防衛側に組織的抵抗能力がほとんどなかったことが窺える。\n\n『ゲスタ・アナリア』をはじめとしたスコットランド側の年代記は、イングランド側が「偽りの旗」を用いて守備隊を陥れたとするエピソードを伝え、それが都市の早期陥落の要因となったと述べるが、このエピソードを史実として認めるには慎重であった方が良いだろう。むしろ、イングランド軍の圧倒的な軍事的優勢と、おそらくは前日の挑発行為への報復という心理的要因が、迅速な陥落を可能にしたと考えられる。\n\nスコットランド、イングランド双方の年代記群が伝えるように、陥落後、大規模な虐殺が発生したことは疑いようがない。ただし、その死者数を正確に特定することは不可能である。\n\n城の守備隊については『ギスバラ年代記』が詳述するように、ウィリアム・ダグラスを隊長とする200人の守備兵は「生命、四肢、土地、動産を保証」されたうえで、「二度と王に剣を向けない」という誓約を条件に解放された。これは、貴顕および騎士階級に対するエドワードの差別的処遇を示している。一般住民には容赦ない虐殺を行う一方で、貴顕階級には寛容を示すことにより、スコットランド貴顕の離反を促す政治的計算が働いていたと考えらえる。
    desc_ja:     
    sources:
      - gesta_annalia_ch_89
      - gesta_annalia_ch_90
      - original_chronicle_ch_144
      - chron_guisborough_274-5
      - chron_lanercost_1296_ex1
      - chron_langtoft_232-58
      - scalacronica_38
