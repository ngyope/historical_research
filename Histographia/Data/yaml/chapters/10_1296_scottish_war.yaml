  - id: edinburgh_surrender_1296
    ja: エディンバラ城の降伏 (1296年6月)
    date: 1296-06
    narrative_ja: 包囲戦の具体的経過を伝えるのは、主としてイングランド側の境域で編まれた『ラナーコスト年代記』である。同年代記によれば、エドワード1世は石を投じる大型の投石機を城の周囲に配置し、3日3夜のうちに158個の石を放って城の屋根を激しく損壊させたという。ただしこの「158」という数値はラナーコスト固有のものであり、他の史料に裏付けを欠く点には留意を要する。一方『ギスバラ年代記』は、王が大量かつ巨大な木製の攻城兵器を用いて8日間にわたり城を攻撃したと記す。両者の攻城兵器の描写の差は、ギスバラが機械の構造・規模を、ラナーコストがその投射物を述べたものとして、同一の兵器を異なる側面から描いた可能性も排除できない。\n\n『ラナーコスト年代記』は、6月11日の聖バルナバスの祝日の出来事として、エドワード自身の伝令であったルーウィンという1人のウェールズ人をめぐる挿話を比較的詳しく伝えている。これによれば、託された路銀を酒場で使い果たしたルーウィンが、イングランド勢への悪ふざけとして城内に入り込もうと図り、敵［イングランド側］の秘密を明かすと偽って守備兵に縄を下ろすよう求めた。しかし城代はこの詐術を見抜いてこれを退け、自らは信義に反することには決して同意しないと王の陣営に知らせた。これを聞いたエドワードは「かの誠実な男の忠節が私を打ち負かした」と述べ、以後この包囲された者たちへの砲撃を一切停止するよう命じたという。ただしこの挿話は、年代記自身が「ウェールズ人の背反について」記憶されるべき教訓的な範例として導入・構成したものであり、純然たる事実報告として扱うことには慎重さが求められる。\n\nなお『ラナーコスト年代記』によれば、エドワードはその後包囲軍を解いて少数の兵とともにスターリングへ向かい、王の不在中、2週間の包囲を経てエディンバラ城はジョン・ディスペンサー卿の手に降伏した。これに対し『ギスバラ年代記』は、王自身が臨席して8日間の包囲を遂行し、その場で守備隊の降伏と助命を受けたとする。降伏と守備隊の助命という結果は両史料で一致するものの、城の陥落時に王が臨席していたか否かという叙述構造には相違が見られる。\n\n包囲の期間については史料間で数値が一致しない。『ラナーコスト年代記』が3日3夜の砲撃に加えて2週間の包囲を、『ギスバラ年代記』が8日間の包囲を伝える。他方、スコットランド系の叙述史料 (『ゲスタ・アナリア』、それを踏襲する『スコティクロニコン』、およびウィントンの『原初年代記』) は、いずれもエディンバラをダンバー、スターリングと並んでエドワードに「引き渡された」3城の一つとして列挙するにとどまり、包囲戦やルーウィン挿話には触れず、関心はもっぱらベイリオル王の廃位・退位に集中している。
    desc_ja:
    sources:
