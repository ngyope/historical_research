  - id: perth_surrender_1296
    ja: パースの降伏 (1296年6月22日前)
    date: 1296-06-22
    narrative_ja: 1296年6月22日、パースシャーのバルエドガーノを領する騎士ロバート・キャメロンがパースにてエドワード1世に忠誠を誓った文書が現存している。さらに6月30日にはラルフ・ラッセルズ卿も忠誠を誓っており、これらの文書史料から、6月下旬にエドワード1世がパースに滞在していたであろうことが確認できる。ここから、6月22日以前にパースがエドワード1世の支配下に入ったものとみえる。\n\n『ギスバラ年代記』は、王が「聖ヨハネの町［パース］」へ進軍し、洗礼者聖ヨハネの誕生祭［6月24日］に新たな騎士たちを叙任し、盛大な祝宴を催したと記す。この6月24日のパース滞在は文書史料から推定される6月下旬の滞在と整合する。なお同年代記は、パースについて包囲や交戦の経過を一切記さず、王の到着と叙任・祝宴の挙行のみを述べる。この点は、パースが格別の抵抗を経ることなくエドワードの支配下に入った可能性を示唆する。
