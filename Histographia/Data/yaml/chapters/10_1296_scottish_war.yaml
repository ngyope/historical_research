  - id: stirling_surrender_1296
    ja: スターリング城の降伏 (1296年6月)
    date: 1296-06
    narrative_ja: スターリング城の陥落についてのまとまった記述を伝えるのは、主として『ラナーコスト年代記』である。同年代記によれば、エディンバラの包囲を解いたエドワード1世が少数の供回りのみを率いてスターリング城へ向かうと、城は恐怖のため空になっていた。門は開いたまま鍵が掛けられており、城内に投獄されていた者たちが慈悲を乞うていたため、王は直ちに彼らを解放するよう命じたという。\n\nラナーコストとは系統を異にするイングランド側の伝承である『ギスバラ年代記』も、独立した証言として、王がスターリングへ進路を転じると城は空で抵抗する者はなく、守備隊は王を恐れて逃走していたと記す。無人の城と守備隊の逃走という陥落叙述の核心が、系統を異にする2つのイングランド側史料によって支持される点は注目され、この核心的事実関係の確度を相対的に高めるものと解される。ただし両者の一致はこの核心部分に限られ、城の鍵が扉に掛かったままであったことや、投獄されていた者たちが慈悲を乞うていたという挿話はラナーコスト固有であって、ギスバラはこれを伝えていない。\n\nこれらの記述は、スターリング城の陥落が軍事的占領ではなく、内部からの恐怖による放棄であったことを示唆している。この「恐怖」は、エディンバラ包囲における砲撃の効果や、ジョン・ベイリオルの劣勢がスコットランド側の士気に与えた心理的影響が、スターリングのような要衝にまで波及していた可能性を示すものと解しうる。一方、スコットランド系の叙述史料 (『ゲスタ・アナリア』、それを踏襲する『スコティクロニコン』、およびウィントンの『原初年代記』) は、いずれもスターリングをダンバー、エディンバラと並んでエドワードに「引き渡された」3城の一つとして記すのみで、どのように陥落したのかについては述べていない。
