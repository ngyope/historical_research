  - id: roxburgh_surrender_1296
    ja: ロクスバラ城の降伏 (1296年5月13日)
    date: 1296-05-13
    narrative_ja: 1296年5月13日、ロクスバラにてスコットランド家令ジェームズ・ステュワートがエドワード1世に忠誠を誓った文書が現存している。このことから、おそらくこの日ないしはその直前にロクスバラ城がエドワード1世に降伏したと推察される。現存する文書は、その後おそらく6月上旬まで、エドワード1世がロクスバラに滞在していたことを示唆している。\n\n『ギスバラ年代記』は、スコットランド家令が長らく保持していたロクスバラ城を、王の到着と同時に、命・身体・領地・動産の保全を条件として、交戦を経ることなく即座に明け渡したと記す。この叙述は5月13日にロクスバラでジェームズ・ステュワートがエドワード1世に臣従した文書記録と整合し、同城が条件付きで降伏した可能性を補強するものと解される。なお同年代記は、ロクスバラにおいて15000人のウェールズ兵が王に合流し、王がほぼ同数の疲弊したイングランド兵をイングランドへ帰還させたとも伝えている。この数字の正確性については慎重であるべきだが、兵員の交代に関する貴重な情報を提供している。
