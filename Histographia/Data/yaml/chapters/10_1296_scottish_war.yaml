  - id: renunciation_of_king_john_homage_1296
    ja: ジョン王の臣従礼の放棄 (1296年4月5日)
    date: 1296-04-05
    narrative_ja: 1296年4月5日、ベリック・アポン・ツイードにおいて、スコットランド王ジョンがかつてイングランド王エドワード一世に対して行った臣従礼および誠実宣誓を放棄する旨を記した開封書状が、使節を通じてエドワードに提示された。この開封書状の内容を照合し、記録した旨を伝える4月26日付の公証人文書や、おそらくそれを書き写したと見える『ギスバラ年代記』の記述からこの臣従礼の放棄の通達がなされたことを確認することができる。時系列上、この放棄は3月30日のベリック略奪、すなわちエドワードによる軍事侵攻の開始より後に位置する。放棄状自体がエドワードの武力侵攻 (国境への接近、虐殺と放火) を非難の対象に含めていることから、放棄は開戦の「引き金」ではなく、すでに始まっていた戦争に対する外交的・法的応答であったと理解すべきである。
    desc_ja:     
    sources:
      - foedera_i_ii_836-7
      - chron_guisborough_275-6
      - scalacronica_38
    links:
      - berwick_siege_1296


  - id: english_invasion_april_1296
    ja: スコットランド軍のヘクサム侵攻 (1296年4月8日～13日)
    date: 1296-04-08
    narrative_ja: 3月28日にイングランドからアナンデールへ撤退した後、スコットランド軍は再度北イングランドに侵入した。この事件をよく伝える『ギズバラ年代記』によれば、1296年4月8日、ジェドバラ城から出撃したバカン伯ジョン・カミンを中心としたスコットランド貴族たちの軍勢がリーズデールの谷に侵入し、ハードボトル城を2日間包囲したが、損害を出して撤退した。その後、軍はタイン川東側のコケットデール、リーズデール、ノーサンバーランドのコーブリッジを経てヘクサムに至る広範な地域を略奪・放火した。『ラナーコスト年代記』もまた、4月上旬の再侵攻と広域的な破壊を記すが、その関心はギズバラほど正確な行程復元にはなく、むしろ老人・幼児・聖職者・修道女への暴虐という道徳化された残虐描写に向けられている。\n\n4月11日、スコットランド軍はヘクサム修道院に侵入し、参事会員が逃走した後、修道院と町全体を焼き払った。『ギズバラ年代記』は、この行為がスコットランド王国の守護聖人である聖アンデレに献堂された修道院を焼くという宗教的逆説を強調している。他方、『ラナーコスト年代記』はヘクサム破壊そのものに加えて、学童の焼殺、聖遺物の焼却、聖アンデレ像の頭部切断といったより劇的で説教的な細部を積み重ねる。翌12日、軍はラムリー女子修道院を焼失させた後、ラナーコスト修道院に宿営した。しかし、13日早朝、エドワード1世の軍勢が接近しているという報を受けて、スコットランド軍は急遽撤退した。\n\n補助史料はこの経過をより圧縮した形で伝える。『スカラクロニカ』は、同じ第二波侵攻の中でスコットランド軍が「ヘクサムの小修道院を焼き、その地方に大きな害をなした」と述べるにとどまり、『ピエール・ラングトフト年代記』もコーブリッジ、ヘクサム、ラナーコストの破壊を列挙したのち、叙述の重心をダンバー戦役へ移していく。したがって、ヘクサムおよび周辺宗教施設が4月侵攻の主要な被害地であったこと自体は複数史料で裏づけられるが、この事件に関連する残虐描写や宗教的意味づけの細部に関する情報は、主としてギズバラとラナーコストの修道院的視角に依存していると言える。
    desc_ja:     
    sources:
      - chron_guisborough_276-7
      - chron_lanercost_1296_ex1
      - chron_langtoft_232-58
      - scalacronica_38
    links:
      - renunciation_of_king_john_homage_1296


  - id: expel_of_english_from_scotland_1296
    ja: スコットランド王国からのイングランド人の追放 (1296年4月21日)
    date: 1296-04-21
    narrative_ja: 『ゲスタ・アナリア』によれば、1296年の4月21日、セント・アンドルーズ司教区において聖職禄を有していたすべてのイングランド人がその陰謀を理由にスコットランド王国から追放された。追放の判決を下したのは、遠地に滞在していた司教ウィリアム・フレイザーの代理であるウィリアム・キングホーンおよびパトリック・カンパニアであったとされる。これと同様に、他のすべてのイングランド人も、聖職者・俗人を問わず、その陰謀を理由にスコットランド王国から追放された。
    desc_ja:     
    sources:
      - gesta_annalia_ch_91
      - original_chronicle_ch_144
    links:
      - renunciation_of_king_john_homage_1296


  - id: dunbar_battle_1296
    ja: ダンバーの戦い (1296年4月27日)
    date: 1296-04-27
    narrative_ja: ## ダンバー城の占拠と戦いの背景\n\n1296年3月30日のベリック陥落を受けて、スコットランド軍はイングランドからの撤退を余儀なくされた。この時点で、マー伯、ロス伯、メンテイス伯らの率いるスコットランド軍の一隊がダンバー城を占拠したことが、4月27日のダンバーの戦いの直接的な契機となった。\n\n史料間で一致しているのは、マーチ伯パトリック・ダンバーがエドワード1世側に留まっていた一方で、その妻である伯夫人 (バカン伯ジョン・カミンの娘) がスコットランド側に与し、城へスコットランド軍を引き入れたという点である。『ギスバラ年代記』は、伯夫人が「悪意と欺瞞を企て」使者を派遣したと記しており、これは明らかに夫への背信行為として描写されている。なお、城を引き渡した主体については史料間に揺れがあり、『ラナーコスト年代記』は伯夫人と「伯の弟」が守備にあたったと記しており、近年の研究者も「伯夫人あるいは伯の弟」と留保を付している [Prestwich (1997), ch. 18]; [Brown (2004), ch. 8]。したがって、城の引き渡しを伯夫人個人の行為と断定することには慎重であるべきである。この点はダンバー伯家夫婦間の不和という個人的次元に還元されるべきではなく、カミン家を中心とするスコットランド王国共同体と、エドワード1世への服従を選んだマーチ伯との政治的対立を反映していると理解すべきである。城の引き渡しは、マーチ伯一個人への私的背信というより、カミン家を軸とする王国共同体とエドワード1世に服したマーチ伯との党派的対立の局所的な現れであったとみるのがより妥当であろう。\n\nダンバー城を占拠したスコットランド軍の構成について、史料は詳細な情報を提供している。『スカラクロニカ』は「メンテイス、アソル、ロスの3伯、6人のバロン、若ジョン・カミン、ウィリアム・シンクレア、年長のリチャード・シワード、ジョン・インチマーティン、アレグザンダー・マリ、キルブライドのエドマンド・カミン、および29人の騎士と80人の従騎士」が城内にいたと記録する。『ギスバラ年代記』は「3人の伯、4人のバロン、31人の騎士、100人の従者」と記し、『ラナーコスト年代記』もこれとほぼ同様の数字を挙げている。これらの数字はおおむね一致しており、後に述べる戦後のスコットランド側の捕虜のリストからも、信頼できる数字と判断できる。\n\nエドワード1世はマーチ伯からの報告を受け、直ちにワレン伯ジョンとウォリック伯を派遣した。『ギスバラ年代記』によれば「1000の騎兵と1万の歩兵」が送られ、さらに「ダラム司教の軍勢から100人の武装兵」が加わったという。包囲軍は4月25日頃にダンバー城の前に到着し、包囲を開始した。包囲開始後の経過について、『ギスバラ年代記』は攻囲数日にして城内の守備隊が動揺し、降伏の条件をジョン王に問い合わせるための3日間の猶予を願い出たと記す。この猶予のうちに使者が送られ、その第3日目に救援軍が到来したという。近年の研究も当時ベイリオルがハディントンに在ったこと、そして守備隊の使者がこの休戦期間中の攻撃を王に進言したと伝える点を指摘している [Prestwich (1997), ch. 18]]; [Beam (2008), ch. 5]。\n\n## 戦いの経過\n\n4月27日金曜日の戦いの経過については、各史料が詳細な記述を残しているが、それらを批判的に検討する必要がある。\n\n### スコットランド軍の到来と戦術的誤判断\n\nすべての史料が一致しているのは、スコットランド救援軍が4月27日の午後に到着したという点である。『ラナーコスト年代記』は「午後3時頃」と具体的な時刻を記し、『ギスバラ年代記』は「ベリック陥落から3週間目の金曜日」と日付を明記している。スコットランド救援軍の規模について、『ギスバラ年代記』は「1500の騎兵と4万の歩兵」と記録している。しかし、歩兵4万という数字は明らかに誇張である。中世の年代記において、敵軍の規模を実際よりも大きく記すことは、勝者側の武勇を称揚する修辞的慣習であったからである。\n\n戦いの転換点となったのは、スコットランド軍の指揮官による戦術的誤判断であったと、とりわけ『ギスバラ年代記』が示唆している。ただし、この「誤認」の筋立てがすべての史料に共通するわけではない点には、あらかじめ注意を要する。『ギスバラ年代記』は、イングランド軍が谷へ下り、相互の激突へより容易に急ぐために四方へ展開して移動した際、スコットランド側がこれを敗走と誤認したと明記する。「我々の軍が谷へと下り、相互の激突へより容易かつ適切に急ぐために四方へ展開して移動していた時、スコットランド軍は我々が逃亡し背を向けたのだと思い込んだ。彼らは角笛を吹き鳴らし、叫び声を上げて我々の死を呼び求め、その恐ろしい角笛の音はまるで地獄の深淵を貫くかのようであった」。同年代記によれば、スコットランド側はこれに先立ち、救援軍が「ダンバーの向かいにある山の斜面を部隊ごとに」下ってくるのを見て、城壁上から旗を掲げてイングランド軍を「尻尾のある犬」と罵り、死と尻尾の切断をもって脅迫していたという。この「尻尾のある犬」という罵りは、中世においてイングランド人を侮辱する常套的な表現であり、中世においてイングランド人を激怒させる一般的な方法であった [Barrow (2013), ch. 5]; [Prestwich (1997), ch. 18]。ギスバラの叙述に従うかぎり、この挑発はスコットランド側の過度の自信を示すものであり、彼らが戦術的状況を正確に把握していなかったことを示唆していると解しうる。\n\nこれに対し、『ラナーコスト年代記』はやや異なる経過を伝えている点に留意すべきである。同年代記は、イングランド側の展開を敗走と誤認したという機制には触れず、ワレン伯と「王の軍勢の5分の1ほど」が露営の準備をしていたところへ、スコットランド軍が「傾斜した山の稜線に」現れて挑戦したが、その隊列は「数において強大に整然と組まれていたにもかかわらず、白兵戦に入る前に煙よりも速く解け散り、彼らのうち最も勇猛な者たちが真っ先に逃走に転じた」と記す。すなわち、両イングランド側年代記はいずれもスコットランド軍の瓦解という結末を共有しつつも、その過程の描き方を異にしており、「敗走の誤認」というしばしば反復される筋立ては、第一義的にはギスバラの叙述に依拠するものである。なお、戦場は『スカラクロニカ』の記述に基づくとスポット川周辺で展開されたものとみられる。\n\n### イングランド軍の反撃と戦いの結果\n\nスコットランド軍が斜面を下って突撃した後、イングランド軍は整然と隊列を組んで反撃に転じた。『ギスバラ年代記』は次のように記す。「ついに我々が深い谷から登り切り、戦闘へと急ぐと、彼らは即座に沈黙した。双方の戦列が整い、遅滞なく互いに激突し、槍と剣が交錯したが、至高なる神の御心により、最初の衝突においてスコットランド軍はすぐに背を向けた」。『ラナーコスト年代記』もまた、スコットランド軍が白兵戦に入る前に「煙よりも速く」瓦解したと記しており、最初の衝突でスコットランド側が崩れたという結末については両者が一致する。\n\n戦いは一方的な追撃戦となった。『ギスバラ年代記』によれば、イングランド軍は「セルカークの森までのおよそ7あるいは8リーグ（約35〜40キロメートル）にわたって殺戮を行った」という。スコットランド側の死者数について、『ラナーコスト年代記』は「約1万人」と記録し、『ギスバラ年代記』も同様に約1万人の数字を挙げている。『ピエール・ラングトフトの年代記』は「1万54人」という具体的な数字を記すが、これらは明らかに修辞的誇張である。\n\nただし、こうした壊滅的描写、すなわち1万人規模の戦死と7〜8リーグ及ぶ追撃を、ただちに野戦の実際の姿とみなすことには、近年の研究者から留保が付されている。M. Prestwich 氏は、貴顕の戦死がパトリック・グレイム1人にとどまり、捕らえられた騎士もわずか4名と伝えられる点を重視し、この戦闘は「ほとんど小競り合いに過ぎなかった可能性」があり、スコットランド軍主力のうち一部のみが関与したにすぎないと論じている [M. Prestwich (1997), ch. 18]。\n\n特筆すべきは、パトリック・グレイムの戦死である。複数の史料が一致して彼の勇敢な戦いと戦死を記録している。『ギスバラ年代記』は「その王国の賢者の中でも第一人者であり、有力者の中でも最も高貴な人物であったが、自身の名誉ある称賛を損なうことを欲せず、顔を背けることなく雄々しく戦い、ついにその場で殺され倒れた」と記している。スコットランド側の年代記である『ゲスタ・アナリア』と『スコティクロニコン』も彼の戦死に言及している。文書史料にも彼の子デイヴィッドが捕虜として記録されており、父パトリックの戦死は信憑性が高いと評価できる。\n\nイングランド側の損害について、『ラナーコスト年代記』は「1人の不注意な騎士を除いて、全く誰も倒れなかった」と記している。これは明らかに誇張であるが、イングランド側の損害が極めて軽微であったことは確かであろう。\n\n## ダンバー城の降伏と捕虜\n\n戦いの翌日、城内のスコットランド守備隊は降伏した。ここで重要なのは、野戦における戦死傷と、城を明け渡した守備隊の捕囚とを区別することである。すなわち、『ギスバラ年代記』や『ピエール・ラングトフトの年代記』が伝える戦死者数は4月27日の野戦に関わるものであるのに対し、文書史料が名を列挙する捕虜は、翌日に城を開いて降伏した城内守備隊である。『スコットランド関係文書カレンダー』に記載された文書史料には、この守備隊の捕虜131名の名前と、彼らが送られたイングランド各地の城の名を詳細に記録しており、『スカラクロニカ』が城内にあったと記す「29人の騎士と80人の従騎士」という数字ともおおむね符合する。この文書史料は、スコットランド貴族層がこの局面でいかに大きな打撃を受けたかを示す最も信頼できる証拠である。野戦そのものの規模をめぐっては議論があるものの、この捕虜リストの存在自体は、ダンバーの帰結がスコットランドの指導層にとって決定的であったことを示している。\n\n捕虜のリストには、ロス伯、アソル伯、メンテイス伯という3人の伯のほか、若ジョン・カミン、リチャード・シワード、ジェフリーの子ジョン・モウブレー、地方統監アンドルー・マリらの著名なバロンや騎士が含まれている。彼らは身分に応じて分散投獄され、とりわけ3人の伯や若ジョン・カミン、シワード、アンドルー・マリといった指導層はロンドン塔へ送られた。この処置は、スコットランドの軍事的・政治的指導層を無力化するというエドワード1世の戦略の一環であった。\n\n## リチャード・シワードの裏切り：史料批判と歴史的評価\n\n『ゲスタ・アナリア』と『スコティクロニコン』は、城の守備隊長リチャード・シワードが捕虜を「あたかも屠殺に供される羊のようにイングランド王に差し出した」と記している。しかし、この記述は史料批判の観点から慎重に評価する必要がある。\n\n第一に、『スコティクロニコン』はウォルター・シワードという別人物が従者に裏切られて殺害されたという物語を付加しているが、これは後世の創作である可能性が高い。\n\n第二に、リチャード・シワード自身が城降伏後に捕虜となったことは捕虜の名を記した文書によって確認される。同文書では、老リチャード・シワードはロンドン塔へ、若リチャード・シワードはブリストル城へ送られている。とりわけ老シワードが、3人の伯や若ジョン・カミンら指導層と同じくロンドン塔に収容された事実は重要である。もし彼が積極的にイングランド側へ協力したのであれば、このように身分ある捕虜として投獄される理由は乏しい。\n\n第三に、城の降伏は軍事的必然であった。野戦での壊滅的敗北を目撃した城内の守備隊が、さらなる抵抗を断念したのは合理的判断である。『ラナーコスト年代記』が記すように、「混乱し恐怖に打ちのめされた」守備隊は、翌日「自身の生命と身体を王の手に委ねて」降伏したのである。\n\n第四に、二次文献もこの史料批判的評価を支持している。A. Young 氏は、フォーダンとバウワーがシワードを「裏切り者」とする叙述は、1296年における彼の実際の行動よりも、むしろ1297年以降に彼がエドワード1世へ与したという後年の経歴を遡及的に投影したものである可能性が高いと論じている [A. Young (1997), ch. 7]。実際、『ラナーコスト年代記』は包囲下のシワードを「戦に名高く武芸に長けた人物」と評しており、彼は1290年代を通じてカミン主導政府のもとで王の諸城の城代を務めた人物であった [A. Young (1997) ch. 7]。降伏後の彼が離反者としてではなく、スコットランド側の指導者の1人として投獄された事実も、この評価を裏づけるものといえる。\n\nしたがって、リチャード・シワードを「裏切り者」として描く記述は、後世のスコットランド側史料による修辞的・道徳的判断であり、歴史的事実とみなすことには慎重であるべきである。むしろ、城の降伏は戦場での敗北の直接的帰結であり、守備隊長としてのシワードが降伏交渉を行ったとしても、それは彼の責務の範囲内であったと理解すべきである。
    desc_ja: ## 史学史的考察：戦いの規模と意義をめぐる解釈\n\nダンバーの戦いについては、イングランド側一次史料の壮大な勝利の叙述に対して、近年の研究者による抑制的な再評価がなされている。以下、(一) 野戦の戦術的規模、(二) スコットランド全軍が関与したか、(三) 戦いの決定性の所在、という3つの論点に即して、主要な研究者の見解を整理する。\n\n### 論点1：野戦の戦術的規模\n\n一方の極にあるのが G. W. S. Barrow 氏の理解である。Barrow は、ダンバーでワレン伯の騎士団を攻撃したのを「ジョン王の軍の主力、すなわちスコットランドの『封建軍）』」と明言し、その壊滅がスコットランド王国の軍事機構の決定的な時代遅れを証明したと論じる [G. W. S. Barrow (2013), ch. 5]]。この理解においては、ダンバーはスコットランド軍主力どうしの本格的な会戦に近いものとして捉えられている。\n\n他方の極にあるのが M. Prestwich 氏の懐疑である。Prestwich は、上級貴族の戦死がパトリック・グレイム1人にとどまり、捕らえられた騎士もわずか4名と伝えられる点を根拠として、野戦そのものは「ほとんど小競り合いに過ぎなかった可能性」があり、関与したのはスコットランド軍主力のうち一部のみであったと論じる [M. Prestwich (1997), ch. 18]。A. Beam 氏もこの見方をおおむね承継している [A. Beam (2008), ch. 5]。\n\nこの対立は本文で述べたように、野戦 (4月27日) と城の降伏 (翌日) とを区別することで、一定程度まで調停しうると考えられる。すなわち、『ラナーコスト年代記』の戦死1万人、セルカークの森までの追撃という壮大像は野戦に関わるものであるのに対し、文書の捕虜131名や『スカラクロニカ』の「騎士29名、従騎士80名」は、翌日に降伏した城内守備隊の数である。Prestwich の「小競り合い」評価が主として野戦の戦死傷者数に基づくものであることを踏まえれば、捕虜リストの大きさをもって直ちにこれに反証することはできない。両者は別個の局面を記述しているとみるのがより整合的であろう。\n\n### 論点2：スコットランド全軍は関与したか\n\n戦術的規模の問題と密接に関わるのが、ダンバーで戦ったのがスコットランドの全軍であったか否かという問いである。A. Young 氏はこれを明確に否定する。Young によれば、ダンバーのスコットランド軍は「多数派ではあるが全面的ではない支持」を有するカミン主導政府の軍勢であり、ブルース父子、マーチ伯、アンガス伯はすでにエドワード1世へ臣従していたために参陣していなかった。Prestwich および Beam も、王ジョン・ベイリオルが至近のハディントンに在りながら出陣しなかった事実を、全軍が関与してはいなかったことの傍証とみている [M. Prestwich (1997), ch. 18]; [A. Beam (2008), ch. 5]。Beam はさらに、ベイリオルが降伏が不可避と見て自ら戦端を開かなかった可能性を示唆している [A. Beam (2008), ch. 5]。なお、『ゲスタ・アナリア』はマー伯とアソル伯がブルースへの好意から戦場を離脱したと記すが、Young はこれを後年のブルース中心的視点の遡及的投影として退けている [A. Young (1997), ch. 7]。\n\n### 論点3：戦いの決定性はどこにあったか\n\n野戦の戦術的規模をめぐっては見解が分かれるものの、戦いの政治的・軍事的帰結が決定的であった点については、主要な研究者がおおむね一致している。Barrow は1296年の戦争を「ある意味でカミン家の戦争」と総括し、彼らがその戦争観に従って戦い「決定的に敗北した」と評する [G. W. S. Barrow (2013), ch. 5]。Young も同様に、ダンバーを必ずしも全軍の敗北とは限らないとしつつ、カミン家を中核とする当時の政治支配層への「決定的打撃」と位置づける [A. Young (1997), ch. 7]。M. Brown 氏 はさらに踏み込み、「1296年の真の物語は軍事的敗北ではなく政治的失敗であった」と述べ、マー伯やアソル伯が戦いから兵を引いたとの非難や、諸侯の忠誠の脆さに注意を促している [M. Brown (2004), ch. 8]]。\n\n総じて、学界の見解の相違は「野戦の戦術的規模」をめぐるものであって、「戦いがスコットランドの政治・軍事の指導層にもたらした帰結の決定性」をめぐるものではない、と整理できよう。この区別を踏まえるならば、ダンバーを「限定的な野戦」と評することと、「1296年の戦役を事実上決した一戦」と評することとは、必ずしも矛盾しない。むしろ、規模の限られた野戦が指導層の大量捕囚と諸城の連鎖的降伏をもたらしたという事態そのものが、当時のスコットランドの軍事・政治体制の脆弱性を映し出していると解しうる。
