chapters:

  - id: appointment_of_walter_huntercombe_as_guardian_of_isle_of_man
    ja: マン島の守護任命 (1290年6月4日)
    date: 1290-06-04
    date_display: 1290年6月4日
    narrative_ja: 1290年6月4日、アルスター伯リチャード・ド・バーグがマン島をイングランド王エドワード1世の手に「返還」したため、エドワードはその管理を家臣のウォルター・ハンタークームに「余の意向が続く限り」管理させるべく委託した。ハンタークームは収益を王の命令に応じて報告する義務を負い、旧管理者にあたるリチャードの配下の全代官は城と島をハンタークームに引き渡すよう命じられた。\n\n他方、島の住民には「条件を付さない」単純な保護状が、王の意向が続く限り有効なものとして与えられた。\n\nなお、マン島は1264年から66年にかけてアレグザンダー3世が侵攻し、1275年の反乱とその鎮圧を受けており、スコットランド側の見解としてはアレグザンダー3世期以降王国の一部となっていた。この見解は1284年に王位の継承を取り決めた際の文書にも、マン島がスコットランド王国に「属する」ものとして言及されていることからもうかがえる。スコットランドの守護団側に諮問が行われたか否かや、守護団側がこの対応にどう反応したかについては史料が残されておらず、不明である。    
    desc_ja: この委任状から、エドワード1世の越権・宗主権の志向の前兆を読み取るべきか否かは論点となっている。G. W. S. Barrow はマン島は「疑いなくスコットランド王国の不可分の一部」であったとし、エドワードが守護団や評議会に諮った証拠はないと強調する。氏は、マン島の主君たる女王に位置づけられていたマルグレーテの死を知る数か月前に、戦略的に重要な島を一方的に掌握した行為とみて、バーガム条約に至る交渉の高揚のなかの「影」と位置づける。M. Prestwich もまた、6月10日へのアンソニー・ベックへの西部島嶼部の権限付与、7月末のベックの国王代理任命と並べて「エドワードはスコットランドで権力を行使すべきだと決めていた」と読む。\n\n他方、A. A. M. Duncan はより抑制的な読みを取る。氏は「エドワードはマン島の管理を取ったが、併合しようとはしなかった。守護者の側にマン島についての不安の気配はなく、エドワードは1293年1月5日にこれをジョン王へ引き渡した」と結論し、その後の宗主権志向への単純な連続性とは読まない。
    sources:
      - stevenson_documents_i_no_103
    links:
      - treaty_of_birgham_1290


  - id: appointment_of_anthony_beck_as_deputy_of_islands_belonging_to_kingdom_of_scotland
    ja: スコットランド王国に属する島々の代官委任状 (1290年6月20日)
    date: 1290-06-20
    date_display: 1290年6月20日
    narrative_ja: 1290年6月20日、イングランド王エドワード1世はダラム司教アンソニー・ベックに「完全な権限」を与え、①スコットランド王国に属する島々において、戦争と不破の下に滞在している人々を「余の平和と調和へ」受け入れること、②「余の代理として、また余の名において」彼らに安全を保証すること、③「彼らの地位についてさらに規定すること」を認可した。この権限は9月29日の聖ミカエル祭まで有効とされた。\n\n対象となる複数形の「島々」は、戦争・不和の文脈からヘブリディーズ諸島（西部島嶼部）を指すとみられる。また、上記の島々は「スコットランド王国に属する」と、エドワード自身の文書が明記しており、エドワードは他王国に属すると自ら認める領域について権限を行使している。さらに、受け入れ先は「余の平和と調和」であり、スコットランド王国の相続人であるマルグレーテの平和ではない。
    desc_ja: 
    sources:
      - stevenson_documents_i_no_107
    links:
      - treaty_of_birgham_1290


  - id: treaty_of_birgham_1290
    ja: バーガム条約 (1290年7月18日)
    date: 1290-07-18
    narrative_ja: 1290年の7月18日、将来のイングランド王子とスコットランド女王の結婚に伴う、スコットランド王国の地位を規定するための文書がツイード川の北岸、スコットランド側のバーガムにてて発行された。通称「バーガム条約」と呼ばれるものである。文書の内容は以下のとおりである。\n\nスコットランド王国は「分離・分割され、それ自体において従属なく自由に留まる」こと。\n\n「スコットランド王国の権利・法・自由・慣習は、あらゆる点で完全かつ不可侵に永久に保持される」こと。\n\nエドワード王子とマルグレーテ王女のいずれかが子を残さず死亡した場合、王国は最近親相続人へ「完全・自由・無条件に、いかなる従属もなく」復帰すること。\n\n「我らが主君およびその他いかなる者にも、辺境その他において本譲歩以前に帰属し、または将来正当に帰属しうる権利は留保される」こと。この条項は文書中に二度挿入されている。\n\n辺境に新たな城塞を築かないというスコットランド側の要求について、イングランド側は「自領に城塞を築く慣習を制限する隷属は課せない」と同意しない旨を明記する。\n\n選挙権を持つ聖堂参事会は選挙認可のために王国外へ出る強制を受けない。直臣は臣従・忠誠・相続上納金のために王国外へ出る強制を受けない。\n\n「スコットランド王国の者は、同王国内での契約・不法行為につき、王国外で答弁する義務を負わない」こと。\n\n女王が到着・即位するまでは守護団の国璽が有効とされ、その後スコットランド王の名と紋章のみを刻む新国璽が作られ、スコットランド居住の尚書が保管する。侍従長や地方統監等の官職もスコットランド王国のものとする。\n\n「スコットランド王国またはその辺境・住民の地位に関わる事項について、王国および辺境の外で議会を開いてはならない」こと。\n\n 王国共通の必要のため、かつ歴代スコットランド王が慣習的に求めてきた場合を除き、「人頭税、援助金、軍役、不当徴収」を課さないこと。\n\n諸条項の遵守をエドワードとイングランド側高位聖職者・貴族が誓約し、違反時は聖地援助として10万ポンドをローマ教会に支払い、教皇による破門・聖務停止の対象となりうる。また、末尾の抗弁で、本文書によって両王国いずれの権利も増減しないとする。\n\nイングランド側の使節団はエドワード1世の側近であり交渉の実質的な責任者であったダラム司教アンソニー・ベックを筆頭に、カーライル司教ラルフ・アイアトン、サリー伯ジョン・ド・ワーレン、リンカン伯ヘンリー・ド・レイシー、騎士のウィリアム・ド・ヴェシー、およびヨーク首席司祭ヘンリー・ニューアークといった有力者で構成されていた。対するスコットランド側は王国共同体を代表してグラスゴー司教ロバート・ウィシャート、ジョン・カミン、ならびにケイスネス司教アランが使節団として臨んだ。
    desc_ja: 条約の性格と意義について。G. W. S. Barrow は既得権留保条項と、この交渉に並行する諸事件（マン島の委託、タインデール掌握、城砦要求）に、エドワードの宗主権志向の萌芽を読む。Barrow にとって条約はスコットランド独立の「命綱」であり、かつ「守護団と共同体による共同の営みの最高潮」と読む。Barrow はこの文書を「本質的に慎重で防御的な文書」、すなわち、王なき暫定統治者たちが責任の全面的な引き受けを避け、イングランドの侵食を警戒していた産物とみる。一方、M. Prestwich は条約文言にエドワードが後に保証を覆せるような明白な抜け穴はなく、スコットランド交渉団の周到さの証だとする。その上で、対ノルウェー外交の失敗を含めエドワード外交全体を「半ば未完の事業」と評価し、条約締結を単純な勝利とはみない。\n\n「それ自体において自由」の語はいつ、なぜ入ったかについて。条約に先立つ6月20日に出されたスコットランド側請願への回答草案では、エドワードの許諾文言はスコットランドの領域的な分離の身を認め、「それ自体において自由」の文言を落としていた。この語は7月18日の文書にはじめて現れるものであり、この差分が解釈の一論点となっている。A. A. M. Duncan と M. Prestwich はともに、温度感の違いはあるものの、この文言変化を「スコットランド側が交渉で勝ち取った譲歩」とみる。G. W. S. Barrow は「エドワードの当初の立場がここに露呈しており、婚姻という目的のために一時的に開かれたに過ぎない」として侵食史観を提示する。\n\n既得権留保条約は抜け穴か否かについて。この留保は6月の草案から既に存在し、7月の条約でも踏襲された。G. W. S. Barrow は、この文言を宗主権主張の余地を残す条項として重視する。他方、A. A. M. Duncan はこれを明示的に否定する。人的同君連合においては宗主権は不要であり、この種の句は他にも見出せる定型で、他方の王国に正当な請求権を持つ者がなおそれを追求しうると保証する趣旨だったとする。\n\nそもそも「条約」なのかについて。A. A. M. Duncan は7月18日文書が形式上イングランド側使節による「義務負担」であり、婚姻を将来の出来事として扱い、約束・日付・持参金のいずれにも言及しない点を挙げ、「これは婚姻条約ではなかった。実のところ条約ですらなかった」と断ずる。ダンカンにとって交渉の核心はエドワードによるスコットランド城塞の掌握であり、「スコットランド人がそれを断固拒否したがゆえに、バーガムに条約は存在しなかった」とする。\n\n交渉の真の争点は城砦だったかについて。6月20日の使節任命状は「王国の司法管轄権、城塞の管理と防備」を交渉事項に掲げ、かつ未使用のまま返還された。これを踏まえ、A. A. M. Duncan はこれをエドワードによるスコットランドの国制そのものへの介入と読み、城塞の占有は「王国の占有を与える」ものであって「交渉の当初からのエドワードの狙いであったに違いない」とする。Duncan にとって王国の法・自由・独立の寛大な確認は、この本命に対する「付随物」であった。\n\n議会条項の意義について。A. A. M. Duncan は、王国外での議会禁止条項を根拠に「1290年において、議会こそが——他のいかなる集会でもなく——政治的行動主体としての共同体と見なされた」と特徴づけ、Barrow もこの条項が課税を含む王国事項を扱う議会の常態性を前提としている点を重視する。これに対し A. A. B. McQueen はこの条項を制度の突然の創出ではなく、既存の拡大集会を対イングランド外圧のもとで防衛的に明文化したものと読む。この読みは、同じ7月集会を守護団側が「colloquium」、ベリック市当局が「parliamentum」と呼ぶ用語の分裂と整合的である。
    links:
      - agreement_northumpton_1290


  - id: appointment_of_anthony_beck_as_deputy_august_1290
    ja: エドワード1世、ダラム司教を代理に任命 (1290年8月8日)
    date: 1290-08-08
    narrative_ja: イングランド王エドワード1世は自身の側近であるダラム司教アンソニー・ベックを、ノルウェーの乙女マルグレーテと王太子エドワードのための「代理」に任命した。この任命において、ベックにはスコットランド王国において「正義を行い」かつ「是正を行う」権限が与えられ、スコットランドの王国共同体は王国の統治と状態に関して必要とされる物事について彼に従うべきと要求された。
    desc_ja: G. W. S. Barrow 氏や A. A. M. Duncan 氏は、この「正義の執行」と「是正」という文言がスコットランドの法と慣習の維持というバーガム条約の精神を逸脱するものであり、エドワード1世がスコットランドの内政に直接介入しようとする不吉な予兆であったと解釈している。Duncan 氏はさらに、この任命書がスコットランド側には提示されず、マルグレーテ到着後に発効する秘密条項のような扱いだった可能性を指摘しており、エドワード1世が条約の裏で着々と支配体制を構築していたことを示唆している。
    sources:
      - foedera_i_ii_737_2
    links:
      - agreement_northumpton_1290


  - id: agreement_northumpton_1290
    ja: ノーサンプトン合意 (1290年8月28日)
    date: 1290-08-28
    narrative_ja: 1290年8月28日、ノーサンプトンの地でグラスゴー司教ウィシャートらスコットランドの使節団とエドワード1世の間で「スコットランド王の城塞の管理権」をめぐる協議が行われた。この管理権は先だって結ばれたバーガム条約の交渉に際して、イングランド側の使節団が条約の条件としてエドワード1世に引き渡すよう要求していたものであった。しかし、スコットランド側がこの要求を拒絶したため、バーガム条約の時点では城塞に関する合意は形成されず、事態は膠着していたのである。\n\nノーサンプトンで取りまとめられた合意において、スコットランド側は即時の城塞引き渡しを拒否し、あくまで「未来の女王となるマルグレーテとイングランド王太子エドワードがスコットランドに到着し、法と慣習に基づく誓いを行った時点」という条件で城塞を引き渡すことに同意した。
    desc_ja: この「ノーサンプトン合意」と同時に、エドワード1世はバーガム条約で合意されたスコットランドの権利保護条項を正式に批准した。これは表面上、スコットランド側の外交的勝利のように見えたが、M. Brown 氏が指摘するように、エドワード1世はスコットランドの法的権利を認めつつも、実質的な支配権の確保を諦めてはいなかった。
    links:
      - departure_of_margaret_of_norway
