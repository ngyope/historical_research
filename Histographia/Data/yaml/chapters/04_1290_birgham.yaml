  - id: appointment_of_walter_huntercombe_as_guardian_of_isle_of_man
    ja: マン島の守護任命 (1290年6月4日)
    date: 1290-06-04
    narrative_ja: 1290年6月4日、イングランド王エドワード1世は家臣のウォルター・ハンタークームをマン島の守護に任じ、その管理を担わせた。その旨を記した書状にはアルスター伯リチャード・ド・バーグが同島をエドワード1世に返還したと書かれているが、実のところマン島は1270年代のスコットランド王アレグザンダー3世が軍事征服によって、スコットランドの支配領域に組み込まれて久しい地域であった。
    desc_ja: 
    sources:
      - stevenson_documents_i_no_103
    links:
      - treaty_of_birgham_1290


  - id: appointment_of_anthony_beck_as_deputy_of_islands_belonging_to_kingdom_of_scotland
    ja: スコットランド王国に属する島々の代官委任状 (1290年6月10日)
    date: 1290-06-10
    narrative_ja: 1290年6月10日、イングランド王エドワード1世はダラム司教アンソニー・ベックを「代官」に任じ、スコットランド王国に属する島々――おそらく、西部島嶼地域を指すとみられる――において「戦争と不和」の状態に置かれている人々をイングランド王の平和のもとに受け入れる権限を与えている。エドワード1世は、アレグザンダー3世の時代にスコットランドの支配圏に入ったばかりのこれらの地域に対して、王の不在から来る混乱や中央政府の統制が及ばない隙をついて、イングランドの影響力を強化しようとしていたものとみえる。
    desc_ja: 
    sources:
      - stevenson_documents_i_no_107
    links:
      - treaty_of_birgham_1290


  - id: treaty_of_birgham_1290
    ja: バーガム条約 (1290年7月18日)
    date: 1290-07-18
    narrative_ja: 1290年の6月、将来のイングランド王子とスコットランド女王の結婚に伴う、スコットランド王国の地位を規定するための交渉がツイード川の北岸、スコットランド側のバーガムにて再開された。この重要な交渉には両国から高位の代表者が派遣された。イングランド側の使節団はエドワード1世の側近であり交渉の実質的な責任者であったダラム司教アンソニー・ベックを筆頭に、カーライル司教、サリー伯ジョン・ド・ワーレン、リンカン伯ヘンリー・ド・レイシー、騎士のウィリアム・ド・ヴェシー、およびヨーク助祭長ヘンリー・ニューアークといった有力者で構成されていた。対するスコットランド側は王国共同体によって選出されたメンバーが交渉に当たった。具体的な出席者として、摂政団のメンバーであったグラスゴー司教ロバート・ウィシャートとジョン・カミン、ならびにケイスネス司教アランが中心的な役割を果たした。\n\n一連の交渉の結果、7月18日に「バーガム条約」として知られる合意文書が締結された。この条約において、マルグレーテとエドワード王太子の結婚が正式に合意されると同時に、スコットランドの法的地位に関する広範な保護規定が設けられた。合意された主要な内容は以下の通りである。第一に、「スコットランド王国はイングランド王国に従属することなく、その正当な境界と辺境によって、これまで保持されてきた通り分離・分割され、それ自体で自由な状態に留まるものとする」としてその独立性が保証された。また、スコットランドの法や特権、慣習が維持される点が明示され、かつスコットランドに関する議会や裁判は国内で開催されなければならないこと、ならびに教会の選挙や臣従礼も国内で行われることが定められた。さらに、マルグレーテの到着後にはスコットランド王の称号と紋章のみを使用した新たな国璽が作成され、その印璽の管理にはイングランド側の尚書部が介入できないことも合意された。課税に関しても、王国の共通の必要性がある場合を除き、新たな課税や兵役を課さないという制限が設けられた。全体的に、スコットランドの法・慣習や権利・特権、自由が保持され、イングランドの従属化や管理下に置かれるのを未然に防ぐような措置がなされていると言える。
    desc_ja: A. A. M. Duncan 氏による条約の文書分析は、上記のような措置が交渉の舞台裏で繰り広げられたスコットランド側の粘り強い外交努力の結果だったことを示している。ダンカン氏によれば、イングランド側が当初用意した草稿と最終的に合意された条約文書の間には、重要な差異が存在するとされる。特に、当初のイングランド側の提案では両国の境界線の維持については言及されていたものの、そこには「自由」という言葉は含まれていなかった。しかし、最終的な条約文書ではスコットランド王国は「イングランド王国に従属することなく［中略］それ自体において自由」という文言が追加された。これは、スコットランド側がイングランドによる曖昧な支配のレトリックを拒絶し、王国の完全な自律性を文書上で明確に定義させることに成功したことを示唆している。\n\nこの交渉における各国の目的は対照的であった。スコットランド側の目的は「王の尊厳」を守り、強力な隣国であるイングランドを「脅威」から「同盟者」へと変えることにあった。彼らは結婚自体には同意しつつも、法的な文書によってエドワード1世の干渉を巧みに防ぐ防壁を築く戦略を取ったのである。これはスコットランドの政治的エリート層が自身の特権を守る策であったと同時に、スコットランドがプランタジネット家の統治機構へ吸収されることに抵抗し、王国のアイデンティティを確立しようとした試みでもあったと言える。\n\n一方でイングランド側、特にエドワード1世の目的は王子の結婚という好機をとらえて、スコットランドをプランタジネット家の支配領域の一部に組み込むことにあったと考えられる。事実、バーガムでの交渉と並行して、エドワード1世はスコットランドの支配領域において実質的な支配権を確立する動きを見せていた。バーガム条約が締結される1か月前の6月4日、王は家臣のウォルター・ハンタ－クームをマン島の守護に任じ、その管理を担わせている。その旨を記した書状にはアルスター伯リチャード・ド・バーグが同島をエドワード1世に返還したと書かれているが、マン島は1270年代のアレグザンダー3世が軍事征服によって、スコットランドの支配領域に組み込まれて久しい地域であった。さらに、同月にはダラム司教アンソニー・ベックを「代官」に任じ、スコットランド王国に属する島々 (西部島嶼地域を指すとみられる) において「戦争と不和」の状態に置かれている人々をイングランド王の平和のもとに受け入れる権限を与えている。エドワード1世は、アレグザンダー3世の時代にスコットランドの支配圏に入ったばかりのこれらの地域に対して、王の不在から来る混乱や中央政府の統制が及ばない隙をついて、イングランドの影響力を強化しようとしていたのである。さらに、続く8月にノーサンプトンで行われた条約の批准交渉において、エドワード1世はスコットランド側に対し王権の象徴である「城塞の引き渡し」を強く要求した。これらは後の完全支配への布石であり、スコットランドを自身の支配領域の中に平和的に組み込もうとする意図がにじみ出ていると言えよう。\n\n他方、3国間の利害に関わる問題でありながら、花嫁の父であるノルウェー王エイリーク2世の代理人はバーガムでの交渉に参加していなかった。ノルウェーの外交政策は当時、デンマークとの戦争やハンザ同盟との通商問題に忙殺されており、スコットランド問題への関与は受動的にならざるを得なかったのがその一因と考えられている。ノルウェー側の主な動機は亡き王妃の持参金や西方の島々の年金回収といった「財政的利益」にあり、エドワード1世からの融資を引き出すために外交の主導権を彼に委ねていた側面があったようである。したがって、この「不在」ゆえにバーガム条約は実質的にイングランド・スコットランド間の2国間協定として成立したと言える。\n\nバーガム条約の歴史的重要性は、この条約によってスコットランドの独立性が法的に定義されたことにある。後述するように、この条約自体はその後の悲劇的な結末によってすぐに政治的効力を失うことになった。しかし、そこで確認された「王国共同体」の権利や「自由な王国」という概念はその後のイングランドとの戦争においてスコットランド側の理論的支柱となり、ナショナル・アイデンティティの形成においても重要な意味を持つことになるのである。
    links:
      - agreement_northumpton_1290


  - id: appointment_of_anthony_beck_as_deputy_august_1290
    ja: エドワード1世、ダラム司教を代理に任命 (1290年8月8日)
    date: 1290-08-08
    narrative_ja: イングランド王エドワード1世は自身の側近であるダラム司教アンソニー・ベックを、ノルウェーの乙女マルグレーテと王太子エドワードのための「代理」に任命した。この任命において、ベックにはスコットランド王国において「正義を行い」かつ「是正を行う」権限が与えられ、スコットランドの王国共同体は王国の統治と状態に関して必要とされる物事について彼に従うべきと要求された。
    desc_ja: G. W. S. Barrow 氏や A. A. M. Duncan 氏は、この「正義の執行」と「是正」という文言がスコットランドの法と慣習の維持というバーガム条約の精神を逸脱するものであり、エドワード1世がスコットランドの内政に直接介入しようとする不吉な予兆であったと解釈している。Duncan 氏はさらに、この任命書がスコットランド側には提示されず、マルグレーテ到着後に発効する秘密条項のような扱いだった可能性を指摘しており、エドワード1世が条約の裏で着々と支配体制を構築していたことを示唆している。
    sources:
      - foedera_i_ii_737_2
    links:
      - agreement_northumpton_1290


  - id: agreement_northumpton_1290
    ja: ノーサンプトン合意 (1290年8月28日)
    date: 1290-08-28
    narrative_ja: 1290年8月28日、ノーサンプトンの地でグラスゴー司教ウィシャートらスコットランドの使節団とエドワード1世の間で「スコットランド王の城塞の管理権」をめぐる協議が行われた。この管理権は先だって結ばれたバーガム条約の交渉に際して、イングランド側の使節団が条約の条件としてエドワード1世に引き渡すよう要求していたものであった。しかし、スコットランド側がこの要求を拒絶したため、バーガム条約の時点では城塞に関する合意は形成されず、事態は膠着していたのである。\n\nノーサンプトンで取りまとめられた合意において、スコットランド側は即時の城塞引き渡しを拒否し、あくまで「未来の女王となるマルグレーテとイングランド王太子エドワードがスコットランドに到着し、法と慣習に基づく誓いを行った時点」という条件で城塞を引き渡すことに同意した。
    desc_ja: この「ノーサンプトン合意」と同時に、エドワード1世はバーガム条約で合意されたスコットランドの権利保護条項を正式に批准した。これは表面上、スコットランド側の外交的勝利のように見えたが、M. Brown 氏が指摘するように、エドワード1世はスコットランドの法的権利を認めつつも、実質的な支配権の確保を諦めてはいなかった。
    links:
      - departure_of_margaret_of_norway
