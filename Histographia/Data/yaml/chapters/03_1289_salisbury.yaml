chapters:

  - id: beginning_of_anglo-norwegian_marriage_negotiation_1289
    ja: エドワード王子とマルグレーテ王女の婚姻交渉の開始 (1289年4月)
    date: 1289-04-01
    date_display: 1289年4月
    narrative_ja: 1289年4月から、エドワード1世の息子エドワード (後のエドワード2世) とノルウェーの乙女マルグレーテの婚姻交渉が始まる。この婚姻がイングランド、ノルウェーのどちら側から打診されたのかは定かではないが、交渉は1289年4月頃に始まった、ないしは本格化したことは確かと言える。エイリーク2世の治世10年目の4月1日、ノルウェーからエドワード1世のもとに「スコットランドの君主にして女王マルグレーテ、並びにそのスコットランド王国自体に関わる若干の事項について交渉し、協議する」ための使節が派遣された。4月8日、イングランドの総督政府はリチャード・オブ・ノルウェーを使者としてノルウェーに派遣している。この使節の目的は文書には記されていないが、M. Prestwich は婚姻交渉の可能性を指摘している。エドワード自身の直接の関与は5月1日、ガスコーニュ地方のコンドンにてノルウェーの使節に対して保護状を発給したことが確認できる。
    desc_ja: 
    links:
      - treaty_of_salisbury_1289


  - id: request_of_marriage_alliance_in_1289
    ja: エドワード1世、息子エドワードとマルグレーテの婚姻許可を教皇に求める (1289年5月10日)
    date: 1289-05-10
    date_display: 1289年5月10日
    narrative_ja: 1289年5月10日、エドワード1世は長期滞在中のガスコーニュから、サヴォワ人の重臣オットー・ド・グランソンとドミニコ会士ウィリアム・オブ・ホザムを使節として教皇庁に派遣した。寝所部の会計記録によると、その外交の目的は十字軍税の交渉を得るとともに、息子エドワードとマルグレーテの婚姻許可を得ることであった。両者は三親等以内の血縁関係にあったため、結婚には教皇の赦免状が必要であり、かつ先代の教皇ホノリウス4世は1287年にこの世を去っていたため、再度新教皇ニコラウス4世から赦免状を得なければならなかったからである。
    desc_ja: 
    links:
      - treaty_of_salisbury_1289


  - id: safe_conduct_for_norwegian_mission_september_1289
    ja: ノルウェー使節団への通行許可証 (1289年9日)
    date: 1289-09-03
    date_display: 1289年9月
    narrative_ja: 1289年9月、エドワード1世はノルウェーの使節団に対する通行許可証を発給している。ここから、ノルウェー使節団のイングランド入りが9月頃に行われたと推察される。
