chapters:

  - id: request_of_marriage_alliance_in_1289
    ja: エドワード1世、息子エドワードとマルグレーテの婚姻許可を教皇に求める (1289年5月)
    date: 1289-05
    narrative_ja: イングランドのエドワード1世は当面の間、スコットランドに対する消極的な静観姿勢を保っていたが、王不在の状態が長期化してスコットランドにおける政情不安が懸念される中、王はノルウェー王の娘マルグレーテと王太子エドワードとの婚姻による解決へと大きく舵を切ることとなった。\n\n1289年5月、エドワード1世は長期滞在中のガスコーニュから信頼する重臣オットー・ド・グランソンをローマへ派遣した。寝所部の会計記録によると、その外交の目的は十字軍税の交渉を得るとともに、息子エドワードとマルグレーテの婚姻許可を得ることであった。両者は三親等以内の血縁関係にあったため、結婚には教皇の赦免状が必要であり、かつ先代の教皇ホノリウス4世は1287年にこの世を去っていたため、再度新教皇ニコラウス4世から赦免状を得なければならなかったからである。\n\nこの時点ではまだスコットランド側との正式な交渉は始まっていないと見えるが、その交渉が始まる前に教皇の許可を取り付けたことは、エドワード1世があらかじめ外交的な既成事実を積み上げることで問題を解決し、十字軍遠征に出発する前に背後の憂いを発っておきたいと意図していたことの表れではないかと考えられる。
    desc_ja: 
    links:
      - treaty_of_salisbury_1289


  - id: treaty_of_salisbury_1289
    ja: ソールズベリー条約 (1289年10月6日)
    date: 1289-10-06
    narrative_ja: 1289年9月、ノルウェーの乙女マルグレーテとイングランド王太子エドワードの婚姻について、ソールズベリーの地においてスコットランドとイングランドの最初の交渉が行われた。この交渉にはスコットランド側から現職の摂政団のメンバーであったセント・アンドルーズ司教、グラスゴー司教、バーデノックの領主ジョン・カミンの3名の参加に加え、アナンデールの領主ロバート・ブルースが出席した。ブルース派と目されていた摂政団のひとり、ジェームズ・ステュワートは欠席し、代わりにブルース本人が代表に加わったのは重要である。ブルースは摂政としてではなく、国内の強力な派閥を代表する有力者として参加したのであり、その同意なくしてはいかなる合意も実効性を持ち得なかったのである。一方、イングランドはエドワード1世の腹心、ダラム司教アンソニー・ベックをはじめ、ウスター司教、ペンブルック伯ウィリアム・ド・ヴァランス、サリー伯ジョン・ド・ワーレンを送り込むなど、交渉を完全に掌握しようとする姿勢を明確にしていた。ノルウェーからはテリー・ド・シャン・ド・ジュー、ピアーズ・アルゴ、グソーン・ド・アズリーという3名の使節が参加した。\n\n3王国の使節団による交渉は10月6日、1か月以上にわたる協議の末に1通の文書にまとめられた。第一に、王女マルグレーテの移送について。彼女は翌年11月1日の万聖節までに、あらゆる結婚および婚約の契約から解放された自由な状態で、イングランドないしはスコットランドに来ることが定められ、その移送についてノルウェー側が尽力することが約束された。イングランドはスコットランドからの要請があった場合には彼女を平和的にスコットランドに移送することを約束したが、その条件としてスコットランドはエドワード1世の定めた「規定、意志、助言」、および彼女の父ノルウェー王の同意なしには彼女を結婚させてはならないとされた。さらに、スコットランド政府内の人事や王国の「改善」に関する事項でスコットランドとノルウェーの間に対立が生じた場合、エドワード1世が仲裁する権利を持つと定められた。
    desc_ja: ソールズベリ条約の締結に至る前から、エドワード1世にスコットランドに対する上級支配権を確立しようとする長期的な基本計画があったのかどうかについては議論が分かれる点である。しかし、先行研究は少なくとも1286年から1289年に至るまでの3年間、エドワード1世がスコットランド問題に対して高い関心を示していたようには見えない点を指摘している。\n\nスコットランド側の外交戦略について、この交渉におけるスコットランド側の根本的な力の弱さに焦点を当て、彼らの立場は受動的なものだったとする見解がある。すなわち、1289年の時点では幼少のマルグレーテがすぐにスコットランドに来る必要性は薄かったものの、エドワード1世とエイリーク2世が彼女の結婚交渉を進める中でスコットランドの摂政団政府は交渉に参加しなければ蚊帳の外に置かれ、王位継承者の将来が勝手に決められてしまうという「不愉快なジレンマ」に直面し、交渉参加と避けられない妥協と譲歩を余儀なくされたという解釈である。確かに、この年の5月初頭にはノルウェーの使節がガスコーニュに滞在していたエドワード1世の元を訪れ、その翌週にはエドワード1世がマルグレーテとエドワードの結婚に関する許可を教皇に申し出ていることから、その頃には両者の結婚の議論がノルウェー・イングランド間ですでに始まっていたと考えられる。ソールズベリー条約の冒頭にはその議論の過程でイングランド側がスコットランドの摂政団に書簡を送り、使節の派遣を求めたと記されていることからも、この交渉のイニシアティブがスコットランド側にはなかった様子が窺える。\n\n一方で、スコットランドの摂政団がこの交渉への参加に「消極的だった」とみるのは早計と考えられる。交渉が始まる以前の段階において、エドワード1世がスコットランドに対する上級支配権の主張を強めていた様子は窺えず、この時点彼がその「覇権的野心」を持ち、摂政団がそれを警戒していたとするのは後知恵の色眼鏡を通した解釈とも言える。折しも、摂政団はメンバーの1人であったファイフ伯が殺害されたばかりであった。彼らが国内の安定化をはかるために、先の王の親戚でありかつヨーロッパの調停者として名高いエドワード1世の支援を積極的に求めた可能性も考えられる。しかし、その交渉の結果としてまとめられた条文には、隙あればスコットランド内の問題に介入しようとするイングランド側の魂胆がにじみ出ていた。スコットランド側はいったんはこの内容に合意したものの、翌年に続く交渉においては王国の自由や法・慣習を守り、イングランド側の意図的な介入を阻止するための交渉を粘り強く展開していくことになる。
    links:
      - ratification_treaty_of_salisbury_1290
      - treaty_of_salisbury_1289_and_norway
      - treaty_of_salisbury_1289_and_england


  - id: treaty_of_salisbury_1289_and_norway
    ja: ソールズベリー条約とノルウェー王
    date: 1289-10-06
    narrative_ja: ソールズベリで合意された条項を真に理解するためには、交渉のテーブルに着いた3国それぞれの国内事情と外交的動機を分析することが不可欠である。彼らの行動は単なる善意や敵意によって突き動かされたものではなく、それぞれの国や王朝の利益に基づいた極めて合理的な選択の結果であった。\n\nノルウェー側の行動原理は主に財政的な要因が強かっとみえる。当時のノルウェー王は長引くデンマークとの戦争で財政的に逼迫していた。そして、その財政難を乗り切るためにエドワード1世からも多額の借款を行っており、債務者として弱い立場にあった。さらに、スコットランドから嫁いだ亡き王妃マーガレットの持参金はアレグザンダー3世の死後、支払いが滞っていた。こうした状況下で、突如として王女マルグレーテとイングランド王太子エドワードの結婚の話が浮上したのである。エイリーク2世としては娘のスコットランド王位継承権という政治的資産を活用し、具体的な金銭的利益に転換する千載一遇のチャンスであった。ノルウェー側はエドワード1世と協調路線を取り、イングランドからさらなる財政支援を引き出す戦略に出たと考えられる。結果として、ノルウェー側は1289年から1290年にかけてイングランドから1,330ポンドの借り入れに成功し、さらにソールズベリの交渉の翌年にはマルグレーテが15歳に達するまで年間400ポンドの年金をダラム司教経由で受け取る権利を勝ち取った。
    desc_ja: 


  - id: treaty_of_salisbury_1289_and_england
    ja: ソールズベリー条約とイングランド王
    date: 1289-10-06
    narrative_ja: ソールズベリで合意された条項を真に理解するためには、交渉のテーブルに着いた3国それぞれの国内事情と外交的動機を分析することが不可欠である。彼らの行動は単なる善意や敵意によって突き動かされたものではなく、それぞれの国や王朝の利益に基づいた極めて合理的な選択の結果であった。\n\nイングランドのエドワード1世はノルウェー王に対する債権者としての立場を利用し、交渉の主導権を掌握することを目指したようである。シチリア王シャルル2世の解放のために身代金を支払った例にも見られるように、自らを「ヨーロッパの平和創造者」と位置づけるエドワード1世にとって、財政融資を通じて他国との交渉で優位に立つ手法は、得意とする外交戦術のひとつであった。イングランドは表向きはスコットランドとノルウェーの交渉に対し「助言と援助」を与える調停役として振る舞っていたが、締結された条約の条文をよく読むと、そこにはこの立場を利用して隙あればスコットランドの内政に介入しようとする様子が見て取れる。マルグレーテの結婚に対する取り決め、スコットランド王国内の摂政や役人の選出に関する規定、そしてスコットランドの「改善」に関する規定において、イングランド側の意志や合意を踏まえた判断がなされるよう明記されている点からも、その意図が透けて見えるだろう。
    desc_ja: 


  - id: ratification_treaty_of_salisbury_1290
    ja: ソールズベリー条約の批准 (1290年3月14日)
    date: 1290-03-14
    narrative_ja: 1290年3月14日にバーガムで開かれた集会にて、スコットランドの聖俗貴顕――12名の司教、10名の伯、34名の修道院長、50名のバロンたち――は前年に締結されたソールズベリー条約を批准した。
