  - id: scottish_letter_of_credence_in_october_1289
    ja: スコットランド守護団がメルローズで使節委任状を発給 (1289年10月3日)
    date: 1289-10-03
    date_display: 1289年10月3日
    narrative_ja: 1289年10月3日、スコットランドの摂政団はメルローズにて、セント・アンドルーズ司教ウィリアム、グラスゴー司教ロバート、アナンデールの領主ロバート・ブルース、ジョン・カミンをノルウェー王の使節との交渉にあたる使節団に任命する書状を発給した。
    desc_ja: この使節委任状には使節団に交渉の全権を委ねる旨が記されているが、ただし「王国の自由と名誉を留保して」という留保事項が見られる。
    links:
      - treaty_of_salisbury_1289


  - id: treaty_of_salisbury_1289
    ja: ソールズベリー条約 (1289年11月6日)
    date: 1289-11-06
    date_display: 1289年11月6日
    narrative_ja: 1289年8月、エドワード1世がガスコーニュからイングランドに帰還した後、エドワード王子とマルグレーテ王女の婚姻と王女の身柄についての交渉が行われた。9月、エドワードはノルウェー使節への通行許可証を発給しており、10月3日にはスコットランド守護団がメルローズで使節委任状を発給していることから、10月頃にはスコットランド使節団もソールズベリに到着し、三国間の交渉が本格化したものと考えられる。\n\n交渉は11月6日、ソールズベリにて交渉は一定の合意に達し、3通の割符文書が作成された。これがソールズベリ条約と呼ばれているものである。交渉の発端と枠組みは、ノルウェー王エイリークとその娘が、使節を通じてエドワードに「乙女が女主・女王・相続人として臣従を受け、他の王が自らの王国で行うように統べ享受できるよう」助力と助言を与えるよう請うた。エドワードは「スコットランド王国の利益と平和のため、かつその姪［＝乙女］の地位を是正するため」守護団に使節派遣を求めた。\n\n条約は6つの条項からなる。第一条項は乙女の身柄の引き渡し起源に関するもので、乙女は「来たる諸聖人の日［11月1日］までに」、いかなる婚姻・婚約契約からも自由な状態でイングランドまたはスコットランドへ来る。ノルウェー使節はこれを誠意をもって果たすと約すことが定められた。\n\n第二条項はエドワードの誓約と婚姻同意権についてであり、乙女が婚姻契約から自由な状態でエドワードの手に来た場合、スコットランドが平穏になれば、エドワードは受け取ったのと同じく婚姻契約から自由な状態で彼女をスコットランドへ送る。ただしスコットランド側は、受領に先立ち「エドワードの差配、意思、助言によらず、かつその父ノルウェー王の同意によらずしては、決して彼女を結婚させない」旨の保証を提供せねばならないことが定められた。\n\n第三条項はスコットランド側の誓約であり、スコットランド側は、乙女の到着前に王国を安全にし、彼女が「真の女主・女王・相続人として」安全に来て留まれるよう保証することが定められた。\n\n第四条項は守護の更迭についてであり、守護や王国官職者のうち、乙女とノルウェー側に「疑わしい、または女主に有益でない」者があれば、「スコットランドおよびノルウェーの善き人々、ならびにエドワードが遣わす者たちの合意により」更迭され、他の者が据えられることが定められた。\n\n第五条項はイングランドの仲裁権であり、スコットランド側とノルウェー側が「イングランド王の家臣たちの助力と助言によって」合意に達し得ない場合、事はエドワードの人々の裁定するところに従う。これは「スコットランド王国の状態の是正に関わる事柄」の一切の争論に及ぶ。王国の状態はエドワードとエイリーク双方に報告されることが定めれた。\n\n第六条項は批准の期日についてであり、四旬節半ばにスコットランド側はロクスバラ周辺に、イングランド使節はツイード対岸のワーク、カーラムに集い、諸誓約と「スコットランド王国の是正に関わる事柄」を確認・履行することが定められた。\n\nスコットランド使節はセント・アンドルーズ司教ウィリアム・フレイザー、グラスゴー司教ロバート・ウィシャート、バーデノックの領主ジョン・カミン、アナンデール領主ロバート・ブルース。ノルウェー王使節はテリー・ド・シャン・ド・ジュー、ピアーズ・アルゴ、グトルム・デ・アシュリー。イングランド王使節はウィンチェスター司教ジョン・オブ・ポンティソワ、ダラム司教アンソニー・ベック、ペンブルック伯ウィリアム・ド・ヴァランス、サリー伯ジョン・ド・ワーレン。
    desc_ja: 王国の状態の是正の意義：条約本文は王国の状態の「是正」に関わる争論の仲裁をエドワードに委ね、この語を複数箇所で用いている。G. W. S. Barrow はこの「是正」の概念が内実を定義されないままイングランド側から持ち込まれた点に「将来のスコットランド＝イングランド関係にとって不吉な」含意を読み、1290年8月のノーサンプトンでのエドワード書状（ベックをスコットランド代官に任じ王国の「是正」を委ねる）、さらに1291年ノラムでの宗主権宣言へ連なる伏線とみる。A. A. M. Duncan も「是正」を「忘れてはならない点」と注記する。A. Young は守護団が使節に「王国の自由と名誉」の保全を訓令していたにもかかわらず、条約が結果的にエドワードの介入権を承認したと総括する。\n\n婚姻同意権の性格：条約はスコットランド側が乙女を「エドワードの差配・意思・助言によらず、かつエイリークの同意によらずしては」結婚させないと定める。A. A. M. Ducan は、この非対称な文言が、実際にはエドワードに乙女の配偶者を選ぶ権利を与え、エイリークには弱い拒否権しか残さなかったと読む。\n\n乙女の王号：A. A. M. Duncan はスコットランド側が乙女を「女王」と呼ぶのはごく限られた書状のみで、ノーサンプトン条約や大訴訟では一貫して「女主・相続人」と称した点を強調し、「女王」の号はエイリークとエドワードの書記が1289年に初めて用いたものだとする。Duncan は乙女を「女王」と呼ぶことはエドワードがスコットランド王国への掌握を早めるための手段であり、乙女は即位式を経ておらず「スコット人の女王であったことはない」とする。
    links:
      - ratification_treaty_of_salisbury_1290
      - treaty_of_salisbury_1289_and_norway
      - treaty_of_salisbury_1289_and_england


  - id: treaty_of_salisbury_1289_and_norway
    ja: ソールズベリー条約とノルウェー王
    date: 1289-11-06
    narrative_ja: ソールズベリで合意された条項を真に理解するためには、交渉のテーブルに着いた3国それぞれの国内事情と外交的動機を分析することが不可欠である。彼らの行動は単なる善意や敵意によって突き動かされたものではなく、それぞれの国や王朝の利益に基づいた極めて合理的な選択の結果であった。\n\nノルウェー側の行動原理は主に財政的な要因が強かっとみえる。当時のノルウェー王は長引くデンマークとの戦争で財政的に逼迫していた。そして、その財政難を乗り切るためにエドワード1世からも多額の借款を行っており、債務者として弱い立場にあった。さらに、スコットランドから嫁いだ亡き王妃マーガレットの持参金はアレグザンダー3世の死後、支払いが滞っていた。こうした状況下で、突如として王女マルグレーテとイングランド王太子エドワードの結婚の話が浮上したのである。エイリーク2世としては娘のスコットランド王位継承権という政治的資産を活用し、具体的な金銭的利益に転換する千載一遇のチャンスであった。ノルウェー側はエドワード1世と協調路線を取り、イングランドからさらなる財政支援を引き出す戦略に出たと考えられる。結果として、ノルウェー側は1289年から1290年にかけてイングランドから1,330ポンドの借り入れに成功し、さらにソールズベリの交渉の翌年にはマルグレーテが15歳に達するまで年間400ポンドの年金をダラム司教経由で受け取る権利を勝ち取った。
    desc_ja: 


  - id: treaty_of_salisbury_1289_and_england
    ja: ソールズベリー条約とイングランド王
    date: 1289-11-06
    narrative_ja: ソールズベリで合意された条項を真に理解するためには、交渉のテーブルに着いた3国それぞれの国内事情と外交的動機を分析することが不可欠である。彼らの行動は単なる善意や敵意によって突き動かされたものではなく、それぞれの国や王朝の利益に基づいた極めて合理的な選択の結果であった。\n\nイングランドのエドワード1世はノルウェー王に対する債権者としての立場を利用し、交渉の主導権を掌握することを目指したようである。シチリア王シャルル2世の解放のために身代金を支払った例にも見られるように、自らを「ヨーロッパの平和創造者」と位置づけるエドワード1世にとって、財政融資を通じて他国との交渉で優位に立つ手法は、得意とする外交戦術のひとつであった。イングランドは表向きはスコットランドとノルウェーの交渉に対し「助言と援助」を与える調停役として振る舞っていたが、締結された条約の条文をよく読むと、そこにはこの立場を利用して隙あればスコットランドの内政に介入しようとする様子が見て取れる。マルグレーテの結婚に対する取り決め、スコットランド王国内の摂政や役人の選出に関する規定、そしてスコットランドの「改善」に関する規定において、イングランド側の意志や合意を踏まえた判断がなされるよう明記されている点からも、その意図が透けて見えるだろう。
    desc_ja: 


