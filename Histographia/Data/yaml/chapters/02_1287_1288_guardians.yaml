chapters:

  - id: diplomatic_loan_and_recruitment_1286
    ja: イングランド王の資金融資と五港市からの軍事動員（1286年）
    date: 1286-03
    date_display: 1286年
    narrative_ja: 1286年3月29日、トンスベルグ城でエイリーク2世はエルヴ・ド・モンテ・スピネ（サルプスボルグ伯）を代理人に任命し、2,000マーク・スターリングまでの借款契約権と、自身・相続人・王国を担保に供する権限を付与した。同年9月21日、この代理人はヤーマスで、イングランド王が貸与した2,000マークを、ルッカ商人グイデションから、ロンドン商人セルヴァトおよびカオール商人ベルナール・ド・ポントの手を通じて全額受領している。あわせて代理人はサンク・ポートで騎士その他の兵を徴募し、これを伴って帰国することを許された。
    desc_ja: K. Helle の解釈によれば、この借款の背景にはノルウェー王室の慢性的な財政難があった。王室収入の多くが現物であったため軍備・戦争の時期には現金が特に不足しており、1285年のヴェンド都市群への賠償金負担もこれを悪化させたとされる。対デンマーク介入という強硬策を進めていたエイリーク2世の評議会はその遂行に現金と兵員を要し、危険な政策に踏み切るにあたってイングランド、スコットランドとの関係を確保しており、1286年の借款・徴募もこの文脈に置かれている。また、Helle はこの借款が返済された形跡がないと評価し、これをエドワード1世がノルウェー政府への影響力を財政的手段で確保していく一連の動きの先駆けと位置づける。
    sources:
      - stevenson_documents_i_no_2
      - stevenson_documents_i_no_13
    links:
      - margaret_or_norway_and_king_of_norway


  - id: scottish_mission_to_gascony_1286
    ja: スコットランド使節のガスコーニュ派遣（1286年8月）
    date: 1286-08
    date_display: 1286年8月
    narrative_ja: エドワード1世は1286年5月に渡海し、1289年までガスコーニュ地方に滞在していた。この状況下で、スコットランドの守護団は統治の初期から、王の不在期における安定を求めてエドワードの助言・保護を仰ごうとした。バウワーの『スコティクロニコン』には「スコットランド王国の状態とペンリスの所領について」エドワードの「助言と保護」を得るため、1286年8月7日の聖ドナトゥスの日、守護団によって選出された3名の使節、すなわちブレチン司教ウィリアム・カミン（ただし、セント・アンドルーズ司教とする異伝も併記されている）、ジェドバラ修道院長、ジェフリ・モーブレーが派遣された旨を伝える。使節はロンドンでの1日を除いて日程を休みなく重ね、サントにてエドワードに謁見して要件を述べた。使節は11月25日の聖カタリナの日にスコットランドのクラックマナンに帰着し、エドワードの返答をもたらした。
    desc_ja: バウワーの『スコティクロニコン』が伝えるのは1個の使節のみであるが、これに対し A. A. M. Duncan、M. Prestwich、A. Young ら複数の研究者は2個の使節を想定する。すなわち、1286年5月にセント・アンドルーズ司教がエドワードのもとへ向かった使節、そして同年8月にブレチン司教、ジェドバラ修道院長、モーブレーの3名からなる使節である。
    sources:
      - scotichronicon_bk_11_3
    links:
      - attitude_of_edward_i_of_england


  - id: norwegian_mission_to_scotland_1286
    ja: ノルウェー使節のスコットランド滞在（1286年末～1287年初）
    date: 1286-11
    date_display: 1286年末
    narrative_ja: 『カラマグヌス・サガ』という、14世紀に編纂されたシャルルマーニュ伝説の古ノルド語集成の中に「オリフ夫人とその息子ランドレスについて」という物語が含まれる。この物語の冒頭には、ノルウェー王の評議会の有力貴族であったビャルニ・エルリングソンがアレグザンダー3世が崩御した後の冬、スコットランド滞在中にこの物語の英語版を見出し、古ノルド語への翻訳を行わせたと述べられている。この使節の記事はほぼ同時代の記録とみなされている。ただし、情報の性格は外交・行政記録ではなく、翻訳事業の由来を語る文学的付記であり、ビャルニがその冬にスコットランドにいたことを伝えるにとどまる。サガは派遣の目的を「ビャルニ卿は乙女［＝マルグレーテ］の治下にある王国を確固たるものとし、平定するために西へ派遣されたのである」と述べるが、その具体的な目的や内容・成果については不明点が多い。
    sources: []
    links:
      - margaret_or_norway_and_king_of_norway


  - id: margaret_or_norway_and_king_of_norway
    ja: ノルウェーの乙女マルグレーテとノルウェー王家 (1286年末～1289年初)
    date: 1287-01
    kind: process
    date_display: 1286年末頃～1289年初頃
    narrative_ja: アレグザンダー3世崩御の後の冬にビャルニ・エルリングソンがスコットランドに滞在した痕跡の後、1289年まで新しい政治情勢に対するノルウェー側の反応の痕跡を現存史料からたどることはできない。\n\n他方、1289年から1290年頃に年代否定されるノルウェー王エイリーク2世のエドワード1世宛ての書簡は、スコットランド王国からの年金700マークが来る聖霊降臨祭において4年間未払いの状態が続いていることを述べている。この年金の歳入義務はエイリーク2世とアレグザンダー3世の娘マーガレットの婚姻条約に由来するものであり、1283年のマーガレットの死後、ノルウェー王は使者を送って700マークの歳入を要求し、アレグザンダー3世もこれに応じた旨が『ゲスタ・アナリア』や『スコティクロニコン』にも記されている。ここから再構成をすると、アレグザンダー3世の死後にこの支払いは停止されたとみられる。\n\nこの支払い停止が両王国の係争事案となったことは間違いないだろうが、この一件がノルウェー王家の外交的「沈黙」にどの程度影響しているかは定かではない。いずれにせよ、スコットランドの王国共同体がノルウェーの乙女を王位継承者に選んだとしても、彼女はノルウェー王の宮廷で養われており、彼女をスコットランドの君主として戴くにあたっては父であるノルウェー王エイリーク2世との合意が必要であり、マルグレーテは引き続きノルウェー王の宮廷に留め置かれた。
    sources:
      - foedera_i_ii_732_2
      - gesta_annalia_ch_64
      - scotichronicon_bk_10_38
    links: []


  - id: attitude_of_edward_i_of_england
    ja: イングランド王エドワード1世の態度
    date: 1286-05
    narrative_ja: 1286年5月、イングランド王エドワード1世はウェストミンスター第二法等の法整備を終えてフランスへ渡航した。エドワード1世はフランス南西部のガスコーニュ公領を領有し、その資格においてフランス王の家臣に位置づけられていた。折しも1285年にフランス王フィリップ3世が死去し、フィリップ4世が跡を継いだことで、エドワード1世はガスコーニュ公領に関する臣従礼を求められていたのである。その履行と併せて、ガスコーニュの問題について協議することがこの渡航の目的のひとつであった。また、ほかにもこの時期のエドワード1世は十字軍遠征の実現を優先事項として掲げており、その前提としてヨーロッパ内の平和を確保する必要があった。1284年にアンジュー家のシャルル・ダンジューの息子シャルルがアラゴンの捕虜となって以降、アンジュー家とアラゴン王家の関係は悪化しており、その紛争調停も渡航の大きな目的となっていたのである。\n\n上記のような事情があったため、スコットランドの隣国、イングランド王エドワード1世のスコットランド情勢に対する態度も最初は消極的な静観にとどまっていた。1286年5月、セント・アンドルーズ司教らスコットランドの使節団がイングランドに到着したものの、具体的な外交成果は記録されていない。この時期はまだ王妃ヨランドの妊娠の可能性があり、王位継承が大きな政治的テーマとならなかったものと考えられる。これらを踏まえれば、イングランドにとって、アレグザンダー3世死後のスコットランド情勢の優先度は決して高くなく、エドワード1世が早期からスコットランドへの介入を企図していたという解釈は成立しづらいと言える。
    desc_ja: 1286年5月27日には教皇ホノリウス4世がエドワード一世の子供たちに対して第4親等までの近親婚を認める勅書を発行している。これをもってマルグレーテと王太子エドワード (後のエドワード2世) の婚姻を実現するためにエドワード1世が事前に根回しを行っていたとする見解もなくはないが、M. Prestwich 氏が指摘するように、これは娘エレノアとアラゴン王家の婚姻に関するものだったと解釈すべきであろう。M. Prestwich (1990).


  - id: administration_under_the_guardians_1287_1290
    ja: 守護団政府による行政運営 (1287年～1290年)
    date: 1287-01
    kind: process
    date_display: 1287年～1290年
    narrative_ja: 1287年から1290年にかけて、スコットランドの唯一の王位継承者であるノルウェー王女マルグレーテはノルウェーに留まり続け、スコットランドは王が不在の状態が続くことになった。守護団は地代の徴収、俸禄の付与や経費の支払い命令、州長官による会計報告の監査、イングランドにおける故アレグザンダー3世の私有地の管理をめぐる交渉といった日々の行政や対外交渉を遂行し、彼らのもとで王国行政の機能が維持されていたことも史料からうかがえる。
    desc_ja:
    links:
