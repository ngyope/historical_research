  - id: response_of_edward_i_on_kidnapping_of_eleanor_de_ferrers
    ja: イングランド王、ウィリアム・ダグラスとエレノア・ド・フェラーズに身元引き渡しを要求する (1289年3月27日)
    date: 1289-03-27
    narrative_ja: おそらく1288年の末ないしは1289年の初頭に、スコットランド南部の領主、ウィリアム・ダグラスがイングランド貴顕の未亡人エレノア・ド・フェラーズをタンレントにて誘拐するという事件が発生した。主君としてエレノアの再婚を承認する権利を有していたイングランド王エドワード1世はこの事件を聞いて激高し、1289年の3月27日付でイングランド側からダグラスとエレノアの身元を引き渡すよう、高圧的な態度で要求した。
    desc_ja:
    sources:
      - stevenson_documents_i_no_56
      - stevenson_documents_i_no_57
    links:
      - imprisonment_of_william_douglas_1290


  - id: imprisonment_of_william_douglas_1290
    ja: ウィリアム・ダグラスの投獄と釈放 (1290年5月)
    date: 1290-05
    narrative_ja: イングランド貴顕の未亡人であったエレノア・ド・フェラーズを誘拐した咎で、ウィリアム・ダグラスは1289年4月以降にリーズ城に幽閉され、1290年5月には釈放された。この事件に対して、スコットランドの摂政団政府がどのような対応を取ったのかは史料に残されていない。
    desc_ja:


  - id: killing_of_duncan_earl_of_fife_1289_09
    ja: ファイフ伯ダンカンの謀殺 (1289年9月)
    date: 1289-09
    narrative_ja: 1289年の9月にブリーヒン近郊にて、スコットランド摂政団の1人であったファイフ伯ダンカンが、ファイフ地方の在地有力者で自身の親戚にあたる騎士、ヒュー・アバネシ―の手の者によって殺害された。イングランド側の年代記『ラナコスト年代記』は、ファイフ伯が「若年でありながら我々が一般に見る誰よりも残酷かつ強欲であり、自らの貪欲を満たせるならばいかなる不正義をも控えることがなかった」ために、その報いを受けて殺されたと述べる。\n\n近年の歴史家たちの分析によれば、この人物評は殺害の動機を示唆しているとされる。すなわち、ダンカンは長い未成年期を経て1284年に成人したばかりであり、その領地には先々代の伯マルコムの妻エレン、ならびに先代の伯コルバンの妻アンの寡婦産が設定されていた。寡婦産とは、夫の死後に未亡人となった妻が相続する財産のことであり、通常であれば妻は亡くなった夫の財産の3分の1を相続する権利を有していた。これらの寡婦産によってダンカンの収入は制限されており、彼は失われた時間と収入を取り戻そうと、近隣の領主や家臣に対して攻撃的に権利を主張した可能性が高いとされる。そして、その強硬的な態度への反発が、アバネシ―によるファイフ伯の殺害という結果に繋がったのではないかと推測されている。王が存命していたのであればこのような地域紛争は王の法廷に上訴されたかもしれないが、王が不在ゆえに強力な仲裁者が欠けており、さらに利害関係者であるファイフ伯が摂政団の一員として国政の中枢にいる以上、アバネシ―にとっては実力行使が紛争解決の「リスクはあるが有効な手段」として選択されたのではないか、ということである。\n\n『ゲスタ・アナリア』によれば、アバネシ―とその手の者はアンドルー・マリによって捕らえられ、アバネシ―はダグラス城で獄死したと伝えられている。ダンカンの死後、彼が保持していた所領や官職が残りの摂政たちによって分配された。セント・アンドルーズ司教はファイフ伯領の管理権を、ジョン・カミンはダルとクリュニーといった王領地の管理権を、ジェームズ・ステュワートの叔父にあたるメンテイス伯はダンバートンの州長官職を獲得した。これは、摂政団が「王国共同体」という一体性の理念を代表する存在であったと同時に、自身や自らの家門の利益を追及する「貴族的な派閥」としても機能していたことを雄弁に物語っている。
    desc_ja:
