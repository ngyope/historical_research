  - id: killing_of_duncan_earl_of_fife_1289_09
    ja: ファイフ伯ダンカンの謀殺 (1289年9月)
    date: 1289-09
    narrative_ja: 1289年の9月にブリーヒン近郊にて、スコットランド守護団の1人であったファイフ伯ダンカンが、ファイフ地方の在地有力者で自身の親戚にあたる騎士、ヒュー・アバネシ―の手の者によって殺害された。イングランド側の年代記『ラナコスト年代記』は、ファイフ伯が「若年でありながら我々が一般に見る誰よりも残酷かつ強欲であり、自らの貪欲を満たせるならばいかなる不正義をも控えることがなかった」ために、その報いを受けて殺されたと述べる。\n\n『ゲスタ・アナリア』によれば、アバネシ―とその手の者はアンドルー・マリによって捕らえられ、アバネシ―はダグラス城で獄死したと伝えられている。ダンカンの死後、彼が保持していた所領や官職が残りの摂政たちによって分配された。セント・アンドルーズ司教はファイフ伯領の管理権を、ジョン・カミンはダルとクリュニーといった王領地の管理権を、ジェームズ・ステュワートの叔父にあたるメンテイス伯はダンバートンの州長官職を獲得した。
    desc_ja: M. Brown (2004), ch. 8 は、ダンカンが後見人という地位を私的な所領拡大に利用したことで近隣に敵を作っていた可能性が高いと指摘する。また、ダンカンの遺した所領・官職の分配について、これを王国統治の継続への配慮というよりも、同僚の暴力的排除に乗じて私利を追求したものであったと評価している。\n\nなお、アバネシ―自身の末路については二次文献の間で記述が分かれる。G. W. S. Barrow (1990) は、教唆者アバネシ―ではなく実行犯サー・ウォルター・ド・パーシチェイらが逃亡の末に捕らえられダグラス城で処刑されたと記す一方、M. Brown (2004), ch. 8 はアバネシ―自身が追跡され投獄されたと記しており、両者は一致しない。
    sources:
      - gesta_annalia_ch_82
      - chron_lanercost_1289_para_7

