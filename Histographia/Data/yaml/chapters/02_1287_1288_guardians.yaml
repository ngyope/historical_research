chapters:

  - id: diplomatic_loan_and_recruitment_1286
    ja: イングランド王の資金融資と五港市からの軍事動員（1286年）
    date: 1286-03
    date_display: 1286年
    narrative_ja: 1286年3月29日、トンスベルグ城でエイリーク2世はエルヴ・ド・モンテ・スピネ（サルプスボルグ伯）を代理人に任命し、2,000マーク・スターリングまでの借款契約権と、自身・相続人・王国を担保に供する権限を付与した。同年9月21日、この代理人はヤーマスで、イングランド王が貸与した2,000マークを、ルッカ商人グイデションから、ロンドン商人セルヴァトおよびカオール商人ベルナール・ド・ポントの手を通じて全額受領している。あわせて代理人はサンク・ポートで騎士その他の兵を徴募し、これを伴って帰国することを許された。
    desc_ja: K. Helle の解釈によれば、この借款の背景にはノルウェー王室の慢性的な財政難があった。王室収入の多くが現物であったため軍備・戦争の時期には現金が特に不足しており、1285年のヴェンド都市群への賠償金負担もこれを悪化させたとされる。対デンマーク介入という強硬策を進めていたエイリーク2世の評議会はその遂行に現金と兵員を要し、危険な政策に踏み切るにあたってイングランド、スコットランドとの関係を確保しており、1286年の借款・徴募もこの文脈に置かれている。また、Helle はこの借款が返済された形跡がないと評価し、これをエドワード1世がノルウェー政府への影響力を財政的手段で確保していく一連の動きの先駆けと位置づける。
    sources:
      - stevenson_documents_i_no_2
      - stevenson_documents_i_no_13
    links:
      - margaret_or_norway_and_king_of_norway


  - id: norwegian_mission_to_scotland_1286
    ja: ノルウェー王の遣スコットランド使節（1286年末～1287年初）
    date: 1286-12
    date_display: 1286年末
    narrative_ja: 1286年末から1287年初にかけての冬、ノルウェーの有力貴顕ビャルネ・エルリングソンがマルグレーテの王位継承問題のためにスコットランドを訪れた痕跡が史料に残されている。しかし、その交渉結果は不明であり、以後1289年まで、ノルウェーがこの問題に関して積極的に介入した痕跡は見られない。
    desc_ja: 1289年までの空白からは、マルグレーテの王位継承問題が当時のノルウェーにとって決して優先度の高い事案ではなく、基本的には消極的な介入の姿勢を貫いていたことがうかがえる。\n\nこの時期のノルウェー政府にとって優先度の高い懸案事項は対デンマーク戦争を見据えた自国の安全保障とそのための財源確保であり、スコットランド問題への即時介入が求められたわけではなかったという指摘もなされている。
    sources: []
    links:
      - margaret_or_norway_and_king_of_norway


  - id: margaret_or_norway_and_king_of_norway
    ja: ノルウェーの乙女マルグレーテとノルウェー王家 (1286年末～1287年初)
    date: 1287-01
    kind: process
    date_display: 1286年末頃～1287年初頃
    narrative_ja: スコットランド王妃ヨランドの懐妊がないとわかり、またロバート・ブルースの反乱が鎮圧されたことで、スコットランドの王位は1284年になされた誓約に基づき、ノルウェーの乙女ことマルグレーテ王女に継承される路線が濃厚となった。しかし、仮にスコットランドの「王国共同体」がノルウェーの乙女を王位継承者に選んだとしても、彼女はノルウェー王の宮廷で養われており、彼女をスコットランドの君主として戴くにあたっては父であるノルウェー王エイリーク2世との合意が必要であった。しかし、スコットランドに対するエイリーク2世の態度は必ずしも宥和的ではなく、マルグレーテは引き続きノルウェー王の宮廷に留め置かれた。
    desc_ja: ノルウェー側の非宥和的な態度の背景として、アレグザンダー3世の死後、亡き妻マーガレットとの結婚に際して1281年の条約で定められた年間700マークの支払いがスコットランド側から滞っていたことが一因であるという指摘がなされている。
    sources:
      - foedera_i_ii_732_2


  - id: attitude_of_edward_i_of_england
    ja: イングランド王エドワード1世の態度
    date: 1286-05
    narrative_ja: 1286年5月、イングランド王エドワード1世はウェストミンスター第二法等の法整備を終えてフランスへ渡航した。エドワード1世はフランス南西部のガスコーニュ公領を領有し、その資格においてフランス王の家臣に位置づけられていた。折しも1285年にフランス王フィリップ3世が死去し、フィリップ4世が跡を継いだことで、エドワード1世はガスコーニュ公領に関する臣従礼を求められていたのである。その履行と併せて、ガスコーニュの問題について協議することがこの渡航の目的のひとつであった。また、ほかにもこの時期のエドワード1世は十字軍遠征の実現を優先事項として掲げており、その前提としてヨーロッパ内の平和を確保する必要があった。1284年にアンジュー家のシャルル・ダンジューの息子シャルルがアラゴンの捕虜となって以降、アンジュー家とアラゴン王家の関係は悪化しており、その紛争調停も渡航の大きな目的となっていたのである。\n\n上記のような事情があったため、スコットランドの隣国、イングランド王エドワード1世のスコットランド情勢に対する態度も最初は消極的な静観にとどまっていた。1286年5月、セント・アンドルーズ司教らスコットランドの使節団がイングランドに到着したものの、具体的な外交成果は記録されていない。この時期はまだ王妃ヨランドの妊娠の可能性があり、王位継承が大きな政治的テーマとならなかったものと考えられる。これらを踏まえれば、イングランドにとって、アレグザンダー3世死後のスコットランド情勢の優先度は決して高くなく、エドワード1世が早期からスコットランドへの介入を企図していたという解釈は成立しづらいと言える。
    desc_ja: 1286年5月27日には教皇ホノリウス4世がエドワード一世の子供たちに対して第4親等までの近親婚を認める勅書を発行している。これをもってマルグレーテと王太子エドワード (後のエドワード2世) の婚姻を実現するためにエドワード1世が事前に根回しを行っていたとする見解もなくはないが、M. Prestwich 氏が指摘するように、これは娘エレノアとアラゴン王家の婚姻に関するものだったと解釈すべきであろう。M. Prestwich (1990).


  - id: administration_under_the_guardians_1287_1290
    ja: 守護団政府による行政運営 (1287年～1290年)
    date: 1287-01
    kind: process
    date_display: 1287年～1290年
    narrative_ja: 1287年から1290年にかけて、スコットランドの唯一の王位継承者であるノルウェー王女マルグレーテはノルウェーに留まり続け、スコットランドは王が不在の状態が続くことになった。守護団は地代の徴収、俸禄の付与や経費の支払い命令、州長官による会計報告の監査、イングランドにおける故アレグザンダー3世の私有地の管理をめぐる交渉といった日々の行政や対外交渉を遂行し、彼らのもとで王国行政の機能が維持されていたことも史料からうかがえる。
    desc_ja:
    links:
      - request_of_marriage_alliance_in_1289
      - response_of_edward_i_on_kidnapping_of_eleanor_de_ferrers
      - killing_of_duncan_earl_of_fife_1289_09


  - id: response_of_edward_i_on_kidnapping_of_eleanor_de_ferrers
    ja: イングランド王、ウィリアム・ダグラスとエレノア・ド・フェラーズに身元引き渡しを要求する (1289年3月27日)
    date: 1289-03-27
    narrative_ja: おそらく1288年の末ないしは1289年の初頭に、スコットランド南部の領主、ウィリアム・ダグラスがイングランド貴顕の未亡人エレノア・ド・フェラーズをタンレントにて誘拐するという事件が発生した。主君としてエレノアの再婚を承認する権利を有していたイングランド王エドワード1世はこの事件を聞いて激高し、1289年の3月27日付でイングランド側からダグラスとエレノアの身元を引き渡すよう、高圧的な態度で要求した。
    desc_ja:
    sources:
      - stevenson_documents_i_no_56
      - stevenson_documents_i_no_57
    links:
      - imprisonment_of_william_douglas_1290


  - id: imprisonment_of_william_douglas_1290
    ja: ウィリアム・ダグラスの投獄と釈放 (1290年5月)
    date: 1290-05
    narrative_ja: イングランド貴顕の未亡人であったエレノア・ド・フェラーズを誘拐した咎で、ウィリアム・ダグラスは1289年4月以降にリーズ城に幽閉され、1290年5月には釈放された。この事件に対して、スコットランドの守護団政府がどのような対応を取ったのかは史料に残されていない。
    desc_ja:


  - id: killing_of_duncan_earl_of_fife_1289_09
    ja: ファイフ伯ダンカンの謀殺 (1289年9月)
    date: 1289-09
    narrative_ja: 1289年の9月にブリーヒン近郊にて、スコットランド守護団の1人であったファイフ伯ダンカンが、ファイフ地方の在地有力者で自身の親戚にあたる騎士、ヒュー・アバネシ―の手の者によって殺害された。イングランド側の年代記『ラナコスト年代記』は、ファイフ伯が「若年でありながら我々が一般に見る誰よりも残酷かつ強欲であり、自らの貪欲を満たせるならばいかなる不正義をも控えることがなかった」ために、その報いを受けて殺されたと述べる。\n\n『ゲスタ・アナリア』によれば、アバネシ―とその手の者はアンドルー・マリによって捕らえられ、アバネシ―はダグラス城で獄死したと伝えられている。ダンカンの死後、彼が保持していた所領や官職が残りの摂政たちによって分配された。セント・アンドルーズ司教はファイフ伯領の管理権を、ジョン・カミンはダルとクリュニーといった王領地の管理権を、ジェームズ・ステュワートの叔父にあたるメンテイス伯はダンバートンの州長官職を獲得した。
    desc_ja: M. Brown (2004), ch. 8 は、ダンカンが後見人という地位を私的な所領拡大に利用したことで近隣に敵を作っていた可能性が高いと指摘する。また、ダンカンの遺した所領・官職の分配について、これを王国統治の継続への配慮というよりも、同僚の暴力的排除に乗じて私利を追求したものであったと評価している。\n\nなお、アバネシ―自身の末路については二次文献の間で記述が分かれる。G. W. S. Barrow (1990) は、教唆者アバネシ―ではなく実行犯サー・ウォルター・ド・パーシチェイらが逃亡の末に捕らえられダグラス城で処刑されたと記す一方、M. Brown (2004), ch. 8 はアバネシ―自身が追跡され投獄されたと記しており、両者は一致しない。
    sources:
      - gesta_annalia_ch_82
      - chron_lanercost_1289_para_7
