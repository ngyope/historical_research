chapters:

  - id: margaret_or_norway_and_king_of_norway
    ja: ノルウェーの乙女マルグレーテとノルウェー王家 (1286年末～1287年初)
    date: 1287-01
    narrative_ja: スコットランド王妃ヨランドの懐妊がないとわかり、またロバート・ブルースの反乱が鎮圧されたことで、スコットランドの王位は1284年になされた誓約に基づき、ノルウェーの乙女ことマルグレーテ王女に継承される路線が濃厚となった。しかし、仮にスコットランドの「王国共同体」がノルウェーの乙女を王位継承者に選んだとしても、彼女はノルウェー王の宮廷で養われており、彼女をスコットランドの君主として戴くにあたっては父であるノルウェー王エイリーク2世との合意が必要であった。しかし、スコットランドに対するエイリーク2世の態度は必ずしも宥和的ではく、マルグレーテは引き続きノルウェー王の宮廷に留め置かれた。\n\nノルウェー側の非宥和的な態度の背景として、アレグザンダー3世の死後、亡き妻マーガレットとの結婚に際して1281年の条約で定められた年間700マークの支払いがスコットランド側から滞っていたことが一因であるという指摘がなされている。なお、1286年末から1287年初にかけての冬、ノルウェーの有力貴顕ビャルネ・エルリングソンがマルグレーテの王位継承問題のためにスコットランドを訪れたという記録も存在するが、その交渉結果は不明であり、以後1289年までノルウェー政府がこの問題に関して積極的に介入した痕跡は見られない。この空白からは、マルグレーテの王位継承問題が当時のノルウェー政府にとって決して優先度の高い事案ではなく、基本的には消極的な介入の姿勢を貫いていたことがうかがえる。\n\nこの時期のノルウェー政府にとって優先度の高い懸案事項は対デンマーク戦争を見据えた自国の安全保障とそのための財源確保であり、スコットランド問題への即時介入が求められたわけではなかったという指摘もなされている。
    desc_ja: 
    sources:
      - foedera_i_ii_732_2


  - id: attitude_of_edward_i_of_england
    ja: イングランド王エドワード1世の態度
    date: 1286-05
    narrative_ja: 1286年5月、イングランド王エドワード1世はウェストミンスター第二法等の法整備を終えてフランスへ渡航した。エドワード1世はフランス南西部のガスコーニュ公領を領有し、その資格においてフランス王の家臣に位置づけられていた。折しも1285年にフランス王フィリップ3世が死去し、フィリップ4世が跡を継いだことで、エドワード1世はガスコーニュ公領に関する臣従礼を求められていたのである。その履行と併せて、ガスコーニュの問題について協議することがこの渡航の目的のひとつであった。また、ほかにもこの時期のエドワード1世は十字軍遠征の実現を優先事項として掲げており、その前提としてヨーロッパ内の平和を確保する必要があった。1284年にアンジュー家のシャルル・ダンジューの息子シャルルがアラゴンの捕虜となって以降、アンジュー家とアラゴン王家の関係は悪化しており、その紛争調停も渡航の大きな目的となっていたのである。\n\n上記のような事情があったため、スコットランドの隣国、イングランド王エドワード1世のスコットランド情勢に対する態度も最初は消極的な静観にとどまっていた。1286年5月、セント・アンドルーズ司教らスコットランドの使節団がイングランドに到着したものの、具体的な外交成果は記録されていない。この時期はまだ王妃ヨランドの妊娠の可能性があり、王位継承が大きな政治的テーマとならなかったものと考えられる。これらを踏まえれば、イングランドにとって、アレグザンダー3世死後のスコットランド情勢の優先度は決して高くなく、エドワード1世が早期からスコットランドへの介入を企図していたという解釈は成立しづらいと言える。
    desc_ja: 1286年5月27日には教皇ホノリウス4世がエドワード一世の子供たちに対して第4親等までの近親婚を認める勅書を発行している。これをもってマルグレーテと王太子エドワード (後のエドワード2世) の婚姻を実現するためにエドワード1世が事前に根回しを行っていたとする見解もなくはないが、M. Prestwich 氏が指摘するように、これは娘エレノアとアラゴン王家の婚姻に関するものだったと解釈すべきであろう。M. Prestwich (1990).


  - id: administration_under_the_guardians_1287-90
    ja: 摂政団政府による行政運営 (1287年～1290年)
    date: 1287-01
    narrative_ja: 1287年から1290年にかけて、スコットランドの唯一の王位継承者であるノルウェー王女マルグレーテはノルウェーに留まり続け、スコットランドは王が不在の状態が続くことになった。摂政団は地代の徴収、俸禄の付与や経費の支払い命令、州長官による会計報告の監査、イングランドにおける故アレグザンダー3世の私有地の管理をめぐる交渉といった日々の行政や対外交渉を遂行し、彼らのもとで王国行政の機能が維持されていたことも史料からうかがえる。
    desc_ja:
