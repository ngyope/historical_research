chapters:

  - id: english_norwegian_negotiation_1290
    ja: イングランド使節団、ノルウェー王との面会に失敗する (1290年5月)
    date: 1290-05
    narrative_ja: イングランド王エドワード1世は王太子エドワードとノルウェーの乙女マルグレーテの婚姻交渉を通じて、スコットランドの支配に関しては着々と布石を打っていった。一方、計画の核心であるマルグレーテの移送に関してはイングランド側の外交的不手際が目立ったと言える。エドワード1世は1290年の5月、ヤーマスから豪華な食器や幼い王女が喜ぶだろう干しブドウやイチジク、砂糖菓子などを山と載せた船をノルウェーに派遣した。しかし、この使節団長に外交経験の乏しいウェルベック修道院長を任命するという失策を犯した。この使節団はノルウェー王エイリーク2世との面会に失敗し、マルグレーテを乗せることなく1290年6月に帰還してしまったのである。
    desc_ja:
    links:
      - departure_of_margaret_of_norway


  - id: departure_of_margaret_of_norway
    ja: ノルウェーの乙女マーガレットの出航 (1290年9月頃)
    date: 1290-09-01
    narrative_ja: 王女マルグレーテとイングランド王太子エドワードの婚姻交渉が進められる中、ノルウェー王エイリーク2世はデンマークとの戦争やハンザ同盟との通商問題に注力しており、積極的な外交政策を展開していた。王は1290年5月から夏にかけてデンマーク遠征に出ており、マルグレーテを送り届けるために派遣されたイングランド使節団が到着した際には不在だったのである。\n\n1290年の初秋、デンマークからベルゲンに帰還した際、これまでこの問題について受動的な態度を示していたエイリーク2世は積極的な行動に出る。彼は娘マルグレーテをイングランドの船に委ねることはせず、自らの主導権下で事を進めることを選択したのである。彼は娘を自国の船に乗せ、ベルゲンから出航させた。行き先はイングランドでもスコットランド本土でもなく、当時ノルウェー領であったオークニー諸島だった。
    desc_ja: この選択から、ノルウェー王が最終的な婚姻交渉を自国領土内で行う意図を持っていたと推測する研究者もいる。
    links:
      - death_of_margaret_of_norway


  - id: death_of_margaret_of_norway
    ja: ノルウェーの乙女マルグレーテの死 (1290年9月下旬～10月上旬)
    date: 1290-10-07
    narrative_ja: 未来のスコットランド女王マルグレーテの航海は、悲劇的な結末を迎えた。過酷な北海の荒波に揉まれ、彼女は船上で病に倒れたのである。1290年9月下旬から10月上旬にかけて、彼女はオークニー諸島のカークウォールにて、随行したベルゲン司教が見守る中で息を引き取った。彼女が「女王」として君臨するはずだったスコットランド本土を見ることはついに一度もなかった。この訃報は10月7日頃には、パースに集まっていたスコットランド貴顕たちのもとに届いた。彼女の死により、ソールズベリー条約、バーガム条約、そしてノーサンプトン合意といった一連の外交努力のすべてが水泡に帰したのである。アレグザンダー3世の血を引く王位継承者が完全に途絶えてしまった今、スコットランドは再び、そしてかつてよりも先の見えない王位継承の難題に引きずり込まれることになった。
    desc_ja:
    links:
      - outbreak_of_royal_succession_problem
      - letter_of_bishop_of_st_andrews_1290_10_07


  - id: letter_of_bishop_of_st_andrews_1290_10_07
    ja: セント・アンドルーズ司教、エドワード1世に援助を求める
    date: 1290-10-07
    narrative_ja: セント・アンドルーズ司教は1290年10月7日付の書簡において、イングランド王エドワード1世に対してもしノルウェーの乙女マルグレーテがこの世を去ってしまったという事態が生じているならば、スコットランドの民を慰め、流血を避けるために国境地帯に来てほしいと懇願した。さらに、その場合ジョン・ベイリオルがエドワード1世のもとへ向かうかもしれないと示唆し、エドワードの「名誉と利益が守られるよう」にベイリオルを扱ってほしいと助言した。司教は内乱を回避し、スコットランドの「王国の忠実な人々」が正当な王を選ぶことができるよう、エドワード1世に「平和の仲介者」として介入を求めたのである。
    desc_ja:
    links: []


  - id: outbreak_of_royal_succession_problem
    ja: ロバート・ブルース、軍隊を率いてパースに現れる (1290年10月上旬)
    date: 1290-10-08
    narrative_ja: ノルウェーの乙女マルグレーテの死の噂は、即座にスコットランド王国を混乱に陥れた。1290年の10月上旬、パースに集まっていたスコットランドの貴顕たちの間で突如として緊張が高まる。いまだマルグレーテの死の真偽が確認されていない中、もともとこの集会の場に来る予定のなかったロバート・ブルースが自身の王位継承権を主張するために、マー伯やアソル伯といった強力な同盟者と共に軍勢を率いてパースに現れたのである。セント・アンドルーズ司教が1290年10月7日にエドワード1世に当てた書簡からは、この行動は内戦につながる恐れがあるほどの武力示威であった様子がうかがえる。
    desc_ja:
    links:
      - mission_to_edward_i_early_1291
