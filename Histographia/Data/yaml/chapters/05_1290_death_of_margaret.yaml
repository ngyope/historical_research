  - id: appeal_of_seven_earls
    ja: 七伯の訴え
    date: 1290-11
    narrative_ja: ノルウェーの乙女マルグレーテの死が確認されると、スコットランドでは空席となった王座をめぐって貴顕たちが各々の利害や思惑に基づいた行動をとるようになる。この時期、スコットランドの各派閥はエドワード1世を味方につけようと競い合い、エドワード1世は宗主権確立の準備を進めていった。王位継承権を主張したロバート・ブルースの行動は、ベイリオル＝カミン派が主流を占める摂政団政府による、ベイリオルによる王位継承の「既成事実化」を防ぐための様々な政治工作によって特徴づけられる。まず、ブルース派は「七伯の訴え」と呼ばれる文書を作成した。この文書は、摂政団のメンバーであったセント・アンドルーズ司教とジョン・カミンががベイリオルを王にしようとしていると非難し、古来の慣習に基づき「七人の伯」と「共同体」が王を選出する権利があると主張し、エドワード一世の保護を求めて上訴したものである。この文書は大きく三つのセクションに分かれており、それぞれのセクションの主張は以下のとおりである。一、アレクサンダー三世の死後、王位が空位である中スコットランドの「七伯」には古来より新王を選出し即位させる権利がある。摂政団のメンバーであるセント・アンドルーズ司教とジョン・カミンがジョン・ベイリオルを王にしようとしている動きを阻止するため、イングランド王エドワード一世に上訴し、保護を求めた。二、摂政たちが権限なく任命した副官たちが、マリ地方で略奪、破壊、殺戮を行ったことに対する告発。七伯の一人であるマー伯ドナルドの名において、イングランド王に救済を求めた。三、ロバート・ブルースが自らを正統な王位継承者と主張。摂政たちが彼を無視してジョン・ベイリオルを王にしようとしていることは、ブルースの権利および「七伯」の選出権の侵害であるとし、イングランド王の判断が下るまで王の選出を停止するよう求めた。
    desc_ja: この「七伯の訴え」は中立的な憲法文書では決してない。これは七伯の選出権なる「古来の権利」というレトリックを用いつつ、実際にはロバート・ブルースの王位獲得を目指す陣営によって作成された高度に政治的で党派的な文書である。そもそも、この七伯の選出権という概念自体が虚構、ないしは「神話」であると解釈されている。ダンカン氏はこの「七」という数字が、一二五七年以降の神聖ローマ帝国における「選帝侯」の制度（七人）から借用された概念である可能性を推測している。一方、ジェフリ・バロウ氏はこれを古代のピクト人時代に起源を持つとされる「七つの地方」や「七人のモルマー」という伝承が十三世紀の好古家たちによって再構成された「神話」であるとする。どちらの可能性も考えられるものの、いずれにしろ、両者ともこの文書の目的が憲法上の権利を主張することではなく、ベイリオルとカミンによる王位獲得の既成事実化を阻止し、エドワード一世の介入を正当化することにあったと論じている点では共通している。ブルース派はライバルであるベイリオルの即位を阻止するために、積極的にエドワード一世の保護とその介入を求めたのである。
    links: 
      - anonimous_letter_1290
    comment: 日付要確認


  - id: anonimous_letter_1290
    ja: 差出人不明の書簡
    date: 1290-11
    narrative_ja: さらに、おそらくこの時期に作成された一通の文書がある。この文書は冒頭の挨拶文が省略されてしまっており、誰が誰に当てて作成されたのかが不明確になってしまっているが、その内容から王位継承権を主張する人物によって作成されたものとみられる。この文書の作成者は、十二世紀前半のデイヴィッド一世の治世中に行われたとされる協定（スコットランド王がイングランド王に敵対することがあれば、スコットランドの七人の伯が誓約によってイングランド王に服従する義務がある）について触れており、さらにリチャード一世がスコットランドに売却した独立権は無効であると主張し、自らの王位請求の正当性とイングランドへの忠誠を訴えている。特に、以下の文言からはこの王位請求者がイングランド王の後ろ盾を強く求めていたことがうかがえる。\n\n王［＝イングランド王エドワード一世］が正当にその要求を行おうと望む時はいつでも、私は彼に従います。そして私自身、私のすべての友人、そして私の一族郎党、私の友人がなし得る限りの力をもって彼を援助します。\n\n象徴的な「七人の伯」の逸話と、この文書が百年以上も前の古の協定について触れていることから、おそらくこの文書の作成者は当時高齢であり、かつ「七伯の訴え」を作成したロバート・ブルースではないかと考えられている。もしそうであるとするならば、この文書はブルースが自身の王位請求権を確固たるものにするにあたり、イングランド王の権威を頼りにしていたことを示すだろう。しかし、この文書は同時に、エドワード一世に対してスコットランド国内に強力な協力者がいることを確信させ、宗主権主張への道を開かせる端緒ともなったのである。
    links: []
    comment: 日付要確認


  - id: balliol_letter_1290_11_15
    ja: ジョン・ベイリオルのダラム司教宛て書簡 (1290年11月15日)
    date: 1290-11-15
    narrative_ja: 一方、もう一人の有力な王位継承者であったジョン・ベイリオルの派閥の動きはライバルであったブルース派が武力示威やプロパガンダを用いて現状打破を試みたのに対し、摂政団による「既存の統治機構の掌握」と「イングランドとの外交的・個人的コネクション」を活用し、法的正当性を固めることで王位への道を切り開こうとする戦略によって特徴づけられる。ブルース派が「七伯の訴え」で摂政団の正当性を攻撃している間、ジョン・ベイリオル本人はイングランドにおいて、自身を次期国王として位置づける既成事実作りを進めた。まず、ベイリオルは妹のエレノアが摂政団の一因であったジョン・カミンに嫁いでおり、カミン家との婚姻関係を通じて摂政団と強いつながりを有していた。さらに、一二九〇年十一月十六日、ベイリオルは自身を「スコットランド王国の世嗣」と称する文書を発給し、ダラム司教アンソニー・ベックに対してノーサンバランド州にあるタインデールのワークの荘園、ペンリスの荘園、ならびにアレグザンダー三世がカンバーランド州に保持していたその他すべての所領を譲渡した。これはまだ法的な裁定が下る前でありながら、自身こそが正統な継承者であるという強い自負と政治的宣言を示すものと言える。ダラム司教領はベイリオル家の居城がある地域で、ベイリオル家は先代からダラム司教と個人的なコネクションを有しており、同様にイングランド王の家臣でもあった。ベイリオルはイングランド王家との長年の奉仕関係と、王の側近であるダラム司教との個人的なコネクションを利用し、エドワード一世の支持を取り付けようとした形である。このことは、彼が後世語られるような受動的な傀儡などでは決してなく、自身の権利を確保するために能動的に動いていたことを示すと言えるだろう。
    links: []
