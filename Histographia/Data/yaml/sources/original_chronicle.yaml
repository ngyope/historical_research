  - id: original_chronicle_ch_144
    title_ja: 『スコットランド原初年代記』第144章
    ja: **エドワード王が聖金曜日に、いかにしてベリックの町でスコットランド人を殺戮したか**\n\n1296年のこと、ジョン・ベイリオルは直ちに、貧者も富者も、王国の諸身分もすべて招集した。当時ファイフには、伯もバロンも、また長もいなかったため、最大の危機が迫っていたその地の自由保有民の中から、その知恵と武勇ゆえに選ばれた者たちがいた。そして命令一下、ファイフのジェントリたちはベリックへと向かった。\n\nそこで彼らは、イングランドの五港からの大船団を見つけた。それらは食糧と兵員で満載され、町を激しく攻撃していた。300かそれ以上のファイフの槍兵は、敵との戦闘において彼らを圧倒し、多くを溺れさせ、残りを海へと追いやった。彼らはイングランドの自港へと必死に逃げ帰った。彼らは18隻の大船を捕獲した。その乗員は一人として生かしておかなかった。というのも、彼らはすぐに大軍によって包囲される戦時となると信じており、その間に捕虜を確保しておくことは大きな危険だと考えたからである。それゆえ、降伏していない者を乱戦の中で殺すほうが、そのような群れを捕らえておき、交渉や激しい戦闘を待つよりも、より名誉あることだと考えたのである。その配慮と決断により、危険と災厄を避けるため、敵兵を皆殺しにし、その物資を町に運び込んだ。そして船はすべて、燃え盛る石炭の火で焼き払った。\n\nそして、イングランド王エドワードがこの出来事の確かな知らせを聞いたとき、彼は激怒し、怒り狂って身を震わせた。急いで全軍を招集し、大いなる威嚇とともにベリックへとやって来た。そしてすぐに町に包囲網を敷き、激しく容赦のない攻撃を加えた。内部の者たちは彼に対して抵抗し、大いに防戦した。\n\nそして彼は、自分が思ったほど容易には町を攻略できないと悟ると、ある意図を抱き、偽りの見せかけによって戦争をすべて止めるかのように振る舞った。彼は全軍を撤退させ、近くの森や隠れ場所にひそかに伏兵として配置し、3日かそれ以上の間やり過ごした。そうして待機している間に、彼はスコットランドの紋章を偽造させ、あたかも領主たちがそれを掲げているかのように見せかけた。そして、名高いスコットランドの諸侯たちの旗や槍旗を描かせたのである。町の中にいた者たちは、この光景を見て喜んだ。彼らに対して仕組まれたこの欺瞞について、何も知らず、何も聞いていなかったからである。彼らは味方が来たと信じ、好きなように入城させようと、すべての城門を開け放った。それは早朝、日の出前、夜明け前のことであった。開かれた門へ、イングランド人たちが猛烈な勢いで殺到し、スコットランド人たちが相手の正体に気づくよりも早く、彼らを包囲してしまった。\n\nそこでイングランド人は、町にいたスコットランド人をことごとく殺戮した。いかなる身分の者も容赦しなかった。その時町の中で見つかった者は、聖職者であれ俗人であれ、誰一人として助命されなかった。いかなる階級も、年齢も関係なかった。男も小姓も、老いも若きも、乙女も人妻も容赦されず、すべて命を奪われたのである。こうして彼らは一日中、休むことなく殺し続けたが、ついにエドワード王はある女性が殺され、その死んだ母の横で、脇腹から赤子が転がり落ちて手足をばたつかせているのを目にした。「ラセ！ラセ！」と、その時彼は叫んだ。それは「やめよ！やめよ！」という意味の言葉である。\n\nこの虐殺についてさらに語るならば、私の聞き及ぶところでは、当時ダラムの司教であり、残酷な男として悪名の高かったアンソニー・ベックが、真っ先にベリックへ突入した。そして彼は町中を進みながら、憎悪を込めて手をかざして祝福の仕草をし、スコットランド人を片っ端から殺し、打ち倒せ、誰も生かしておくなと命じたのである。彼は聖職者とも、市長とも呼ばれうる立場だったが、悪を行う用意があまりに周到であったため、「悪魔の司教」であった。それゆえ、彼が流させた血の数だけ、彼はその報いを受けている。王国を守るために死んだ者たちは、天上の至福にあるのだから。\n\nそこでは7500もの遺体が数えられた。これは聖金曜日に行われたことである。イングランド軍は神のためにも、祈りのためにも、誰一人として容赦しなかった。その2日後、町中を彼らの血が深い奔流となって流れた。こうして、あのイングランドの王、いや王ではなく、呪われた暴君は、その日に「勤行」を行ったのである。彼はそこで多くの善良な人々、神の恩寵に満ち、潔白で、告解を済ませ、善き意図を持ち、秘跡を受ける準備ができていた者たちに、死の受難を耐え忍ばせたのである。その聖金曜日における彼の務めとは、罪なき人々が死ぬのを聞き、「ああ、ああ！主よ、今日死んだ彼の者のために慈悲を乞い願います」と唱えることであるはずだった。しかし彼はその日、他の礼拝など聞こうともせず、ただ無慈悲に殺戮を行わせた。彼がそこで殺させた者たちの魂を、彼は自分自身の魂が決して行くことのない場所、すなわち至福の場所へと送り出したのである。彼の最期がいかなるものであったかは、ロバート王の書を見ればわかる通りである。\n\nその同じ年、スコットランドに居住していたすべてのイングランド人は、助祭であれ教区司祭であれ、剥奪の宣告によって王国全土から追放された。各司教はその教区において彼らから聖職禄を取り上げ、代わりにスコットランド人を登用した。あらゆる身分、年齢の者たち、老いも若きも、男も小姓も、評議会の決定により、完全にスコットランドから追放されたのである。\n\nまたその同じ年、ダンバーにおいて多くの者が戦いで命を落とした。勇敢で男らしく、大胆で力強い高貴な騎士であったパトリック・グレイムをはじめ、多くのジェントルマンたちがそこで殺され、傷ついた。名声高き著名な領主ロス伯ウィリアム卿、そして60名の騎士と10名、多くの従騎士や男らしい者たち、その他多くの立派な人々、高名な領主やバロンたちは、その戦場から城へと逃げ込んだ。そこで救助が得られると期待したからである。しかし、当時その城の守将であったリチャード・シワードは、彼らを大いに喜んで迎え入れたかと思うと、その後、彼らをしっかりと縛り上げた。そして羊のように縛られた彼らを、彼はイングランドの「長脛王」エドワードのもとへ差し出し、王は彼に大いに感謝した。\n\nこの時、スコットランドには大きな不和と分裂があった。王国は2つに割れ、互いに争っていたからである。カミンの一族はベイリオル側に付き、ロバート・ブルースには一1人の司教と2人の伯が味方した。グラスゴー、アソル、マーがそれである。これら3人は固い絆でロバート・ブルースと結ばれており、中でもグラスゴー司教ロバートは徳の高い領主であった。それゆえ、カミンや他の領主たちは彼らに強い嫉妬を抱き、双方が互いの敵となっていた。こうして王国は二分され、この分裂によって罪なき人々が大きな苦痛と責め苦を受けたのである。\n\nそして、お聞き及ぶ通り、スコットランド人がダンバーで打ち負かされた後、「長脛王」エドワードのもとへロバート・ブルースが密かにやって来て、彼に懇願した。「あなたが約束したことを果たしていただきたい」と。それは、当時王位が空席となっていたスコットランド王国のことであった。フランス語で、このエドワードはロバート・ブルースにこのように答えた。「Ne avons-nous autres choses a faire que a vous reaume gaigner?」 この言葉を英語で言えば、彼はフランス語で誓ってこう言ったのである。「我々には、お前のために王国を勝ち取ってやる以外に、やるべきことがないとでも思うのか？」ロバート・ブルースは、その邪悪な男の不実さをはっきりと悟った。そして自分の領地へと向かうため、すぐにイングランドへの路についた。彼はスコットランドには留まらず、イングランドにある自らの領地へと馬を進めたのである。
    ref: A. Wyntoun, *Original Chronicle*, ch. 144.

