  - id: aps_i_424
    title_ja: 1284年の限定相続（APS版）
    ja: キリストのすべての信徒にして、この現在の書状が届くであろう人々へ。 バカン伯かつスコットランド軍務長官および地方統監アレグザンダー・カミン、ダンバー伯パトリック、ストラサーン伯マリーズ、レノックス伯マルコム、キャリック伯ロバート・ブルース、マー伯ドナルド、アンガス伯ギルバート、メンテイス伯ウォルター、ロス伯ウィリアム、サザーランド伯ウィリアム、オークニー伯マグヌス、ファイフ伯ダンカン、アソル伯ジョン、ロバート・ブルース父、スコットランド家令ジェームズ、ジョン・ベイリオル、ジョン・カミン、当時のロージアン地方統監ウィリアム・ソウルズ、イングラム・ギンズ、ウォルター・マリの息子ウィリアム・マリら騎士たち、アレグザンダー・ベイリオル、レジナルド・チェイン父、ウィリアム・シンクレア、リチャード・シワード、ウィリアム・ブレチン、ニコラス・ヘイ、ヘンリ・グレイム、イングラム・ベイリオル、伯の息子アラン、レジナルド・チェイン子、J...・リンゼイ、パトリック・グレイム、...・マクスウェル、サイモン・フレイザー、アレグザンダー・オブ・アーガイル、ドナルドの息子アンガス、ロドリックの息子アラン、これらスコットランド王国のバロンたちより、主にあって挨拶を送る。知っておくべきこととして、いと高き方の御心により、我らが国王陛下の長男であられたアレグザンダー殿下が、同王の御身から直接の正当な後継者を残すことなく、万人が辿る肉の道へ入られたため、我らはこの書状により、我ら自身および我らの相続人を、前述の我らが国王陛下、および同王の御身から直接または間接に下り、権利として同王の継承に認められるべき相続人たちに対し、極めて固く義務付けるものである。我らが彼らに負うべき信義と忠誠のもと、もし我らが国王陛下が、御自身の御身、あるいは御子アレグザンダーの御身から生じた正当な息子や娘が存在しないまま、この世の最後の日を終えられることがあったならば、我ら全員および我らの一人ひとりは、著名なるノルウェー王エイリーク殿下と、我らが国王陛下の娘にして良き記憶に残る故ノルウェー王妃マーガレットとの間に生まれた高名なる少女マルグレーテ、および彼女から下る正当な子孫を、我らの君主として、そしてスコットランド全王国、マン島、およびスコットランド王国に属するその他すべての島々、さらにはタインデイルおよびペンリス、加えて我らがスコットランド国王陛下に属する、あるいは属すべきその他すべての権利と特権における正当な相続人として受け入れることを、ここに固くかつ忠実に約束する。 また、生きうる限り、あるいは...できる限りのすべての者に対し、我らは全力を尽くしてこれらを維持し、支持し、防衛する。さらに、我らが国王陛下とその子孫に負う信義と忠誠にかけて、忠実に約束する。 同国王陛下ならびにその遺言執行者、そのうちの2名、あるいはそのうちの1名に対しても、我らと我らの相続人は極めて厳格に義務を負い、我らの一人ひとりも個別に前述の通り義務を負う。 すなわち、同国王陛下が崩御し、いかなる代官や債務者たる者が反逆し、国王陛下に支払うべきものを期限内に支払おうとしない場合、同王の遺言に関与する執行者たちが、その生涯に定められた遺志を遂行し果たすため、我ら、我らの相続人、およびその一人ひとりは、それら反逆する代官や債務者に対し、我らの権力を以て... 遺言執行者またはそのいずれかと共に、同国王陛下のすべての債務が遺言執行者に対して完全に弁済され、反逆に対する十分な賠償が提供されるまで、彼らを差し押さえるものとする。我ら自身および我らの相続人、また我らの一人ひとりとその相続人を、セント・アンドリュース、グラスゴー、ダンケルド、アバディーン、マリ、ブレチン、ギャロウェイ、ダンブレーン、ケイスネス、アーガイルの各司教たる尊き父たち、およびその時々に在任する...の管轄権と強制力に服させる。 これにより、前述のすべての司教、またはそのうちの数名、あるいは1名が、教会法に基づく制裁によって、我らと我らの相続人、我らの一人ひとりとその相続人を強制し、前述のすべての事項を遵守し、固く守り、実行させることができるものとする。この証として、我らのうちの多くがこの書状に自らの印章を据えさせた。 恩寵の年1283年、我らが国王陛下の治世第35年、2月5日、スクーンにて発布された。
    ref: *APS*, i, p. 424.
