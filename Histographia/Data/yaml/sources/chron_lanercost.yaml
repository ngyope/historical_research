sources:

  - id: chron_lanercost_1289_para_7
    title_ja: 『ラナーコスト年代記』1289年の項第7段落
    ja: 続いて、聖母誕生の祝日［1289年9月8日］の間の土曜日［9月10日］、ファイフ伯ダンカンが残酷に殺害された。彼は当時、スコットランドの首席守護であったが、若年でありながら、我々が一般に見る誰よりも残酷かつ強欲であり、自らの貪欲を満たせるならば、いかなる不正義をも控えることがなかった。彼に対して多くの呪いが積み重なり、彼の行いによって引き起こされた憎悪が彼にふさわしい報いを準備していた時、王の街道にて議会へ急ぐ道中、あろうことか自らの家臣および血縁者によって、馬上で殺害された。彼はクーパーの修道院に埋葬された。彼は殺害される少し前に、グロスター伯の娘、ジョーン夫人を妻に迎えていた。彼女は夫の死の時点で妊娠しており、後に息子を産んだ。その子は現在も生存しており、父の名と世襲の権利を継いでいる。
    ref: *Chron Lanercost*, s.a. 1289 para 7.


  - id: chron_lanercost_1293_ex1
    title_ja: 『ラナーコスト年代記』1293年の項の抜粋
    ja: ［前略］諸聖人の祝日［11月1日］、神に愛された司教、ギャロウェイのヘンリが現世を去った。彼の後任にはトマス・ドルトン師が就き、いと高き乙女の被昇天の祝日［8月15日］にリポンにて叙階された。\n\nまた、聖マルティヌスの祝日の後の主日［11月15日］、キャリック伯ロバートの娘がノルウェー王マグヌス［※エイリーク2世の誤り］と結婚した。［後略］
    ref: *Chron Lanercost*, s.a. 1293.


  - id: chron_lanercost_1295_ex1
    title_ja: 『ラナーコスト年代記』1295年の項の抜粋
    ja: イングランドとスコットランドの双方においてバロンであり、アナンデール領主であったロバート・ブルース卿は、老齢に達し天寿を全うしてこの世を去った。彼は優雅な容姿と雄弁さを持ち、多くの従者を抱えることで名高かったが、さらに偉大なことに、神と聖職者に対して極めて敬虔であった。主の晩餐の日［5月12日］、宮廷の人々のなかでも訪れるすべての人々に最も名誉ある食事と晩餐を供することを常とし、心を配っていた彼が息を引き取ったのである。彼の家の外に旅人がとどまることはなく、その扉は常に旅人に開かれていた。彼はイングランドのギスバラで祖先たちとともに眠っているが、その魂を天使たちに委ねたのは彼の故国の主要な村落であるアナンにおいてであった。この村はある義人の呪いによって次のような経緯で自治都市の栄誉を失ったのである。少し昔のこと、アイルランドにシトー会の司教にして修道士であったマラキという名の聖人がいた。彼は修道会の総会が近づいたとき、霊的な導きに促され、自身を委ねるべくその地へ急ぎ赴き、そこで没して安眠し、奇跡によって名を馳せている。彼の死に際して、そこに立ち会った聖ベルナルドは極めて哀切な説教をその葬儀において涙ながらに行い、私もそれを度々目にした。さて、この神に愛された司教はアイルランドの北部から海を渡り、ギャロウェイを経て2人の同僚聖職者とともに徒歩でアナンにやってきた際、誰が自分を喜んで客として迎えてくれるかを住民に尋ねた。その時そこに居合わせたこの地の領主である高貴な人物が、この親切なもてなしを喜んで提供したいと考えていると他の者たちが告げたため、彼は謙虚に食事を求め、それは気前よく承諾された。そして、従者たちが旅を続ける予定の彼に対し、領主の食事の時間を待つか、それとも先に食事を済ませたいかを尋ねると、彼は先に済ませる許可を求めた。こうして広間の北側に彼のための食卓が整えられ、彼が仲間たちとともに食事をとるために席に着いていたとき、従者たちが、すでに判決を待っている捕らえられたある盗賊の死刑について話しているところに、バロンが広間に入ってきて、食事中の客たちを歓迎した。そこで、この無垢な司教は、権力者の寛大さを深く信じてこう言った。「旅人として、貴方様の高貴なる恩寵にお願い申し上げます。これまで流血の裁きが私のいる場所を汚したことはありません。もし彼が罪を犯していたとしても、この者の命を私にお預けください」。高貴な主人は頷いたが、それは礼儀からではなく欺瞞からであった。そして、神の御前では愚かさであるこの世の知恵に従って、密かにその悪党を死刑に処すよう命じた。盗賊が吊るされ、司教の食事が終わると、バロンは自身の食事のために広間に入ってきた。司教は神と主人に感謝を捧げた後、「私はこの広間に、この食卓に、そして今後ここで食事をするすべての者に、神の祝福を授けます」と述べた。しかし、司教が村を通り過ぎたとき、道のそばの十字架 (絞首台) に吊るされている盗賊を見た。その時、彼は心の中で深く嘆き、重い宣告を下した。まずその地の領主とその子孫に、次にその都市に対してである。そして事の顛末がそれを証明した。なぜなら、その後まもなくその富豪は悲惨な死を遂げ、3代にわたる相続人たちは皆、人生の絶頂期に命を落としたからである。ある者は領主となって5年に満たないうちに、またある者は3年以内に命を奪われた。これを知った前述のロバートは青年時代に直ちに直接聖人のもとへ赴き、許しを請うて身を委ね、その後は3年ごとに聖人を訪問した。また、彼がエドワード陛下とともに赴いた聖地巡礼から晩年に帰還した際にも、クレルヴォーに立ち寄り、そこで永遠に聖人との契約を固めた。彼は永久的な収入源を提供し、その収益から聖人の墓の上に3つの銀の鉢と灯りが維持されるようにした。かくして、このような敬虔な行いにより、彼ただ1人が良き老年を迎えて埋葬されたのである。\n\n［中略］\n\n同年、スコットランド人たちは自らのために12人の貴族を選出し、王国は彼らの助言によって統治されるべきであるとした。\n\n六人の王の時代に法の遵守は滅び、無法者たちの横行により、群れの略奪があろう。\n\nスコットランド人たちは彼らの主君であるイングランド王エドワードに対抗し、狡猾にも使節たち、すなわちセント・アンドルーズ司教ウィリアムとダンケルド司教マシュー、そして騎士ジョン・ド・ソールズとイングラム・アンフラヴィルをフランス王のもとへ派遣した。これは、イングランド王とその王国に対抗すべく、フランス王およびその王国と交渉するためであり、先述の使節たちは委任状を携行して戦争を引き起こそうと企てていたのである。その噂がイングランド国王陛下の耳に入ると、陛下は当然のことながら激怒し、幾度もスコットランド王のもとへ使者を送った。そして、スコットランド王国ならびにイングランド王国内でスコットランド王が保持しているその他の領地のために、法的に義務付けられている通りに自身の議会に出頭するよう命じた。しかしスコットランド王は出頭を完全に拒否し、さらに悪いことには、イングランド王に抵抗すべく大軍を招集した。そして、復活祭の週の月曜日 (1296年3月26日)、ジョン・カミン・オブ・バカン卿がスコットランド軍を率いてイングランドに侵攻し、家屋への放火、人々の殺戮、家畜の略奪を働いた。続く2日間にわたり、彼らはカーライル市を猛烈に攻撃したが目的を果たせず、3日目に撤退した。これを聞いたイングランド王はスコットランド人に対する報復としてベリックに向けて軍旗を進めた。復活祭の週、すなわち4月カレンダエの3日前 (1296年3月30日)、同町およびその城は王によって同日中に陥落し、そこで約7000人の者たちが剣に倒れた。\n\n聖ペテロと聖パウロの祝日の8日後［7月6日］、スコットランド王国の貴顕、高位聖職者、その他の貴族たちが集まり、スターリングで荘厳な議会が開かれた。そこで、彼らの王が自ら何かを行うことができないように、フランス人の慣習に倣って12人の貴族を置くことが共通の評議によって定められ、その場で彼らを選出し、任命した。彼らはそこで、イングランドへ逃亡していたロバート・ブルース (子) を彼らに臣従礼を行うことを望まなかったという理由で父祖伝来の世襲財産から追放した。またその息子も、父に与したという理由で彼に与えられていたキャリック伯領から追放した。彼らはスコットランド王の舅であるウォレン伯をイングランド王の他の使者たちと共に返答もなしに侮辱的に追い返し、王自身の縁者であるほどの人物を城に入れることさえ許さなかった。彼らはまた、そこで断固として反乱を起こし、エドワード王になされた臣従礼を破棄することを協議し、フランス王と同盟を結び、フランスが海軍で自分たちが陸軍で同時にイングランドを疲弊させ、そして彼らが信じるところでは打ち負かすことを相談した。［後略］
    ref: *Chron Lanercost*, s.a. 1295.
    

  - id: chron_lanercost_1296_ex1
    title_ja: 『ラナーコスト年代記』1296年の項の抜粋
    ja: さて、我々はこの著作の第9部に精神と筆の両方を向けることとする。退屈を払いのけるため、また新たな世紀の始まりにあたるため、新しい巻を編纂することが求められているからだ。そこで我々はまず何よりも、最も聖なるグレゴリウスの極めて健全な教えに注目する。「悪人の権力は」と彼は言う、「野の花に例えられる。彼らの肉的な栄光は輝いている間に散り、自らの内で誇り高ぶる間に、突然の終焉によって断ち切られ終わるからである」。主の年1296年 (この年は間違いなく閏年であった) に、このことがアルバ人［＝スコットランド人］に起こったことは、彼らの明白な傲慢さが証明している。というのも、過去のあらゆる時代において、彼らはイングランドの王権に従属していたのに、そしてしばしばこれに背き、イングランド人から委ねられた君主を拒絶し、これまでの年代記が伝えるように、幾度となく王の評議会や役職からだけでなく、サクソン人［＝イングランド人］との交わりそのものから彼らを排除してきた。今やかつての深い憎悪に立ち返り、彼らの王であるジョンが連れてきたすべての廷臣を追放した上、さらに新たな犯罪を加えたのである。民の長である王に有効な決定を一切下させず、意のままに動くことも許さず、昼夜を問わず監視をつけ、まるで逃亡者のように彼を拘束したのだ。その結果、エドワード王の会議に召喚されても出席することは許されず、エドワードに対して自らの意向を示すこともできなかった。また、前述のように同盟国や武力に虚しく頼り、彼らは王とその子を国内に留め置き、自らは戦場に赴くことを決定した。そのため、至る所から穀物や家畜、その他の食糧を略奪して自らの城塞に備蓄し、王国の主要な港であり都市であるベリックを要塞化し、異邦の援軍を引き入れた。彼らは自らに差し迫る神の怒りに気づいておらず、それによって彼らは生贄の羊の群れのように集められ、過ぎ越しの祭の日に屠られるために聖別されたのである。最後に、最後にして亡くなった彼らの君主の悲劇から、彼らは神を畏れるように教えられるべきであった。神はすべての者に代わって彼を恐ろしく打ち倒し、その後、この民に10年間の悔い改めの猶予を与えられたのだ。それにもかかわらず、彼らはそれを悪用して傲慢になり、日々ますます罪を重ねていった。そのため、賢者が「専制を行う者には破滅が訪れるのが必然であった」と述べていること以外に、何の救済策も残されていなかった。これらが起きたしるしを、これらの事績を書き記した罪人である私は、主の啓示によって受け取った。というのも、来るべき災難の少し前、日曜日の礼拝を終えて休息をとろうと横になり、まぶたを閉じて眠りを求めていたときのことである。全身が真っ白で翼を持った1人の男を見た。私はすぐにそれが天使であると悟ったが、彼は右手に抜き身の剣を持っていた。彼は修道院の建物の端から端へと進み、修道士たちの本が収められている書棚のところで、その脅威の剣を振りかざした。これは、私がその後自らの目で目撃することになる、修道士たちの書物や衣服、生活用品の素早い、というよりむしろ邪悪な略奪を、このしるしによって示していたのである。実際、正しい者の生活は、罪人の罰の巻き添えになってすり減らされることがよくある。そしてそれが罪人たちを苦しめる一方で、正しい者たちを浄化するのである。\n\nしかしながら、我々が着手した歴史の道筋を詳しく探求する前に、同年の閏日、すなわち使徒聖マティアの祝日［1296年2月25日］に、使徒座の公正なる人である教皇ボニファティウス8世は、その着座から第2年に、「事の永遠の記憶のために」等と題する教令書簡を発布した。これは、教会の財産の強奪に常に向けられている君主たちの飽くことのない貪欲な欲望を抑制するものであり、これに反する行動をとる俗人には重い破門と聖務停止を科すものであった。さらに、使徒座の同意なしに、教会の収益から君主に何らかの贈与、援助金、借入金、あるいは何らかの課税された割り当てを与えることを敢えてする者は誰であれ、身分を問わずすべての聖職者を免職と聖職禄剥奪の対象としたのである。しかし彼はまた、同年4月カレンダエの4日前［1296年3月29日］に、魂にとって極めて有益な別の勅令「事の永遠の記憶のために」を発布した。これは、魂の世話を担うすべての聖職者に対し、無差別かつ普遍的に、自らの職務と場所において司牧的な定住を実践することを命じるものであり、まる1か月の間、自らに割り当てられた教会から離れていることが判明した者は誰であれ、違反者には聖職禄剥奪の罰を加えるというものであった。\n\nしたがって、神によって発せられた聖書が「極めて邪悪な企てを行う者にはそれが自らに降りかかり、それがどこから来るのか彼には分からないであろう」と述べているように、多くの所領の所有者である高名なロバート・ロスは、それが自らの成功につながると考え、忠誠に背いてイングランド王の敵対者たちのもとへ赴き、王の秘密を彼らに暴露し、援助を約束した。これが発覚すると、王は主の復活の喜び［復活祭］を彼のワークの城で厳粛に祝い［1296年3月25日］、そしてベリックの指揮官たちに降伏を促した。王は彼らに対し、彼らが自らの安全を考慮し、提供された恩寵を軽んじない限りにおいて、身体の安全、財産の保全、法と特権の改善、そしてこれまでの危害の免除を約束した。しかし彼らは逆に、罪によって心を暗くし、侮蔑を募らせた。王が3日間待機したにもかかわらず、その寛大な約束に対して何の返答もしなかった。それどころか、第4日目［1296年3月29日］に到着し、自ら友好的に語りかけた王に対して、彼らは二重の侮辱を加えたのである。高い場所に立っていた者たちは、自らの尻を露出して王とその軍勢を罵倒した。また他の者たちは、王の命令を待って港に停泊していた艦隊に獰猛に突撃し、水夫の一部を殺戮した。彼らの女たちでさえ、火と藁を持ち出し、船に火を放とうと企てた。このようにして邪悪な者たちの強情さが明らかになり、軍隊が動員されると、裏切り者たちの傲慢さは武力をほとんど用いることなく鎮圧された。都市は敵によって占領され、極めて多くの財宝が略奪された。そして1日半の間に、男女を問わず、ある者は剣によって、ある者は火によって、15000人以上が殺戮され、幼い子供に至るまでの残りの者たちは永久の追放によって排除された。しかしながら、この極めて寛大な君主は、生きている者たちに提示した人間性を、死者に対しても示した。なぜなら、倒れた者たちの遺体を埋葬するために任命された膨大な人数の男たちを私自身が目撃したからである。彼らは皆、たとえ第11時［夕暮れ時］に働き始めたとしても、報酬として王の金庫から1人につき1ペニーを受け取ることになっていた。これらの出来事は4月のカレンダエの3日前［1296年3月30日］、すなわち復活祭の聖週間の第6日［金曜日］に行われたが、これは神が罪の重さに応じた罰を定められたからである。というのも、受難週の第6日に、スコットランド軍の一部がイングランドへの最初の侵入を行い、いくつかの農村やカーハムの修道院を殺戮と放火によって荒廃させていたからである。そして、偽証したベリックの市民たち自身も、悪意に心を硬直させ、兄弟への憎悪を抱いたまま、自らの破滅に向けて恐れることなく復活祭の最高の愛の聖体拝領を受けていたのである。それゆえ、この件に関しては、「日は日に言葉を伝え」、すなわち復讐を伝え、「夜は夜に」、すなわち刑罰の鞭が罪の恥辱に対する知識を示す、という言葉 (詩編第19編2節) を引用するのがふさわしい。これらに加えて、クリソストモスが証言しているように、悪意は時として理性によって打ち砕かれることはあっても、決して矯正されることはなく、とりわけ無知からではなく邪悪な意図を持って罪を犯す者たちの悪意はなおさらである。そのため、この狂気の人々はさらなる愚かなる蛮勇を奮い起こし、4月のイドゥスの6日前［1296年4月8日］に二手の陣形で別の方向からイングランド国境に攻撃を仕掛け、これを荒らしまわった。バカン伯に率いられたギャロウェイ人たちはカンバーランドを通り、新兵や若者たちの全軍はリデスデールを通って進軍路を切り開いた。この侵攻において、彼らの残酷さは異教徒のあらゆる狂気をも凌駕した。逃げ延びた強健な者や若者たちを捕らえることができなかったため、彼らは老衰した者や老婆、出産のために床に就いている女性たち、さらには2、3歳の幼児たちに対して、まだ新しい武器を血で染め、戦場での武勲ではなく専制的な虐殺を繰り返した。その惨状は、手のひらほどの深さまで槍で貫かれた幼児たちを空中に吊るし上げ、そこで息絶えた彼らの魂が天へと飛び去っていくほどであった。彼らは奉献された教会を焼き払い、神に捧げられた女性たち［修道女］や若くして結婚した女性たちを、神聖な場所やその他の場所で陵辱し、欲望を満たした後は彼女たちを殺すか身ぐるみを剥いだ。彼らはまた、幼い聖職者の卵たちの群れをヘクサムの学校に集め、扉を封鎖した上で、神に対して白く輝くその集団に火を放ったのである。この時、彼らによって3つの聖なる参事会修道院が破壊された。すなわち、正規修道参事会のラナーコスト、同修道会のヘクサム、そしてラムリーの女子修道院である。これらすべての荒廃は、決して戦士たちの武勇に帰せられるべきものではなく、抵抗を受けることのない、より防備の手薄な土地を襲撃した略奪者たちの卑怯さに帰せられるべきものである。\n\n最悪の事態から最善を引き出すことは真に神のみに属することであるゆえに、私はここに教化のために2つの出来事を記そう。なぜなら、キリスト教徒という名の下にある多くの不誠実な者たちは、実際においてではなく外見において善人であると思われたがるからである。これらのことは目下の出来事から証明できる。というのも、彼らは前述の女子修道士たちに対して最も極悪な行為を働いたことを自覚しており、その最後に司祭に対してミサを執り行うよう求めたからである。思うに、その司祭は他の理由からではなく恐怖に駆られて、聖別に至るまでの聖なる職務を執り行ったが、彼がパンに触れて祝福を与えようとしたとき、それは突如として消え失せた。彼は自身の恥を隠そうとして、別の聖体を取り上げて聖別しようとしたが、それもまた触れようとする彼の指の間から消え失せた。こうして彼の無謀さは抑え込まれ、神の復讐が理解されると、傍観していた者たちは皆、自らの罪を自覚したかのように逃げ去った。\n\nまた、主の著名な大司教である聖ウィルフリッドが建立したヘクサムの教会には、古くから聖なる教父たちの遺物を納めた多くの聖遺物箱が安置されていた。彼らの尊厳と事績については、聖ベーダが『イングランド人教会史』の中で論じている。ローマの建築様式で際立っていたこのバシリカは、使徒の中で最も柔和な聖アンデレとスコット人の霊的守護聖人に敬意を表し、祝福されたウィルフリッドの奉仕によって献堂されたものであった。聖人たちの威厳や敬虔な修道士たちの畏敬の念が、無謀な者たちを遠ざけるべきであったにもかかわらず、前述の狂気にとりつかれた者たちはこれらを何とも思わず、すべてを鑑みられる神への恐れも気に留めず、野蛮な残忍さで炎をもって聖なる建物を破壊した。彼らは見つけた教会の財産を奪い、さらにはその場にいた女性たちを辱めた挙句に刺し殺し、年齢、身分、性別を問わず容赦しなかった。そしてついに彼らは不信仰の極みに達し、箱に納められていた聖人たちの遺物を軽蔑するように火の中に投げ捨て、金銀の板や宝石を剥ぎ取り、さらには聖アンデレの姿を表した彫像の首を嘲笑いながら切り落とし、彼がそこから立ち去り、踏みにじられるために自身の土地へと戻るようにと命じたのである。\n\n同じ頃、信頼に足る耳によって、最高天に響く叫び声が聞き取られた。それは不義の民に対する報復を3度にわたって求めるものであり、それが神の耳にどのように響いたかは、その直後に続くあの民の不幸な出来事が示すことになろう。というのも、神の復讐に急き立てられ、そそくさと祖国へと逃げ帰る臆病な者たちは、別の愚かな計略を採用したからである。すなわち、軍勢を分けて、自軍の一部はロージアンの狭い入り口を、もう一部はティヴィオットデールの境界を警備し、それ以上進軍しようとするイングランドの軍勢を両者の間に挟み込んで閉じ込め、あちこちから切り刻もうというのであった。このため、5月のカレンダエの11日前［1296年4月21日］、マー伯とその他の者たちは選りすぐりの若い新兵たちと共にダンバーへとやって来た。この要塞を避難所として手に入れたいと望んでいたのである。そして、彼らは近隣の場所を略奪した後、町に火を放ち、城を包囲した。しかし、内部には強力な軍勢が欠けていたものの、伯夫人とその小さな家臣団、そして伯の兄弟は2日間にわたってその場所を防衛した。敵対者たちは、伯が忠誠を保つためにイングランド王の側に寝返ったことを挙げて彼の裏切りを口実にし、夫人に名誉ある撤退を説得した。このようにして、4日目の夜明け［1296年4月25日］に彼らは要塞に入城した。彼らは、高名で武術に熟練した人物であるリチャード・シワード卿を軍の指揮官として擁していた。そして、まるで羊の群れが囲いに入るように彼らが流れ込むと、彼らは日暮れ前には直ちに陸と海から包囲された。まるで神が彼らをその敵対者たちの犠牲とするために集めたかのようであった。彼らの包囲が聞き知られると、同胞を解放するためにより早く集結するよう、スコットランドのあらゆる場所から召集の布告が出された。さらに、五月の初めに野戦の日が定められた。そして世俗の権力だけでなく教会の権力もまた、毒塗りの剣を抜き放ち、まずは聖職停止の罰則の下に、教区の世話を担うすべての者に対して、毎週日曜日に民衆の面前で、イングランドの君主およびダラム司教アンソニーに対して厳粛な判決を非難轟々と下すことを命じた。その際、聖職者たちは「神よ、私の賛美を」と合唱した。その後、単に励ますだけでなく武器を持って戦うことによっても、多数の叙階された聖職者たちが戦闘に参加したことが知られている。\n\nしかし、真実は常に打ち負かされることなく残り、一方で残酷で動揺した良心は常に思い上がるものであるため、自軍の優秀な若者たちや軍の主力が城壁内に包囲されて座しているのを見て、彼らは突発的な恐怖をもって包囲を解き、急遽引きずり出した者たちを自らの戦列に合流させることを決定した。したがって、5月のカレンダエの五日前［1296年4月27日］の金曜日、彼らにとって2度目の不吉な日となったこの日の第九時、ウォレン伯と王の戦列のわずか5分の1が休息の準備をしていたところ、山の中腹の斜面に傲慢な者たちが現れ、敵を戦闘へと挑発した。そして、彼らの軍勢は整然と密集し、その数において強力であったにもかかわらず、手で触れることができるようになる前に、煙よりも早く崩れて散り散りになった。彼らの中で最も獰猛な者たちが真っ先に逃走したのである。なぜなら、もし騎兵たちがそれほど性急に踵で戦わなかったなら、彼らの歩兵は頑強に持ち堪えたであろうからである。そして、勝利は軍勢の数にあるのではなく天から与えられるものであるため、その戦闘において主が選ばれた民に約束されたこと、「1つの道から彼らはあなたに向かって来るが、10の道から彼らは逃げ去るであろう」という言葉を目の当たりにすることができた。このようにして、偽証した者たちのうち1万人以上が殺害され、剃髪した者たちの何人かが後に死者の中に発見された。一方で、イングランド側からは、不注意な1人の騎士を除いて、完全に誰一人として倒れなかった。真実に対して引き起こされたこの戦いは、最高の真実が終わらせたように思われる。その方は、世に来たのは人をその父と対立させるためであると言われた。というのも、そこでは同じ民族でありながら、息子が父に対して武器を取り、兄弟が国境を接する兄弟を剣で殺害するのを見ることができたからである。これにより、包囲された者たちに対する裁きが下され始めた。なぜなら、彼ら自身が城の頂上で合図の火を焚き、いつどのようにして思いがけない敵に打撃を与えることができるか、味方に知らせていたからである。それゆえ、ある者は掘るために、ある者は土塁を築くために心を奮い立たせ、それによって城壁を猛烈に攻撃しようとしたため、内部にいた者たちは精神的に打ちのめされ、翌日直ちに王の意志に降伏した。そこで捕らえられ、イングランドの様々な場所に監禁された貴族の中には、マー、メンテイス、アソル、ロスの4人の伯がおり、さらにその他に134人がおり、その中には複数のバロン、20人の騎士、80人の従騎士がいた。また、そこでは300人の歩兵が発見されたが、王は彼らを留め置くことを望まず、誓いを立てさせた上で彼らを解放し、彼らが野営地を越えて進むまで安全通行権を与えた。これは、敵の喉元にあってさえ、彼の慈悲深さを大いに称賛させるものであった。この嵐のような時期に、ダラム司教猊下はジョン・ベイリオル卿の領地をすべて差し押さえさせた。これは彼が聖カスバートの封地として保持していたものである。そのうちのバーナード城において、同ジョンが拘禁していた88歳の者を汚泥から引き上げ、髪を刈らせ、着物を替えさせて自由に回復させ、さらに彼から奪われていた土地を返還させた。これらのすべてのことは、イングランド人の中にあるキリスト教的な愛情を証明するものである。彼らは、悪意ある者たちの報復とは対照的に、悪に対して無償で善を返すのである。\n\n同年、教皇ボニファティウスは、キリストの普遍なる教会全体において、個々の使徒や福音記者、さらに4人の教会博士の祝日を一級祝日（二重祝日）として祝うよう定め、布告した。「自らの吐瀉物に戻る犬」に対する別の教令も発布し、ドミニコ会、フランシスコ会、聖アウグスティヌス隠修士会、その他のいかなる托鉢修道会の修道士も、自身の修道会の管理外にある高位聖職の職位に向けた、不和を招くような形で行われた選挙、要請、聖職授与、あるいは召命に対し、同意を与えることはできないとした。さらに、たとえ彼らが自身の修道会の総長、管区長、あるいは修道院長などの下位の長上からの許可や同意を得ていたとしても、使徒座の霊的な許可がない限り、知ってか知らずか、誰から受けたかに関わらず、これを無効かつ無価値なものと判決した。これを受け、私の推測ではあるが、ある聖職者が、大いにふざけてか、あるいは憤慨してか、以下に記す滑稽な詩を作り、教皇殿下の寝室の扉に密かに貼り付けたのである。その詩とは以下の通りである。\n\n今は教皇ボニファティウスだが、かつてはベネディクトゥス、二つの良き名よ、あなたの衣服も立派であるように。名に違わぬ者となれ、祝福し、善をなせ、ベネディクトゥス (祝福されし者) よ、さもなくばこれらを覆し、呪い、悪をなせ、マレディクトゥス (呪われし者) よ。\n\n使徒聖バルナバの祝日 (6月11日) には、ウェールズ人の裏切りに関する特筆すべき記憶に残る出来事が起きた。エドワード国王陛下が大軍を率いてエディンバラの高くそびえる城を包囲し、石を投擲するための巨大な攻城兵器を周囲に配置し、3日3晩の間に158個の石を放ち、城の屋根を激しく破壊していた時のことである。先述の祝日の前夜、王が最も忠実だと評価していた最速の飛脚である1人のウェールズ人に、多くの書状を託し、報酬を支払い、ロンドンに向けて可能な限り早く出発するよう命じた。彼はルーウィンという名で呼ばれており、その末路にふさわしく、英語ではレフウィンのように響いた。彼はすぐさま酒場に入り込み、旅費として受け取った全額を己の腹の貪欲さを満たすために使い果たしてしまったのである。日曜日であった祝日の朝、イングランド人を愚弄してやろうと考えた彼は、仲間に自身の前で盾を持たせるよう命じ、城の守備隊に攻撃を仕掛けるまではこの場を離れないと主張した。そして弩を持って門の前に近づき、城壁の衛兵に向かって縄を下ろすように叫んだ。城内に入れてくれれば、敵の秘密をすべて暴露するというのである。城代が私に断言したところによれば、彼が休息を取っていた折に、その偽者が潜入し、王の書状が入った箱を手に差し出しながら彼の前に立たされたという。彼は「見よ、卿、イングランド王の秘密だ。調べて見てみるがよい。そして私にも防衛するための城壁の一部を与え、私が弩を撃てるかどうか見てみてほしい」と言った。他の者たちは秘密を開示させようとしたが、指揮官はこれを禁じた。彼は直ちに見晴らしの良い場所に立ち、通りがかりの者たちに向かって大声で叫び、王の陣営に対し、王の裏切り者が城内の者たちに詐欺を働こうとしているが、自分は信仰に反してそれに同意するつもりは毛頭ないということを知らせるよう求めたのである。この噂を聞きつけてすぐにジョン・ディスペンサー卿が駆けつけ、事の次第が順を追って説明された後、その欺瞞者は手付かずの書状と共に縄で下ろされた。そして食事の席についていた王に対し、彼の逮捕とその経緯が明らかにされた。真実を深く愛する君主は「神にかけて喜んで宣言しよう。あの誠実な男の忠義が私を打ち負かした。以後、誰も城内に閉じ込められた者たちの破滅を求めてはならず、いかなる攻城兵器も彼らに向かって石を放ってはならないと命じる」と言った。こうして、以前は全員の命を奪うと誓っていた王の怒りは鎮められたのである。3日間寝ずの番をしていた者たちのまぶたにも眠りが訪れたが、彼らの多くは自らの救済のために誓願を立てており、それを永遠に守り続けている。翌日、王の寛大な計らいにより、包囲されていた者たちはフォーファーに滞在していたジョン王のもとに使者を送り、状況を報告して援軍を要請した。しかし、ジョン王は彼らを救援することができず、各自が自らの利益を図ることを許可した。しかし、先述の裏切り者であるルーウィンの処罰について黙っているわけにはいかない。彼はすぐに捕らえられ、裁かれ、引き回され、彼の罪のために建てられた厳粛な絞首台で吊るされたのである。私がこの例をここに挿入したのは、賢明なる者が詐欺師との親交を避けるためである。\n\n使者たちの報告を待つ間、エドワード王は包囲軍を解散し、わずかな供回りを連れてスターリングへと出発した。そこでは、彼に対する恐怖から城は空になっており、開け放たれた門の上に鍵が吊るされ、囚人たちが王の慈悲を乞い願っていた。王は直ちに彼らを解放するよう命じた。かくして、王の不在中、15日間の包囲の末に乙女の城がジョン・ディスペンサー卿の手に明け渡された。この場所は、その際立った高さと堅固さゆえに、過去に陥落したと古い記録のどこにも記されたことがない場所であり、古くはその創設者たる君主エドウィン王にちなんでエディンバラと呼ばれていた。伝えられるところによれば、王はそこに7人の娘を安全に保護するために置いたという。\n\nさて、スコット人たちによって彼らの王に対し、戦闘に姿を見せることも和議に同意することもせず、あちこち逃亡して隠れ家に潜むようにと決定されていた。しかし対照的に、エドワード王は海であれ彼を遠ざけることはできず、山や森であれ彼を隠すことはできないと決意を固めた。それどころか、キンカーディンで彼を水陸両面から包囲し、王の意志の裁量に従わせてモントローズへと急ぐよう強いたのである。そこで彼は王権を放棄し、不実な者たちの助言を受けた結果、アルバニアにおける王の誉れと、イングランドにおける父祖伝来の世襲財産の双方を永久に失うという損害を被ったのである。彼は1人息子とともにロンドンへ送られ、名誉あるものではあるが私的な生活を送り、王の国庫から支給される年金に満足している。これらは、殉教者聖トマスの遺骨遷座の祝日の翌日 (7月8日) に、神の摂理によって成し遂げられた。それは、この首のない者［無能な王］の祖先である暗殺者ヒュー・モーヴィルの罪の報いであった。なぜなら、彼が聖トマスの頭に罰を与えたのと同じように、それ以降、彼の血を引く者の中で、頭の分別あるいは地上の財産を奪われなかった者は1人もいなかったからである。［後略］
    ref: *Chron Lanercost*, s.a. 1296.
    
