sources:

  - id: gesta_annalia_ch_63
    title_ja: 『ゲスタ・アナリア』第63章
    ja: スコットランド王アレグザンダーの子、アレグザンダー殿下は主の年1282年、冬の聖マルティヌスの祝日の次の日曜日にフランドル伯の娘である高貴な乙女をロクスバラで妻に迎えた。多くのフランドルの騎士と貴婦人が列席し、大きな喜びと喝采に包まれた。そこにはスコットランドの多くの司教、修道院長、伯、バロン、騎士、その他の貴族が集い、15日間滞在した。婚礼は名誉ある形で祝われ、彼らはついに自らの領地へと帰還した。しかし、ああ、悲しいかな、かくも大きな喜びの後、短い時間の内に大きな悲しみが続いた。というのも、そのアレグザンダーはスコットランド王国の待望の後継者であった優れた若者であったが、翌年、実に20歳でリンドーズにて亡くなり、ダンファームリンに埋葬されたからである。全ての民の計り知れない悲しみ、全聖職者の涙と呻き、そして王と貴族たちの無限の嗚咽の中であった。彼は主の年1283年に亡くなった。さらに、彼の弟デイヴィッドはそれより以前、すなわち主の年1281年6月の終わりにスターリング城でこの世を去っており、全スコットランド人の大きな、しかし王にとっては最大の嘆きの中、ダンファームリンの修道院に埋葬されている。彼の死はスコットランドの未来の悲しみの始まりであった。ああ、悲しいかな！おお、スコットランドよ！もし汝が汝に訪れるであろう多くの悲しみと涙の日々を知っていたならば。\nかくも多くの災いが必ずや訪れようとしており、\n>その大きさを知っていたならば、汝は決して耐えられないと思うだろう。\n先の王の長子アレグザンダーの死後、フランドル伯からスコットランド王のもとへ4人の騎士が遣わされた。先の伯の娘であり、最近亡くなった彼の息子アレグザンダーの未亡人を彼女の父のもとへ連れ帰るためであった。これについて国王陛下とその顧問官たちは長く審議し、ついに、かの貴婦人は彼女の寡婦産に対する忠誠を王に誓うことなく父のもとへ帰ることに同意した。そしてその通りに行われ、彼女らは自らの領地へ帰るにあたり、盛大に見送られた。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 63.
    


  - id: gesta_annalia_ch_64
    title_ja: 『ゲスタ・アナリア』第64章
    ja: また、王の唯一の娘であったマーガレットは兄のアレグザンダーが亡くなる前にノルウェー王ホーコンと婚約し、8月の初め頃、メンティス伯ウォルター、メンティス伯夫人、バルメリノ修道院長、バーナード・モワット、その他多くの騎士や貴族と共に、高貴な一行を率いて海を渡った。婚礼が厳粛に執り行われた後、彼らのうちでかの修道院長、バーナード、その他数名が帰途に溺死した。しかし、伯ウォルターとその妻はそのファミリアの全員と共にノルウェーからスコットランドへ無事帰還した。しかし、ノルウェー人の王妃である同貴婦人マーガレットは夫である王と1年半暮らした後、兄アレグザンダーも亡くなった同じ年の初めに人間の定めである死の負債を支払い、4月のイドゥスの5日前[1283年4月5日]に亡くなった。ノルウェー王は彼女からマーガレットという名の1人の娘だけをもうけた。彼女が成熟した年齢に達したとき、彼女も同様に以下で語られるようにこの世を去った。実に、ノルウェー王はスコットランド王のもとへ、彼の娘でありかの王の妻であった王妃の死後に厳粛な使者を送った。先の娘、すなわち彼の孫娘のために、両王の間で結ばれ書面で確認された協定に従い、特定の土地における700マークの歳入を要求し、受け取るためであった。王はこれらの使者を親切に迎え、貴族たちの助言を得て自らの使者をノルウェー人の王のもとへ派遣し、莫大で様々な贈り物と共に名誉をもって送り返した。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 64.
    


  - id: gesta_annalia_ch_67
    title_ja: 『ゲスタ・アナリア』第67章
    ja: **フランスのドルー伯の娘ヨランドとスコットランド王アレグザンダー3世との婚約、ならびに同王の死について**\nスコットランド王アレグザンダー3世は聖カリストゥスの祝日[1285年10月14日]、ドルー伯の娘ヨランドと結婚した。その王家の結婚式を祝うため、フランスとスコットランド双方から数多くの貴族がそして無数の男女が厳粛に集まった。式典が終わるとフランスから来た人々は様々な贈り物を贈られ、王妃のもとに残った数名を除き喜んで帰国した。同年、4月のカレンダエの14日前[1286年3月19日]、良き記憶に残るかののアレグザンダー、スコットランドの輝かしき王はキングホーンで亡くなり、ダンファームリンに丁重に埋葬された。その死がスコットランド王国にとっていかに悲痛で有害であったかは、その後の時代の損失が明白に示している。この王は36年間統治した。この王の生涯のすべての日々においてキリストの教会は栄え、その聖職者たちは然るべき敬意をもって遇され、悪徳は枯れ、欺瞞は消え、不正は止み、美徳は育ち、真実は力を得、正義が支配した。彼はまた、その誠実さの功績により、正しく王と呼ばれた。なぜなら、彼は自身とその民を正しく治め、各人にその権利を与えたからである。そして、もし自らの民の中に反逆者がいればその狂気を非常に厳しい規律で抑圧し、首に縄をかけられ、彼の意志であれば絞首刑に処される準備が整い、彼の権威に服従させられた。このため、近くでも遠くでも、友人のみならず敵、特にイングランド人からも恐れられると同時に愛された。そして、彼がこの地に生きたすべての時代は固い平穏な平和のもとにあり、喜ばしい自由に守られていた。おお、まことに不幸なスコットランドよ！かくも偉大な指導者にして導き手を失い、さらに不幸なことに、正統な後継者となる子孫が彼によって残されなかったとは。その死はあなたにとって絶え間ない嘆きと悲しみの原因となっている。その称賛すべき生涯が、あなたに特に多くの、そして偉大な幸福の増進をもたらしたというのに。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 67.
    


  - id: gesta_annalia_ch_68
    title_ja: 『ゲスタ・アナリア』第68章
    ja: **アレグザンダー王の死後における女王の摂政について**\n前述の壮麗なる君主がその身から生まれたすべての子ら、また祖父ウィリアム王から直系であれ傍系であれ血を引くすべての正統な相続人や親族が亡くなった後、ただ1人の幼い少女、すなわちノルウェーの王妃でありかの故アレグザンダー王の娘でもあったマーガレットの娘、マルグレーテという名の者を除いて、スコットランド王国は王の統治なく6年と9ヶ月の間空位となった。それは古い予言で言われていた通りである。\n『壮麗なる君主を失いし地は空位とならん／2倍の3年に、そして9ヶ月の間。』\nしかし、王国は6人の守護団によって統治された。すなわち、セント・アンドルーズ司教ウィリアム・フレイザー師、ファイフ伯ダンカン、バカン伯ジョン・カミンがフォース川以北で任命され、グラスゴー司教ロバート、ジョン・カミン卿、そしてスコットランド家令ジェームズがフォース川以南で立てられた。しかし、ファイフのダンカンはその後まもなくこの世を去った。このことは後に明らかになるだろう。この期間がまだ続いている間に、イングランド王にして壮麗なる君主エドワード1世はかのノルウェー王の娘にして自らの妹の娘の娘でもあるマルグレーテという少女がスコットランド王国の真の正統な相続人であることを知った。彼はかのスコットランド王国を自らの王国に統合し秩序づけることを熱意と勤勉さをもって望み、1289年、六人の特別な代理人と公式の使節を任命した。彼らは王の息子であり相続人であるエドワードと、当時スコットランドの真の相続人であったかのマルグレーテとの間で契約されるべき結婚について、エドワード王自身とスコットランドのかの守護団、その他の司教たち、聖職者全体、貴族、伯、バロン、そして同王国の共同体全体との間で準備し、取り決め、交渉するためであった。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 68.
        


  - id: gesta_annalia_ch_70
    title_ja: 『ゲスタ・アナリア』第70章
    ja: **ロバート・ブルースとジョン・ベイリオルの権利の区別について**\n件の王国の貴族たちは、前述の摂政たちと共に自国の王の選出について頻繁に協議を重ねた。しかし、継承権について彼らが心の中で感じていたことをあえて公言しようとはしなかった。その理由は多岐にわたる。第一に、この訴訟が困難かつ険しいものであったため。第二に、権利について人々が抱く意見は様々であり、多角的に揺れ動いていたため。第三に、当事者 (ブルース家とベイリオル家) の権力が強大であり、それゆえに恐るべきものであったため、彼らが恐怖を抱いたのはもっともであった。そして第四に、彼らの判決と権力の厳格さを執行に移し、あるいは当事者に判決の遵守を強制できるような上位者が存在しなかったためである。これらの事情を慎重に考慮した結果、ついに彼らは満場一致で、イングランド王エドワードのもとへ厳粛な使節を派遣することを決定した。それは、彼がこの訴訟における上位の裁判官および双方の権利の宣言者となり、その権力によって、判決が不利に下された側を法の要求に従って正当に強制するためであった。したがって彼らは、遠隔地で公務を遂行していた彼 (エドワード王) のもとへ、セント・アンドルーズ司教W・フレイザー猊下に数名を同行させて派遣した。要請を受けた彼は来訪し、スコットランド王国のあらゆる貴族に対し、その地位や身分がいかなるものであれ、ベリックの御前で一堂に会する日を定めた。そして、論争の当事者たち、および当該王国の権利を主張するその他のすべての者たちを召喚するよう命じた。しかしながら、このような召喚や出頭がスコットランド王国に不利益をもたらさず、またこれによって彼 (エドワード) にいかなる権利や支配権の優越性も生じないという条件が付けられていた。なぜなら彼は、この件に関して「上級君主」として、あるいは法的な裁判官として招かれたのではなく、不和を鎮めるための「友好的な調停者」および有力な隣人として、その知恵と権力をもって友好的な仲裁者の流儀と互恵的な恩義によって招かれたからである。そしてこのことは、期日の前、および訴訟が開始される前に、公開書状によって明示的に予防措置が講じられていた。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 70.
    
        


  - id: gesta_annalia_ch_72
    title_ja: 『ゲスタ・アナリア』第72章
    ja: 法廷の警備が固められると、彼〔エドワード1世〕は退出し、側近たちを呼び寄せた。彼は法廷の決定〔＝ブルース有利という報告〕を彼らに伝え、この件について彼らの助言を求め、前述の事態に対して何をなすべきかを協議した。これに対し、ダラム司教アントニー・ベックが次のような問いを提起した。 「もしロバート・ブルースがスコットランド王となれば、イングランド王エドワードはどこにとどまることになるでしょうか？件のロバートは全イングランドで最も高貴な血筋の出身であり、これに加えてスコットランド王国はそれ自体で非常に強力です。また、過去の時代にはスコットランドの王たちによって、イングランドの王権に対して多大なる不利益がもたらされてきたではありませんか？」これに対して同王〔エドワード〕は、あたかも頭を振るかのようにして、フランス語でこう答えた。「パル・ル・サン・デュー、ヴ・ザヴェ・ボン・シャント」これは「キリストの血にかけて、其方は見事なことを言った。事態は私が以前に意図していたのとは違う方向に進むだろう」という意味である。同様に、彼の顧問官たちは皆、ある時は密かに、ある時は公然と、あらゆる手段を用いて彼にこう進言した。「好機が差し迫っている今、服従なしには決して判決を下すべきではありません。長年考え続けてきた自身の望みを達することができるのですから」と。これらのことがこのように審議されると、彼は「年長の方の」ロバート・ブルース〔＝競合者ロバート〕を呼ばせ、彼にこう尋ねた。「もし余がそなたを王となし、その地位に就けるならば、そなたは前述の王国を予から『直接受封者として』保有することを望むか？」これに対し、彼は率直に答えて言った。「もし私が法の道と誠実なる法廷を経て前述の王国を獲得できるのであれば、それは結構なことです。しかし、もしそうでなければ、王国を我が物とするために前述の王国を隷属状態に陥れるようなことは決して致しません。同王国のすべての王たちは多大なる苦難と労苦を伴いながらも、今日に至るまで隷属することなく、確固たる平和の下でこれを守り抜いてきたのですから。」これを聞くと、エドワードはブルースを下がらせ、ジョン・ベイリオルを呼び、彼にも最初と同じ質問をぶつけた。彼はかなり腐敗した自身の顧問団と手早く協議し、前述の王の意志に同意した。すなわち、スコットランド王国をエドワードから保有し、そのために臣従礼を行うと。これが行われた後、間もなくして、スコットランドとイングランドの貴族たちが列席する中、双方の当事者が呼び出され、エドワードはジョン・ベイリオルが王国の継承における合法的相続人であると宣言し、判決として彼がより強力な権利を有すると確定した。判決が下された後、グロスター伯が皆の目の前でロバート・ブルースの手を取り、王に向かって次のように言った。「思い出されよ、おお王よ。今日あなたがどのような裁きを下したかを。そして知られよ、あなたもまた最期の時には裁かれねばならぬことを。」そして直ちに、前述のロバート・ブルースは同伯の助言に従って退出し、ジョン・ベイリオルに対して臣従礼も忠誠宣誓も決して行わなかった。主よ、我らを憐れみたまえ。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 72.
    


  - id: gesta_annalia_ch_81
    title_ja: 『ゲスタ・アナリア』第81章
    ja: **[アレグザンダー3世王の死後の王国守護団の選出について]**\n\nかの記憶に名高い、前述の輝かしきスコットランド王アレグザンダー3世の遺体が教会での埋葬に付された後、西暦1286年、4月2日にスクーンで開催された議会において、スコットランド全土の聖職者および共同体によって、6名の守護団が選出された。彼らについては、少し前で十分に述べられている。\nそして王国は、あの予言「高貴なる君主が」にある通り、6年と9ヶ月の間、王による統治を欠くこととなった。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 81.
        


  - id: gesta_annalia_ch_82
    title_ja: 『ゲスタ・アナリア』第82章
    ja: **[ファイフ伯ダンカンの殺害について]**\n\n1288年4月のイドゥスの7日前［1288年4月7日］、ファイフ伯であるマルコムの子コルバンの子ダンカンが、騎士パトリック・アバネシーおよび騎士ウォルター・パーシーによってピットロッホにて殺害された。これは、騎士ウィリアム・アバネシーの助言と同意によるものであった。ウィリアムは計画に基づき、前述の伯がいかなる手段でも生きて逃れられぬよう、多数の手勢と共に密かに別の街道で伯の通過を待ち伏せしていたのである。この凶行がなされるや否や、アンドルー・マリが、各地を惨めに逃げ回る彼らを追跡した。彼はスコットランド海［＝フォース湾］のこちら側も向こう側も捜索し、そのうちの2人、すなわちウォルターとウィリアムをクライド渓谷にあるコヴィントンという村にて果敢にも捕縛した。彼はその場ですぐに、ウォルターと2人の従者を斬首刑に処した。ウィリアムについては、ダグラス城のウィリアム・ダグラス卿の監視の下、死ぬまで投獄させた。一方、パトリックはフランスへ逃亡し、同地にてその生涯を閉じた。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 82.
        


  - id: gesta_annalia_ch_83
    title_ja: 『ゲスタ・アナリア』第83章
    ja: **【イングランド王の息子とノルウェー王の娘マルグレーテの婚姻契約について】**\n\n1290年、6人の正式な使節が派遣された。すなわち、ダラムとカーライルの2人の司教、リンカンとワーレンの2人の伯、ウィリアム・ド・ヴェシーという名の1人の騎士、そしてヨーク管区長のヘンリである。これらイングランド王エドワード1世の特別代理人は、スコットランド王国の守護者たち、貴族たち、および共同体と交渉するために赴いた。その目的は、王の息子にして相続人であるエドワードと、ノルウェー王の娘であり当時のスコットランドの正当な相続人であったマルグレーテとの間に婚姻を結ぶことであった。この経緯は、同使節たちによって作成され、同守護団に引き渡されたある書状により詳細に記されており、その書状については先にも言及されている通りである。同年、ユダヤ人がイングランドから追放された。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 83.
        


  - id: gesta_annalia_ch_84
    title_ja: 『ゲスタ・アナリア』第84章
    ja: **ロバート・ブルースとジョン・ベイリオルの間に生じた争いについて。**\n\n1291年、ノルウェー王エイリークの娘であり、スコットランドの正当な継承者であったマルグレーテが死去した。同年、ジョン・ベイリオルとロバート・ブルースという2人の人物の間で、スコットランド王国の統治権および継承権を巡り、訴訟、争い、あるいは論争が生じた。ついに、スコットランドの有力者たちの要請を受け、イングランド王エドワード1世が求めに応じてベリックに到着した。そしてそこで、同王によって、前述の様式と形式に則り、ジョン・ベイリオルに有利な判決が下された。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 84.
        


  - id: gesta_annalia_ch_85
    title_ja: 『ゲスタ・アナリア』第85章
    ja: **スコットランド王国におけるジョン・ベイリオルの即位について。**\n\n同ジョン・ベイリオルは、1292年11月の末日に、スクーンにて王となった。そして同地において、慣習に従い、王座に据えられ、しかるべき作法にて高位に就けられた。同年の12月26日、同ジョンはイングランド王エドワード1世に対し、スコットランド王国のために臣従礼を行った。それは彼が以前耳元で約束した通りであり、少数の者を除く王国の全有力者たちの意に反して、自身を同王への永続的な隷属下に置くものであった。主よ、我らを憐れみたまえ。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 85.
        


  - id: gesta_annalia_ch_86
    title_ja: 『ゲスタ・アナリア』第86章
    ja: **王位の剥奪の過程について**\n\n覚書。このスコットランド王ジョンの治世において、先日殺害されたファイフ伯ダンカンの兄弟であるマクダフという名の者がいた。ある者たちが、彼のキルコンカーの土地と所有権を奪おうと画策し、前述のジョン王の面前で行われた議会の本会議にて彼を裁判にかけた。しかし、前述のマクダフから見て、同王が相手方にあまりに有利な態度をとっていたため、彼はその判決と法廷を不服として、イングランド王への聴聞を求めて上訴した。彼は可能な限りの勤勉さでこの上訴を遂行し、前述のスコットランド王ジョンがロンドンで開催されたイングランド王の議会に召喚されるよう手配した。ジョン王はそこへ個人的に出頭したが、イングランド王およびマクダフ側の異議申し立てに対しては自身の評議会の審議を経て、代理人を通じて回答すべきであると決定した。こうして王自身が呼び出され、法廷に代理人を通じて出頭したものの、幾度も言及されたイングランド王は裁判席に座り、いかなる手段をもってしても前述のジョン王の代理人たちの言葉を聞こうとはしなかった。ついに、当時イングランド王のそばに着席していたスコットランド王はその席から立ち上がり、法廷でイングランド王の前に立ち、自らの口で代理人たちに回答を委ねることになった。彼は命令に従い、王としての尊厳ある地位に反する数え切れないほどの不当な扱いと侮辱を皆の前で甘受し、ようやく代理人たちに回答を委ねることができた。こうして許可を求め、彼は最大級の屈辱を感じながら自国へと帰還した。帰国後、彼は直ちに議会を招集し、聖職者および俗人からなる王国の有力者たちを集めた。そこで彼は、自身が耐え忍んだ不当な扱い、卑しさ、侮辱、不名誉をあからさまに説明し、前述のイングランド王の邪悪さに対して、自身の能力の及ぶ限りのあらゆる手段で救済策を講じるよう働きかけた。最終的にそこで決定されたことは、ジョン王がイングランド王に対して行った臣従礼と誠実宣誓は暴力と恐怖によって強要されたものであるとしてこれを完全に撤回すること、そして、自国の自由を害するような彼の命令には以後決して従わないことであった。彼はこの抗議と臣従礼および誠実宣誓の撤回を記した書状に自身の印章を押し、ヘンリという名のアーブロースの修道院長に託して前述のイングランド王のもとへ公然と送付した。この書状が提示された際、イングランド王はフランス語で次のように答えた。 「あの愚か者は、なんと愚かなことをするのか。」そして直ちにこう付け加えた。「彼が余のもとへ来ようとしないのなら、余が彼のもとへ行くとしよう。」このような回答が示され、前述の修道院長は敵意に満ちた場所へ派遣されていたこと、またその不誠実さゆえにイングランド王国の多くの貴族やその他の者たちから憎まれていたこともあり、また残された時間が短かったためイングランド王からこれ以上長い返書を得ることもできず、導きによりかろうじて生きて脱出した。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 86.
        


  - id: gesta_annalia_ch_89
    title_ja: 『ゲスタ・アナリア』第89章
    ja: **ファイフの貴顕たちがいかにしてベリックの町の防衛のために派遣され、その死に至ったかについて**\n\nこれらのことが行われていた時、スコット人の王ジョンは自身に忠実な有力者たちの助言に基づき、当時指導者を欠き、正当な導き手を失っていたファイフ伯領のすべての貴顕や自由土地保有者、ならびにその他の有力な者たちを組織して派遣した。彼は当時最大の危機が迫っていたベリックの町の守備と防衛のために彼らを差し向けたのである。そこには、五港から集められた、多数の兵を乗せたイングランド王の膨大な船団が押し寄せていた。海側から激しい攻撃を加える彼らに対し、町の守備隊は、武勇に優れ、力強く、勇猛な精神をもって力で撃退し、武装した兵員を乗せた18隻の船を、兵をことことく殺害した上で火を放ち焼き払った。この年代記の筆者は、上述の出来事がどの年、月、日に発生したかについて確証を持っていなかった。しかし、確実な事実として保持されるべきは、これらすべてが主の年1293年、1294年、そして1295年に、記述された順序に従って発生したということである。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 89.
        


  - id: gesta_annalia_ch_90
    title_ja: 『ゲスタ・アナリア』第90章
    ja: **イングランド王エドワード1世によるベリックの町の占領について**\n\n西暦1296年4月のカレンダエの3日前［1296年3月30日］、度重なる理由により激昂したイングランド王は、自ら大軍を率いてベリックの町に接近した。武力でこれを落とすことができなかったため、彼は巧妙かつ狡猾に守備側を欺くことを考えた。実際、彼は撤退するように見せかけ、テントを撤去し、遠くへ去るふりをしたのである。しかし、4月のカレンダエの3日前［1296年3月30日］の夜明け直後、スコットランド軍のものに見せかけて狡猾に偽造した旗や軍旗を掲げ、町の門に接近した。これを見た町の守備隊は、自国の王の救援と援助が間近に迫っていると知らされていたため、非常に喜び活気づき、そのような約束のもとで不幸にも欺かれ、忠実かつその詐欺行為には全く気づかずに、自信を持って門を開いた。しかし、詐欺が発覚し真実が知れ渡り、抵抗しようとした時には、突如として敵に包囲され、四方八方から攻撃を受け、突然の戦闘によって悲惨にも制圧された。かくして前述のように町は陥落し、全員が打ち倒された。前述のイングランド王は、年齢や性別を問わず容赦せず、2日間にわたり殺された者たちの体から血が小川のように流れ、その暴虐の猛威の中で、男女合わせて7500人の命を虐殺するよう命じた。そこでファイフの貴顕たちは完全に絶滅した。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 90.
        


  - id: gesta_annalia_ch_91
    title_ja: 『ゲスタ・アナリア』第91章
    ja: **スコットランド王国からのイングランド人の追放について**\n\n同年、5月のカレンダエの11日前［1296年4月21日］、国王および王国の安寧に対する陰謀という邪悪な行為への最も明白な疑念の根拠、および確からしい証拠ゆえに、セント・アンドルーズ司教区において聖職禄を有するすべてのイングランド人は、遠隔地に滞在中であったセント・アンドルーズ司教ウィリアム・フレイザーの代理であるウィリアム・オブ・キングホーンおよびパトリック・オブ・キャンパニアによって、その聖職禄を判決により剥奪された。同様に、聖職者であれ俗人であれ、他のすべてのイングランド人も、その陰謀ゆえにスコットランド王国から追放された。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 91.
        


  - id: gesta_annalia_ch_92
    title_ja: 『ゲスタ・アナリア』第92章
    ja: **ダンバーの戦いについて**\n\n同年5月のカレンダエの5日前［1296年4月27日］、ダンバーの戦いが行われた。その場所でパトリック・グレイムと多くの貴族たちが傷ついて倒れた。また、その他の非常に多くの騎士やバロンたちが命が助かることを期待してダンバー城へ逃げ込み、そこで快く迎え入れられた。しかし、同城の守備隊長であるリチャード・シワードという名の者は、ロス伯ウィリアムと共にいた彼ら、すなわち有名な従者たちを除いても70名に及ぶ騎士たち全員を、あたかも屠殺に供される羊のようにイングランド王に差し出したのである。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 92.
        


  - id: gesta_annalia_ch_95
    title_ja: 『ゲスタ・アナリア』第95章
    ja: **[ジョン・ベイリオルとその子エドワードの捕縛について]**\n\n前述の王［エドワード1世］はそこから進軍し、ダンバー、エディンバラ、スターリングの城が彼に引き渡されると、前述のスコットランド王ジョンをフォーファーの城まで追跡した。そこへストラスボギーの領主ジョン・カミンが出迎え、王に降伏した。一部の者の話によれば、カミンはその直後、前述のジョン王をその子エドワードと共にアバディーンからモントローズの城へ連れ戻した。そしてイングランド王がモントローズの前述の城に到着すると、かのジョン王は王の装飾を剥ぎ取られ、手に白い杖を持ち、スコットランド王国において彼が有した、あるいは有し得たすべての権利を杖と棒をもって放棄し、イングランド王の手に返上した。その数日後、イングランド王は彼をその子エドワードと共に船でロンドンへ送致させ、そこで両名を長期間にわたり厳重に監視させた。しかし時を経て、子は留め置かれたまま、父は解放された。ただし解放に先立ち、前述のスコットランド王国において統治権を決して要求しないという極めて重い誓いを立てさせられた。こうしてフランスにある自身のベイリューの領地に復帰した彼は、そこで最期の日を終えた。その後、息子エドワードも先の誓いと同様の義務を負って父の許に返され、父の死後ダップリン・ムーアの戦いに至る彼の戦争の準備が始まるまでそこに留まった。こうしてジョン・ベイリオル王の治世は終わった。彼は3年半在位した。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 95.
        


  - id: gesta_annalia_ch_96
    title_ja: 『ゲスタ・アナリア』第96章
    ja: **[スコットランドの共同体がどのようにイングランド王に臣従礼を行ったかについて]**\n\n同年、スコットランド王の捕縛後、スコットランドの共同体はイングランド王に臣従礼と誠実宣誓を行った。城と要塞化された町は彼に引き渡された。しかしながら王はごく一部の例外を除き、古くからの慣習あるいは世襲の権利によってスコットランドの歴代王に仕える習わしであった諸城の城代、町々の代官、そして王家の役人たちを、誰一人として交代させなかった。むしろ、主要な都市の城の城代を除き、彼らから忠誠の誓いを受け取った上で、すべてを以前仕えていたのと同じ地位と職務に留まることを許容した。そして、このようにして自国へと急ぎ帰還した。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 96.
            


  - id: gesta_annalia_ch_98
    title_ja: 『ゲスタ・アナリア』第98章
    ja: **ウィリアム・ウォレスの出自と決起について** \n\n同年、ウィリアム・ウォレスはいわば潜伏先から立ち上がり、ラナークの町においてイングランド人で屈強かつ権勢のあるラナークの州長官を殺害した。故にその時より、イングランドの支配という耐え難き君臨のもと、隷属の重荷に苦しみ、辛酸をなめていたすべての者たちが彼のもとに集い、彼はその軍事指導者となった。というのも、彼は驚くべき剛勇と大胆さの持ち主で、容姿は秀麗、そして非常に気前が良かったからである。そして、王国の伯や大貴族たちの間では卑しい身分と見なされていたかもしれないが、彼の両親は騎士の名誉に輝いていた。彼の兄もまた騎士の帯剣を許され、その身分に相応しい十分な世襲財産を土地に有しており、それを彼の子孫たちに残した。この男は至る所でイングランド人を打ち破り、日ごとに勢力を増し、短い時間の間にスコットランドのすべての大貴族を、好むと好まざるとにかかわらず、その武力と実直さの力によって、自らの指揮下に置いた。そして、もし大貴族の中に自ら彼の命令に従わない者がいれば、彼を捕らえて拘束し、彼の意向に完全に従うまで投獄した。こうしてすべての者を服従させると、彼はイングランド人が支配する城砦や防備を固めた町々の攻略に雄々しく向かい、あらゆる点において祖国の解放と敵の打倒に熱心に取り組んだ。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 98.
            


  - id: gesta_annalia_ch_99
    title_ja: 『ゲスタ・アナリア』第99章
    ja: **スターリング・ブリッジの戦いについて**\n\n主の1297年、ウィリアム・ウォレスの名声は四方へと広まり、イングランド人に加えられた損害が報告される中で、ついにイングランド王の耳に達した。かの王は他の場所での多くの困難な務めに忙殺されていたが、彼の財務府長官であるヒュー・クレシンガムという者を大軍とともに、かのウィリアムの剛勇を鎮圧し、スコットランド王国を自らに服従させるために派遣した。さて、この男の到来を聞くと、前述のウィリアムはそのときダンディー城にいるイングランド人の包囲で多忙であったが、直ちに、生命と四肢を失うという罰則のもとにその城の包囲の管理と遂行を同地の市民たちに委ね、軍を率いて全速力でスターリングへとかのヒューを迎え撃つために進軍した。そして、9月のイドゥスの3日前［1297年9月11日］、スターリング近郊のフォース川の橋で戦闘が始まると、かのヒュー・クレシンガムは殺害され、彼の全軍は敗走し、ある者は剣によって殺され、ある者は捕虜となり、またある者は水中に沈められた。しかし、神の力によって全ての敵が打ち破られ、前述のウィリアムは少なからぬ賞賛とともに、輝かしい勝利を手にした。彼の側では、貴族のうち、高貴なアンドルーの父であるアンドルー・マリーのみが、傷を負って倒れた。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 99.
            


  - id: gesta_annalia_ch_123
    title_ja: 『ゲスタ・アナリア』第123章
    ja: **イングランド王エドワード一世の死について。**\n\n同年4月のノナエの日［1307年4月5日］、イングランド王エドワード1世はバーグ・バイ・サンズで崩御した。彼はその軍歴の初めにおいて戦争を引き起こし、イングランド人たちを恐ろしい鞭で打ち据え、その邪悪さによって全世界を混乱させ、残虐さをもって騒乱を引き起こし、自らの欺瞞によって聖地への渡航を妨害し、ウェールズを侵略し、スコット人たちとその王国を欺瞞によって自らに服従させ、彼らの王であるジョン・ベイリオルをその息子とともに投獄し、教会を破壊し、高位聖職者たちを鎖につなぎ、何人かを牢獄の汚濁の中で死に至らしめ、民衆を殺戮し、その他数え切れないほどの悪事を働いた。彼には息子のエドワード2世が後継者として続き、フランス王フィリップの娘であるエリザベスを妻に迎えた。
    ref: *Chron. Fordun*, i, *Gesta Annalia*, ch. 123.
    
