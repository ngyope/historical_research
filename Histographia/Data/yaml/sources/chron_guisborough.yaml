sources:

  - id: chron_guisborough_240-3
    title_ja: 『ギスバラ年代記』
    ja: 主の1293年、不吉な争いが五港のイングランド王の船乗りと、ノルマンディのフランス王の船乗りの間で以下のように生じた。ノルマンディのある港に寄港していた五港の1隻の船が数日間滞在していた。ある日、2人の水夫が近くの泉から真水を汲もうと上陸した際、そこでノルマン人の船乗りたちに出くわした。挑発された彼らは口論となり、ついには殴り合いに至った。そしてついに刃物が抜かれ、1人が死に、もう1人は仲間のいる船へと逃げ帰り、事の顛末と追ってくるノルマン人の到来が近いことを告げた。彼らが逃れようと沖へ出ると、敵は彼らを捕らえようと追跡してきた。逃げ延びた者たちは事態を五港の船乗りたちに告げ、加勢を求めた。追撃する者たちの怒りは収まらず、多くの船と合流してイングランド船を海上で捜索した。ある日、6隻のイングランド船に遭遇すると、彼らは敵対的に攻撃を仕掛け、直ちにそのうちの2隻を撃破した。彼らは船の梁から人間を犬と一緒に吊るし、海を航行しながら犬とイングランド人の区別をつけなかった。逃げ延びた者たちからこの話を聞いた五港の船乗りたちはすぐさま集結し、この屈辱に対する復讐に燃えて敵を捜索した。しかし思うように敵が見つからなかったため、彼らはスウィン (Zwin) の港へと力強く進攻し、敵への報復を試みた。そこで数人を殺害し、多くを溺死させ、そこから6隻の船を力ずくで奪い去った。それ以来両者は互いに血に飢え、難破や略奪を伴う衝突を繰り返すようになった。\n\n両者の間で長期にわたる戦いが続けられる中、使者が送られ、ついに特定の日に全力を挙げて激突することに合意した。すなわち4月14日、イングランドとノルマンディのほぼ中間地点の海上に「スタンダード」となる目印を据えた。実際、彼らは衝突の印として、共通の合意の下に1隻の巨大な空船をそこに停泊させていた。イングランド側にはアイルランド人やオランダ人が、ノルマン側にはフランス人、フランドル人、ジェノヴァの船乗りたちが加わった。ついに当日、彼らは軍装を十分に整えて集まったが、彼らの心意気に違いがあったように、その日は気象状況においても極端な不均衡が生じた。両者の間で激しい戦闘が繰り広げられたが、ついに全能の神は我らに勝利を与え、剣によって数千人が倒れたほか、船とともに沈んだ者は数知れなかった。我らは略奪品を積んだ約240隻の船を引き連れて帰還した。\n\nこの知らせがフランス王フィリップに届くと、彼の兄弟であるシャルルがこの海戦の発起人であったにもかかわらず、彼はイングランド王に使者を送り、自分への賠償、実行犯の引き渡し、および略奪された商人への巨額の賠償金を執拗に要求した。我らの王［エドワード1世］は、自らの使者を通じて回答すると賢明に答えた。そして、フランス王を親族および主君として仰ぎつつ使者を送り、この問題について友好的に協議し、真実が示すところに従ってさらに処置するために、互いに向かうべき特定の日時と場所を指定するよう要請した。フランス王はこの提案を受け入れず、大貴族たちの助言の下、これらの侵害について自身の宮廷で回答するよう、令状をもってイングランド王を召喚するよう命じた。イングランド王が期日に現れなかったため、フランス王の宮廷は海を越えた彼の全領土を没収することを命じ、さらに、全ての海外領土没収の刑を科すという警告の下、別の日に回答するため再度召喚されると宣告された。イングランド王は、一部の友人から警告されていた通り陰謀を恐れて自ら赴くことはせず、弟であるレスター伯エドマンドを全権委任状とともに送り、正義が勧める通りの処置をさせようとした。エドマンドがイングランド王のために十分な権限を示して現れたが、彼らは彼を受け入れず、法廷命令への不出頭を理由に、ガスコーニュおよびイングランド王の全大陸領の没収を宣告した。\n\nしかし、エドマンド卿は和平の希望を持ってフランス王と様々な交渉を行った。巷では、我らの王がフランス王の妹と結婚し、全てが解決されるだろうと言われた。その間、ガスコーニュのイングランド王のセネシャルはフランス王の役人が没収のためにガスコーニュに入ることを許可しようとせず、大きな論争が生じていた。そのためフランス王はエドマンド卿を呼び、和平の仲裁者かつ友人として、せめてボルドー、バイヨンヌ、ランゴン、マルマンドの4、5つの都市への役人の立ち入りを許可するよう求めた。これは和平を期待してのことであり、フランス王は「自分の大貴族たちが宮廷の判決が執行されるのを見なければ、和平を固めることはできない」と述べ、この要求が満たされるならば、王としての信義にかけて完全な和平が続くことを約束した。エドマンドは自分にはそのような独断をなす勇気はないと言ったが、直ちに王の要請により、これに関するイングランド王の意志と同意を求めた。イングランド王は弟の言葉を信じ、自らの開封書状を通じて、弟がこの件に関して王の名においてなすいかなることも承認し満足する旨を伝えた。これを受け取った後、フランス王に知らされると、王は信義と王としての言葉にかけて、しばらくの時間の後には全てが完全な和平とともに返還されることを約束した。エドマンドはこれをお人好しにも信じ、王の約束に魅了されて担保を求めなかった。彼は王の約束がどのような保証をも凌駕すると固く信じていたのである。\n\n彼はすぐにガスコーニュのセネシャルに対し、それらの都市の占有権をフランス王の役人に引き渡すよう書いた。それが実行されると、フランス人は最初は密かに少人数で、後には公然と多人数で、ついには巨大な軍隊を運び入れた。エドマンド卿はこれを聞き、陰謀を恐れ、約束を思い出すよう、またこのような事態を禁じるようフランス王に求めた。王は「40日間が過ぎるまで、少しの間待て。そうすれば全てを返還しよう」と言った。40日が過ぎ、エドマンド卿が再び同じ件について求めたところ、王は直ちに「12人の同輩公による宮廷の決定と判決は、彼らの共通の同意なしには撤回できない」と答え、侮蔑するかのように顔色を変えて立ち去った。エドマンド卿はフランス王の妻の母であるナバラ王妃を妻としていたため、その宮廷に多くの友人がいた。彼は密かに警告を受け、確かな推測から陰謀を恐れ、その宮廷から密かに急いで立ち去った。そしてイングランドの兄王のもとに帰り、重い心の痛みとともに事の次第を順を追って述べ、自分はこの件において愚かであり、いわば兄を欺く者となってしまったと言った。王は聞いた内容に動揺したものの、弟を優しく慰めた。\n\nすぐさま王は大貴族たちを召集し、スコットランド王ジョンとともにロンドンで議会を開いた。彼らの面前で全経過を述べ、彼らの助言と援助を求めた。王は、たとえより大きな従者がいなくとも、少年1人と馬1頭だけであっても、死に至るまで自らの権利を追求し、このような不当な扱いに対して報復したいと宣言した。彼らは一斉に、生も死も王に従いたいと答えた。列席していたスコットランド王も他の大貴族らとともに援助を約束した。王は神に感謝し、彼らにも感謝を述べ、多くの謝辞とともに解散させた。そして、自分から十分な告知があった際、準備を整えて武装して馳せ参じるよう付け加え、要請した。
    ref: *Chron Guisborough*, 240-3.


  - id: chron_guisborough_268
    title_ja: 『ギスバラ年代記』
    ja: **前述の使節任命状の文面は以下の通りである。**\n\n至高の君主であり主君、また友人である神の慈悲による誉れ高きフランス国王フィリップ陛下へ。同じく神の慈悲によるスコットランド国王ジョンより主にある挨拶を。陛下におかれましては、余が愛する忠実な配下であるセント・アンドルーズのウィリアムおよびダンケルドのマシューの両司教、ならびに騎士ジョン・ソールズと騎士イングラム・アンフラヴィルを、陛下の愛すべき姪あるいは親族である深窓の令嬢と、余の長男であり継承者であるエドワードとの間の婚約および婚姻の交渉を陛下と共に行うための、我々の特別な代理人、使節、および全権代理人として任命し、定めたことを知られたし。余は彼らに対し、前述の婚約および婚姻についてこのような契約の性質上、不在者間での婚約および婚姻の締結が特別な全権代理人あるいは使節を通じて認められる限りにおいてこれを交渉し、行い、完成させるための一般的、自由、および十全な権限と特別な命令を授ける。また、前述の契約や条件に属する、あるいは何らかの形で属し得るすべての事項、およびそれらなしには前述の契約や合意が正当に完了し得ないすべての事項を行う権限を授ける。余はこれを批准し、堅固なものとする。1295年のノナエの3日前［1295年7月3日］、スターリングにて。
    ref: *Chron Guisborough*, 268.    


  - id: chron_guisborough_269
    title_ja: 『ギスバラ年代記』
    ja: **さらなる条項（あるいは別の委任状）**すべての人々へ。神の恩寵によるジョン、云々。汝らすべて、余が前述の通り云々、知られたし。余は彼らの3人、あるいはそのうちの2人に対し、余、余の息子、および王国の住人を義務づけ、余、余の息子、および王国の住人の魂にかけて宣誓する一般的、自由、および十全な権限を授け、また、すべての事項および個々の事項を行い、完成させる、云々。前述と同じ日、スターリングにて。1295年10月23日、パリにて。すべての人々へ。フランス王の子、ヴァロワ、アランソン、シャルトル、およびアンジュー伯シャルルより、挨拶を。汝らすべて、余が前述の条約および合意を前述の形式と合意の下で快く受け入れ、批准し、これを賛美し、望み、かつ明示的に承認し、余が約束することを、云々、知られたし。1295年10月23日、パリにて。
    ref: *Chron Guisborough*, 269.
    

  - id: chron_guisborough_269-71
    title_ja: 『ギスバラ年代記』
    ja: **スコットランド人がイングランド王に対して行った回答について。**\n\nこうしてフランス王およびその配下との同盟が結ばれると、彼ら［スコットランド人］はすぐに角を立て［傲慢になり］、戦いの準備を整えた。そして彼らは集会を開き、スコットランド王国に土地、所領、あるいは何らかの地代を有するすべての者は、その没収を罰条件として、イングランド王に抵抗するため、さらには国王自身が12人の同輩の助言に基づいてなすべきと決定したことに従うために、武装して備えなければならないという勅令を制定した。また、同地に土地を持つ多くのイングランド人や貴族たちは、イングランド王への忠誠を忠実に保っていたため、その集会に参加することを拒んだ。そのため、彼らの土地は、共同の取り決めに従ってそれを防衛し保持する他の者たちに与えられた。それらの貴族たちも、他のすべてのイングランド人と同様に、それ以降は公敵とみなされ、自発的に退去していなかった者は王国から追放された。\n\nその中には、かの日に出頭することを拒んだために前述した、第4代ロバートの息子であるロバート・ブルース卿が含まれていた。彼の土地、すなわちアナンデールは、バカンのジョン・カミン卿に与えられ、カミンはそれを直轄地として所有し、自らのものとして防衛することとなった。彼がそこへ入ると、まもなく同地方における我々のすべての十分の一税を、何の対価も支払わずにロッホマーベンンの城の防衛のために運び込ませ、暴力的に留め置いた。\n\n一方、我らが王［イングランド王エドワード1世］は、自身へ援軍が送られるべきであるという当初の提案を維持していたが、嘲笑され、ついには以下のように傲慢な返答を受けた。彼らが言うには、彼らの王も彼ら自身も、彼に対して何ら義務を負っておらず、また彼の要求や命令に従う義務もないという。とりわけ、彼らの王から力ずくで強要した忠誠や不法な臣従礼に関して、教皇ケレスティヌスから免償の恩恵を得ているからだという。これを聞いて王は驚愕し、彼らの反逆を知ると、自らの臣下に対するように命じ、たとえ援軍を送ることを拒否するにしても、敵であるフランス人やフランドル人を自国に引き入れてはならないと伝えた。そして、もし彼への忠誠を保ちたいのであれば、少なくともフランス王との戦争が終わるまで、指定された3つの城、すなわちベリック、ロクスバラ、エディンバラを彼とその家臣たちに引き渡して保持させるべきであるとした。しかし彼らは後者を行うことを拒絶し、前者についてはこう答えた。「我々の土地は自由であり、あらゆる隷属から免除されている。イングランド王の命令に何一つ縛られる覚えはない。それどころか、フランス人であれフランドル人であれ、どこから来る商人であろうと、我々は人物の区別なく意のままに受け入れるつもりだ」。\n\nほぼ同時期に、ベリックの港にはイングランドの商人たちがいたが、スコットランド人たちは激怒して彼らを捕らえ、ある者を打ち据え、ある者を切断し、さらにはある者を完全な死に至らしめた。しかし何人かは逃げ延びて、これらすべての出来事を我らが王に報告した。これを聞いた王は信じがたいことだと驚嘆して言った。「おお、何という邪悪さか。おお、何という反逆か。誰がこのようなことを信じられようか。確かに彼らの悪意は今や極まった。もはや我々がこれ以上待つべきことは何もない」。そして直ちに勅令を発し、これらの報告について答明させるため、指定した日にスコット人の王を召喚するよう命じた。彼がその日に出頭もせず、使者も送らなかったため、王は彼がイングランドに保持していたすべての土地を差し押さえるよう命じた。そしてそれは実行された。\n\n王は再び貴族たちと協議し、布告によってスコットランドの王自身と大貴族たちに対し、先述の件について答明するため、3月1日にニューカッスル・アポン・タインに出頭するよう召喚した。その間、巨大な軍勢が召集され、我らが王は貴族たちと共に、同じ日、同じ場所に威風堂々と到着した。召喚された者たちが出頭もせず、使者も送らなかったため、王は側近の助言により、少なくとも国境までは進軍すべきであると決定した。軍勢が整えられ数えられたところ、武装した馬に乗った装甲兵が4000人、精鋭の歩兵が30000人であった。これに加え、ダラム司教の軍勢として武装した馬に乗った者が400人、歩兵が1000人おり、さらにまだ到着していないウェールズ人やアイルランド人もいた。しかし彼らは後に到着した (これについては後述する)。そして彼らは部隊ごとに分かれ、地域の国境へと進軍した。スコットランド人たちも自国の国境に集結し、部隊ごとに散らばって配置されていたが、戦闘の準備を整えており、その民衆の数は実に多く、非常に傲慢であった。
    ref: *Chron Guisborough*, 269-71.
    

  - id: chron_guisborough_271-2
    title_ja: 『ギスバラ年代記』
    ja: 我らの王が国境地帯にごく短い間滞在していた時のことである。見よ、我らの一員であるワーク城の領主、ロバート・ロスという者が、妻に迎えようとしていたあるスコットランド人の女の愛に誘惑された。彼は同じ城にいた弟のウィリアムにこう言った。「我が兄弟よ、お前に隠しておきたくない秘密がある。私はスコットランドの人々と同盟を結んだ。これからは彼らに忠実に尽くすつもりだ。さあ、私と共に来い。我々は向こうで大いなる民となるだろう」。これに対し弟は言った。「黙れ、兄弟よ。兄上が心に抱いたことは愚かなことだ。もしこれを行えば、兄上には死が待っており、諸国にとっての恥辱、そして一族にとっての不名誉となるだろう」。しかし、ロバートは諫める弟に従わず、その夜のうちに愛する女、おそらくは娼婦への愛のために全てを捨てて密かに立ち去った。朝になると、弟のウィリアムはこの言葉のすべてを王に報告し、敵がやって来て力ずくで城を奪うことのないよう、援軍を送ってくれるよう懇願した。すぐに王は、1000人の男たちを従えた1人の千人隊長の騎士を派遣した。彼らが翌日の夜、プレスフェンの村で何の悪意も抱かず野営していたところ、かの誘惑者ロバートがロクスバラ城の守備隊にいたスコットランドの民と共に密かにやって来て、その村全体を隠密裏に包囲した。彼らは、イングランド人との乱戦の中で誰がイングランド人で誰がスコットランド人か疑わしくなった時のために、互いに合言葉を決めていた。もし疑わしければ、英語で「チュニック、あるいはタバードの上」と言い、相手は即座に「馬」と答えることになっていた。このように答え合わない者はイングランド人であるとみなされ、死刑に処され虐殺される手はずであった。合図が送られ、村が包囲されると、彼らは直ちに火を放ち、互いに「イングランド人に死を！」と叫んだ。我々の軍勢は仰天し、どちらへ逃げればよいかも分からず、互いに切り結び、同士討ちをして倒れた。クリーヴランドの百人隊長も身を守りながら多くを殺したが、ついに彼自身も倒れた。千人隊長の騎士は馬と武器を失い、辛うじて逃げ延びた。我々の軍勢の多くは敵があまりにも頻繁にその合言葉を使っていたのでそれを認識し、自らもそれを連呼して野原を逃げ回り、助かった者もいた。捕虜となった者たちはスコットランド人がやって来た元の城へと連行された。その一部は剣で、一部は牢獄での飢えによって死んだ。残されたわずかな者たちは我らの王によってベリックの街が攻略された後、同じ城にスコットランド人と共にいたある高貴な婦人の熱心な嘆願によって解放されたが、彼らは母の胎から出てきた時のように裸のままであった。こうして朝になり、この忌まわしい噂が王の軍隊に響き渡り、ついに王の耳にも届いた。王は神を祝福して言った。「いと高き神に祝福あれ。神は現在に至るまで我らの手を潔白に保ってくださった。彼らがこのように戦端を開き、敵意を持って我らの王国に侵入したからには我らは主を導き手としてこの事業を完遂し、彼らの頭上に同じ報いを返してやるであろう」。すぐに軍隊が準備され、王はワーク城へと向かった。しかし、復活祭が近づいていたため、祭礼が終わるまでは国境を越えることを望まなかった。一方、自分は大物になるだろうと信じていたロバート・ロス本人は、我らの王がスコットランド王国に対して勝利を収めた後、王の御前から逃亡し、浮浪者や逃亡者のようにしばらく身を隠していたが、その年のうちに極貧の中で死亡した。
    ref: *Chron Guisborough*, 271-2.
        

  - id: chron_guisborough_272-4
    title_ja: 『ギスバラ年代記』
    ja: 西暦1296年、復活祭の週の月曜日、すなわち「主のお告げの祝日 (受胎告知)」の翌日［1296年3月26日］のことである。この年は復活祭がちょうど「主のお告げの祝日」と同じ日に当たっていたからである。バカンのジョン・カミン卿、メンテイス伯、ストラサーン伯、レノックス伯、ロス伯、アソル伯、マー伯、そしてバーデノックのジョン・カミンの息子が500騎の武装した騎士と4万人と数えられる歩兵からなるスコットランドの大軍と共にアナンデールの谷を出発した。彼らはソルウェイ川を3か所で渡り、アーサレットからニコラスの御料林の中を通って、カーライルに至るまで近隣のすべての村々を焼き払った。彼らは見つけ次第、性別や聖職にあるか否か、あるいは年齢を問わず、剣で殺すか少なくとも惨殺し、誰一人として容赦しなかった。火曜日になると、彼らはイーデン川の橋の向かい側からカーライル市への包囲戦の準備を始めた。しかし、何名かの射手が市の外に出て、橋板を持ち去るなどして一時的に橋を防衛した。これを見た武装兵たちは軍の一部を迂回させ、リカーディナ (Ricardina) 村の下にある浅瀬で川を渡り、あらゆる方向から市を包囲し、郊外の家々を火で焼き払った。その時、市内にはパトリックという名の密偵がいた。彼は少し前に明白な嫌疑によって捕らえられ、市の牢獄の監視下で鎖につながれていた。彼はスコットランド軍が到着したと聞くやいなや鎖を引きちぎり、自身がわずかの間滞在していたその建屋に火を放った。そしてすぐに市の城壁に登り、スコットランド人に向かって「男らしく振る舞え、奮起せよ」と叫んだ。彼はその叫び声によって市民に気づかれ、再び捕らえられて城の牢獄に入れられたが、数日後、彼の監視人と共に真っ先に死刑を宣告され、引き回しの上、絞首刑に処された。彼が火をつけた家から他の家々へも延焼し、風が吹いていたために炎は猛烈な勢いで広がり、市の大半が焼失した。多くの人々の心は挫け、「市は陥落した、逃げよう」と言い合った。こうして多くの者が火の方へ走り、城門へ向かう者は少なかった。しかし、女性たちは男らしく振る舞い、石を運んで敵に投げつけ、さらに熱湯を浴びせかけた。ついに火が消し止められると、それ以降は全員が一致団結して敵に当たり、城壁と城門を死守した。ある城門で次のようなことが起きた。敵が木材や藁、その他燃えやすいものを運び込み、火を放って城門からの侵入路を開こうとしていた時、敵の1人が自分の武具を過信して城門のすぐ近くに張り付いていた。すると、城門の上の板敷きに座っていた我々の兵士の1人が、鉄の鉤を下ろして彼の肩甲骨あたりを引っ掛け、内側の仲間たちに「彼を刺し殺せ」と叫んだ。仲間たちはすぐに槍を突き出して彼を刺し貫き、彼は絶命した。敵の仲間たちは彼を引き戻したが、死んでいるのを見て、非常に大きな嘆きをもって彼を悼んだ。言われるところによれば、彼はギャロウェイ全土でも屈指の高貴な人物の1人であったという。水曜日になり、スコットランド人たちは自分たちが成果を上げておらず、むしろ消耗しているのを見て、始めた包囲を解き、出発地であるアナンデールの谷へと撤退した。
    ref: *Chron Guisborough*, 272-4.
    

  - id: chron_guisborough_274-5
    title_ja: 『ギスバラ年代記』
    ja: 復活祭の荘厳な儀式がふさわしい敬意をもって執り行われた後の、同じ復活祭週の水曜日、我らが国王はその軍勢とともに敵の地に侵攻した。すなわち、コールドストリームの神聖なる女子修道士たちの修道院の麓でツイード川と呼ばれる川を渡ったのである。川は激しく氾濫していたが、馬からはぐれ濁流に飲まれた1人の少年を除いて、全軍から誰一人として犠牲者が出なかったのは、半ば奇跡的であった。一方、ダラム司教は自身の部隊とともに、自身の城から遠くないノーラムの近くでツイード川を渡った。国王自身は、その日一日中と翌日も、ベリックの市民たちが和平に応じるのを待っていたが、彼らが国王の差し伸べた和平を受け入れようとしなかったため、その金曜日、国王は陣を移し、ベリックの対岸、半リーグ離れた女子修道院に天幕を張った。陽が高く昇り、平原に軍勢が整列すると、国王はその場でヘンリ・パーシーをはじめとする多くの者を新たな騎士に叙した。港の前の海上で24隻の軍船とともに待機していた我らが水夫たちはこれを見て、武装した軍勢と多くの翻る軍旗を目にしたため、国王が直ちに都市への総攻撃をかけるつもりであると信じ込み、折からの満ち潮に乗って自ら港へ突入した。そのうちの1隻が他の船より先に帆を上げて進み、陸地の高みに座礁した。スコット人たちがこれを包囲し、水夫たちは長きにわたり応戦して投射物と剣で多くの敵を倒したものの、ついに梯子が掛けられ火が放たれて敵の侵入を許し、互いに殺戮を繰り広げた末に28人が殺害された。その後すぐ、底を擦って動けなくなった別の船も貪欲な炎に包まれたが、水夫たちは小舟で逃れた。第1時から第11時まで力強く防戦していたダラム小修道院長の家臣や従者の武装兵が乗る第3の船も、ついに座礁して火を放たれ焼失した。大部分は小舟で逃れ、最後まで残っていた者たちは敵の手に落ちるよりは水に身を委ねようと海へ飛び込んだ。そして半ば奇跡的なことに、彼らの中からは1人も死者が出ず、他の船の小舟によって救助された。残る30隻の船は引き潮とともに後退し、機会をうかがっては敵に向かって投射物を放った。野営地にいた国王にこの事態が報告され、誰もが船から高く立ち昇る煙を目にすると、国王はラッパを吹き鳴らし、力強く都市へ突入するよう命じた。ラッパが鳴り響くやいなや、彼らはスコット人たちが板材で作った堀を物ともせずに越えて敵に襲いかかり、あちこちで海に至るまで殺戮を繰り広げた。彼らの突入に驚愕したスコット人たちの中には、剣を振り上げたり投射物を放ったりする者は1人もおらず、皆、我を忘れたように呆然と立ち尽くしていた。一方、「赤い館」と名付けられた建物を、イングランド人の王に対して常にこれを守り抜くという条件で受け取っていた30人のフランドル人たちは、夕暮れまでその館を男らしく防衛したが、ついに火を放たれ、館とともに焼け死んだ。そこではコーンウォール伯の兄弟である勇猛な騎士が倒れた。彼は敵に向かって頭を高く上げた際、兜の目の開口部に投射物を受けて直ちに倒れ、息絶えた。こうして都市は陥落し、敵側からは8000人以上が戦死した。また同じ日、城の守備に就いていた勇敢な者たちも、生命、身体、土地、動産の保全を条件に降伏した。国王は彼らの指揮官であるウィリアム・ダグラス卿を、自身の戦争が終結するまでその地に留め置いた。しかし、彼と行動を共にしていた200人の部下たちについては、決して国王やイングランドの王国に刃向かわないという誓いを立てさせた上で、武器を携えて自由に去ることを許した。また、この都市の女性たちも数日後に自分たちの民の元へ送られ、無事に去っていった。国王はこの都市に15日間滞在し、幅80フィート、深さ40フィートの新たな堀を建設させた。
    

  - id: chron_guisborough_275-6
    title_ja: 『ギスバラ年代記』
    ja: **スコットランド王はイングランド王に自身の臣従礼を返上した。**\n\nそして彼［イングランド王］がその地［ベリック・アポン・ツイード］に留まっている間に、スコットランド王は彼のもとへ宗教者たちを使者として送った。すなわち、ロクスバラのフランシスコ会修道院長であるアダム・ブラント修道士と、彼に同伴する3人の修道士たちであり、4月に入って5日目に、以下の言葉をもって彼の臣従礼を王に返上させた。/n/n「高貴なる君主、神の恩寵によるイングランド王であるエドワード陛下へ。同じき恩寵によるスコットランド王［ジョン］より。貴方および貴方の王国の者たちは、余が知らぬことではないはずの、あるいは少なくとも知らぬはずがない状況下で、貴方の暴力的な力によって余と余の王国の住民に対して、重大かつ耐え難い不正、侮辱、苦痛、さらには甚大な損害を余と余の王国の自由に対して、そして神と正義に反して、公然と頻繁にもたらしてきた。すなわち、誰かしらの些細な示唆に基づき、貴方の意のままに余を余の王国の外へと召喚し、不当に悩ませたこと。余に何の落ち度もないにもかかわらず、貴方の王国内にある余および余の人々の城、領地、所有物を占拠したこと。陸路においても海路においても、余と余の臣下の財産を奪い、貴方の王国内に接収したこと。余の王国の商人やその他の住民を殺害したこと。そして余の王国から余の臣下を貴方の王国へと暴力的に連れ去り、そこに抑留し投獄したことによってである。これらの事態を是正するため、余は幾度も貴方へ使者を送ったが、それらは未だに正されないままであるばかりか、日を追うごとに、貴方と貴方の臣下たちによって、以前よりもさらに悪い事態が積み重ねられている。なぜなら貴方はすでに、数え切れないほどの武装兵の群れとともに軍隊を公に召集し、余と余の王国の住民から権利を剥奪するために、敵意をもって余の国境へと接近したからである。そして余の王国内へとさらに進軍し、陸路・海路の双方から虐殺と放火、そして暴力的な襲撃と侵略を非人道的に引き起こした。余は、前述の不正、侮辱、苦痛、損害、さらには敵対的な攻撃をこれ以上耐え忍ぶことができず、また、貴方の暴力的な抑圧によって強要されたものであったとはいえ、貴方への誠実宣誓と臣従礼に留まり続けることもできない。余は、余自身と余の王国の防衛のため (その防衛と保護のために余は誓いの絆によって縛られている)、貴方に立ち向かうことを決意した。余から、そして余の王国のあらゆる住民や余の忠実な臣下たちから、貴方の王国内において貴方から保持していた領地のゆえに、また貴方の家臣団あるいは従者であることのゆえに貴方に対してなされた誠実宣誓と臣従礼を、余の名において、また彼らすべての名において、本状をもって貴方に返上する。」\n\nそしてこの書簡には日付が記されていなかった。王は返上された臣従礼を受理し、この出来事の永遠の記憶として自身の尚書府の記録巻物に登録するよう命じ、そのように実行された。
    ref: *Chron Guisborough*, 275-6.
    

  - id: chron_guisborough_276-7
    title_ja: 『ギスバラ年代記』
    ja: **スコットランド人、ヘクサムをその地域一帯と共に焼き払う**\n\n同じく4月、前述のスコットランドの伯たちは数多のスコットランド軍を率いてジェドバラの城からやってきた。彼らは4月のイドゥスの6日前［1296年4月8日］、リーズデールの谷にある我々の国境に入り、ハードボトルの城を2日間包囲した。しかし、戦果が得られないばかりか、味方の何人かを失ったと見るや、彼らはそこから転進した。そして、タイン川の東側からコケットデール、リーズデール、そしてノーサンバーランドのコーブリッジを含め、ヘクサムに至るまでを荒らし回り、焼き払った。彼らは、逃げ出した参事会員たちがいたその場所に宿営し、聖レオ教皇の日、すなわち第4曜日［1296年4月11日の水曜日］に侵入した。朝になると、彼らはすでにその修道院からあらゆる財産を略奪し尽くしていたにもかかわらず、火を放ち、教会だけでなく、修道院と町全体を前代未聞の悪行をもって焼き払った。実のところ、彼らはその館の尊き守護聖人であり、かつてはスコットランド全土の守護聖人でもあった、もっとも祝福された使徒アンデレの記憶を忘れた、いやむしろ軽蔑したのであった。彼らは、古来よりスコットランド王国の守護者と呼ぶ習わしであったその方を軽んじたのである。そこから彼らは向きを変え、ラムリーの聖なる女子修道院と、その近隣の地域を恐ろしい火災によって焼き尽くし、その木曜日［1296年4月12日］の終わりにはラナーコストにて夜を明かした。彼らの意志としてはさらに先へ進むつもりであったが、神御自身がそれを望まれず、それゆえに彼らは阻まれた。というのも、彼らの味方の使者が現れ、イングランド王の軍勢が間近に、あるいは門前まで迫っていると伝えたからである。これに仰天し呆然とした彼らは、同修道院のいくつかの建物を焼いたものの教会そのものには火をつけず、金曜日の早朝、ニコラスの御料林を抜けて、多くの略奪品と共に撤退した。
    ref: *Chron Guisborough*, 276-7.
    

  - id: chron_guisborough_277-9
    title_ja: 『ギスバラ年代記』
    ja: **ダンバーの城にて、多くのスコットランド人が捕虜となる**\n\nその時、一般にマーチ伯と呼ばれるパトリック伯は、我が王の下で強力かつ忠実に軍務に就いていた。しかし、ダンバーの自城に留まっていた彼の妻である伯夫人は、言われているところによれば悪意と欺瞞を企て、スコットランド軍に使者を送り、彼らが到着し次第城を明け渡すと約束して、大急ぎで彼らを招き入れた。彼女の夫は王と共にあり、こうした事態を知らなかった。スコットランド側は、3人の伯、4人のバロン、31人の騎士、そして100人の従者を送り込んだ。彼らが到着するとすぐに招き入れられ、王側の者たちは追放されるか、一部は殺害された。このことが我が王に報告されると、王は直ちにワレーン伯と共に軍の主力、すなわち1000の騎兵と1万の歩兵を現地へ派遣した。また、ダラム司教の軍勢からも100人の武装兵が送られた。彼らが城を包囲し、数日間互いに飛び道具による攻撃や突撃を交わした後、驚愕した新たな城の守備兵たちは、3日間の猶予を与えてほしいと懇願した。それは、どのような条件で降伏し城を明け渡すべきか、彼らの王に使者を送って指示を仰ぐためであった。これが認められ使者が送られたが、見よ、第3日目、それはベリックの占領から3週間目の金曜日であったが、スコットランド王によって派遣された大軍が到着したのである。1500の騎兵と四万の歩兵が、ダンバーの向かいにある山の斜面を部隊ごとに戦闘態勢を整えて下ってきた。新たな城の守備兵たちはこれを見ると、その光景にすでに勝利したかのように歓喜し、直ちに城壁の防備の上に旗を掲げ、我々に向かって叫び声を上げ、我々を「尻尾のある犬」などと罵り、さらには死と尻尾の切断をもって脅迫した。そこでワレーン伯は、彼と共にいた有力者の若者たちと一部の武装兵を割り当て、敵が外に出ないよう城の包囲を継続させ、自身は残りの軍勢と共に敵に向かって勇猛に進軍した。我々の軍が谷へと下り、相互の激突へより容易かつ適切に急ぐために四方へ展開して移動していた時、スコットランド軍は我々が逃亡し背を向けたのだと思い込んだ。彼らは角笛を吹き鳴らし、叫び声を上げて我々の死を呼び求め、その恐ろしい角笛の音はまるで地獄の深淵を貫くかのようであった。しかし、ついに我々が深い谷から登り切り、戦闘へと急ぐと、彼らは即座に沈黙した。双方の戦列が整い、遅滞なく互いに激突し、槍と剣が交錯したが、至高なる神の御心により、最初の衝突においてスコットランド軍はすぐに背を向けた。我々は敗走する彼らを追撃し、セルカークの森までのおよそ7リーグあるいは8リーグの距離にわたって殺戮を行い、彼らのうち約1万人が倒れた。しかし彼らの中の1人、パトリック・グレイムという名の勇猛な騎士はその王国の賢者の中でも第一人者であり、有力者の中でも最も高貴な人物であったが、自身の名誉ある称賛を損なうことを欲せず、顔を背けることなく雄々しく戦い、ついにその場で殺され倒れた。戦利品を集め、我々が城の包囲へと戻ると、見よ、以前は我々の破滅を願って高々と掲げられていた旗が降ろされていた。味方が背を向けて逃げ、一部が倒されたのを見て、彼らは混乱し恐怖に打ちのめされていたのである。翌日、我が王が到着すると、彼らは自身の生命と身体を王の手に委ねて城を明け渡した。王はいかなる条件も付けず、また協定によって確実な恩赦を約束することも望まなかった。捕虜となった者たちの名は以下の通りである。ロス伯ウィリアム、アソル伯ウィリアム、メンテイス伯アレグザンダー。またバロンとしては、ジョン・カミンの息子ジョン、ウィリアム・シンクレア、リチャード・シワード、ジェフリー・モウブレーの息子ジョン。これらの有力者たちと共に、31人の騎士、100人の従者、そして2人の聖職者、すなわちジョン・サマーヴィルとウィリアム・シンクレアが見つかり捕らえられた。王はこれら全員を、12人あるいは16人ずつに分散させ、イングランドの様々な城へ送り、厳重な監視の下に拘禁した。こうしてダンバーでの勝利が得られたことで、スコットランド側の計画と心は砕かれ、城の守備に残っていた者たちを除き、その王国のほぼ全員が海を越えて逃亡した。その後、王はいくつかの都市や町へと進み、それ以来、スコットランドの全戦力を極めて些細かつ無血の作戦で支配下に置き、征服した。ひとたびの戦いの結果が彼らの栄光のすべてを削ぎ落としたため、残りの地域を制圧するにあたって、最も幸運な君主に立ちはだかる困難は皆無であった。
    ref: *Chron Guisborough*, 277-9.
    

  - id: chron_guisborough_279-80
    title_ja: 『ギスバラ年代記』
    ja: **スコットランド王とその貴族たちがどのようにして服従したか。**\n\n数日後、王［イングランド王エドワード1世］は、スコットランド家令が長らく保持していたロクスバラ城へと進軍した。家令は王の到着と同時に、命と身体、領地、動産の安全を条件に、直ちにこれを明け渡した。そこへ15000人のウェールズ人が王のもとに到着し、王は直ちに同数程度の疲弊したイングランド兵をイングランドへ送り返した。そして城を確保すると、全軍を率いて英語でエディンバラと呼ばれる「乙女の城」へと出発した。王はそこを8日間にわたり包囲し、持ち込んだ大量かつ巨大な木製の攻城兵器を用いて激しく攻撃した。城の守備隊は降伏し、彼らには命が与えられた。王はスターリングへと進路を変えたが、城は空であり、抵抗する者は誰もいなかった。守備隊は王を恐れて逃げ出していたからである。そこへ、アルスター伯が400の騎兵と3万のアイルランド歩兵を率いて王のもとに合流した。そして王は、聖ヨハネの町［パース］と呼ばれる町へと進軍し、洗礼者聖ヨハネの誕生祭［1296年6月24日］において、新たな騎士たちを叙任し、盛大な祝宴を催した。王はそこに数日間滞在したが、スコット人の王の側から使者が訪れた。使者は、スコットランド王が最近まで拒絶していた和平を彼の名において求め、彼の罪に応じてではなく、慈悲深い憐れみに従って彼に和平を認めてほしいと付け加えた。しかし我が王は、罪の重さを量ることなく、慈悲深く振る舞い、寛大にもこう答えた。すなわち、15日以内にスコットランド王自身が貴族たちとともにブレチン城に赴き、王が派遣する使者と和平の条件について協議せよと。そして、そこに王、すなわちスコットランド王と、バーデノックのカミンおよびバカンのカミンの両ジョン・カミン、その他同王国の有力貴族たちがやって来た際、我が王はダラム司教アンソニーを十分な助言と、交渉を行い適切な形で決着をつける全権を与えてそこへ派遣した。幾度にもわたる交渉と多くの会談の後、王自身が王国を放棄し、国璽が破壊された上で、王自身および他の貴族たちが無条件でイングランド人の王の意志に自らを委ね、降伏する以外に和平の形はなかった。彼らはその通りにし、イングランド人の王の意志に身を委ねた。王自身は息子のエドワードを人質として引き渡し、次のような文言で記された書状によってスコットランド王国を放棄したのである。
    ref: *Chron Guisborough*, 279-80.
    
    
  - id: chron_guisborough_280-1
    title_ja: 『ギスバラ年代記』
    ja: **スコットランド王が王国を放棄したこと**\n\n神の恩寵によるスコットランド王ジョンから、この現在の書状を見るか聞くであろうすべての人々に挨拶を送る。余は、悪質で偽りの助言により、また余自身の愚かさにより、多くの事柄において余の主君たる神の恩寵によるイングランド王、アイルランドの領主、アキテーヌ公エドワードを深く怒らせ、罪を犯した。すなわち、以下の事柄である。余は、彼の臣従のもとで忠誠を誓い留まる立場にありながら、当時も今も彼の敵であるフランス王と同盟を結んだこと。また、フランス王の弟であるシャルル卿の娘との婚姻を取り決めたこと。余の主君を悩ませ、フランス王を援助するために、戦争やその他の方法で全力を尽くしたこと。そしてその後、前述の悪しき助言によって余の主君たるイングランド王に逆らい、臣従の誓いを返上して彼の臣従と忠誠から自らを切り離したこと。さらに、放火、略奪、殺人、その他の数多の損害を引き起こすために余の軍勢を彼の領土であるイングランドへと送り込んだこと。そして、彼の封土であるスコットランドの地に、町や城やその他の場所へ武装した兵士たちを配置・駐留させ、彼に対してこの地を防衛し、彼からその封土を不法に奪おうとしたこと。前述のこれらの事柄と違法行為のために、前述の余の主君たるイングランド王はスコットランドの地に侵攻し、余が彼に対抗して差し向けた軍勢にもかかわらず、武力をもってこれを奪い、征服した。余が彼に臣従の誓いを返上し、前述の事柄を行った以上、彼は自身の封土の主君として正当にこの征服を行うことができるのである。このため、余は完全なる権限と自由意志において、スコットランドの地とすべての民、ならびに彼らのすべての臣従の誓いを彼に引き渡した。この事の証として、余はこの開封書状を作成させた。余の治世の第4年、7月10日、ブレチンにて与えられる。
    ref: *Chron Guisborough*, 280-1.
    

  - id: chron_guisborough_283-4
    title_ja: 『ギスバラ年代記』
    ja: **ロバート・ブルースおよびその他の者たちの証書**\n\nこの現在の書状を見る、あるいは聞くすべての人々へ。マーチ伯およびダンバー伯パトリック、アンガス伯ギルバート・アンフラヴィル、父ロバート・ブルース、キャリック伯である子ロバート・ブルースより挨拶を送る。我々は、神の恩寵によるイングランド王、アイルランドの主、アキテーヌ公である、最も気高き君主であり我らが親愛なる国王エドワード陛下に対し、常に忠実であり、その意に従ってきた。ゆえに我々は、自身および相続人の名において、身体および財産の処罰を覚悟し、さらに我々に可能な限りのこととして、以下のように約束する。我々は、生きとし生けるすべての者たちに対し、彼［エドワード王］によく、かつ誠実に仕えるものである。前述の我らが国王陛下またはその相続人によって求められた、あるいは召集された際はいかなる時もこれに応じ、彼らの損害を知りながら放置することはなく、力の限りそれを阻止し、あるいは彼らに知らせるものである。これらの事項を保持し守るために、我々は自身と相続人、そして全財産を拘束するものである。これについて、我々は聖福音書にかけて宣誓を行った。そしてその後、我々全員および各人は個別に、前述の我らが国王陛下に対し、以下の言葉をもって臣従礼を行った。「私は生きとし生けるすべての者たちに対抗し、生命、身体、および地上の名誉をかけて、あなたの忠実な臣下となります。」そして、我らが国王陛下御自身が、この形式にてこれを受け入れた。「余は、汝がいま現に占有権を有している所領について、これを受け入れる。ただし、余の権利および他者の権利を留保し、かつ『スコット人の王』であったジョン・ベイリオルが、もし彼が汝にいかなる土地を与えていたとしても、余が彼にスコットランド王国を返還した後に汝に与えた土地を除く」。さらに、我々全員および各人は個別に、前述の我らが国王陛下に対し、以下の言葉をもって誠実宣誓を行った。「私は誠実かつ忠実であり、イングランド王エドワード王およびその相続人に対し、生きとし生けるすべての者たちに対抗して、生命、身体、および地上の名誉にかけて、信義と忠誠を捧げます。いかなる場合においても、決して何人の武器も彼に向けず、彼およびその相続人に敵対する助言も援助も行いません。そして、彼から保持すると主張する保有地に付随する奉仕義務を、法に則り認め、法に則り履行します。神と諸聖人が私を助け給わんことを。」これらの事柄の証として、我々は我々の印章によって封をした、この開封書状を作成させた。イングランドの国王陛下の治世第24年、3月25日［1296年3月25日］、ワークにてこれを与える。
    ref: *Chron Guisborough*, 283-4.
    
