  - id: chron_langtoft_212-32
    title_ja: 『ピエール・ラングトフトの年代記』
    ja: ［前略］スコットランドは聖母神によって呪われるがいい。ウェールズは悪魔によって深淵に沈められるがいい！ どちらにも真実など微塵もなかった。ウェールズで戦争が始まるやいなや、アキテーヌの合意はフランス王によって破棄され、拒絶された。エドワード陛下とフィリップが争い始めると、愚かなスコットランド王、ジョン・ベイリオル (エドワード王によって王位に就いた者) は自らの愚かなバロンたちの助言を受け、臣従の誓いや誠実の誓いに背き、ローマの教皇庁に使節を送った。当時教皇の座にあったケレスティヌスに対し、彼らは偽りの主張を行い、古よりスコットランド王国とその尊厳は教皇に従うべきものであるとした。そしてエドワード王が権力と威圧によって意に反して臣従を強いたのだと述べ、自らが誓った王への忠誠から解放され、赦免されることを請うた。教皇ケレスティヌスはあまりに無分別であり、教皇書簡によってスコットランド王を赦免した。このことがスコットランドに伝わるとすぐに、バロンたちは自らの不名誉にも、スコットランドに12人の同輩を任命し、エドワードから主権を剥奪しようと謀った。賢明なるエドワードがジョン・ベイリオルに与えた多大な栄誉に対し、返ってきた恩義とはこのようなものであった。\n\nエドワード王が愚かなジョン王から受けた報いはこれである。スコットランドのことはさておき、以前に語った物語を完結させねばならない。\n\n［後略］
    ref: *Chron Langtoft*, 212-32.


  - id: chron_langtoft_232-58
    title_ja: 『ピエール・ラングトフトの年代記』
    ja: **西暦1296年**\n\nイングランド人であるワークのロバート・ロスが逃亡し、スコットランド勢に与して戦争に加わった。国王陛下エドワードは彼の城を接収してそこで復活祭を祝い、その後ベリック・アポン・ツイードに向けて出発し、その町を包囲した。哀れな人々［スコットランド人］は、当初イングランドの船2隻を奇襲して乗員を殺害した。エドワード王はこれを聞くと門を攻め立て、イングランド兵は休みなく堀を越えた。復活祭の金曜日の午後、彼はベリックの町を征服した。イングランド兵はそこで4000人のスコットランド人を殺害したが、自らも若干の損害を出した。エドワード陛下が失った騎士はわずか1人、リチャード・オブ・コーンウォールであった。彼は「赤い館」から放たれたフランドル人の弩の矢に射抜かれたのである。その館はまもなく占領され、火によって焼き払われた。城の守備隊長は軍勢を目にすると、攻撃を受ける前に城を王に明け渡した。そこにはウィリアム・ダグラスや、王を侮辱したリチャード・フレイザーらが選ばれて立てこもっていた。主イエス・キリストに慈悲あれ、王は彼らを捕虜とした。\n\n著名なマーチ伯パトリックは和平を求めて自ら王に服属した。ギルバート・アンフラヴィルはそれ以前からエドワード王に留まっており、彼に忠誠を誓っていた。ロバート・ブルース卿もまた、配下の全軍とともにエドワード王への忠誠を常に保ち、スコットランド勢に抗して［王への］愛を示した。ベリックが陥落すると、町の中からは金銀や他の金属、そしてその都市に属するあらゆる財宝が多量に発見された。ベイリオルは、彼の権力下にあった最も高貴な都市への出入り口を失った。エドワード王は剣によってそこを征服し、スコットランド人を嘲笑して、イングランド語の韻文でこう歌わせ、町の周囲に広く深い堀を巡らせた。\n\n穴を掘れ、溝を掘れ、嘲笑して言え、奴は溝を掘る、奴は穴を掘る、好きなだけ掘るがいい、それが一番のやり方だ。お前のその穴掘りは､多くの不快な思いとなり、真実が明らかになる、偽りなしに。お前の嘲笑はすべて､お前自身に降りかかる。スコットランド人は散り散りになり、小屋に押し込められ、決して栄えることはない。私が正しく読み解くなら、海辺に住んでいた者たちは、ツイード川に転がり落ちたのだ。\n\nエドワード陛下が伯やバロンたちとともにベリックを堀で囲ませている間に、マー、ロス、メンテイスの3人の伯が4万の悪党どもを率いてスコットランドから現れた。彼らは隠密に動き、タインデールを灰燼に帰し、コーブリッジの町とヘクサムおよびラナーコストの二つの修道院を放火によって滅ぼした。その地の人々を殺戮し、財産を奪い、参事会員たちを追い出した。この略奪の後、彼らは愚か者のように自らの破滅の地であるダンバーへと向かった。彼らは城を占領し、天幕を張った。そこはマーチ伯の居館であった。エドワード王はこれを聞くと聖なる教会を破壊した賊どもを捕らえ、ダンバーを奪還するために召集を命じた。その少し前、カンブレーの枢機卿が各国を巡ってフランス王からの返答を持って戻ってきた。また、名高いサヴォワ伯アマデウス卿やオットー・ド・グランソンも随行していた。彼はキプロスから仲間とともに帰還した者で、アッコンが陥落した際、海路を通って辛うじて脱出したのであった。以前に語った通り、聖なる教会に対していかに多くの悪行と裏切りが不当かつ無分別に行われたか。諸君も説教でよく耳にするように、神はすべての報いにおいて公正である。さて、神の敵たちが羊のように囲いに追い込まれ、逃げ場もなく捕らえられたダンバーの話を聞くがよい。\n\n5月の最初の火曜日、ベリック・アポン・ツイードにて王は報告を聞いた。ヘクサムやラナーコストを焼き払い、修道院さえ容赦しなかった愚かな悪党どもがマーチ伯パトリックの妻がいた海辺の城ダンバーを占領したというのである。エドワード陛下は直ちに、ワーレン伯、ウォリック伯、そしてヒュー・ディスペンサーを全軍とともに派遣した。バロン、陪臣、騎士、従騎士、南部人や北部人たちが勇んでこれに加わった。歩兵も必要に応じて十分に伴われ、彼らはダンバーに至って城を包囲した。彼らは容赦なく突撃の準備を整えた。城内の愚かな連中は援軍を期待し、いかにしてイングランド兵を欺くか策を練った。かつて我らがエドワード王のもとで扶持を受けていたリチャード・シワード卿が、欺瞞によってイングランド側と交渉するために送られた。彼は、もし3日間の猶予を与え、王ベイリオルに相談して状況を伝えることを許すならば、喜んで城を明け渡すと述べた。そして、もしその時までに解囲軍が来なければ、これ以上遅れることなく城を返還すると約束した。彼は人質を出し、同時にスコットランド軍に対して、後に記される通りの方法で状況を知らせた。\n\n使者は立ち去り、ジョン・ベイリオル王がいる場所にすぐに到着した。彼はシワードから教えられた通りに語った。「王よ、貴方のバロンたちはダンバー城で苦境にあります。エドワード王が彼らの所在を知ると、自軍の一部をそこに送りました。イングランド兵が到着して城を包囲した際、貴方の知己であったリチャード・シワード卿が城を出て、イングランド兵から3日間の休戦を勝ち取りました。それゆえ、貴方が派遣した部隊に対し、主君である貴方のもとへ行き、策略なしには勝機がないことを伝えるよう命じられました。イングランド側が与えた休戦期間内、明日の食事時の頃に、速やかにあちらへ向かってください。城内の味方が待ち伏せ、イングランド兵が予想だにしない時に出撃するでしょう。彼らを挟み撃ちにし、二度と戦場で貴方の民を害さぬよう固く捕らえてください。これ以外に道はありません。今こそ武装して出発しましょう。」\n\n敵どもは、捕らえられたなら、誰一人慈悲をかけるな。剣を振るえ、ノーサンバーランドは、正当に汝らのものとなる。この戦争により、イングランド全土が、滅びることを望め。かつてアルバニアが、剣の一撃で、これほどの手柄を立てたことはなかった。緑の野に、あの獰猛なる一族が、山羊のように集まった。私は思う、どこで牙が剥かれるか、いくつかの兆しが見えると。\n\n使者はならず者たちの群れ［スコットランド軍］のところへ行き、彼らは戦闘隊形を整え始めた。一方、策を授けたリチャード・シワード卿はイングランド側のところへ行き、「神にかけて、無数の歩兵を伴った大軍が来るのが見える。もし諸君が許すなら、彼らが近づけぬよう妨害しに行ってこよう」と言った。しかしイングランド側は「その必要はない」と言い、シワードがそれ以上進まぬよう捕らえ、門と壁に守備兵を配置した。若きハンフリー・ド・ブーンが守備を指揮し、城からの援軍が後方を襲わぬよう警戒した。彼らは戦馬に跨り、山を駆け上がった。最も速い者が他を追い越して進んだ。スコットランド勢は彼らが来るのを見ると、麦わらが風に舞うように、あるいは鶉のように尻尾を巻いて逃げ出した。イングランド兵は、森から狼が来るのを見た羊を追うように彼らを追撃した。傲慢なスコットランド人は、自分たちがコーンウォールを征服したコリネウス公にも匹敵すると思っていたが、あれほど武装した大軍であっても、誰一人として1銭の価値もなかった。ただ、留まって磨かれた剣で戦ったパトリック・グレイムを除いては。しかし、彼も間違いなく討ち取られた。この戦いで1万54人が殺害された。すべてがスコットランド人であり、その数は正確に数えられた。これこそが、ノーサンバーランドを荒らし回り、犬に内臓を食らわせた首謀者たちであった。彼らは書物と蝋燭によって破門されていた。なぜなら、彼らは聖なる教会も司祭も聖職者も、炉や乾燥棚と同じ程度にしか容赦しなかったからである。罪こそが彼らをこのような破滅へと追いやり、戦場で首と耳を失わせたのである。\n\n歩兵たちは、スコットランド人を泥沼に叩き込み、その尻を剥き出しにした。途上で、司祭の召使いが、これほど手柄を立てたという話は、決して聞いたことがない。戦場に倒れた、金持ちたちの服を、剥ぎ取るために。彼らは一人残らず連れて行かれた。あの粗野でボロをまとった卑怯者、地獄で彼らを引き裂け。\n\nこれほど短時間でこれほど多くの軍勢が打ち負かされ、抵抗もせずに引き返した戦闘はかつて記録されたことがない。死体は鴉に、魂は悪魔に、このような戦争を導いたすべての者に災いあれ！なぜなら、その地域［スコットランド］では、町の中でも外でも、かつて一度も善行が示されたことがなく、ただ村々を掠奪し、聖なる教会を焼き、聖職者を殺すことばかりであったからだ。ダンバーで復讐を果たされた神を讃えよ！悪行を働いた伯たちは、自らの親族らが敗北したことを知ると、イングランド兵が戻ってきた際に城を引き渡した。そして無条件で自らをエドワード王の意に委ねることを約束した。翌日、王は配下の貴族とともに到着した。捕らえられた捕虜たちが王に差し出された。3人の伯、3人のバロン、そして3人の名ある旗手に加え、28人の騎士、100人の従士がそこで発見された。2人の聖職者と2人のピカルディ人も含まれていた。伯たちはロンドン塔へ送られ、バロンたちの一部も同行した。他の者たちは別の城へと送られた。2人ずつ一緒にハックニー馬に乗せられ、ある者は荷馬車に乗せられ、脚には枷をはめられた。このような滑稽な姿で彼らの遊興は終わりを告げた。イングランド中のすべての地域で、彼らの傲慢さは語り継がれるだろう。この世が続く限り、彼らの行いは嘲笑の的となる。\n\nスコットランド人といえば、私は愚か者、そして不注意な哀れな者たちと呼ぶ。不運なことに、痛烈な一撃を受けるために、彼らはダンバーへと引き寄せられたのだ。\n\nさて、イングランドを滅ぼせると信じていたスコットランドの「12人同輩公」が計画したことについて語る時が来た。どのように企てられたか、詳しく説明しよう。フランス王がしばしば語られていたあの縁談の後に、不当にガスコーニュを領有しようとした際、エドワード王は軍勢を派遣し、フランス側から一部を戦争で取り戻した。スコットランド王ジョンは、伯やバロン、および聖職者たちの扇動により、共同の合意をもってセント・アンドルーズの司教をフランスに派遣した。その画策により、フランス王の弟であるシャルルが進み出て、スコットランド王の息子との同盟を結び、彼の娘を結婚させようとした。そして宣誓により、フランス人とスコットランド人は一体となって、ツイードからケントに至るまでイングランドを滅ぼすと決めた。フランス王は、望む時にいつでも速やかにツイードへ上陸し、それによってノーサンバーランドを不意に奪い、その後は妨害なしに全土を占領し、親族であれ誰であれ生存者を残さないつもりであった。しかし、その偽りの謀略は成果を結ぶことなく終わった。スコットランドの執事は不本意ながらも配下を連れてエドワード王のもとへやってきた。伯やバロン、および司教たちも、本心ではなかろうが悉く王の和平に応じ、帰順した。ジョン王とその息子は土地も領地も失い、裁判を待つためにロンドンへと連行された。今やエドワード王は、かつてアルバナッハが持っていたように、スコットランド全土を手中に収めた。\n\nウェールズ人も、アイルランド人も、我らがイングランド兵を、大いに助けた。それゆえスコットランド人は、我々の仲間によって、投獄された。そしてかの地は、この戦争によって、ついに失われたのだ。ウェールズ人は帰還し、アイルランド人も戻っていった、帆を上げ、風に乗って。諸君、イングランド兵よ、そこに留まれ……。敬虔に祈らねばならない。全能の主なる神が、王の会議において、ハマンを和解させ、モルデカイを追放せんことを。\n\nエドワードよ、汝のあらゆる道理のうちに、全能の神の神殿、ヘクサムにおける放火を忘却するな。そこであの軍勢は、人類の救済の象徴である十字架を焼き尽くしたのだ。ヘロデが打ち、幼子が死に、この苦悶の中でラケルは泣いている。エドワードよ、今こそ復讐を果たせ。\n\n汝は裁きを下す立場にある。正しく裁け。吊るされるべき者が吊るされるのを許せ。法は確かにそれを求めている。法に背く裁きをなす者すべてにとって、報いの苦しみは過酷で極めて無慈悲なものとなる。なぜなら、その苦しみは永遠だからだ。汝の敵を今こそ懲らせ。彼らが再び新たな混乱に向けて動き出すことがないように。人は慈悲を持つべきだ。しかし、反逆者に対してはそれは無効であり、そこにおいて法は慈悲を停止させる。王たる者は、友のためであれ金のためであれ、悪人を見逃してはならない。等しく裁きを下すべきである。もし王が神に仕えんと欲するなら、法を維持せねばならない。さもなくば、王は罪を犯し、大いなる過ちを犯すことになる。真実、ジョン・ベイリオルが学校に本を置き忘れた［王としての分をわきまえなかった］時、彼はひどく欺かれたのだ。\n\n彼の本の中では、空虚な妄想ばかりが育っていた。王国とともに手に入れたものを、彼はすべて失ってしまった。彼は分不相応な振る舞いをした。今や彼の肩衣は取り上げられ、彼の陣羽織は空っぽである。
    ref: *Chron Langtoft*, 232-58.
    
