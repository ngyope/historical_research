sources:

  - id: scotichronicon_bk_10_37
    title_ja: 『スコティクロニコン』第10巻第37章
    ja: **スコットランドとイングランドの王の間の争い、およびスコットランド王の息子アレグザンダーの婚姻について**\n\n主の1278年、両王の間の争いを鎮めるため、四旬節の半ばにツイード川畔のベリックにて、スコットランド王の側からはセント・アンドルーズ、グラスゴー、ダンブレーンの三人のスコットランドの司教が、伯およびその他の多数の貴族とともに会合した。一方、イングランド王の側からは、ノリッジとダラムの司教、ニューカッスル・アポン・タインの州長官、およびその他の多数の騎士や聖職者が、前述の境界および辺境地帯について協議するためにツイードマウスに集まった。しかし、交渉はまとまらず、彼らは引き揚げた。ウェールズ公ルウェリンは、ウスターにてシモン・ド・モンフォールの娘を妻に迎えた。\n\nそして翌年、第2代ロジャー・モーティマー卿はケニルワースで円卓会を開催した。彼は、自らの武具で身を飾った100人の騎士と同数の貴婦人たちとともに、王が前述のロジャーの息子たち（すなわちロジャー、ウィリアム、ジェフリー）を騎士に叙任したロンドン市から、ケニルワースへと進み出た。彼はそこで3日間にわたって馬上槍試合を開催し、四日目には自身のライオンをウォリックへ連れて行き、無事に連れ帰った。\n\n主の1279年、教皇マルティヌス4世が聖別された。そしてセント・アンドルーズ司教ウィリアム・ウィシャートが6月のカレンダエの5日前［5月28日］に死去した。同年、ウィリアム・フレイザーが8月のノーナエの前日［8月4日］に選出された。翌年、王アレグザンダー3世の息子デイヴィッドがスターリングにて死去し、ダンファームリンに埋葬された。\n\n翌年、イングランドの国王陛下とウェールズ人との間に、ルウェリン公の弟デイヴィッド・グリフィズによって、4月のカレンダエの10日前［3月23日］、すなわち枝の主日に戦争が勃発した。その日、前述のデイヴィッドはハワーデンにてロジャー・クリフォードを捕らえた。\n\n同年、アレグザンダー3世王の息子アレグザンダーが、冬の聖マルティヌスの祝日の次の日曜日に、ロクスバラにおいてフランドル伯卿の娘である高貴な乙女を妻に迎えた。フランドルの騎士や貴婦人たちの盛大な喝采を浴びてのことである。そこには、スコットランドの多数の司教や修道院長、伯、そしてバロンが大々的に集まり、15日間にわたって歓喜のうちに祝宴を続け、王室にふさわしい形で婚礼が祝われた後、ついに彼らは自らの領地へと帰っていった。\n\nしかし、ああ、何たる悲劇か！このような大きな喜びの後、わずかな時間のうちに深い悲しみが続いたのである。なぜなら、この優れた若者であり、王国の将来の相続人として期待されていた同アレグザンダーは、主の1283年、リンドーズにて死去し、第二聖アグネスの祝日［1284年1月28日］にダンファームリンに埋葬されたからである。享年20であった。\n\nしかしこれより少し前、すなわち主の1281年に、アレグザンダー3世王の娘マーガレットが、ホーコンまたはエイリークと呼ばれるノルウェー王と婚約した。彼女は8月のイドゥスの前日［8月12日］にスコットランドを後にし、ウォルター・ブロッホ伯およびそのメンテイス女伯、ならびにバルメリノ修道院長、バーナード・モワット、その他多数の騎士や貴族とともに、立派な装備で海を渡った。そして聖母被昇天の祝日の前夜にノルウェーに入国し、王から名誉ある歓迎を受け、同王の母親の反対を押し切って、その王国の絶対司教によって戴冠された。\n\nしかし、婚礼が厳かに執り行われた後、帰途についた前述の修道院長やバーナードをはじめとする多数の者たちが溺死した。一方、ウォルター伯とその妻は、一族全員とともにノルウェーからスコットランドへ無事に帰還した。しかし、この同じノルウェーの王妃マーガレット殿下は、夫である王とともに1年半暮らした後、弟アレグザンダーが死去したのと同じ年の初め、4月のイドゥスの5日前［4月9日］に、人間の宿命としての負債を支払った。彼女とノルウェー王の間には、同じくマルグレーテという名の1人の娘だけが生まれたが、彼女も成熟の年齢に達した頃、同じくこの世を去った。
    ref: Walter Bower, *Scotichronicon*, Book X, ch. 37.

  - id: scotichronicon_bk_10_38
    title_ja: 『スコティクロニコン』第10巻第38章
    ja:　**エドワード王の残虐性とウェールズ人の悲惨な隷従について**\n\nすなわち、兄弟であるアレグザンダーとデイヴィッド、そして姉妹のマーガレットとその娘マルグレーテの死が、スコットランドにやがて訪れる悲劇の始まりであった。ああ、なんという悲嘆か、おおスコットランドよ！ もしあなたも、これほど多くの哀悼と涙の日々がやってくること、それほどまでに数多くの災厄が間違いなく急速に近づいていることを知っていたならば。もしその大きさを知っていたなら、あなたは決して耐えられないと思っただろうに。\n\n前述のアレグザンダー王の長男であるアレグザンダーの死後、フランドル伯から遣わされた4人の騎士がスコットランドの国王陛下のもとを訪れ、最近亡くなった王の息子アレグザンダーの未亡人である同伯の娘を、彼女の父親のもとへ連れ帰ることを求めた。これについて国王陛下と彼の顧問たちは長く協議し、最終的に前述の貴婦人がその持参金のために国王陛下に何の忠誠も誓うことなく父親のもとへ帰ることに同意した。それはその通りに実行され、自国へ戻る彼らは惜しみなく見送られた。\n\nまた、ノルウェー王は、前述のアレグザンダー王の娘である妻マーガレットの死後、スコットランドの国王陛下のもとへ正式な使者を遣わした。これは、両王の間で結ばれ文書によって確約された協定に従い、特定の土地における700マークの地代を、前述の娘のために要求し受け取るためであった。国王はこれらの使者を丁重に迎え入れ、諸侯の助言のもとに手続きを済ませると、彼ら使者を多種多様な莫大な贈り物とともにノルウェー王のもとへ名誉をもって送り返した。\n\n同年、すなわち主の年1281年に、＜ロバート・ブルースの義理の息子である高貴なウォルターの祖父、スコットランドの家令アレグザンダーが死去した＞。そしてイングランド人の王エドワードは無数の軍勢を率いてウェールズに進軍し、そこでブリテン人の君主サウェリンを打ち破り、両陣営の少なくない民衆が殺害された。ついにその君主自身も残酷かつ反逆的に殺害された。そこで、おそらくは神の復讐により、イングランド王の多くの貴族たちが、ある者は水に溺れ、ある者は剣で殺され、ある者は天幕の中で突然死に見舞われて教会の埋葬を奪われ、犬のように野原で鳥のついばむに任せることとなった。前述の王は、彼らがこの世を去ったことを知ると、まるで非人間的で邪悪な者のように自らの部下の死を軽視し、「私は彼らを失ったのではない、彼らの母親たちを失ったのだ」とある者たちに豪語した。＜この征服については、以下の第15巻第27章を参照＞。\n\nサウェリンの死後、非常に多くのウェールズ人がデイヴィッド・グリフィンに従い、君主に対するように彼に服従して忠誠の誓いを立てた。この君主はその後、主の年1283年の聖マタイの祝日の翌日に捕らえられ、ロンドンにおいてあの暴君エドワード王により次のような判決が下された。すなわち、反逆者として馬で引き回され、泥棒として首を吊られ、強盗として斬首され、その体は4つに分割されて、王国の主要な4つの町にそれぞれの部位が吊るされるために送られるべし、と。＜そして彼の首はロンドン塔の上に掲げられた＞。\n\nさらにこの王からイングランドとウェールズ全土に布告が出され、布告役たちの恐ろしい声で宣言された。すなわち、ブリテン人の血を引く者は、いかなる身分であれ、城壁に囲まれた都市、城、要塞、町、あるいはいかなる防衛施設の中であっても、命や手足を失う刑罰の脅威の下で夜を明かしてはならない、と。\n\nしたがって、イングランドの隣国や国境を接する民が、前述の歴史を読み、ウェールズ人の例から教訓を得ずに、うっかりイングランド人の支配下に入り悲惨な隷従に陥ることがないよう、この章が手短に挿入されたのである。なぜなら、彼らについて一般に言われているように、「イングランド人は裏切りやすい仲間であり、良い召使いであるが、耐え難い主人あるいは君主である。また、彼らをどのような地位に置いたとしても、狡猾な狐のように変節しやすく欺瞞に満ちていることがわかるだろう」からである。\n\nそれゆえ、ある者はイングランド人や他の国民について次のように韻文を作り始めた。\n\n「彫刻家よ、お前が彫る時、イングランド人は狐のように、フランス人は子羊のようにせよ。ノルマン人は立派な大きな熊とし、しかしブリテン人は猪、スコット人はライオンとせよ。」
    ref: Walter Bower, *Scotichronicon*, Book X, ch. 38.

  - id: scotichronicon_bk_10_40
    title_ja: 『スコティクロニコン』第10巻第40章
    ja: 主の年1285年、教皇にして殉教者たる聖カリストゥスの日［10月14日］、スコットランド王アレグザンダー陛下はドルー伯の娘ヨランドと結婚した。この王家の婚礼を盛大に祝うため、フランスとスコットランドから数多の貴族と、男女を問わない無数の群衆が厳粛に集まった。祝宴が終わると、フランス人たちは様々な贈り物に喜ばされ、王妃とともに残る少数の者を除いて嬉々として帰国した。これほどまでに盛大な祝宴がスコットランドで行われたことは、過去に遡っても記録に読まれた例がない。\n\nしかし嘆かわしいことに、この類まれな祝宴は、直後にスコットランド人に対して、不吉あるいは嫌悪の兆候である満たされることのない飢えをもたらしたのである。なぜなら、場所が祝宴を飾り、祝宴が場所にふさわしいものとなるよう、その王室の婚礼はジェドバラ（Jedwod）で執り行われることが意図的に選ばれたからである。というのも、その場所自体が「ジェド（Jed）」と呼ばれる川と、母語で「森」を意味する「wod」から名付けられているからである。それゆえ、ある者はこう詠んだ。「水と森は真に、人を喜ばせるために生まれた二つの良きもの。それらから成るものは、それぞれが称賛に値すると言え」と。\n\nその王家の婚礼において万事が滞りなく進んでいた時のこと、宴会の席に連なる人々の間で、行列の形をとった一種の仮面劇が行われた。その技芸に通じた者たちが多種多様な楽器や悲劇的な音色を奏でる楽器を携えて先導し、他の者たちが後ろに続いて交互に、あるいは断続的に剣舞を華々しく踊る中、一人の何者かが後に続いた。それは人間なのか幻影なのか、ほとんど疑わしいほどの者であった。彼は一歩一歩歩くというよりは、むしろ影のように滑り動いているように見えた。その者が人々の目の前からまるでかき消えるように姿を消すと、狂騒的な行列全体は静まり返り、音楽は熱を失い、演奏は止み、舞踏の隊列は予期せぬ速さで凍りついた。\n\n笑いは悲しみに混じり、歓喜の果ては哀悼に取って代わられた。そして、あれほどの栄華の後、王国は不名誉にも泣き叫ぶこととなった。間もなく王国は自らを滅ぼし、結果として王をも失ったからである。\n\nなぜなら同年、4月のカレンダエの14日前［3月19日］、王はクイーンズフェリーにおいて暗闇が訪れるまで渡海を阻まれていたが、今夜はインヴァーケイシングを通り過ぎるべきではないという側近たちの忠告を退け、騎士の護衛に囲まれながら、早足でキングホーンへと急いだ。その西側の海岸沿いで馬が砂につまずき、ああ、高貴なる王は供回りの注意もむなしく首の骨を折り、息を引き取った。そして、王にふさわしくダンファームリンの修道院に埋葬されたのである。\n\n彼の死がスコットランド王国にとってどれほど涙を誘い、有害なものであったかは、その後の時代が被った損害が明白に物語っている。これほど偉大な王の栄光への旅立ちについて、予期せぬ死が突然であったからといって疑う者はいない。「善く生きた者は悪く死ぬことはない」と言われるからである。それゆえ、ある者はこう詠んだ。「善き人生を歩んだ正しき者の突然の死は、そのように死したからといって、その功績を減ずるものではない」と。\n\n彼について、次のような韻文が残されている。「1000年と200年、そして50を1回、10を3回、5を重ねた年（1285年）、4月のカレンダエの14日前に、アレグザンダー3世はキングホーンにて死し、ダンファームリンの教会の内に、歴代の王らと共に葬られ眠っている。彼は37年間統治し、その生涯は満たされることはなかった。彼の高貴な心臓はパースにて安らかに眠る。かくして、この後のこの王国について、神が定めたもうことを。」
    ref: Walter Bower, *Scotichronicon*, Book X, ch. 40.

  - id: scotichronicon_bk_11_3
    title_ja: 『スコティクロニコン』第11巻第3章
    ja: **イングランド王がいかにして悪意をもってスコットランド人を呼び出したかは、以下の記述によって明らかである。**\n\n事の次第をより明白にするために記す。恩寵の年1286年、復活祭の2週間後、スクーンにおいて議会が開かれ、そこで前述の6名の王国守護が任命された。ある書物が記すところによれば、そのうちの一人はダンケルド司教であった。また他の者は、ダンカン・オブ・ファイフが殺害された後、彼がその代理となったと主張しているが、これについては後述する。\n\nしかし、その場において、老ロバート・ブルース、すなわちロバート王の祖父とジョン・ベイリオルの間で、スコットランド王国の継承権を巡り激しい論争が交わされた。ジョンはハンティンドン伯の娘たちの長姉であるダーヴォルギラの血筋から出ている上、その母もまだ存命であり、自分こそが統治すべきであると主張した。 対してロバート・ブルースはこれに反論し、次のように述べた。「否。たとえ私が次姉の血筋から出ているとはいえ、最初の男子であり、血縁の近親度において一等親近い。私は同伯デイヴィッドの孫であるが、男子が見出される限り女子が継承すべきではなく、また曾孫が孫に優先されるべきではない」と。\n\n双方からのこのような極めて強力な主張が聞かれる中、聖職者の間でも民衆の間でも、ロバート・ブルース派とジョン派に王国が二分される大分裂が生じた。ある者は、ジョン・ベイリオルが長姉の娘から生まれ、長子相続の権利に支えられているとして、彼を王に推戴しようとした。他の者はこれを全面的に否定し、ロバート・ブルースこそが、次姉の家系とはいえ、男子であり、かのデイヴィッド伯に対し一等親近いため、継承すべきであるとした。\n\nこのような論争やその他の上述の理由により、最終的に彼らは全会一致で、前述の方法と形式に則り、イングランド王エドワードに仲裁を委ねることで合意した。彼らは、彼が両者の権利に関する訴訟の宣言者となり、法が要求するところに従って、判決に背く側を然るべく強制することを決定したのである。\n\nそこで議会において、ブレチン司教（ただし、セント・アンドルーズ司教とする説もある）、ジェドバラ修道院長、およびジェフリー・モウブレイが選出され、スコットランド王国の状態とペンリスの所領について、エドワードの助言と保護を乞うこととなった。これらの使節は同年、聖ドナトゥスの日［8月7日］に旅立ち、ガスコーニュへ向かった。彼らはニューカッスルからサン＝ジャン＝ダンジェリーまで、ロンドンでの1日を除き、1日たりとも休むことなく旅程を続けた。彼らはサントにて前述の王を見つけ、そこで旅の理由を説明した後、スコットランド方面へ戻り、聖カタリナの日［11月25日］にクラックマナンに到着し、イングランド王の返答をもたらした。\n\nその日、同地には王国摂政たちが集まっていた。というのも、当時、王妃ヨランドが懐妊していると言われており、彼らはその子が産まれ、それを見るのを待っていたからである。しかし、この件が不首尾に終わるか、あるいは流産となると、前述のイングランド王は喜び勇んでイングランドへと歩みを急いだ。そして可能な限り速やかに、自国の高位聖職者や貴族を招集し、スコットランド人たちが助言と援助を求めて送ってきた使節のことを知らせた。彼は、スコットランド王国とその住民を完全に自身の支配下に置く絶好の機会が到来した、と言ったが、それは後の事態によってより真実であることが証明された。こうして、貴族たちの助言と同意を得て、彼はフランスの法学者たちに、スコットランド王国の継承に関する自身の計画と決定を求めるにあたり、事実関係を不適切に提示して諮問したのである。
    ref: Walter Bower, *Scotichronicon*, Book XI, ch. 3.

  - id: scotichronicon_bk_11_ch_24
    title_ja: 『スコティクロニコン』第11巻第24章
    ja: **いかにして、前述の障害にもかかわらず、彼が修道院長のように振る舞ったか**\n\n前述の障害があったにもかかわらず、ある種の好意によって増長した彼は、小修道院の統治に自らを押し込んだ。そのため、三部会の総評議会 (スコットランド王ジェームズ1世が当時イングランドに抑留されていた時期のことである) において、すべての世俗的財産は摂政の手に戻されるべきこと、続いて聖職者会議において、同修道院のすべての教会収益が差し押さえられるべきことが定められた。しかし、今日に至るまで前述の措置が正当に解除されたとは認められていない。それどころか、かのウィリアム・ドラクスはその評議会において、彼の手下、共謀者、代理人、支援者のすべてと共に名指しで厳粛に破門され、そのように公示されたのである。それゆえ、教会に対してこれほど過度の罪を犯した彼のような者が、このような極悪非道な行いについて教会から庇護されたり、そこから利益を得たりすることは不適切であった。それにもかかわらず、彼はスコットランド人によって連れ戻されたか、少なくとも受け入れられたか、あるいは先導されたかして、前述の毒蛇のごとく王国の懐に入り込んだ。そして、ウィリアム・アランという名の高名な船長を些細な口実で偵察し、イングランド人に逮捕させ、殺害させた。それも屈辱的なことに、単に斬首しただけでなく、国王陛下（殺されたウィリアムはその臣下であった）への侮辱として絞首刑にし、その結果、イングランド人が驚嘆して見るための矢の的として、〈高い場所に縛り付けられ〉刑架の上に晒したのである。このような重罪ゆえに王は激怒し、ドラクスは王が存命の間、二度と公然とスコットランド王国に入国する勇気を持たなかった。しかし王の死後、彼はすぐに馴染みとなり、スコットランド人によって小修道院に迎え入れられた。そして彼が死ぬと、別のダラムの修道士がそこに配置された。このように、イングランド人による王国の嘲笑の種が（今も）存在している。\n\n年代記に戻ろう。 さて、イングランド人によるベリックの町の攻略と、ファイフのスコットランド人の悲惨な虐殺を耳にして、ベリックの町の救援のためにジョン王から派遣されていたスコットランド軍は、同年5月のカレンダエの5日前［1296年4月27日］、ダンバーにてイングランド軍と交戦した。そこでパトリック・グレイムと多くの貴族たちが傷ついて倒れた。また、その他多くの騎士やバロンたちは命が助かることを期待してダンバー城へと逃げ込み、そこで快く迎え入れられた。しかし、彼ら全員、すなわち名高い従騎士やその他の有力者たちを除く70名の騎士、ならびにロス伯ウィリアム (およびメンティス伯) を、同城の城守であったリチャード・シワードという名の者が、あたかも屠殺のために差し出された羊のごとく、すべてイングランド王に差し出した。王は彼らを慈悲なく、直ちに様々な死と刑罰に処すよう命じた。この戦いの中から、ウォルター・シワードという名の高貴な騎士が、彼が幼少期よりスコットランド人として育て、とりわけ信頼を置いていたイングランド生まれの槍持ちの召使ただ一人を連れて脱出した。マッセルバラとレッドフィゴットの間を二人だけで馬で進んでいた時、騎士はその従者に、涙にむせびながら、スコットランドの不運について深い不満と悲痛な嘆きを吐露していた。 「ああ」と彼は言った。「我々の敵であるイングランド人によって、生まれ故郷が破滅し、間もなく征服されようとしている！そしてああ、かつて私の親族でありながら、今や王国の最も不誠実な裏切り者となったリチャード・シワードよ！私はどうして生きていられようか。砦が敵の手に渡り、我々が屠殺される羊のように見なされ、わが同胞が打ち砕かれるのを見るなどとは！」騎士が、心配そうな足取りで先を行く従者と、これやこれに類する言葉を交わしていた時、不実な従者は好機と見て、悲嘆に暮れる主人の背中を槍で突き刺し、馬から地面に投げ出され、思いがけない事態に無防備であった彼を、自らの剣で直ちに喉をかき切って殺害した。彼はホリルードに埋葬された。その後、前述の通り、ウィリアム・ウォレスがイングランド人を王国から追放するために大きな活動を起こした。
    ref: W. Bower, *Scotichronicon*, book XI, ch. 24.

  - id: scotichronicon_bk_11_ch_25
    title_ja: 『スコティクロニコン』第11巻第25章
    ja: **ジョン・ベイリオルとロバート・ブルースの支持者について、およびイングランド王がロバート・ブルースになした返答について**\n\n記されるべきは、スコットランド王国の継承権を巡って高貴なるブルースとベイリオルの間で最初の不和が生じて以来、王国そのものが2つに分断されていたことである。すなわち、すべてのカミン一族とその全支持者たちはベイリオルを支援していた。一方でブルースの側には、グラスゴー司教ロバートが愛の断ち難き絆をもって堅固に座し、マーとアソルの伯たちが親族としての固い盟約の下、その権力の総力を挙げて味方した。こうした理由により、世間の評判によれば、前述の伯たちはその軍勢と共に、前述の戦い［ダンバーの戦い］の日、ブルース側への愛と好意ゆえに戦場から無傷で逃走したのである。そしてこのようにして、敵対する側［ベイリオル側］には大いなる破滅が開かれ、双方にとっての敵［イングランド王］はいかに喜ばしく愉快な勝利を手にしたことか。そして、あたかも後にロバート・ブルースが王として戦った際にベイリオルの全支持者が反逆の疑いを持たれたように、ベイリオル自身の戦争においても、前述の司教および伯たちはブルース側の全支持者と共に、王と王国の裏切り者であると一般に見なされていたのである。しかし、ああ悲しきかな！ このような不和のために、罪なき民衆は狼たちの狂暴な牙にさらされ、広大な領域にわたって傷つき打ち捨てられたのであった。\n\nこうしてダンバーにてスコットランド人に対する勝利が得られた後、老ロバート・ブルースはイングランド王のもとへ参じ、王国の獲得について王がかつて彼に約束していたことを誠実に履行するよう求めた。これに対し、あの古き欺瞞の匠［エドワード1世］は、少なからぬ怒りをもってフランス語で次のように答えた。「Ne avons ren autres chosis a feris que a vogis reamgis ganer?」これはすなわち、「我々は汝のために王国を勝ち取ること以外に、なすべきことがないとでもいうのか？」という意味である。この返答によって、高貴なる男［ブルース］はこの老獪な王の欺瞞を理解し、イングランドにある自らの領地へと退き、それ以上スコットランドには姿を見せなかった。\n\nダンバー城の攻略については、以下の詩句が伝えられている。\n\n前述の年、王は密集した軍勢をもって、ダンバーの城を奪った。欺瞞には欺瞞が相応しかった。そこで多くの者が捕らえられ、牢獄へと投じられた。これは5月のカレンダエから数えて5日前のことと言われている。
    ref: W. Bower, *Scotichronicon*, book XI, ch. 25.

  - id: scotichronicon_bk_11_ch_26
    title_ja: 『スコティクロニコン』第11巻第26章
    ja: **ジョン王の捕縛と、イングランド王の手への王国の譲渡について**\n\nそこからエドワード王は進軍し、ダンバー、エディンバラ、およびスターリングの各城を明け渡させ、スコットランド王ジョンをフォーファー城まで追跡した。\n\nストラボギー卿ジョン・カミンはこれに出迎え、王の和平に入った。ある報告によれば、その直後、彼はジョン王その人を、狡猾にもアバディーンからモントローズ城にいる息子エドワードのもとへ連れ戻したという。イングランド王がそのモントローズ城に到着すると、同所にてジョン王は、王の装飾具を脱ぎ捨て、手に白い杖を持ち――これについては同書の第63章に見られるように、暴力と生命の恐怖に導かれてのことである――スコットランド王国において彼が有した、あるいは有し得たすべての権利を、棒と杖をもって返上し、イングランド王の手に権利放棄した。そして、この譲渡に関して、以下のような主旨の自らの書状を彼に引き渡した。\n\n「神の恩寵によるスコットランド人の王ジョンより、本証書を閲覧するすべての者へ、挨拶を送る。余は、一部の邪悪な者たちの扇動および余の者たちの悪しき助言によって、最近愚かさにも誘い込まれ、かつ詐欺的に欺かれ、余の名高き君主にして主君、神の恩寵によるイングランド王、アイルランドの主、アキテーヌ公であるエドワード卿に対し、重大な過ちを犯し、激しい怒りを引き起こした。余は自らの衝動により、種々の方法で、とりわけ、余が彼の誠実、臣従礼、および保護の下に留まっていたにもかかわらず、豊かかつ慎ましく生きることを拒み、むしろ最後まで (平和を) 維持することを知らず、フランス王との相互的な併合の軛、盟約、および同盟の絆を軽率にも結んでしまった。この結びつきをより明白なものとするため、余の息子でありスコットランド王国の継承者であるエドワードとの婚姻のために、彼の兄弟であるシャルル卿の娘を請い求め、余の主君であるイングランド王に対し少なからぬ不法行為と損害を与えた。このようにして、彼の主要な敵に固執して彼を怒らせ、彼の王としての威厳を傷つけ損なう行為に及び、彼とその民に対し、領土の破壊、彼の民および臣下への略奪、さらには戦争による恐るべき侵略をもって、余の力の限り激しく反乱を起こしたのである。その他については省略するが、余のこの入り組んだねじれはあまりにも優勢となり、余の心の野蛮さを盲目にしたため、前述の主君への誠実、主従関係、および誠実宣誓を無秩序に断ち切り、完全に軽蔑するに至った。前述の忌むべき徴発や戦争による略奪による荒廃の後、余は、スコットランドの地において法的に前述の主君の封土に自由に属する（あるいは正当に属すべき）城、村、砦、および町にいる余の部下や余の地の臣下たちを、まさにその主君の利益、自由、および封土を打ち砕くために、残虐にも配置したのである。それゆえ、余の悪意ある行為が報いを受け、前述の主君の怨恨と激しい憤りを引き起こしたため、また余が反抗的であったため、同主君は強力な手と強固な武力をもってスコットランドの地に敵として侵入し、極めて強大な力でこれを征服し、再び彼の服従下に置いた。余の力や権力は、抵抗するための勇気や活力をいかなる方法でも発揮することはなかった。それにもかかわらず、彼が上級君主として正当に封土を与えた者として、この侵略および敵対的な踏破を行うことは、自由にかつ法的に可能である。なぜなら、余は前述の通り、彼とその民に対し多大なる損害、不法行為、苦難を与えたことにより、彼への臣従礼を、誠実および誠実宣誓と共に否定したからである。したがって余は、前述の損害を誓いに従って償うことを望み、純粋な判断と余の自由意志、および自由かつ完全な権限をもって、前述の主君に対し、前述のスコットランドの全土を、そのすべておよび個々の民、住民、居住者、ならびにすべての臣従礼と誠実宣誓と共に返還し、自発的かつ無償で譲渡する。この証として、余はこの特許状を余の主君である王のために作成させた。主の年1296年、余の治世第4年、7月10日。」
    ref: W. Bower, *Scotichronicon*, book XI, ch. 26.
