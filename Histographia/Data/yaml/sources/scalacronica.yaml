  - id: scalacronica_38
    title_ja: 『スカラクロニカ』第38章
    ja: **……ジョン・ベイリオル……臣従礼**\n\nこのスコットランド王ジョン・ベイリオルは、戴冠の後の次の主の降誕祭にニューカッスル・アポン・タインへ来訪し、スコットランド王国のために、征服王以来の初代イングランド王エドワードに対し王としての臣従礼を行った。こうして彼は、イングランド王の手に接収されていたスコットランドのすべての城砦の占有権を回復した。その直後、あるスコットランドのジェントルマンによるイングランド王の法廷への上訴が始まった。彼は、近隣の者との争いにおいてスコットランド王の法廷では公正な権利が得られないと判断したためである。これによってスコットランド王ジョンは、イングランド王の令状により、その男に対して法を行うよう召喚されたため、スコットランドの評議会は大いに動揺した。/n/n時を同じくして、バイヨンヌとフィポートの船乗りたちがサン・マロにてノルマンディーの船団と衝突したことを発端として、イングランド王とフランス王の間で再び戦争が勃発した。そこでスコットランドの評議会は、スコットランドの地を統治するために4人の司教、4人の伯、4人のバロンを任命し、彼らの助言によってイングランド王に対して反乱を起こすことが画策された。彼らはフランス王のもとへジョン・ソールズらを使者として送り、イングランド王に対抗する同盟を結んだ。スコットランド人を全く信用していなかったイングランド王は、彼らと交渉するためにダラム司教アンソニーを派遣した。ジェドバラでの交渉の最中、小競り合いによって乱闘となり、同ダラム司教の親族でブシーという姓を持つ者が1人殺害された。ダラム司教はフランスとの戦争中、イングランド王が彼らを信頼できるようにスコットランド側へ4つの城、すなわちベリック、ロクスバラ、エディンバラ、スターリングの引き渡しをイングランド王の名において要求した。その上で彼は、四旬節の中頃にニューカッスル・アポン・タインで開催されるイングランド王の議会へ個人的に出頭するようにとの、彼らの王ジョン宛ての召喚令状を提示した。しかしその時、その場所にスコットランド王は来ず、代理の者も来なかった。そのためイングランド王エドワードは、大軍を率いてスコットランドへ向かい、ワークにて過越の祭を祝った。この城の主であったロバート・ロスは、クリスティアナ・モウブレーへの愛ゆえに、王が到着する3日前にイングランド王への服従を捨てて逃亡した。彼は城を空にして、スコットランドにあるサンカーという彼の小さな城へ退いたが、後に彼女は彼を受け入れようとはしなかった。\n\nこの時、バカン、メンテイス、ストラザーン、レノックス、ロス、アソル、マーの7人のスコットランドの伯たちは、ジョン・カミンおよび他の多くのバロンと共に軍を率いてイングランドへ侵入し、誰も容赦せず、カーライルの郊外を焼き払い、これを包囲した。これを聞いたエドワード王はベリックの前へと進軍した。彼が到着した初日、王が天幕で食事をとっていた時、物資を積んだ彼の1艘の船が船乗りたちの不手際によって、当時は城壁がなく高い堀に囲まれていただけの町の方へ向かって岸に乗り上げてしまった。町の一般民衆は船に駆け寄り、火を放ち、乗組員たちを切り殺した。王の軍営では騒ぎが起こり、皆が武器を取った。彼らは馬に拍車をかけ、荒々しい若者たちは馬に乗ったまま堀を乗り越えた。町の人々が堀の長さに沿って作った小道を通って、真っ先に到着した者たちが馬のまま猛然と侵入した。内部では守備隊として駐留していたファイフとフォルシーフの一般民衆の多くが殺害された。その夜、エドワード王は城を含めた町全体を征服し、そこに留まった。そこへ、スコットランド王ジョンの代理として、ロクスバラの修道士の長であるフランシスコ会士が王のもとへやって来て、スコットランド王および一般民衆の公的な書簡によって、スコットランド王の臣従の破棄を伝えた。イングランド王はこの書簡を受理し、公に記録させた。\n\n同刻、前述のスコットランドの伯たちは再びイングランドへ侵入し、ヘクサムの小修道院を焼き払い、その地方に大きな害をなした。スコットランドの諸侯の中でただ1人イングランド王への服従を守り、ベリックの攻略において王と共にいた「黒髭」のマーチ伯パトリックが王に次のように告げた。「私の妻がダンバーにある私の城に、親族であるスコットランドの敵たちを引き入れました。彼らは私の役人を追い出し、私に逆らって城を保持しています」。そこで彼は王に助けを求め、その夜に出発することを願った。王はワーレン伯とウォリック伯に海路と陸路で大規模な軍勢を与え、彼らは翌日の日の出前にダンバー城を包囲した。集結していたスコットランドの諸侯は包囲の知らせを聞き、夜通し行軍して朝にはスポットへ到着した。同地とダンバーの間で、彼らは包囲を行っていたイングランド勢と交戦したが、スコットランド勢は敗北した。これがこの戦争の最初の会戦である。城の中では、メンテイス、アソル、ロスの各伯と6人のバロン、若ジョン・カミン、ウィリアム・シンクレア、老チャード・シワード、ジョン・インチマーティン、アレクサンダー・マリ、キルブライドのエドマンド・カミン、および29人の騎士と80人の従騎士が捕らえられ、イングランド各地の牢獄へ送られた。イングランド王エドワードはスコットランドのすべての城砦を接収し、全土を行軍してストックフォードに至り、役人を配置した。その帰路、彼はスクーン修道院から、スコットランドの王たちが即位の際に座る慣習であった石を持ち出させ、ロンドンのウェストミンスターへ運ばせ、主祭壇の司祭の席とした。\n\nイングランド王エドワードはベリックに議会を召集させ、そこでスコットランドのすべての有力者たちから臣従の誓いを受け、永遠の記憶として彼らの印章が懸垂された文書を得た。そこから彼はイングランドへ帰還し、ニューミンスター修道院において、ワーレン伯にスコットランドの守護と総督としての印章を委ね、冗談交じりに「糞から逃れる者は良い仕事をするものだ」と彼に語った。王はヒュー・クレシンガムをスコットランドの侍従長に、ウィリアム・オームズビーを地方統監に任命した。そして彼らに対し、15歳以上のすべてのスコットランド人が臣従の誓いを立て、彼らの名前が書き留められるよう命じた。書記官たちは各人から1ペニーを徴収し、それにより彼らは裕福になった。王はスコットランドのすべての領主たちに対し、フランスとの戦争が続く間はトレント川の対岸に留まるよう命じた。恩寵の年1297年、彼はイングランドとスコットランドの羊毛1袋につき半マークのスターリング銀貨を徴収したが、以前はわずか4ペンスしか支払われておらず、このためそれは悪税と呼ばれた。王はその後ガスコーニュへと向かった。\n\nその頃、5月に、ウィリアム・ウォレスはスコットランドの共同体によってイングランド人に対して戦争を起こすための指導者に選ばれ、手始めにラナークにおいて、イングランド王によってクライズデールの州長官に任じられていたウィリアム・ヘーゼルリグを殺害した。前述のウィリアム・ウォレスは夜に乗じて同州長官を急襲し、同州長官の随員であったトマス・グレイは、イングランド人たちが応戦する乱戦の中で身ぐるみを剥がされ、死んだものとして放置された。このトマスはスコット人たちが火を放って燃え盛る2軒の家の間に一晩中裸で横たわっていたが、その熱によって命を取り留め、夜明けに発見され、ウィリアム・ランディによって運び出されて治療を受けた。そして次の冬、ウィリアム・ウォレスはノーサンバランド全域を焼き払った。\n\nイングランド王の代理としてスコットランドの守護を任されていたワーレン伯は南方にいたが、スコットランドへ向かい、スターリングの橋においてウィリアム・ウォレスに敗北した。ウォレスは戦闘態勢を整えて待ち構えており、自らが望むだけの数のイングランド人を橋を渡らせた後、好機と見るや突撃し、橋を落とした。そこで王の財務官ヒュー・クレシンガムを含む多数のイングランド人が命を落とした。伝えられるところでは、スコット人たちは彼の皮を剥ぎ、その皮から見せしめのために革紐を作ったという。ワーレン伯はベリックへと逃亡した。この敗北の直後、スコット人たちの支持を集めたウィリアム・ウォレスは大軍を率いて同ワーレン伯を追撃した。彼はベリック近郊のハットン・ムーアに陣頭を進めたが、イングランド軍が彼と戦うために陣を構えていると考えたため、それ以上はベリックに近づくことなく引き返し、ダンズの御苑に野営した。同ワーレン伯はウィリアム・ウォレスが接近してくるとベリックから退去して同市を放棄し、王がガスコーニュに滞在していたため、ウェールズ公であった王の息子の下へと向かった。この知らせを受け、王はイングランドへと帰還した。\n\nグラスゴー司教とダグラス卿ウィリアムは、同ワーレン伯がスコットランドに最初にやって来た際、自分たちはウィリアム・ウォレスの反乱に同意していなかったと弁明に訪れた。しかし彼らが以前はウォレスに加担していたため、同伯は彼らを投獄し、司教をロクスバラ城に、ウィリアム・ド・ダグラスをベリック城に収監し、ダグラスはそこで不遇の死を遂げた。［後略］
    ref: T. Gray, *Scalacronica*, 38.


