<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Histographia: Scottish Experience 1286-1296</title>
<style>
  :root {
    --bg: #191b24;
    --panel: rgba(34, 37, 50, 0.92);
    --panel-elev: #2d3143;
    --panel-glass: rgba(26, 29, 39, 0.82);
    --border: rgba(143, 152, 184, 0.22);
    --border-strong: rgba(167, 139, 250, 0.46);
    --text: #e7eaf2;
    --muted: #97a0b7;
    --accent: #a78bfa;
    --accent-soft: rgba(59, 47, 94, 0.78);
    --accent-glow: #c4b5fd;
    --edge: rgba(129, 136, 171, 0.52);
    --edge-outer: rgba(129, 136, 171, 0.3);
    --error: #f87171;
    --accent-warm: #f59e0b;
    --accent-warm-soft: #3a2c12;
    --accent-warm-glow: #fcd34d;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.36);
    --codex-height: min(46vh, 380px);
    --mode-background:
      radial-gradient(circle at top, rgba(88, 64, 160, 0.22), transparent 42%),
      radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08), transparent 28%),
      linear-gradient(180deg, #1b1d27 0%, #151821 100%);
    --fog-mask: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 32%,
      rgba(19, 21, 28, 0.16) 58%,
      rgba(16, 18, 24, 0.6) 86%,
      rgba(16, 18, 24, 0.78) 100%
    );
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Mincho Pro", "Yu Mincho", "Noto Serif JP", "Times New Roman", serif;
    color: var(--text);
    background:
      radial-gradient(circle at top, rgba(88, 64, 160, 0.22), transparent 42%),
      radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08), transparent 28%),
      linear-gradient(180deg, #1b1d27 0%, #151821 100%);
  }
  #app { position: relative; height: 100vh; overflow: hidden; }
  #app.mode-chapter-graph {
    --mode-background:
      radial-gradient(circle at 22% 16%, rgba(120, 98, 222, 0.22), transparent 34%),
      radial-gradient(circle at 78% 18%, rgba(245, 181, 67, 0.08), transparent 26%),
      linear-gradient(180deg, rgba(20, 22, 31, 0.98) 0%, rgba(16, 19, 28, 0.98) 100%);
  }
  #app.mode-chapter-sources {
    --mode-background:
      radial-gradient(circle at 18% 18%, rgba(245, 158, 11, 0.18), transparent 30%),
      radial-gradient(circle at 74% 14%, rgba(102, 126, 234, 0.16), transparent 30%),
      linear-gradient(180deg, rgba(27, 25, 20, 0.98) 0%, rgba(20, 23, 31, 0.98) 100%);
    --fog-mask: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 34%,
      rgba(28, 24, 17, 0.12) 58%,
      rgba(22, 20, 16, 0.46) 86%,
      rgba(18, 18, 16, 0.62) 100%
    );
  }
  #app.mode-source-chapters {
    --mode-background:
      radial-gradient(circle at 18% 18%, rgba(63, 171, 181, 0.18), transparent 30%),
      radial-gradient(circle at 76% 16%, rgba(236, 201, 75, 0.12), transparent 28%),
      linear-gradient(180deg, rgba(16, 24, 28, 0.98) 0%, rgba(14, 18, 25, 0.98) 100%);
    --fog-mask: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 36%,
      rgba(13, 34, 36, 0.12) 58%,
      rgba(11, 23, 28, 0.42) 86%,
      rgba(10, 18, 22, 0.58) 100%
    );
  }

  header {
    position: absolute;
    top: 18px;
    left: 20px;
    right: 20px;
    z-index: 30;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: start;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .brand-stack,
  .header-progress,
  .header-actions {
    border: 1px solid var(--border);
    background: var(--panel-glass);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
  }
  .brand-stack {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 14px 18px;
    border-radius: 18px;
  }
  .brand-kicker {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header h1 { font-size: 23px; margin: 0; font-weight: 600; line-height: 1.15; }
  .header-progress {
    display: none;
  }
  .header-progress-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .header-progress strong {
    font-size: 14px;
    color: var(--accent-glow);
    font-weight: 600;
  }
  .header-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 18px;
  }
  header button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    background: rgba(19, 22, 31, 0.62);
    color: var(--accent-glow);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    cursor: pointer;
  }
  header button:hover { background: var(--accent-soft); }

  /* Start screen */
  #start-screen {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(320px, 1.1fr) minmax(320px, 0.95fr);
    gap: 24px;
    align-content: center;
    padding: 120px 32px 32px;
    overflow: auto;
  }
  .start-card {
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 32px;
    background: linear-gradient(180deg, rgba(39, 42, 57, 0.95), rgba(28, 31, 42, 0.88));
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
  }
  .start-copy-card {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background:
      linear-gradient(180deg, rgba(26, 29, 41, 0.58), rgba(26, 29, 41, 0.9)),
      radial-gradient(circle at top, rgba(167, 139, 250, 0.16), transparent 38%);
  }
  .start-select-card {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .start-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .start-card h2 { font-size: 40px; margin: 0 0 18px; line-height: 1.1; }
  .start-card p {
    font-size: 15px;
    line-height: 1.9;
    color: var(--muted);
    margin: 0;
    white-space: pre-wrap;
    max-width: 34em;
  }
  .start-card-head {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .start-card-head h3 {
    font-size: 22px;
    margin: 0;
  }
  .start-card-caption {
    font-size: 13px;
    color: var(--muted);
  }
  .start-card button {
    font-family: inherit;
    font-size: 15px;
    padding: 14px 28px;
    background: linear-gradient(135deg, var(--accent), #6d80ff);
    color: #11131a;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    align-self: flex-start;
    box-shadow: 0 14px 30px rgba(109, 128, 255, 0.24);
  }
  .start-card button:hover { opacity: 0.88; }
  .start-preview {
    grid-column: 1 / -1;
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 28px;
    background: linear-gradient(180deg, rgba(30, 33, 44, 0.94), rgba(24, 27, 37, 0.88));
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
  }
  .preview-kicker {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .preview-title {
    font-size: 24px;
    line-height: 1.35;
    margin: 0 0 14px;
  }
  .preview-summary {
    font-size: 14px;
    line-height: 1.85;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .preview-facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .preview-fact {
    padding: 12px 14px;
    background: rgba(19, 22, 31, 0.56);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .preview-fact-label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }
  .preview-fact-value {
    font-size: 15px;
    color: var(--text);
  }
  .preview-list-title {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .preview-list {
    margin: 0;
    padding-left: 18px;
    color: var(--text);
    line-height: 1.8;
  }

  /* Main view */
  #main-view { position: absolute; inset: 0; overflow: hidden; min-height: 0; }
  #map-pane {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--mode-background);
    transition: background 220ms ease, filter 220ms ease;
    cursor: grab;
    user-select: none;
    z-index: 1;
    --scene-enter-scale: 0.9;
    --scene-enter-x: 0px;
    --scene-enter-y: 0px;
    --scene-leave-scale: 1.04;
    --scene-leave-x: 0px;
    --scene-leave-y: 0px;
  }
  #map-pane.is-dragging { cursor: grabbing; }
  #map-pane.mode-transitioning {
    pointer-events: none;
    filter: saturate(1.04);
  }
  #map-pane.transition-to-chapter-sources {
    --scene-enter-scale: 0.88;
    --scene-enter-y: 18px;
    --scene-leave-scale: 1.05;
  }
  #map-pane.transition-to-source-chapters {
    --scene-enter-scale: 0.86;
    --scene-enter-y: -14px;
    --scene-leave-scale: 1.03;
  }
  #map-pane.transition-to-chapter-graph {
    --scene-enter-scale: 1.05;
    --scene-leave-scale: 0.95;
  }
  #fog-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: var(--fog-mask);
    transition: background 220ms ease, opacity 180ms ease, transform 220ms ease;
    transform-origin: center;
    z-index: 5;
  }
  #map-pane.mode-transitioning #fog-overlay {
    opacity: 0.92;
    transform: scale(1.04);
  }
  #map-container {
    position: relative;
    padding: 18px;
    width: 100%;
    height: 100%;
    isolation: isolate;
  }
  #map-container svg { display: block; overflow: visible; }
  .map-scene {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
    transform-origin: center center;
    transition: opacity 180ms ease, transform 260ms cubic-bezier(0.22, 1, 0.36, 1), filter 220ms ease;
    will-change: opacity, transform, filter;
  }
  .map-scene.scene-enter {
    opacity: 0;
    filter: blur(2px);
    transform: translate3d(var(--scene-enter-x), var(--scene-enter-y), 0) scale(var(--scene-enter-scale));
  }
  .map-scene.scene-enter.scene-enter-active {
    opacity: 1;
    filter: none;
    transform: translate3d(0, 0, 0) scale(1);
  }
  .map-scene.scene-leave {
    opacity: 1;
    filter: none;
    transform: translate3d(0, 0, 0) scale(1);
  }
  .map-scene.scene-leave.scene-leave-active {
    opacity: 0;
    filter: blur(1.6px);
    transform: translate3d(var(--scene-leave-x), var(--scene-leave-y), 0) scale(var(--scene-leave-scale));
  }

  .hud-panel {
    position: absolute;
    z-index: 14;
    padding: 18px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--panel-glass);
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
    pointer-events: auto;
  }
  .hud-panel-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  #quest-panel {
    top: 112px;
    left: 24px;
    width: min(420px, calc(100vw - 48px));
    max-height: calc(100vh - 220px);
    overflow-y: auto;
  }
  #discovery-panel {
    top: 112px;
    right: 24px;
    width: min(300px, calc(100vw - 48px));
  }
  #journey-rail {
    left: 24px;
    right: 24px;
    bottom: 24px;
    transition: opacity 220ms ease, transform 220ms ease;
  }
  #main-view.codex-open #journey-rail {
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
  }
  .quest-title {
    font-size: 24px;
    line-height: 1.35;
    margin: 0 0 10px;
  }
  .quest-summary {
    font-size: 14px;
    line-height: 1.85;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .quest-stats,
  .discovery-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .quest-stat {
    padding: 12px 12px 10px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(18, 21, 29, 0.54);
  }
  .quest-stat-label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .quest-stat-value {
    font-size: 16px;
    color: var(--accent-glow);
  }
  .hud-actions,
  .choice-list,
  .discovery-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .hud-action,
  .choice-btn,
  .journey-node {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    background: rgba(18, 21, 29, 0.7);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .hud-action:hover,
  .choice-btn:hover,
  .journey-node:hover {
    border-color: var(--border-strong);
    background: rgba(59, 47, 94, 0.5);
  }
  .section-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .discovery-list {
    flex-direction: column;
  }
  .discovery-item {
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(18, 21, 29, 0.58);
  }
  .discovery-item strong {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
  }
  .discovery-item span {
    font-size: 12px;
    color: var(--muted);
  }
  .journey-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .journey-node.current {
    border-color: var(--border-strong);
    color: var(--accent-glow);
    background: rgba(59, 47, 94, 0.6);
  }
  .journey-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
  }

  #reading-pane {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 20px;
    height: var(--codex-height);
    transform: translateY(calc(100% + 24px));
    transition: transform 320ms cubic-bezier(0.4, 0, 0.2, 1), top 220ms ease, border-radius 220ms ease;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    overflow: hidden;
  }
  #reading-pane.open { transform: translateY(0); }
  #reading-pane.fullscreen {
    top: 20px;
    bottom: 20px;
    height: auto;
    z-index: 40;
    border-radius: 20px;
  }
  #app.codex-fullscreen header,
  #app.codex-fullscreen #status,
  #app.codex-fullscreen #quest-panel,
  #app.codex-fullscreen #discovery-panel,
  #app.codex-fullscreen #journey-rail {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #reading-content {
    height: calc(100% - 118px);
    padding: 18px 300px 24px;
    max-width: 100%;
    overflow-y: auto;
  }

  .pane-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 18px 22px 10px 300px;
    background: linear-gradient(180deg, rgba(39, 42, 57, 0.95), rgba(39, 42, 57, 0.75));
    border-bottom: 1px solid var(--border);
  }
  .pane-headline {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pane-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pane-kicker {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #codex-title {
    font-size: 20px;
    margin: 0;
    line-height: 1.3;
  }
  .pane-close-btn {
    font-family: inherit;
    font-size: 16px;
    padding: 8px 12px;
    line-height: 1;
    background: rgba(18, 21, 29, 0.58);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
  }
  .pane-mode-btn {
    font-family: inherit;
    font-size: 12px;
    padding: 8px 14px;
    line-height: 1.2;
    background: rgba(18, 21, 29, 0.58);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
  }
  .pane-mode-btn:hover,
  .pane-close-btn:hover { color: var(--text); background: var(--accent-soft); }
  .pane-tabs {
    display: flex;
    gap: 10px;
    padding: 12px 22px 12px 300px;
    border-bottom: 1px solid var(--border);
  }
  .pane-tab {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    color: var(--muted);
    background: rgba(18, 21, 29, 0.44);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
  }
  .pane-tab.active {
    color: var(--accent-glow);
    border-color: var(--border-strong);
    background: rgba(59, 47, 94, 0.54);
  }

  .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.9; }
  .breadcrumb .crumb { cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .breadcrumb .crumb.current { color: var(--text); text-decoration: none; cursor: default; font-weight: 600; }
  .breadcrumb .sep { margin: 0 6px; color: var(--border); }

  .meta-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .meta-chip {
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(18, 21, 29, 0.52);
  }
  .meta-chip-label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .meta-chip-value {
    font-size: 13px;
    color: var(--text);
  }
  .empty-note {
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px dashed var(--border);
    color: var(--muted);
    background: rgba(18, 21, 29, 0.34);
  }

  .chapter-title { font-size: 20px; margin: 0 0 18px; line-height: 1.5; }
  .section-label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 24px 0 12px; }
  .summary-text, .desc-text, .source-text { max-width: 80em; overflow-wrap: break-word; }
  .summary-text, .desc-text {
    font-size: 14.5px;
    line-height: 2.0;
  }
  .desc-text { color: var(--text); }
  .rich-text > :first-child {
    margin-top: 0;
  }
  .rich-text > :last-child {
    margin-bottom: 0;
  }
  .rich-text p, .rich-text ul, .rich-text ol, .rich-text blockquote, .rich-text pre {
    margin: 0 0 1.15em;
  }
  .rich-text h1, .rich-text h2, .rich-text h3,
  .rich-text h4, .rich-text h5, .rich-text h6 {
    margin: 1.4em 0 0.55em;
    line-height: 1.4;
    color: var(--accent-glow);
  }
  .rich-text h1 { font-size: 1.55em; }
  .rich-text h2 { font-size: 1.35em; }
  .rich-text h3 { font-size: 1.18em; }
  .rich-text h4, .rich-text h5, .rich-text h6 { font-size: 1.05em; }
  .rich-text ul, .rich-text ol {
    padding-left: 1.5em;
  }
  .rich-text li + li {
    margin-top: 0.35em;
  }
  .rich-text blockquote {
    margin-left: 0;
    padding: 0.9em 1em;
    border-left: 3px solid var(--accent);
    background: rgba(18, 21, 29, 0.42);
    color: var(--text);
  }
  .rich-text code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.92em;
    padding: 0.1em 0.3em;
    border-radius: 4px;
    background: rgba(18, 21, 29, 0.6);
  }
  .rich-text pre {
    padding: 0.9em 1em;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(18, 21, 29, 0.68);
    overflow-x: auto;
  }
  .rich-text pre code {
    display: block;
    padding: 0;
    background: transparent;
  }
  .rich-text a {
    color: var(--accent-glow);
  }
  .rich-text em,
  .rich-text i {
    font-style: italic;
    color: #d7dcef;
  }
  .rich-text strong {
    color: #f5f7ff;
  }

  .detail-toggle {
    font-family: inherit; font-size: 13px; margin-top: 16px;
    padding: 6px 16px; background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px; cursor: pointer;
  }
  .detail-toggle:hover { background: var(--accent-soft); }

  .source-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .source-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .source-item > summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 14px 10px 32px;
    font-size: 14px;
    color: var(--accent);
    position: relative;
    line-height: 1.5;
  }
  .source-item > summary::-webkit-details-marker { display: none; }
  .source-item > summary::before {
    content: '▶';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--accent);
    transition: transform 0.15s ease;
  }
  .source-item[open] > summary::before { transform: translateY(-50%) rotate(90deg); }
  .source-item > summary:hover { background: var(--accent-soft); }
  .source-body {
    padding: 12px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .source-text {
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
  }
  .source-ref {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .next-list { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .next-btn {
    display: flex;
    align-items: center;
    font-family: inherit; font-size: 14px; text-align: left;
    padding: 12px 16px; background: rgba(59, 47, 94, 0.5); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px; cursor: pointer; line-height: 1.6;
  }
  .next-btn:hover { border-color: var(--accent); }
  .next-btn .arrow {
    flex: 0 0 auto;
    color: var(--accent);
    margin-right: 8px;
    font-size: 15px;
    line-height: 1;
    transform: translateY(-1px);
  }
  .next-end { font-size: 13px; color: var(--muted); padding: 10px 0; }

  #status {
    position: absolute;
    top: 98px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 16px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(21, 24, 32, 0.84);
    backdrop-filter: blur(14px);
    min-height: 28px;
    max-width: min(760px, calc(100vw - 40px));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 26;
    box-shadow: var(--shadow);
  }
  #status.error { color: var(--error); }
  #status.ok { color: var(--muted); }

  /* Chapter picker (start-screen) */
  #theme-picker {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 0 8px;
    text-align: left;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .theme-option {
    font-family: inherit; font-size: 14px; line-height: 1.6;
    padding: 14px 16px; background: rgba(18, 21, 29, 0.7); color: var(--text);
    border: 1px solid var(--border); border-radius: 18px; cursor: pointer;
    text-align: left;
    transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
  }
  .theme-option:hover { border-color: var(--accent); transform: translateY(-1px); }
  .theme-option.selected { border-color: var(--accent); background: rgba(59, 47, 94, 0.56); }
  .theme-option .theme-option-title { font-weight: 600; display: block; margin-bottom: 4px; }
  .theme-option .theme-option-intro { font-size: 12px; color: var(--muted); }

  /* SVG map nodes */
  .node-box { stroke: rgba(163, 173, 210, 0.36); stroke-width: 1.2; fill: rgba(46, 50, 67, 0.92); }
  .node-box.current { stroke: var(--accent); stroke-width: 2.4; fill: rgba(55, 49, 80, 0.94); }
  .node-g { cursor: pointer; }
  .node-g.outer { opacity: 0.6; }
  .node-g:hover .node-box { stroke: var(--accent); }
  .node-text { font-size: 10px; fill: var(--text); }
  .node-text.current { font-weight: 600; fill: var(--accent-glow); }
  .edge-line { stroke: var(--edge); stroke-width: 1.3; fill: none; }
  .edge-line.outer { stroke: var(--edge-outer); stroke-width: 1.0; }
  .focus-edge-line {
    stroke: rgba(177, 189, 220, 0.46);
    stroke-width: 1.4;
    fill: none;
    stroke-dasharray: var(--focus-edge-len, 240);
    stroke-dashoffset: var(--focus-edge-len, 240);
    animation: focusEdgeDraw 420ms ease-out both;
    animation-delay: var(--edge-delay, 0ms);
  }
  .focus-node {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: focusNodeBloom 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: var(--node-delay, 0ms);
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .focus-node.interactive-node { cursor: pointer; }
  .focus-node.interactive-node:hover { transform: translateY(-2px); }
  .chapter-node-shape {
    fill: rgba(46, 50, 67, 0.94);
    stroke: rgba(163, 173, 210, 0.4);
    stroke-width: 1.4;
  }
  .focus-node.center-node .chapter-node-shape {
    fill: rgba(58, 50, 84, 0.96);
    stroke: var(--accent);
    stroke-width: 2.2;
    filter: drop-shadow(0 0 12px rgba(196, 181, 253, 0.24));
  }
  .source-node-shape {
    fill: rgba(41, 47, 57, 0.95);
    stroke: rgba(120, 204, 210, 0.55);
    stroke-width: 1.5;
  }
  .focus-node.center-node .source-node-shape {
    fill: rgba(35, 56, 61, 0.98);
    stroke: #7cd0d8;
    stroke-width: 2;
    filter: drop-shadow(0 0 10px rgba(124, 208, 216, 0.24));
  }
  .focus-node.origin-node .chapter-node-shape {
    stroke: var(--accent-warm);
    fill: rgba(66, 53, 29, 0.88);
  }
  .focus-node.interactive-node:hover .chapter-node-shape,
  .focus-node.interactive-node:hover .source-node-shape {
    stroke: var(--accent-glow);
  }
  .focus-node-label {
    font-size: 10px;
    fill: var(--text);
  }
  .focus-node-label.center-label {
    font-weight: 600;
    fill: var(--accent-glow);
  }

  @keyframes focusNodeBloom {
    from {
      opacity: 0;
      transform: translateY(var(--node-lift, 12px)) scale(0.78);
    }
    65% {
      opacity: 1;
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes focusEdgeDraw {
    to {
      stroke-dashoffset: 0;
      opacity: 1;
    }
  }

  /* === アニメーション === */
  @keyframes nodeAppear {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
  .node-g {
    transform-box: fill-box;
    transform-origin: center;
    animation: nodeAppear 320ms cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
  }
  .node-g.outer { animation-delay: 80ms; }

  @keyframes nodeWiggle {
    0%, 100% { transform: scale(1.08) rotate(0deg); }
    25%      { transform: scale(1.08) rotate(-1.2deg); }
    75%      { transform: scale(1.08) rotate(1.2deg); }
  }
  .node-g:hover { animation: nodeWiggle 0.6s ease-in-out infinite; }

  @keyframes currentPulse {
    0%, 100% { filter: drop-shadow(0 0 4px var(--accent-glow)); }
    50%      { filter: drop-shadow(0 0 14px var(--accent-glow)); }
  }
  /* current-node のパルスは .node-box にだけ適用 (g 自体の出現アニメと干渉させない) */
  .node-g.current-node .node-box {
    animation: currentPulse 2.4s ease-in-out infinite;
  }

  .edge-line {
    stroke-dasharray: var(--edge-len, 1000);
    stroke-dashoffset: var(--edge-len, 1000);
    animation: edgeDraw 500ms ease-out 120ms forwards;
  }
  @keyframes edgeDraw {
    to { stroke-dashoffset: 0; }
  }

  /* === カメラパン (world group のスライド) === */
  .world {
    transition: transform 600ms cubic-bezier(0.25, 0.1, 0.25, 1);
    transform-origin: 0 0;
    will-change: transform;
  }
  .node-box { transition: fill 200ms ease, stroke 200ms ease; }

  /* === 可視性 tier (霧マスク + 既訪残光) === */
  .node-g { transition: opacity 350ms ease; }
  .node-g.tier-hidden { opacity: 0; pointer-events: none; }
  .node-g.tier-far { opacity: 0.35; pointer-events: none; }
  .node-g.tier-visited { opacity: 0.55; }
  .node-g.tier-near { opacity: 1; }
  .node-g.tier-current { opacity: 1; }

  .node-g.tier-visited .node-box {
    fill: var(--accent-warm-soft);
    stroke: var(--accent-warm);
    filter: drop-shadow(0 0 6px var(--accent-warm-glow));
  }
  .node-g.tier-visited .node-text { fill: var(--accent-warm-glow); }

  .edge-line { transition: opacity 350ms ease; }
  .edge-line.tier-hidden { opacity: 0; }
  .edge-line.tier-dim    { opacity: 0.22; }
  .edge-line.tier-active { opacity: 1; }

  /* === ミュートボタン === */
  #audioBtn { font-size: 16px; padding: 4px 10px; line-height: 1; }
  #audioBtn.muted { opacity: 0.55; }

  @media (max-width: 1100px) {
    header {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand actions"
        "progress progress";
    }
    .brand-stack { grid-area: brand; }
    .header-actions { grid-area: actions; }
    .header-progress { grid-area: progress; justify-self: stretch; }
    #start-screen {
      grid-template-columns: 1fr;
      padding-top: 160px;
    }
    #quest-panel {
      width: min(380px, calc(100vw - 48px));
    }
    #discovery-panel {
      top: auto;
      bottom: 112px;
      width: min(320px, calc(100vw - 48px));
    }
    #journey-rail { right: 360px; }
  }

  @media (max-width: 780px) {
    :root { --codex-height: min(58vh, 420px); }
    header {
      left: 12px;
      right: 12px;
      top: 12px;
      gap: 12px;
    }
    .brand-stack,
    .header-progress,
    .header-actions {
      border-radius: 16px;
    }
    header h1 { font-size: 19px; }
    #status {
      top: 130px;
      max-width: calc(100vw - 24px);
    }
    #start-screen {
      padding: 162px 12px 18px;
      gap: 16px;
    }
    .start-card,
    .start-preview {
      border-radius: 22px;
      padding: 22px;
    }
    .start-card h2 { font-size: 32px; }
    #quest-panel,
    #discovery-panel,
    #journey-rail {
      left: 12px;
      right: 12px;
      width: auto;
    }
    #quest-panel {
      top: 148px;
      max-height: 34vh;
    }
    #discovery-panel {
      top: auto;
      bottom: 98px;
    }
    #journey-rail {
      bottom: 12px;
    }
    #reading-pane {
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: min(58vh, 420px);
    }
    #reading-pane.fullscreen {
      top: 12px;
      bottom: 12px;
    }
    .quest-stats,
    .discovery-stats,
    .preview-facts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
</style>
</head>

<script>
"use strict";

/* ============================================================
   1. Mini YAML Parser
   既存データ互換を保ちつつ、値中の Markdown 見出しを壊さないようにする。
   ============================================================ */
function parseYAML(text) {
  const rawLines = String(text || '').split('\n');
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const normalizedLine = rawLines[i].replace(/\s+$/, '');
    const trimmed = normalizedLine.trim();
    if (trimmed.length === 0 || trimmed.startsWith('#')) continue;
    lines.push({ raw: normalizedLine, lineNo: i + 1, indent: getIndent(normalizedLine) });
  }
  let idx = 0;

  function getIndent(line) {
    let i = 0;
    while (i < line.length && line[i] === ' ') i++;
    return i;
  }

  function parseBlock(baseIndent) {
    if (idx >= lines.length || lines[idx].indent < baseIndent) return null;
    const first = lines[idx];
    const content = first.raw.trim();
    if (content.startsWith('-')) return parseList(baseIndent);
    return parseMapping(baseIndent);
  }

  function parseList(baseIndent) {
    const result = [];
    while (idx < lines.length && lines[idx].indent === baseIndent && lines[idx].raw.trim().startsWith('-')) {
      const line = lines[idx];
      let content = line.raw.trim().substring(1);
      content = content.replace(/^\s+/, '');
      idx++;
      if (content === '') {
        const child = parseBlock(baseIndent + 2);
        result.push(child);
        continue;
      }
      if (looksLikeKeyValue(content)) {
        const item = {};
        const [key, value] = parseKeyValue(content);
        if (value === '') {
          item[key] = parseBlock(baseIndent + 4);
        } else {
          item[key] = value;
        }
        const itemIndent = baseIndent + 2;
        while (idx < lines.length && lines[idx].indent === itemIndent && !lines[idx].raw.trim().startsWith('-')) {
          const sub = lines[idx];
          const subContent = sub.raw.trim();
          if (!looksLikeKeyValue(subContent)) break;
          const [subKey, subValue] = parseKeyValue(subContent);
          idx++;
          if (subValue === '') {
            item[subKey] = parseBlock(itemIndent + 2);
          } else {
            item[subKey] = subValue;
          }
        }
        result.push(item);
      } else {
        result.push(parseScalar(content));
      }
    }
    return result;
  }

  function parseMapping(baseIndent) {
    const result = {};
    while (idx < lines.length && lines[idx].indent === baseIndent) {
      const line = lines[idx];
      const content = line.raw.trim();
      if (content.startsWith('-')) break;
      if (!looksLikeKeyValue(content)) {
        throw new Error(`L${line.lineNo}: 解釈不能な行: "${content}"`);
      }
      const [key, value] = parseKeyValue(content);
      idx++;
      if (value === '') {
        result[key] = parseBlock(baseIndent + 2);
      } else {
        result[key] = value;
      }
    }
    return result;
  }

  function looksLikeKeyValue(content) {
    let quote = null;
    let depth = 0;
    for (let i = 0; i < content.length; i++) {
      const char = content[i];
      if (quote) {
        if (char === quote) quote = null;
        continue;
      }
      if (char === '"' || char === "'") {
        quote = char;
        continue;
      }
      if (char === '[' || char === '{') depth++;
      else if (char === ']' || char === '}') depth--;
      else if (char === ':' && depth === 0) return true;
    }
    return false;
  }

  function parseKeyValue(content) {
    let quote = null;
    let depth = 0;
    let colonIndex = -1;
    for (let i = 0; i < content.length; i++) {
      const char = content[i];
      if (quote) {
        if (char === quote) quote = null;
        continue;
      }
      if (char === '"' || char === "'") {
        quote = char;
        continue;
      }
      if (char === '[' || char === '{') depth++;
      else if (char === ']' || char === '}') depth--;
      else if (char === ':' && depth === 0) {
        colonIndex = i;
        break;
      }
    }
    if (colonIndex === -1) return [content, ''];
    const key = content.substring(0, colonIndex).trim();
    const valueText = content.substring(colonIndex + 1).trim();
    return [unquote(key), valueText === '' ? '' : parseScalar(valueText)];
  }

  function unquote(value) {
    if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
      return value.substring(1, value.length - 1);
    }
    return value;
  }

  function parseScalar(value) {
    const text = value.trim();
    if (text.startsWith('[') && text.endsWith(']')) {
      const inner = text.substring(1, text.length - 1);
      return splitFlowArray(inner).map(parseScalar);
    }
    if (text.startsWith('"') && text.endsWith('"')) return text.substring(1, text.length - 1);
    if (text.startsWith("'") && text.endsWith("'")) return text.substring(1, text.length - 1);
    if (/^-?\d+$/.test(text)) return parseInt(text, 10);
    if (/^-?\d+\.\d+$/.test(text)) return parseFloat(text);
    return text;
  }

  function splitFlowArray(inner) {
    const items = [];
    let quote = null;
    let depth = 0;
    let buffer = '';
    for (let i = 0; i < inner.length; i++) {
      const char = inner[i];
      if (quote) {
        buffer += char;
        if (char === quote) quote = null;
        continue;
      }
      if (char === '"' || char === "'") {
        quote = char;
        buffer += char;
        continue;
      }
      if (char === '[' || char === '{') {
        depth++;
        buffer += char;
        continue;
      }
      if (char === ']' || char === '}') {
        depth--;
        buffer += char;
        continue;
      }
      if (char === ',' && depth === 0) {
        if (buffer.trim()) items.push(buffer.trim());
        buffer = '';
        continue;
      }
      buffer += char;
    }
    if (buffer.trim()) items.push(buffer.trim());
    return items;
  }

  return parseBlock(0) || {};
}

if (typeof marked !== 'undefined' && typeof marked.setOptions === 'function') {
  marked.setOptions({ gfm: true, breaks: true });
}

/* ============================================================
   1.5. オーディオマネージャ (Howler.js)
   ============================================================ */

const audio = (() => {
  let bgm = null, sfxClick = null, sfxTrans = null, sfxBegin = null;
  let muted = localStorage.getItem('ih.muted') !== '0';
  const safeHowl = (src, opts) => {
    if (typeof Howl !== 'function') return null;
    try { return new Howl({ src: [src], ...opts, onloaderror: () => {}, onplayerror: () => {} }); }
    catch { return null; }
  };
  function init() {
    bgm      = safeHowl('Assets/audio/bgm_ambient.mp3',   { loop: true, volume: 0.18, html5: true });
    // sfxClick = safeHowl('Assets/audio/sfx_click.mp3',  { volume: 0.5 });
    sfxTrans = safeHowl('Assets/audio/sfx_transition.mp3', { volume: 0.4 });
    sfxBegin = safeHowl('Assets/audio/sfx_begin.mp3',      { volume: 0.6 });
    apply();
  }
  function apply() {
    if (!bgm) return;
    if (muted) { try { bgm.pause(); } catch {} }
    else { try { if (!bgm.playing()) bgm.play(); } catch {} }
  }
  function toggle() {
    muted = !muted;
    localStorage.setItem('ih.muted', muted ? '1' : '0');
    apply();
    return muted;
  }
  function click()      { if (!muted && sfxClick) { try { sfxClick.play(); } catch {} } }
  function transition() { if (!muted && sfxTrans) { try { sfxTrans.play(); } catch {} } }
  function begin() { if (!muted && sfxBegin) { try { sfxBegin.play(); } catch {} } }
  function isMuted()    { return muted; }
  return { init, toggle, click, transition, begin, isMuted };
})();

function svgEl(name, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function setStatus(msg, kind) {
  statusEl.hidden = !msg;
  if (!msg) {
    statusEl.textContent = '';
    statusEl.className = 'ok';
    return;
  }
  statusEl.textContent = msg;
  statusEl.className = kind || 'ok';
}

function excerptText(text, maxChars) {
  const clean = String(text || '').replace(/\\n/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean) return '';
  if (clean.length <= maxChars) return clean;
  return clean.slice(0, Math.max(0, maxChars - 1)) + '…';
}

function normalizeRichText(text) {
  return typeof text === 'string'
    ? text.replace(/\r\n?/g, '\n').replace(/\\n/g, '\n').trim()
    : '';
}

function createMarkdownBlock(className, text, emptyText = '') {
  const block = document.createElement('div');
  block.className = `${className} rich-text`;

  const normalized = normalizeRichText(text);
  if (!normalized) {
    if (emptyText) {
      const paragraph = document.createElement('p');
      paragraph.textContent = emptyText;
      block.appendChild(paragraph);
    }
    return block;
  }

  if (typeof marked === 'undefined' || typeof marked.parse !== 'function') {
    const paragraph = document.createElement('p');
    paragraph.textContent = normalized;
    block.appendChild(paragraph);
    return block;
  }

  const rendered = marked.parse(normalized, { gfm: true, breaks: true });
  block.innerHTML = (typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function')
    ? DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } })
    : rendered;
  return block;
}

function getChapterSourceIds(ch) {
  return (Array.isArray(ch && ch.sources) ? ch.sources : [])
    .filter((sid) => typeof sid === 'string' && allSourcesMap.has(sid));
}

function getSourceChapterIds(sourceId) {
  return [...(sourceChapterMap.get(sourceId) || [])]
    .filter((chapterId) => chapterMap.has(chapterId))
    .sort();
}

function getOrderedChapterSourceIds(ch) {
  const sourceIds = getChapterSourceIds(ch);
  if (!codexFocusedSourceId || !sourceIds.includes(codexFocusedSourceId)) {
    return sourceIds;
  }
  return [
    codexFocusedSourceId,
    ...sourceIds.filter((sourceId) => sourceId !== codexFocusedSourceId)
  ];
}

function syncNetworkModeClass() {
  appEl.classList.remove(
    'mode-chapter-graph',
    'mode-chapter-sources',
    'mode-source-chapters'
  );

  const className = {
    [NETWORK_MODE.CHAPTER_GRAPH]: 'mode-chapter-graph',
    [NETWORK_MODE.CHAPTER_SOURCES]: 'mode-chapter-sources',
    [NETWORK_MODE.SOURCE_CHAPTERS]: 'mode-source-chapters'
  }[networkMode] || 'mode-chapter-graph';

  appEl.classList.add(className);
}

function setNetworkMode(mode, options = {}) {
  networkMode = mode;

  if (Object.prototype.hasOwnProperty.call(options, 'focusedSourceId')) {
    focusedSourceId = options.focusedSourceId || null;
  } else if (mode === NETWORK_MODE.CHAPTER_GRAPH) {
    focusedSourceId = null;
  }

  if (Object.prototype.hasOwnProperty.call(options, 'codexFocusedSourceId')) {
    codexFocusedSourceId = options.codexFocusedSourceId || null;
  } else if (mode === NETWORK_MODE.CHAPTER_GRAPH) {
    codexFocusedSourceId = null;
  }

  syncNetworkModeClass();
}

function getModeTransitionKey(mode) {
  switch (mode) {
    case NETWORK_MODE.CHAPTER_SOURCES:
      return 'chapter-sources';
    case NETWORK_MODE.SOURCE_CHAPTERS:
      return 'source-chapters';
    case NETWORK_MODE.CHAPTER_GRAPH:
    default:
      return 'chapter-graph';
  }
}

function clearMapTransitionTimers() {
  if (mapModeTransitionTimer) {
    window.clearTimeout(mapModeTransitionTimer);
    mapModeTransitionTimer = 0;
  }
  if (mapModeTransitionResetTimer) {
    window.clearTimeout(mapModeTransitionResetTimer);
    mapModeTransitionResetTimer = 0;
  }
}

function clearMapTransitionClasses() {
  mapPane.classList.remove(
    'mode-transitioning',
    'mode-transition-out',
    'mode-transition-in',
    'transition-from-chapter-graph',
    'transition-from-chapter-sources',
    'transition-from-source-chapters',
    'transition-to-chapter-graph',
    'transition-to-chapter-sources',
    'transition-to-source-chapters'
  );

  const activeScene = mapContainer.querySelector('svg.map-scene');
  if (activeScene) {
    activeScene.classList.remove('scene-enter', 'scene-enter-active', 'scene-leave', 'scene-leave-active');
  }
}

function cancelMapModeTransition(syncMode = false) {
  clearMapTransitionTimers();
  clearMapTransitionClasses();
  mapModeTransitionToken += 1;
  if (syncMode) renderedNetworkMode = networkMode;
}

function prepareMapScene(svg, sceneClass) {
  if (!svg) return;
  svg.classList.add('map-scene', sceneClass);
  svg.dataset.networkMode = networkMode;
}

function shouldAnimateModeTransition(skipTransition) {
  if (skipTransition || mainView.hidden) return false;
  if (renderedNetworkMode === networkMode) return false;
  return !!mapContainer.querySelector('svg.map-scene');
}

function runModeTransition() {
  const currentScene = mapContainer.querySelector('svg.map-scene');
  if (!currentScene) {
    cancelMapModeTransition(true);
    renderMap();
    renderedNetworkMode = networkMode;
    return;
  }

  const fromClass = `transition-from-${getModeTransitionKey(renderedNetworkMode)}`;
  const toClass = `transition-to-${getModeTransitionKey(networkMode)}`;

  cancelMapModeTransition();
  const token = mapModeTransitionToken;

  mapPane.classList.add('mode-transitioning', 'mode-transition-out', fromClass, toClass);
  currentScene.classList.add('scene-leave');

  window.requestAnimationFrame(() => {
    if (token !== mapModeTransitionToken) return;
    currentScene.classList.add('scene-leave-active');
  });

  mapModeTransitionTimer = window.setTimeout(() => {
    if (token !== mapModeTransitionToken) return;

    renderMap();
    renderedNetworkMode = networkMode;

    const nextScene = mapContainer.querySelector('svg.map-scene');
    mapPane.classList.remove('mode-transition-out');
    mapPane.classList.add('mode-transition-in');

    if (nextScene) {
      nextScene.classList.add('scene-enter');
      void nextScene.getBoundingClientRect();
      window.requestAnimationFrame(() => {
        if (token !== mapModeTransitionToken) return;
        nextScene.classList.add('scene-enter-active');
      });
    }

    mapModeTransitionResetTimer = window.setTimeout(() => {
      if (token !== mapModeTransitionToken) return;
      clearMapTransitionTimers();
      clearMapTransitionClasses();
    }, MAP_MODE_SETTLE_MS);
  }, MAP_MODE_TRANSITION_MS);
}

function buildSourceChapterMap() {
  const nextMap = new Map();
  for (const chapter of allChapters) {
    if (!chapter || !chapter.id) continue;
    for (const sourceId of getChapterSourceIds(chapter)) {
      if (!nextMap.has(sourceId)) nextMap.set(sourceId, new Set());
      nextMap.get(sourceId).add(chapter.id);
    }
  }
  sourceChapterMap = nextMap;
}

function getRelatedChapterIds(ch) {
  if (!ch) return { outgoing: [], incomingOnly: [], all: [] };
  const outgoing = (Array.isArray(ch.links) ? ch.links : []).filter((id) => chapterMap.has(id));
  const outgoingSet = new Set(outgoing);
  const incomingOnly = [];
  for (const id of (adjacency.get(ch.id) || [])) {
    if (!outgoingSet.has(id)) incomingOnly.push(id);
  }
  return { outgoing, incomingOnly, all: [...outgoing, ...incomingOnly] };
}

function collectVisitedSourceIds() {
  const ids = new Set();
  for (const chapterId of visited) {
    const ch = chapterMap.get(chapterId);
    if (!ch) continue;
    for (const sid of getChapterSourceIds(ch)) ids.add(sid);
  }
  return [...ids];
}

function appendMetaChips(parent, items) {
  const row = document.createElement('div');
  row.className = 'meta-chip-row';
  for (const item of items) {
    const chip = document.createElement('div');
    chip.className = 'meta-chip';
    const label = document.createElement('span');
    label.className = 'meta-chip-label';
    label.textContent = item.label;
    const value = document.createElement('span');
    value.className = 'meta-chip-value';
    value.textContent = item.value;
    chip.appendChild(label);
    chip.appendChild(value);
    row.appendChild(chip);
  }
  parent.appendChild(row);
}

  }

  const neighborhood = Math.max(0, localNeighborhood(ch.id).size - 1);

  const kicker = document.createElement('div');
  kicker.className = 'preview-kicker';
  kicker.textContent = 'Selected Expedition';
  startPreview.appendChild(kicker);

  const title = document.createElement('h3');

  title.textContent = ch.ja || ch.id;

  summary.textContent = excerptText(ch.narrative_ja || ch.desc_ja || '', 180) || '導入文はまだありません。';
  startPreview.appendChild(summary);

  const facts = document.createElement('div');
  facts.className = 'preview-facts';
  [
    // { label: '年代', value: ch.date || '未詳' },

    { label: '史料', value: `${sources.length}件` },
    { label: '周辺視界', value: `${neighborhood}章` }
  ].forEach((item) => {
    const box = document.createElement('div');
    box.className = 'preview-fact';
    const label = document.createElement('span');
    label.className = 'preview-fact-label';
    label.textContent = item.label;
    const value = document.createElement('span');
    value.className = 'preview-fact-value';
    value.textContent = item.value;
    box.appendChild(label);
    box.appendChild(value);
    facts.appendChild(box);
  });
  startPreview.appendChild(facts);

  const listTitle = document.createElement('p');
  listTitle.className = 'preview-list-title';
  listTitle.textContent = '最初に見えている論点';
  startPreview.appendChild(listTitle);

    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = 'この章にはまだ接続先がありません。';
    startPreview.appendChild(empty);

  }

    list.appendChild(li);
  });

function renderQuestPanel() {
  questPanelBody.innerHTML = '';
  if (!currentId || !chapterMap.has(currentId)) return;
  const ch = chapterMap.get(currentId);
  const related = getRelatedChapterIds(ch);
  const sourceIds = sortSourceIdsByLabel(getChapterSourceIds(ch));
  const currentSource = focusedSourceId ? allSourcesMap.get(focusedSourceId) : null;
  const sourceRelatedChapterIds = currentSource ? sortChapterIdsByLabel(getSourceChapterIds(currentSource.id)) : [];

  const title = document.createElement('h2');
  title.className = 'quest-title';

  const summary = document.createElement('p');
  summary.className = 'quest-summary';

  const stats = document.createElement('div');
  stats.className = 'quest-stats';
  const actions = document.createElement('div');
  actions.className = 'hud-actions';
  const hint = document.createElement('p');
  hint.className = 'section-hint';
  const list = document.createElement('div');
  list.className = 'choice-list';

  const statItems = [];
  const appendStats = (items) => {
    items.forEach((item) => {
      const box = document.createElement('div');
      box.className = 'quest-stat';
      const label = document.createElement('span');
      label.className = 'quest-stat-label';
      label.textContent = item.label;
      const value = document.createElement('span');
      value.className = 'quest-stat-value';
      value.textContent = item.value;
      box.appendChild(label);
      box.appendChild(value);
      stats.appendChild(box);
    });
  };

  if (networkMode === NETWORK_MODE.SOURCE_CHAPTERS && currentSource) {
    title.textContent = currentSource.title_ja || currentSource.id;
    summary.textContent = excerptText(currentSource.ja || currentSource.ref || '', 160)
      || 'この史料に関連する章をたどれます。';
    statItems.push(
      { label: 'モード', value: '史料中心' },
      { label: '関連章', value: `${sourceRelatedChapterIds.length}章` },
      { label: '発見史料', value: `${collectVisitedSourceIds().length}` }
    );
    appendStats(statItems);

    const backBtn = document.createElement('button');
    backBtn.className = 'hud-action';
    backBtn.textContent = '章へ戻る';
    backBtn.addEventListener('click', () => showChapterSources(currentId));
    actions.appendChild(backBtn);

    const codexBtn = document.createElement('button');
    codexBtn.className = 'hud-action';
    codexBtn.textContent = '史料本文を開く';
    codexBtn.addEventListener('click', () => { setCodexTab('sources'); openDetailPane(); renderReading(); });
    actions.appendChild(codexBtn);

    hint.textContent = sourceRelatedChapterIds.length > 0
      ? 'この史料と結びつく章'
      : 'この史料に関連づく章はありません。';
    sourceRelatedChapterIds.forEach((chapterId) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = chapterMap.get(chapterId)?.ja || chapterId;
      btn.addEventListener('click', () => navigateToChapterSources(chapterId));
      list.appendChild(btn);
    });
  } else if (networkMode === NETWORK_MODE.CHAPTER_SOURCES) {
    title.textContent = ch.ja || ch.id;
    summary.textContent = excerptText(ch.narrative_ja || '', 160) || 'この章の導入は未記載です。';
    statItems.push(
      { label: 'モード', value: '章→史料' },
      { label: '史料', value: `${sourceIds.length}件` },
      { label: '旅程', value: `${history.length}章目` }
    );
    appendStats(statItems);

    const graphBtn = document.createElement('button');
    graphBtn.className = 'hud-action';
    graphBtn.textContent = '章ネットワークへ戻る';
    graphBtn.addEventListener('click', showChapterGraphForCurrentChapter);
    actions.appendChild(graphBtn);

    const codexBtn = document.createElement('button');
    codexBtn.className = 'hud-action';
    codexBtn.textContent = '史料一覧を開く';
    codexBtn.addEventListener('click', () => { setCodexTab('sources'); openDetailPane(); renderReading(); });
    actions.appendChild(codexBtn);

    hint.textContent = sourceIds.length > 0
      ? 'この章に紐づく史料'
      : 'この章に紐づく史料はまだありません。';
    sourceIds.forEach((sourceId) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = allSourcesMap.get(sourceId)?.title_ja || sourceId;
      btn.addEventListener('click', () => showSourceChapters(sourceId));
      list.appendChild(btn);
    });
  } else {
    title.textContent = ch.ja || ch.id;
    summary.textContent = excerptText(ch.narrative_ja || '', 160) || 'この章の導入は未記載です。';
    statItems.push(
      { label: '現在地', value: `${history.length}章目` },
      { label: '選択肢', value: `${related.all.length}件` },
      { label: '史料', value: `${sourceIds.length}件` }
    );
    appendStats(statItems);

    const codexBtn = document.createElement('button');
    codexBtn.className = 'hud-action';
    codexBtn.textContent = '記録を開く';
    codexBtn.addEventListener('click', () => { setCodexTab('chapter'); openDetailPane(); renderReading(); });
    actions.appendChild(codexBtn);

    if (sourceIds.length > 0) {
      const srcBtn = document.createElement('button');
      srcBtn.className = 'hud-action';
      srcBtn.textContent = '史料庫を見る';
      srcBtn.addEventListener('click', () => { setCodexTab('sources'); openDetailPane(); renderReading(); });
      actions.appendChild(srcBtn);
    }

    hint.textContent = related.all.length > 0
      ? '次に踏み込める章'
      : 'この章は今のところ行き止まりです。';
    related.all.slice(0, 4).forEach((id) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = chapterMap.get(id)?.ja || id;
      btn.addEventListener('click', () => navigateTo(id));
      list.appendChild(btn);
    });
  }

  questPanelBody.appendChild(title);
  questPanelBody.appendChild(summary);
  questPanelBody.appendChild(stats);
  questPanelBody.appendChild(actions);
  questPanelBody.appendChild(hint);
  if (list.childElementCount > 0) {
    questPanelBody.appendChild(list);
  }
