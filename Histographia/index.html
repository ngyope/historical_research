    btn.className = 'journey-node' + (index === history.length - 1 ? ' current' : '');
    btn.textContent = chapterMap.get(id)?.ja || id;
    if (index !== history.length - 1) {
      btn.addEventListener('click', () => jumpToHistory(index));
    }
    track.appendChild(btn);
  });
  journeyRailBody.appendChild(track);

  const relatedCount = getRelatedChapterIds(chapterMap.get(currentId)).all.length;
  const note = document.createElement('div');
  note.className = 'journey-note';
  if (networkMode === NETWORK_MODE.SOURCE_CHAPTERS && focusedSourceId) {
    note.textContent = `この史料に ${getSourceChapterIds(focusedSourceId).length} 章が関連しています。`;
  } else if (networkMode === NETWORK_MODE.CHAPTER_SOURCES && chapterMap.has(currentId)) {
    note.textContent = `この章に ${getChapterSourceIds(chapterMap.get(currentId)).length} 件の史料が紐づいています。`;
  } else {
    note.textContent = `現在地点から ${relatedCount} 件の分岐が見えています。`;
  }
  journeyRailBody.appendChild(note);
}

function renderHud() {
  if (validationErrors.length) {
    hudProgressText.textContent = '要修正';
  } else if (networkMode === NETWORK_MODE.SOURCE_CHAPTERS && focusedSourceId && allSourcesMap.has(focusedSourceId)) {
    const source = allSourcesMap.get(focusedSourceId);
    hudProgressText.textContent = `史料: ${source.title_ja || source.id}`;
  } else if (networkMode === NETWORK_MODE.CHAPTER_SOURCES && currentId && chapterMap.has(currentId)) {
    const currentChapter = chapterMap.get(currentId);
    hudProgressText.textContent = `章と史料: ${currentChapter.ja || currentChapter.id}`;
  } else if (currentId && chapterMap.has(currentId)) {
    const currentChapter = chapterMap.get(currentId);
    hudProgressText.textContent = currentChapter.ja || currentChapter.id;
  } else if (selectedChapterId && allChaptersMap.has(selectedChapterId)) {
    const selectedChapter = allChaptersMap.get(selectedChapterId);
    hudProgressText.textContent = selectedChapter.ja || selectedChapter.id;
  } else {
    hudProgressText.textContent = '開始章を選択中';
  }
  if (mainView.hidden) return;
  renderQuestPanel();
  renderDiscoveryPanel();
  renderJourneyRail();
}

/* ============================================================
   4. グラフ構築・検証
   ============================================================ */

function buildGraph() {
  chapters = allChapters.slice();
  chapterMap = allChaptersMap;
  adjacency = new Map();
  for (const c of chapters) {
    if (c && c.id) adjacency.set(c.id, new Set());
  }
  for (const c of chapters) {
    if (!c || !c.id) continue;
    const links = Array.isArray(c.links) ? c.links : [];
    for (const tid of links) {
      if (typeof tid !== 'string' || !chapterMap.has(tid)) continue;
      adjacency.get(c.id).add(tid);
      adjacency.get(tid).add(c.id);
    }
  }
  computeGlobalLayout();
}

/* ============================================================
   4.5. グローバル力学レイアウト (シード固定、決定論的)
   ============================================================ */

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function computeGlobalLayout() {
  const rng = mulberry32(0xC0FFEE);
  const ids = chapters.filter(c => c && c.id).map(c => c.id);
  const n = ids.length;
  globalPos = new Map();
  if (n === 0) return;

  // 初期配置: 単位円上にランダムに散らばす
  const pos = new Map();
  const initR = Math.max(220, 60 * Math.sqrt(n));
  for (const id of ids) {
    const a = rng() * Math.PI * 2;
    const r = initR * (0.4 + rng() * 0.6);
    pos.set(id, { x: Math.cos(a) * r, y: Math.sin(a) * r });
  }

  const EDGE_LEN = 280;
  const K_SPRING = 0.04;
  const K_REPEL = 22000;
  const K_GRAVITY = 0.012;
  const K_TEMPORAL = 0.025;
  const ITER = 320;

  // 日付 → 目標Y座標マップを構築 (上=古, 下=新)
  const dateMs = new Map();
  for (const id of ids) {
    const c = chapterMap.get(id);
    if (!c || !c.date) continue;
    const r = parseDateRange(String(c.date));
    const lo = r.lo !== null ? r.lo : r.hi;
    const hi = r.hi !== null ? r.hi : r.lo;
    if (lo !== null) dateMs.set(id, (lo + hi) / 2);
  }
  const dateVals = [...dateMs.values()];
  const minDate = dateVals.length ? Math.min(...dateVals) : 0;
  const maxDate = dateVals.length ? Math.max(...dateVals) : 1;
  const dateSpan = maxDate - minDate || 1;
  const TEMPORAL_SPAN = Math.max(n * EDGE_LEN * 0.45, 600);

  // 無向エッジ列を作成
  const edgeList = [];
  for (const [u, set] of adjacency) {
    for (const v of set) if (u < v) edgeList.push([u, v]);
  }

  for (let step = 0; step < ITER; step++) {
    const cool = 1 - step / ITER;
    const force = new Map(ids.map(id => [id, { fx: 0, fy: 0 }]));

    // 反発力 (O(n^2))
    for (let i = 0; i < n; i++) {
      const a = pos.get(ids[i]);
      for (let j = i + 1; j < n; j++) {
        const b = pos.get(ids[j]);
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy + 0.01;
        const f = K_REPEL / d2;
        const d = Math.sqrt(d2);
        const fx = (dx / d) * f, fy = (dy / d) * f;
        force.get(ids[i]).fx += fx; force.get(ids[i]).fy += fy;
        force.get(ids[j]).fx -= fx; force.get(ids[j]).fy -= fy;
      }
    }
    // バネ (エッジ)
    for (const [u, v] of edgeList) {
      const a = pos.get(u), b = pos.get(v);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = K_SPRING * (d - EDGE_LEN);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      force.get(u).fx += fx; force.get(u).fy += fy;
      force.get(v).fx -= fx; force.get(v).fy -= fy;
    }
    // 中心重力
    for (const id of ids) {
      const p = pos.get(id);
      force.get(id).fx -= p.x * K_GRAVITY;
      force.get(id).fy -= p.y * K_GRAVITY;
    }
    // 時間軸引力 (Y軸: 上=古い時代, 下=新しい時代)
    for (const id of ids) {
      if (!dateMs.has(id)) continue;
      const t = (dateMs.get(id) - minDate) / dateSpan;
      const targetY = (t - 0.5) * TEMPORAL_SPAN;
      force.get(id).fy += (targetY - pos.get(id).y) * K_TEMPORAL;
    }
    // 位置更新 (冷却 + 速度キャップ)
    const stepSize = 0.85 * cool + 0.15;
    for (const id of ids) {
      const p = pos.get(id), f = force.get(id);
      const fmag = Math.sqrt(f.fx * f.fx + f.fy * f.fy);
      const cap = Math.min(1, 40 / (fmag + 0.01));
      p.x += f.fx * stepSize * cap;
      p.y += f.fy * stepSize * cap;
    }
  }
  // dateMs を buildWorldMap でグラデーション生成に再利用するため公開
  computeGlobalLayout._dateMs = dateMs;
  globalPos = pos;
}

function localNeighborhood(centerId) {
  const dist = new Map();
  if (!chapterMap.has(centerId)) return dist;
  dist.set(centerId, 0);
  const queue = [centerId];
  while (queue.length) {
    const u = queue.shift();
    if (dist.get(u) >= 2) continue;
    for (const v of (adjacency.get(u) || [])) {
      if (!dist.has(v)) {
        dist.set(v, dist.get(u) + 1);
        queue.push(v);
      }
    }
  }
  return dist;
}

function validateChapters() {
  const errs = [];
  const seen = new Set();
  for (const c of allChapters) {
    if (!c || typeof c !== 'object') { errs.push('chapters 内に不正な要素があります'); continue; }
    if (!c.id) { errs.push('id の無い章があります'); continue; }
    if (seen.has(c.id)) errs.push(`chapter id が重複しています: ${c.id}`);
    seen.add(c.id);
  }
  for (const c of allChapters) {
    if (!c || !c.id || !c.date) continue;
    const r = parseDateRange(String(c.date));
    if (r.lo === null && r.hi === null) {
      errs.push(`章 "${c.ja || c.id}" の date "${c.date}" を解釈できませんでした`);
    }
  }
  for (const c of allChapters) {
    if (!c || !c.id || c.sources == null) continue;
    if (!Array.isArray(c.sources)) {
      errs.push(`章 "${c.ja || c.id}" の sources が配列ではありません`);
      continue;
    }
    for (const sid of c.sources) {
      if (typeof sid !== 'string' || !sid.trim()) {
        errs.push(`章 "${c.ja || c.id}" の sources に不正な値があります`);
        continue;
      }
      if (!allSourcesMap.has(sid)) {
        errs.push(`章 "${c.ja || c.id}" の sources に未定義の source id があります: "${sid}"`);
      }
    }
  }
  for (const c of allChapters) {
    if (!c || !c.id || c.links == null) continue;
    if (!Array.isArray(c.links)) {
      errs.push(`章 "${c.ja || c.id}" の links が配列ではありません`);
      continue;
    }
    for (const tid of c.links) {
      if (typeof tid !== 'string' || !tid.trim()) {
        errs.push(`章 "${c.ja || c.id}" の links に不正な値があります`);
        continue;
      }
      if (!allChaptersMap.has(tid)) {
        errs.push(`章 "${c.ja || c.id}" の links に未定義の chapter id があります: "${tid}"`);
      }
    }
  }
  return errs;
}

function validateSources() {
  const errs = [];
  const seen = new Set();
  for (const s of allSources) {
    if (!s || typeof s !== 'object') { errs.push('sources 内に不正な要素があります'); continue; }
    if (!s.id) { errs.push('id の無い source があります'); continue; }
    if (seen.has(s.id)) errs.push(`source id が重複しています: ${s.id}`);
    seen.add(s.id);
    const hasTitle = typeof s.title_ja === 'string' && s.title_ja.trim();
    const hasBody = typeof s.ja === 'string' && s.ja.trim();
    if (!hasTitle && !hasBody) {
      errs.push(`source "${s.id}" に title_ja も ja も無く、表示すべき内容がありません`);
    }
  }
  return errs;
}

/* ============================================================
   5. レイアウトユーティリティ
   ============================================================ */

function wrapText(str, maxChars, maxLines) {
  str = String(str || '');
  const lines = [];
  let s = str;
  while (s.length > 0 && lines.length < maxLines) {
    if (s.length <= maxChars) { lines.push(s); s = ''; }
    else { lines.push(s.slice(0, maxChars)); s = s.slice(maxChars); }
  }
  if (s.length > 0 && lines.length > 0) {
    lines[lines.length - 1] = lines[lines.length - 1].slice(0, Math.max(0, maxChars - 1)) + '…';
  }
  return lines;
}

/* ============================================================
   5.5. 日付解析 (検証用)
   ============================================================ */

function parseDateRange(str) {
  if (!str || typeof str !== 'string') return { lo: null, hi: null };
  const s = str.trim();
  function utcMs(y, m, d) { return Date.UTC(y, m - 1, d); }
  function monthEnd(y, m) { return Date.UTC(y, m, 0); }
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) {
    const t = utcMs(+m[1], +m[2], +m[3]); return { lo: t, hi: t };
  }
  if ((m = s.match(/^(\d{4})-(\d{2})$/))) {
    return { lo: utcMs(+m[1], +m[2], 1), hi: monthEnd(+m[1], +m[2]) };
  }
  if ((m = s.match(/^(\d{4})-?$/))) {
    const y = +m[1]; return { lo: utcMs(y, 1, 1), hi: utcMs(y, 12, 31) };
  }
  if ((m = s.match(/^(?:bf\.|bef\.|before)\s+(.+)$/i))) {
    const inner = parseDateRange(m[1]);
    return { lo: null, hi: inner.lo !== null ? inner.lo - 86400000 : inner.hi };
  }
  if ((m = s.match(/^(?:aft\.|after)\s+(.+)$/i))) {
    const inner = parseDateRange(m[1]);
    return { lo: inner.hi !== null ? inner.hi + 86400000 : inner.lo, hi: null };
  }
  if ((m = s.match(/^(?:c\.|circa)\s+(\d{4})$/i))) {
    const y = +m[1]; return { lo: utcMs(y, 1, 1), hi: utcMs(y, 12, 31) };
  }
  if ((m = s.match(/^early\s+(\d{4})$/i))) {
    const y = +m[1]; return { lo: utcMs(y, 1, 1), hi: utcMs(y, 4, 30) };
  }
  if ((m = s.match(/^mid\s+(\d{4})$/i))) {
    const y = +m[1]; return { lo: utcMs(y, 5, 1), hi: utcMs(y, 8, 31) };
  }
  if ((m = s.match(/^late\s+(\d{4})$/i))) {
    const y = +m[1]; return { lo: utcMs(y, 9, 1), hi: utcMs(y, 12, 31) };
  }
  if ((m = s.match(/^(.+?)\s*[×x]\s*(.+)$/i))) {
    const a = parseDateRange(m[1].trim()), b = parseDateRange(m[2].trim());
    return { lo: a.lo, hi: b.hi };
  }
  return { lo: null, hi: null };
}

/* ============================================================
   6. マップ描画 (ローカルグラフ・放射状配置)
   ============================================================ */

function getMapFocusPoint() {
  const paneW = mapPane.clientWidth || window.innerWidth;
  const paneH = mapPane.clientHeight || window.innerHeight;
  const paneOpen = readingPane.classList.contains('open');
  const codexH = paneOpen ? readingPane.getBoundingClientRect().height : 0;
  const focusY = paneOpen ? Math.max(150, (paneH - codexH) / 2) : paneH / 2;
  return {
    paneW,
    paneH,
    paneOpen,
    cx: paneW / 2,
    cy: focusY
  };
}

function sortChapterIdsByLabel(ids) {
  return [...ids].sort((leftId, rightId) => {
    const left = chapterMap.get(leftId)?.ja || leftId;
    const right = chapterMap.get(rightId)?.ja || rightId;
    return left.localeCompare(right, 'ja');
  });
}

function sortSourceIdsByLabel(ids) {
  return [...ids].sort((leftId, rightId) => {
    const left = allSourcesMap.get(leftId)?.title_ja || leftId;
    const right = allSourcesMap.get(rightId)?.title_ja || rightId;
    return left.localeCompare(right, 'ja');
  });
}

function buildFocusRingPositions(count, centerX, centerY, paneW, paneH, paneOpen) {
  if (count === 0) return [];

  const positions = [];
  const baseRadius = Math.max(
    120,
    Math.min(Math.min(paneW, paneH) * (paneOpen ? 0.18 : 0.24), 220)
  );
  const ringStep = 110;
  let placed = 0;
  let ring = 0;

  while (placed < count) {
    const capacity = ring === 0 ? 7 : 10 + ring * 2;
    const ringCount = Math.min(capacity, count - placed);
    const radius = baseRadius + ring * ringStep;
    const offset = -Math.PI / 2 + (ring % 2 ? Math.PI / ringCount : 0);

    for (let i = 0; i < ringCount; i++) {
      const theta = offset + (2 * Math.PI * i) / ringCount;
      positions.push({
        x: centerX + radius * Math.cos(theta),
        y: centerY + radius * Math.sin(theta),
        ring,
        ringIndex: i
      });
    }

    placed += ringCount;
    ring += 1;
  }

  return positions;
}

function appendFocusNodeLabel(group, label, x, y, isCenter) {
  const lines = wrapText(label, 8, 2);
  lines.forEach((line, index) => {
    const text = svgEl('text', {
      x,
      y: y + index * 12,
      'text-anchor': 'middle',
      class: `focus-node-label${isCenter ? ' center-label' : ''}`
    });
    text.textContent = line;
    group.appendChild(text);
  });
}

function createFocusNode(node, x, y) {
  const classNames = ['focus-node', `${node.type}-focus-node`];
  if (node.isCenter) classNames.push('center-node');
  if (node.isOrigin) classNames.push('origin-node');
  if (typeof node.onClick === 'function') classNames.push('interactive-node');

  const group = svgEl('g', { class: classNames.join(' ') });
  group.dataset.id = node.id;
  group.dataset.kind = node.type;
  group.style.setProperty('--node-delay', `${node.animationDelay || 0}ms`);
  group.style.setProperty('--node-lift', `${node.animationLift || 0}px`);

  let labelY = y + NODE_LABEL_GAP + 28;

  if (node.type === 'chapter') {
    const radius = node.isCenter ? NODE_R : LOCAL_CHAPTER_NODE_R;
    const shape = svgEl('circle', {
      cx: x,
      cy: y,
      r: radius,
      class: 'chapter-node-shape'
    });
    group.appendChild(shape);
    labelY = y + radius + NODE_LABEL_GAP + 11;
  } else {
    const radius = node.isCenter ? SOURCE_NODE_R + 3 : SOURCE_NODE_R;
    const points = [
      `${x},${y - radius}`,
      `${x + radius},${y}`,
      `${x},${y + radius}`,
      `${x - radius},${y}`
    ].join(' ');
    const shape = svgEl('polygon', {
      points,
      class: 'source-node-shape'
    });
    group.appendChild(shape);
    labelY = y + radius + NODE_LABEL_GAP + 11;
  }

  appendFocusNodeLabel(group, node.label, x, labelY, !!node.isCenter);

  if (typeof node.onClick === 'function') {
    group.addEventListener('click', () => {
      if (!isDragging) node.onClick(node.id);
    });
  }

  return group;
}

function buildFocusedNetworkSpec() {
  if (!currentId || !chapterMap.has(currentId)) return null;

  if (networkMode === NETWORK_MODE.CHAPTER_SOURCES) {
    const chapter = chapterMap.get(currentId);
    return {
      center: {
        id: chapter.id,
        type: 'chapter',
        label: chapter.ja || chapter.id,
        isCenter: true,
        onClick: showChapterGraphForCurrentChapter
      },
      neighbors: sortSourceIdsByLabel(getChapterSourceIds(chapter)).map((sourceId) => {
        const source = allSourcesMap.get(sourceId);
        return {
          id: sourceId,
          type: 'source',
          label: source?.title_ja || sourceId,
          onClick: showSourceChapters
        };
      })
    };
  }

  if (networkMode === NETWORK_MODE.SOURCE_CHAPTERS && focusedSourceId && allSourcesMap.has(focusedSourceId)) {
    const source = allSourcesMap.get(focusedSourceId);
    return {
      center: {
        id: focusedSourceId,
        type: 'source',
        label: source.title_ja || source.id,
        isCenter: true,
        onClick: null
      },
      neighbors: sortChapterIdsByLabel(getSourceChapterIds(focusedSourceId)).map((chapterId) => {
        const chapter = chapterMap.get(chapterId);
        return {
          id: chapterId,
          type: 'chapter',
          label: chapter?.ja || chapterId,
          isOrigin: chapterId === currentId,
          onClick: navigateToChapterSources
        };
      })
    };
  }

  return null;
}

const CENTER_RADIUS_INNER = 240;
const CENTER_RADIUS_OUTER = 420;
const OUTER_SCALE = 0.82;

function radialLayout(centerId) {
  const dist = localNeighborhood(centerId);
  const inner = [];
  const outer = [];
  for (const [id, d] of dist) {
    if (d === 1) inner.push(id);
    else if (d === 2) outer.push(id);
  }
  inner.sort();
  outer.sort();

  const maxR = CENTER_RADIUS_OUTER + NODE_W * OUTER_SCALE;
  const cx = maxR + PADDING + NODE_W / 2;
  const cy = maxR + PADDING + NODE_H / 2;

  const pos = new Map();
  const sizes = new Map();

  pos.set(centerId, { x: cx - NODE_W / 2, y: cy - NODE_H / 2 });
  sizes.set(centerId, { w: NODE_W, h: NODE_H });

  function placeRing(ids, radius, scale) {
    const w = NODE_W * scale;
    const h = NODE_H * scale;
    const n = ids.length;
    if (n === 0) return;
    const offset = -Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const theta = offset + (2 * Math.PI * i) / n;
      const ix = cx + radius * Math.cos(theta);
      const iy = cy + radius * Math.sin(theta);
      pos.set(ids[i], { x: ix - w / 2, y: iy - h / 2 });
      sizes.set(ids[i], { w, h });
    }
  }
  placeRing(inner, CENTER_RADIUS_INNER, 1);
  placeRing(outer, CENTER_RADIUS_OUTER, OUTER_SCALE);

  const totalSize = (maxR + PADDING) * 2;
  return { pos, sizes, dist, width: totalSize, height: totalSize, cx, cy };
}

const VIEWPORT_PAD = 200;

function renderMap() {
  if (networkMode === NETWORK_MODE.CHAPTER_GRAPH) {
    renderChapterGraphMap();
    return;
  }
  renderFocusedNetworkMap();
}

function renderFocusedNetworkMap() {
  if (!currentId || !chapterMap.has(currentId)) {
    mapContainer.innerHTML = '';
    worldGroup = null;
    mapBuilt = false;
    return;
  }

  const spec = buildFocusedNetworkSpec();
  if (!spec) {
    setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
      focusedSourceId: null,
      codexFocusedSourceId: null
    });
    renderChapterGraphMap();
    return;
  }

  mapBuilt = false;
  worldGroup = null;
  currentTx = 0;
  currentTy = 0;
  mapContainer.innerHTML = '';

  const { paneW, paneH, cx, cy, paneOpen } = getMapFocusPoint();
  const svg = svgEl('svg', {
    xmlns: 'http://www.w3.org/2000/svg',
    width: paneW,
    height: paneH,
    viewBox: `0 0 ${paneW} ${paneH}`
  });
  prepareMapScene(svg, 'scene-focused');
  const edgeLayer = svgEl('g', {});
  const nodeLayer = svgEl('g', {});
  const positions = buildFocusRingPositions(spec.neighbors.length, cx, cy, paneW, paneH, paneOpen);

  spec.neighbors.forEach((node, index) => {
    const position = positions[index];
    if (!position) return;

    const edge = svgEl('line', {
      x1: cx,
      y1: cy,
      x2: position.x,
      y2: position.y,
      class: 'focus-edge-line'
    });
    edge.style.setProperty('--focus-edge-len', String(Math.ceil(Math.hypot(position.x - cx, position.y - cy))));
    edge.style.setProperty('--edge-delay', `${80 + index * 28}ms`);
    edgeLayer.appendChild(edge);
    nodeLayer.appendChild(createFocusNode({
      ...node,
      animationDelay: 120 + index * 30,
      animationLift: 10 + position.ring * 4
    }, position.x, position.y));
  });

  nodeLayer.appendChild(createFocusNode({
    ...spec.center,
    animationDelay: 40,
    animationLift: 0
  }, cx, cy));
  svg.appendChild(edgeLayer);
  svg.appendChild(nodeLayer);
  mapContainer.appendChild(svg);
  void svg.getBoundingClientRect();
}

function renderChapterGraphMap() {
  if (!currentId || !chapterMap.has(currentId)) {
    mapContainer.innerHTML = '';
    worldGroup = null;
    mapBuilt = false;
    return;
  }

  const firstBuild = !mapBuilt;
  if (!mapBuilt) {
    buildWorldMap();
    mapBuilt = true;
  }
  updateMapState();
  updateVisibility();
  panCameraTo(currentId, firstBuild);
}

function buildWorldMap() {
  mapContainer.innerHTML = '';

  // バウンディングボックス
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const { x, y } of globalPos.values()) {
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
  }
  if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 0; maxY = 0; }

  const worldW = (maxX - minX) + NODE_W + VIEWPORT_PAD * 2;
  const worldH = (maxY - minY) + NODE_H + VIEWPORT_PAD * 2;
  worldOffX = -minX + VIEWPORT_PAD;
  worldOffY = -minY + VIEWPORT_PAD;

  const svg = svgEl('svg', {
    xmlns: 'http://www.w3.org/2000/svg',
    width: worldW,
    height: worldH,
    viewBox: `0 0 ${worldW} ${worldH}`
  });
  prepareMapScene(svg, 'scene-chapter-graph');

  // グラデーション定義 (エッジの時間的方向を色で示す)
  const svgDefs = svgEl('defs', {});
  const dateMs = computeGlobalLayout._dateMs || new Map();
  svg.appendChild(svgDefs);

  worldGroup = svgEl('g', { class: 'world' });
  svg.appendChild(worldGroup);

  // エッジ (無向、重複排除)
  const drawn = new Set();
  for (const [fromId, set] of adjacency) {
    for (const toId of set) {
      const key = fromId < toId ? fromId + '|' + toId : toId + '|' + fromId;
      if (drawn.has(key)) continue;
      drawn.add(key);
      const a = globalPos.get(fromId);
      const b = globalPos.get(toId);
      if (!a || !b) continue;
      const x1 = a.x + worldOffX + NODE_W / 2;
      const y1 = a.y + worldOffY + NODE_H / 2;
      const x2 = b.x + worldOffX + NODE_W / 2;
      const y2 = b.y + worldOffY + NODE_H / 2;

      // 時間的方向を判定してグラデーションを生成
      const dA = dateMs.get(fromId), dB = dateMs.get(toId);
      let strokeVal = null;
      if (dA !== undefined && dB !== undefined && dA !== dB) {
        // 古い方→新しい方の向きで紫→琥珀グラデーション
        const older = dA < dB ? { x: x1, y: y1 } : { x: x2, y: y2 };
        const newer = dA < dB ? { x: x2, y: y2 } : { x: x1, y: y1 };
        const gradId = `eg-${fromId}-${toId}`.replace(/[^a-zA-Z0-9_-]/g, '_');
        const grad = svgEl('linearGradient', {
          id: gradId, gradientUnits: 'userSpaceOnUse',
          x1: older.x, y1: older.y, x2: newer.x, y2: newer.y
        });
        const stop0 = svgEl('stop', { offset: '0%' });
        stop0.style.stopColor = '#5840a0';
        const stop1 = svgEl('stop', { offset: '100%' });
        stop1.style.stopColor = '#8b5e20';
        grad.appendChild(stop0);
        grad.appendChild(stop1);
        svgDefs.appendChild(grad);
        strokeVal = `url(#${gradId})`;
      }

      const line = svgEl('line', { x1, y1, x2, y2, class: 'edge-line' });
      if (strokeVal) line.style.stroke = strokeVal;
      line.dataset.from = fromId;
      line.dataset.to = toId;
      const len = Math.ceil(Math.hypot(x2 - x1, y2 - y1));
      line.style.setProperty('--edge-len', String(len));
      worldGroup.appendChild(line);
    }
  }

  // ノード
  for (const [id, p] of globalPos) {
    const c = chapterMap.get(id);
    if (!c) continue;
    const g = svgEl('g', { class: 'node-g' });
    g.dataset.id = id;
    const nodeCx = p.x + worldOffX + NODE_R;
    const nodeCy = p.y + worldOffY + NODE_R;
    const circle = svgEl('circle', {
      cx: nodeCx,
      cy: nodeCy,
      r: NODE_R,
      class: 'node-box'
    });
    g.appendChild(circle);

    const label = (wrapText(c.ja || c.id, 7, 1)[0] || '');
    const t = svgEl('text', {
      x: nodeCx,
      y: nodeCy + NODE_R + NODE_LABEL_GAP + 11,
      'text-anchor': 'middle',
      class: 'node-text'
    });
    t.textContent = label;
    g.appendChild(t);

    g.addEventListener('click', () => { if (!isDragging) navigateTo(id); });
    worldGroup.appendChild(g);
  }

  mapContainer.appendChild(svg);
  // 強制 reflow してから後続の transform を適用 (transition が走るように)
  void svg.getBoundingClientRect();
}

function updateMapState() {
  if (!worldGroup) return;
  for (const g of worldGroup.querySelectorAll('.node-g')) {
    const id = g.dataset.id;
    const isCurrent = id === currentId;
    g.classList.toggle('current-node', isCurrent);
    const box = g.querySelector('.node-box');
    if (box) box.classList.toggle('current', isCurrent);
    for (const t of g.querySelectorAll('.node-text')) {
      t.classList.toggle('current', isCurrent);
    }
  }
}

function updateVisibility() {
  if (!worldGroup) return;
  const nearDist = localNeighborhood(currentId);

  for (const g of worldGroup.querySelectorAll('.node-g')) {
    const id = g.dataset.id;
    g.classList.remove('tier-current', 'tier-near', 'tier-far', 'tier-visited', 'tier-hidden');

    const d = nearDist.has(id) ? nearDist.get(id) : Infinity;

    if (id === currentId) {
      g.classList.add('tier-current');
    } else if (visited.has(id)) {
      g.classList.add('tier-visited');   // 訪問済みは即オレンジ（距離問わず）
    } else if (d === 1) {
      g.classList.add('tier-near');      // 未訪問1hop: 青紫・クリック可
    } else if (d === 2) {
      g.classList.add('tier-far');       // 未訪問2hop: 薄表示・クリック不可
    } else {
      g.classList.add('tier-hidden');
    }
  }

  const tierOf = (id) => {
    if (id === currentId) return 'current';
    if (visited.has(id)) return 'visited';
    const d = nearDist.has(id) ? nearDist.get(id) : Infinity;
    if (d === 1) return 'visible';
    if (d === 2) return 'far';
    return 'hidden';
  };

  for (const line of worldGroup.querySelectorAll('.edge-line')) {
    const tFrom = tierOf(line.dataset.from);
    const tTo   = tierOf(line.dataset.to);
    line.classList.remove('tier-active', 'tier-dim', 'tier-hidden');

    if (tFrom === 'hidden' || tTo === 'hidden' ||
        (tFrom === 'far' && tTo === 'far')) {
      line.classList.add('tier-hidden');
    } else if (tFrom === 'current' || tTo === 'current') {
      line.classList.add('tier-active');
    } else {
      line.classList.add('tier-dim');
    }
  }
}

function panCameraTo(centerId, instant) {
  if (!worldGroup) return;
  const p = globalPos.get(centerId);
  if (!p) return;
  const { paneW, paneH, cy: focusY } = getMapFocusPoint();
  // SVG 内のノード中心座標 (絶対位置)
  const nodeCx = p.x + worldOffX + NODE_W / 2;
  const nodeCy = p.y + worldOffY + NODE_H / 2;
  // worldGroup を平行移動して、 nodeCx/Cy が可視領域の中央に来るようにする
  const tx = paneW / 2 - nodeCx;
  const ty = focusY - nodeCy;
  currentTx = tx;
  currentTy = ty;
  const value = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px)`;
  if (instant) {
    // 初回はトランジションを抑止して即座にセンタリング
    worldGroup.style.transition = 'none';
    worldGroup.style.transform = value;
    void worldGroup.getBoundingClientRect();
    worldGroup.style.transition = '';
  } else {
    worldGroup.style.transform = value;
  }
}

function renderReading() {
  const ch = chapterMap.get(currentId);
  readingContent.innerHTML = '';
  if (!ch) {
    const p = document.createElement('p');
    p.textContent = '章が見つかりません。';
    readingContent.appendChild(p);
    return;
  }
  const focusedSource = codexFocusedSourceId ? allSourcesMap.get(codexFocusedSourceId) : null;
  codexTitle.textContent = (activeCodexTab === 'sources' && focusedSource)
    ? (focusedSource.title_ja || focusedSource.id)
    : (ch.ja || ch.id);
  syncPaneTabs();

  const sourceIds = getOrderedChapterSourceIds(ch);
  const related = getRelatedChapterIds(ch);

  if (activeCodexTab === 'sources') {
    const focusedSourceChapterIds = focusedSource
      ? sortChapterIdsByLabel(getSourceChapterIds(focusedSource.id))
      : [];

    if (focusedSource) {
      appendMetaChips(readingContent, [
        { label: '現在の焦点', value: focusedSource.title_ja || focusedSource.id },
        { label: '関連章', value: `${focusedSourceChapterIds.length}章` },
        { label: '表示', value: networkMode === NETWORK_MODE.SOURCE_CHAPTERS ? '史料中心' : '章と史料' }
      ]);
    }

    const srcLabel = document.createElement('div');
    srcLabel.className = 'section-label';
    srcLabel.textContent = '発見した史料';
    readingContent.appendChild(srcLabel);

    if (sourceIds.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'この章に紐づく史料はまだ登録されていません。';
      readingContent.appendChild(empty);
      readingContent.scrollTop = 0;
      return;
    }

    const list = document.createElement('div');
    list.className = 'source-list';
    for (const sid of sourceIds) {
      const src = allSourcesMap.get(sid);
      const details = document.createElement('details');
      details.className = 'source-item';
      details.open = sid === codexFocusedSourceId;

      const summary = document.createElement('summary');
      summary.textContent = src.title_ja || src.id;
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'source-body';
      if (typeof src.ja === 'string' && src.ja.length > 0) {
        const txt = createMarkdownBlock('source-text', src.ja);
        body.appendChild(txt);
      }
      if (typeof src.ref === 'string' && src.ref.trim().length > 0) {
        const ref = document.createElement('div');
        ref.className = 'source-ref';
        ref.textContent = src.ref;
        body.appendChild(ref);
      }
      details.appendChild(body);
      list.appendChild(details);
    }
    readingContent.appendChild(list);
    readingContent.scrollTop = 0;
    return;
  }

  if (activeCodexTab === 'trail') {
    appendMetaChips(readingContent, [
      { label: '旅程', value: `${history.length}章目` },
      { label: '分岐', value: `${related.all.length}件` }
    ]);

    const bc = document.createElement('div');
    bc.className = 'breadcrumb';
    history.forEach((id, i) => {
      const c = chapterMap.get(id);
      const span = document.createElement('span');
      const isCur = i === history.length - 1;
      span.className = isCur ? 'crumb current' : 'crumb';
      span.textContent = c ? (c.ja || id) : id;
      if (!isCur) span.addEventListener('click', () => jumpToHistory(i));
      bc.appendChild(span);
      if (i < history.length - 1) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '›';
        bc.appendChild(sep);
      }
    });
    readingContent.appendChild(bc);

    const nextLabel = document.createElement('div');
    nextLabel.className = 'section-label';
    nextLabel.textContent = '次に踏み込める章';
    readingContent.appendChild(nextLabel);

    if (related.all.length === 0) {
      const end = document.createElement('div');
      end.className = 'empty-note';
      end.textContent = '現在地点から進める章はありません。';
      readingContent.appendChild(end);
      readingContent.scrollTop = 0;
      return;
    }

    const list = document.createElement('div');
    list.className = 'next-list';
    for (const id of related.all) {
      const target = chapterMap.get(id);
      const btn = document.createElement('button');
      btn.className = 'next-btn';
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      btn.appendChild(arrow);
      btn.appendChild(document.createTextNode(target?.ja || id));
      btn.addEventListener('click', () => navigateTo(id));
      list.appendChild(btn);
    }
    readingContent.appendChild(list);
    readingContent.scrollTop = 0;
    return;
  }

  // appendMetaChips(readingContent, [
  //   { label: '史料', value: `${sourceIds.length}件` }
  // ]);

  // 概要
  const sumLabel = document.createElement('div');
  sumLabel.className = 'section-label';
  sumLabel.textContent = '概要';
  readingContent.appendChild(sumLabel);
  const sum = createMarkdownBlock(
    'summary-text',
    typeof ch.narrative_ja === 'string' ? ch.narrative_ja : '',
    '（概要は未記載です）'
  );
  readingContent.appendChild(sum);

  // 詳細（desc_ja があるときのみトグル表示）
  const hasDesc = typeof ch.desc_ja === 'string' && ch.desc_ja.trim().length > 0;
  if (hasDesc) {
    if (showDetail) {
      const descLabel = document.createElement('div');
      descLabel.className = 'section-label';
      descLabel.textContent = '詳細';
      readingContent.appendChild(descLabel);
      const desc = createMarkdownBlock('desc-text', ch.desc_ja);
      readingContent.appendChild(desc);
    }
    const toggle = document.createElement('button');
    toggle.className = 'detail-toggle';
    toggle.textContent = showDetail ? '詳細を閉じる' : '詳しく読む';
    toggle.addEventListener('click', () => { showDetail = !showDetail; renderReading(); });
    readingContent.appendChild(toggle);
  }

  readingContent.scrollTop = 0;
}

   8. ナビゲーション
   ============================================================ */

function openDetailPane() {
  detailPaneOpen = true;
  readingPane.classList.add('open');
  mainView.classList.add('codex-open');
  journeyRail.setAttribute('aria-hidden', 'true');
  syncDetailPaneMode();
  if (currentId && worldGroup) panCameraTo(currentId, false);
}

function closeDetailPane() {
  detailPaneOpen = false;
  readingPane.classList.remove('open');
  mainView.classList.remove('codex-open');
  journeyRail.removeAttribute('aria-hidden');
  syncDetailPaneMode();
  if (currentId && worldGroup) panCameraTo(currentId, false);
}

function updateChapterTrail(id) {
  if (!chapterMap.has(id)) return false;
  const existing = history.indexOf(id);
  if (existing !== -1) {
    history = history.slice(0, existing + 1);
  } else {
    history.push(id);
  }
  currentId = id;
  visited.add(id);
  showDetail = false;
  return true;
}

function showChapterGraphForCurrentChapter() {
  audio.click();
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  openDetailPane();
  refresh();
}

function showChapterSources(id = currentId) {
  if (!chapterMap.has(id)) return;
  audio.click();
  if (id !== currentId && !updateChapterTrail(id)) return;
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_SOURCES, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  openDetailPane();
  refresh();
}

function showSourceChapters(sourceId) {
  if (!allSourcesMap.has(sourceId)) return;
  audio.click();
  activeCodexTab = 'sources';
  setNetworkMode(NETWORK_MODE.SOURCE_CHAPTERS, {
    focusedSourceId: sourceId,
    codexFocusedSourceId: sourceId
  });
  openDetailPane();
  refresh();
}

function navigateToChapterSources(id) {
  if (!chapterMap.has(id)) return;
  audio.click();
  if (!updateChapterTrail(id)) return;
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_SOURCES, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  openDetailPane();
  refresh();
}

function navigateTo(id) {
  if (!chapterMap.has(id)) return;
  if (networkMode === NETWORK_MODE.CHAPTER_GRAPH && id === currentId) {
    showChapterSources(id);
    return;
  }
  audio.click();
  if (!updateChapterTrail(id)) return;
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  openDetailPane();
  refresh();
}

function jumpToHistory(i) {
  history = history.slice(0, i + 1);
  currentId = history[history.length - 1];
  showDetail = false;
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  openDetailPane();
  refresh();
}

function refresh(skipTransition = false) {
  if (!skipTransition) audio.transition();
  if (shouldAnimateModeTransition(skipTransition)) {
    runModeTransition();
  } else {
    cancelMapModeTransition(true);
    renderMap();
    renderedNetworkMode = networkMode;
  }
  if (detailPaneOpen) renderReading();
  updateStatus();
  renderHud();
}

function updateStatus() {
  if (validationErrors.length) {
    setStatus('データの問題: ' + validationErrors.join(' / '), 'error');
    return;
  }
  setStatus('', 'ok');
}

   9. 開始画面 / 初期化
   ============================================================ */

function showStartScreen() {
  cancelMapModeTransition(true);
  startScreen.hidden = false;
  mainView.hidden = true;
  homeBtn.hidden = true;
  if (currentId && chapterMap.has(currentId)) selectedChapterId = currentId;
  detailPaneFullscreen = false;
  setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  syncDetailPaneMode();
  closeDetailPane();
  // マップ状態をリセット (グローバル座標は不変、SVG だけ捨てる)
  mapContainer.innerHTML = '';
  worldGroup = null;
  mapBuilt = false;
  renderChapterPicker();
  renderHud();
}

let selectedChapterId = null;

function renderChapterPicker() {
  const picker = document.getElementById('theme-picker');
  picker.innerHTML = '';
  if (!allChapters.length) {
    const msg = document.createElement('div');
    msg.style.color = 'var(--muted)';
    msg.style.fontSize = '13px';
    msg.textContent = '章が定義されていません (Data/data_sample.js を確認してください)。';
    picker.appendChild(msg);
    selectedChapterId = null;
    renderStartPreview();
    return;
  }
  if (!selectedChapterId || !allChaptersMap.has(selectedChapterId)) {
    selectedChapterId = allChapters[0].id;
  }
  for (const c of allChapters) {
    if (!c || !c.id) continue;
    const btn = document.createElement('button');
    btn.className = 'theme-option' + (c.id === selectedChapterId ? ' selected' : '');
    btn.dataset.chapterId = c.id;
    const title = document.createElement('span');
    title.className = 'theme-option-title';
    title.textContent = c.ja || c.id;
    btn.appendChild(title);
    if (typeof c.date === 'string' && c.date.trim()) {
      const dt = document.createElement('span');
      dt.className = 'theme-option-intro';
      // dt.textContent = c.date;
      btn.appendChild(dt);
    }
    btn.addEventListener('click', () => {
      selectedChapterId = c.id;
      renderChapterPicker();
    });
    picker.appendChild(btn);
  }
  renderStartPreview();
}

function enterApp() {
  if (!selectedChapterId || !chapterMap.has(selectedChapterId)) {
    setStatus('開始する章を選択してください。', 'error');
    return;
  }
  audio.begin();
  startScreen.hidden = true;
  mainView.hidden = false;
  homeBtn.hidden = false;
  document.getElementById('theme-title').textContent = 'Histographia: Scottish Experience 1286-1296';
  currentId = selectedChapterId;
  visited = new Set([currentId]);
  history = [currentId];
  showDetail = false;
  activeCodexTab = 'chapter';
  setNetworkMode(NETWORK_MODE.CHAPTER_GRAPH, {
    focusedSourceId: null,
    codexFocusedSourceId: null
  });
  closeDetailPane();
  refresh(true);
}

function init() {
  if (typeof window.HISTORY_CHAPTERS !== 'string') {
    setStatus('データ (Data/data_sample.js) を読み込めませんでした。', 'error');
    return;
  }
  if (typeof window.HISTORY_SOURCES !== 'string') {
    setStatus('データ (Data/sources.js) を読み込めませんでした。', 'error');
    return;
  }

  let chaptersData, sourcesData;
  try {
    chaptersData = parseYAML(window.HISTORY_CHAPTERS);
  } catch (e) {
    setStatus('data_sample.js のYAML解析エラー: ' + e.message, 'error');
    return;
  }
  try {
    sourcesData = parseYAML(window.HISTORY_SOURCES);
  } catch (e) {
    setStatus('sources.js のYAML解析エラー: ' + e.message, 'error');
    return;
  }

  allChapters = Array.isArray(chaptersData && chaptersData.chapters) ? chaptersData.chapters : [];
  allChaptersMap = new Map();
  for (const c of allChapters) if (c && c.id) allChaptersMap.set(c.id, c);

  allSources = Array.isArray(sourcesData && sourcesData.sources) ? sourcesData.sources : [];
  allSourcesMap = new Map();
  for (const s of allSources) if (s && s.id) allSourcesMap.set(s.id, s);

  buildSourceChapterMap();

  validationErrors = [...validateSources(), ...validateChapters()];

  buildGraph();

  document.getElementById('theme-title').textContent = 'Histographia: Scottish Experience 1286-1296';
  document.getElementById('start-title').textContent = 'Histographia: Scottish Experience 1286-1296';
  const introEl = document.getElementById('start-intro');
  introEl.textContent = '最初の章を選び、出来事と史料の関連を辿りながら、歴史の海を探求していきます。';

  renderChapterPicker();
  syncPaneTabs();

  if (validationErrors.length) {
    setStatus('データの問題: ' + validationErrors.join(' / '), 'error');
  } else if (allChapters.length === 0) {
    setStatus('章が定義されていません。', 'error');
  } else {
    setStatus(`準備完了 ／ 全${allChapters.length}章`, 'ok');
  }

  document.getElementById('startBtn').addEventListener('click', enterApp);
  homeBtn.addEventListener('click', () => { showStartScreen(); updateStatus(); });
  document.getElementById('closeDetailBtn').addEventListener('click', closeDetailPane);
  toggleDetailModeBtn.addEventListener('click', toggleDetailPaneMode);
  paneTabs.forEach((tab) => {
    tab.addEventListener('click', () => setCodexTab(tab.dataset.tab));
  });

  // ドラッグによる手動パン
  mapPane.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !worldGroup) return;
    const startX = e.clientX, startY = e.clientY;
    const startTx = currentTx, startTy = currentTy;
    let moved = false;

    function onMouseMove(e) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 5) {
        moved = true;
        isDragging = true;
        worldGroup.style.transition = 'none';
        mapPane.classList.add('is-dragging');
      }
      if (moved) {
        currentTx = startTx + dx;
        currentTy = startTy + dy;
        worldGroup.style.transform = `translate(${currentTx.toFixed(1)}px, ${currentTy.toFixed(1)}px)`;
      }
    }

    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      if (moved) {
        worldGroup.style.transition = '';
        mapPane.classList.remove('is-dragging');
      }
      setTimeout(() => { isDragging = false; }, 0);
    }

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  // ブラウザのズーム変更時に自動再センタリング
  new ResizeObserver(() => {
    if (!currentId) return;
    if (networkMode === NETWORK_MODE.CHAPTER_GRAPH && worldGroup) {
      panCameraTo(currentId, true);
      return;
    }
    refresh(true);
  }).observe(mapPane);

  audio.init();
  const audioBtn = document.getElementById('audioBtn');
  function refreshAudioBtn() {
    audioBtn.textContent = audio.isMuted() ? '🔇' : '🔊';
    audioBtn.classList.toggle('muted', audio.isMuted());
  }
  audioBtn.addEventListener('click', () => { audio.toggle(); refreshAudioBtn(); });
  refreshAudioBtn();
  syncDetailPaneMode();
  syncNetworkModeClass();

  showStartScreen();
}

init();
</script>
</body>
</html>
